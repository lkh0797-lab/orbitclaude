}

// ---------------------------------------------------------- 전문검색
function viewFind(p){
  const c=S.co;
  p.innerHTML='';
  p.appendChild(el('h4','head','전문검색'+(S.kind?' — '+S.kind:'')));
  p.appendChild(el('p','sub','이 회사의 '+reps().length+'건 보고서 전문을 훑습니다. 어떤 말이 언제 처음 나왔는지가 핵심입니다.'));
  const row=el('div','row');
  const inp=el('input'); inp.type='text'; inp.placeholder='예: HBM, 가동률, 연구개발비, 소송';
  inp.value=S.findQ||'';
  const selS=el('select');
  selS.appendChild(Object.assign(el('option',null,'전체 섹션'),{value:''}));
  c.sections.forEach(s=>{const o=el('option',null,s.norm);o.value=s.norm;
    if(s.norm===S.findSec)o.selected=true; selS.appendChild(o);});
  const go=el('button','go','검색');
  row.appendChild(inp); row.appendChild(selS); row.appendChild(go);
  p.appendChild(row);
  const out=el('div'); p.appendChild(out);

  async function run(){
    const q=inp.value.trim(); if(!q) return;
    S.findQ=q; S.findSec=selS.value;
    out.innerHTML='<div class="loading">찾는 중…</div>';
    const hits=await (await fetch('/api/search?code='+c.code+'&q='+encodeURIComponent(q)+
      (selS.value?'&section='+encodeURIComponent(selS.value):'')+labelsParam())).json();
    out.innerHTML='';
    if(hits.error){ out.appendChild(el('div','err',hits.error)); return; }
    if(!hits.length){ out.appendChild(el('div','empty','"'+q+'" 없음. 이 회사는 이 말을 한 번도 쓴 적이 없습니다.')); return; }

    const byStamp={};
    hits.forEach(h=>{ (byStamp[h.stamp]=byStamp[h.stamp]||[]).push(h); });
    const stamps=Object.keys(byStamp).sort();
    const f=el('div','first');
    f.innerHTML='<b>최초 등장 '+stamps[0]+'</b> · 마지막 '+stamps[stamps.length-1]+
      ' · 총 '+hits.length+'회 / '+stamps.length+'개 보고서';
    out.appendChild(f);

    out.appendChild(sparkline(stamps.map(s=>({x:s, y:byStamp[s].length}))));

    stamps.reverse().forEach(s=>{
      byStamp[s].slice(0,12).forEach(h=>{
        const d=el('div','hit');
        const hd=el('div','h');
        hd.appendChild(el('span',null,h.stamp+' '+h.label+h.tag));
        hd.appendChild(el('span',null,h.section));
        hd.onclick=()=>{ S.lastRead={rcept:h.rcept,file:h.file};
          [...$('#tabs').children].forEach(x=>x.classList.toggle('on', x.dataset.t==='read'));
          show('read'); };
        d.appendChild(hd);
        const t=el('div','t');
        t.innerHTML='…'+esc(h.before)+'<b>'+esc(h.match)+'</b>'+esc(h.after)+'…';
        d.appendChild(t);
        out.appendChild(d);
      });
    });
  }
  go.onclick=run;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')run();});
  if(S.findQ) run();
}

// ---------------------------------------------------------- 키워드 추이
function viewTrend(p){
  const c=S.co;
  p.innerHTML='';
  p.appendChild(el('h4','head','키워드 추이'+(S.kind?' — '+S.kind:'')));
  p.appendChild(el('p','sub','보고서마다 그 말이 몇 번 나왔는지. 회사가 무엇에 말을 쓰기 시작했고 무엇을 접었는지가 드러납니다. 쉼표로 여러 개.'));
  const row=el('div','row');
  const inp=el('input'); inp.type='text'; inp.placeholder='예: HBM, DDR5, 낸드';
  inp.value=S.trendQ||'';
  const go=el('button','go','그리기');
  row.appendChild(inp); row.appendChild(go);
  p.appendChild(row);
  kindNote(p);
  const out=el('div'); p.appendChild(out);

  async function run(){
    const terms=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!terms.length) return;
    S.trendQ=inp.value;
    out.innerHTML='<div class="loading">세는 중…</div>';
    const d=await (await fetch('/api/trend?code='+c.code+'&terms='+
      encodeURIComponent(terms.join(','))+labelsParam())).json();
    out.innerHTML='';
    if(d.error){ out.appendChild(el('div','err',d.error)); return; }
    if(!d.points.length){ out.appendChild(el('div','empty','해당 보고서가 없습니다.')); return; }
    out.appendChild(multiline(d));
    const t=el('table','tbl');
    let head='<tr><th>시점</th>'+terms.map(x=>'<th style="text-align:right">'+esc(x)+'</th>').join('')+'</tr>';
    t.innerHTML=head;
    d.points.forEach((pt,i)=>{
      const tr=el('tr');
      tr.appendChild(el('td',null,pt.stamp+' '+pt.label));
      terms.forEach(x=> tr.appendChild(el('td','num', fmt(d.series[x][i].n))));
      t.appendChild(tr);
    });
    out.appendChild(t);
  }
  go.onclick=run;
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')run();});
  if(S.trendQ) run();
}

// ---------------------------------------------------------- 차트
function sparkline(pts){
  const W=760,H=90,P=26;
  const max=Math.max(...pts.map(p=>p.y),1);
  const sw=(W-P*2)/Math.max(pts.length-1,1);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','chart');
  let d='';
  pts.forEach((p,i)=>{ const x=P+i*sw, y=H-18-(p.y/max)*(H-40);
    d+=(i?'L':'M')+x+' '+y+' ';
    const cc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    cc.setAttribute('cx',x);cc.setAttribute('cy',y);cc.setAttribute('r',2.5);
    cc.setAttribute('fill','var(--accent)');
    const ti=document.createElementNS('http://www.w3.org/2000/svg','title');
    ti.textContent=p.x+' : '+p.y+'회'; cc.appendChild(ti); svg.appendChild(cc);
  });
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d); path.setAttribute('fill','none');
  path.setAttribute('stroke','var(--accent)'); path.setAttribute('stroke-width','1.6');
  svg.insertBefore(path, svg.firstChild);
  [[pts[0].x,P,'start'],[pts[pts.length-1].x,W-P,'end']].forEach(([txt,x,an])=>{
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',H-4);t.setAttribute('text-anchor',an);
    t.setAttribute('font-size','10');t.setAttribute('fill','var(--faint)');
    t.setAttribute('font-family','var(--mono)');t.textContent=txt; svg.appendChild(t);
  });
  const wrap=el('div'); wrap.style.margin='6px 0 16px'; wrap.appendChild(svg); return wrap;
}

function multiline(d){
  const COLORS=['#2f5d50','#a3352c','#8a5a12','#3b5f8a','#6b3f7a','#2f7d6a','#8a3f5f','#55603a'];
  const terms=Object.keys(d.series);
  const W=820,H=260,L=44,R=14,T=14,B=34;
  const n=d.points.length;
  const max=Math.max(1,...terms.flatMap(t=>d.series[t].map(v=>v.n)));
  const sw=(W-L-R)/Math.max(n-1,1);
  const X=i=>L+i*sw, Y=v=>H-B-(v/max)*(H-T-B);
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','chart');

  [0,.25,.5,.75,1].forEach(f=>{
    const y=Y(max*f);
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',L);l.setAttribute('x2',W-R);l.setAttribute('y1',y);l.setAttribute('y2',y);
    l.setAttribute('stroke','var(--line)');l.setAttribute('stroke-width','1'); svg.appendChild(l);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',L-7);t.setAttribute('y',y+3.5);t.setAttribute('text-anchor','end');
    t.setAttribute('font-size','10');t.setAttribute('fill','var(--faint)');
    t.setAttribute('font-family','var(--mono)');t.textContent=Math.round(max*f); svg.appendChild(t);
  });
  d.points.forEach((p,i)=>{
    if(n>14 && i%Math.ceil(n/12)) return;
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',X(i));t.setAttribute('y',H-12);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','10');t.setAttribute('fill','var(--faint)');
    t.setAttribute('font-family','var(--mono)');t.textContent=p.stamp.slice(2); svg.appendChild(t);
  });
  terms.forEach((term,k)=>{
    const col=COLORS[k%COLORS.length];
    let path='';
    d.series[term].forEach((v,i)=>{ path+=(i?'L':'M')+X(i)+' '+Y(v.n)+' '; });
    const pe=document.createElementNS(NS,'path');
    pe.setAttribute('d',path);pe.setAttribute('fill','none');
    pe.setAttribute('stroke',col);pe.setAttribute('stroke-width','2');
    pe.setAttribute('stroke-linejoin','round'); svg.appendChild(pe);
    d.series[term].forEach((v,i)=>{
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',X(i));c.setAttribute('cy',Y(v.n));c.setAttribute('r',2.6);
      c.setAttribute('fill',col);
      const ti=document.createElementNS(NS,'title');
      ti.textContent=d.points[i].stamp+' '+term+' : '+v.n+'회'; c.appendChild(ti);
      svg.appendChild(c);
    });
  });
  const wrap=el('div');
  const leg=el('div'); leg.style.cssText='display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 2px;font-size:12px';
  terms.forEach((t,k)=>{
    const s=el('span'); s.style.cssText='display:flex;gap:6px;align-items:center';
    const sw2=el('span'); sw2.style.cssText='width:12px;height:3px;border-radius:2px;background:'+COLORS[k%COLORS.length];
    s.appendChild(sw2); s.appendChild(el('span',null,t)); leg.appendChild(s);
  });
  wrap.appendChild(svg); wrap.appendChild(leg);
  wrap.style.margin='4px 0 18px';
  return wrap;
}
