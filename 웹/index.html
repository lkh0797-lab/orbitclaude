function orbPlate(plate, all, c, animate){
  plate.innerHTML='';
  plate.classList.toggle('full', document.fullscreenElement===plate);
  plate.classList.toggle('anim', !!animate);
  // 정정 공시는 늦게 접수돼도 원래 기간 자리에 둔다 — 연도 띠가 끊기지 않게
  const rows=all.filter(r=>r.score!==null && r.score!==undefined)
    .sort((a,b)=>a.stamp.localeCompare(b.stamp) || a.rcept.localeCompare(b.rcept));
  if(!rows.length){
    plate.appendChild(el('div','orbWait', all.length ? '아직 분석된 보고서가 없습니다. 아래 목록은 지금도 열 수 있습니다.'
                                                     : '이 종류의 보고서가 없습니다.'));
    return;
  }
  const ok=rows.filter(r=>r.x!==null && r.x!==undefined && !r.tag);
  const big=ok.filter(r=>r.x>=1.5), shock=ok.filter(r=>r.x>=2);
  const byX=ok.slice().sort((a,b)=>b.x-a.x);
  const peak=byX[0], latest=ok[ok.length-1];
  const keys=byX.slice(0, Math.min(5, Math.max(3, big.length)));
  const rank=new Map(keys.map((r,i)=>[r.rcept,i+1]));
  const y0=rows[0].stamp.slice(0,4), y1=rows[rows.length-1].stamp.slice(0,4);

  // ── 머리: 전시 번호 · 발표 모드
  const top=el('div','spTop');
  const eb=el('div','spEyebrow');
  eb.innerHTML='<b>EXHIBIT 02</b><span></span><em>Filing change intensity · '+y0+'–'+y1+'</em>';
  eb.querySelector('span').textContent='변화 궤도 · '+c.name;
  top.appendChild(eb);
  const tools=el('div','spTools');
  const fs=el('button','spFull', document.fullscreenElement===plate?'발표 모드 끝내기':'⛶ 발표 모드');
  fs.title='전시판만 전체 화면으로 띄운다 (Esc 로 나가기)';
  fs.onclick=()=>{
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    if(plate.requestFullscreen) plate.requestFullscreen().catch(()=>{});
  };
  plate.onfullscreenchange=()=>{
    const on=document.fullscreenElement===plate;
    plate.classList.toggle('full', on);
    fs.textContent=on?'발표 모드 끝내기':'⛶ 발표 모드';
  };
  tools.appendChild(fs); top.appendChild(tools); plate.appendChild(top);

  // ── 헤드라인 — 이 장이 말하려는 한 문장
  const n=ok.length;
  let h3, en;
  if(shock.length){ h3=n+'개 보고서 중 '+shock.length+'번, 평소의 2배 넘게 다시 쓰였다';
    en=shock.length+' of '+n+' filings rewrote more than twice their usual volume.'; }
  else if(big.length){ h3=n+'개 보고서 중 '+big.length+'번, 평소의 1.5배 넘게 다시 쓰였다';
    en=big.length+' of '+n+' filings rewrote at least 1.5× their usual volume.'; }
  else { h3=n+'개 보고서 내내 큰 재작성은 없었다';
    en='None of '+n+' filings rewrote more than 1.5× its usual volume.'; }
  const hl=el('div','spHead');
  hl.appendChild(el('h3',null,h3));
  if(peak){
    // 부제에는 사업 쪽 문장을 먼저 — 재무 섹션 문장은 회계 서술인 때가 많다
    const gl=(peak.gist||[]).filter(x=>x.text);
    const g=gl.find(x=>x.sec==='사업의 내용'||x.sec==='이사의 경영진단 및 분석의견')||gl[0];
    hl.appendChild(el('p',null,'가장 크게 바뀐 때는 '+peak.stamp+' '+peak.label+', 평소의 '+peak.x.toFixed(2)+'배'
      +(g?' — '+g.short+': '+g.text:'')));
  }
  hl.appendChild(el('p','spEn',en+(peak?' Peak '+orbX(peak.x)+' in '+peak.stamp+'.':'')));
  plate.appendChild(hl);

  // ── 그림
  const fig=el('div','orbFig'); plate.appendChild(fig);
  const W=1000,H=340,L=46,R=96,T=38,B=50;
  const N=rows.length, step=(W-L-R)/N, bw=Math.max(4,Math.min(26,step*.62));
  const maxX=Math.max(2.4,...ok.map(r=>r.x));
  const ymax=Math.min(4,Math.ceil((maxX+.15)*2)/2);
  const Y=v=>H-B-Math.min(v,ymax)/ymax*(H-T-B);
  const X=i=>L+i*step+step/2;
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'orbSvg',role:'img','aria-label':h3});
  const defs=svgEl('defs',{});
  defs.innerHTML='<pattern id="orbHatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">'+
    '<rect width="5" height="5" fill="rgba(154,164,176,.08)"/><line x1="0" y1="0" x2="0" y2="5" stroke="rgba(154,164,176,.6)" stroke-width="1.3"/></pattern>';
  svg.appendChild(defs);

  // 연도 띠 — 보고서를 연도별로 묶어 번갈아 칠한다
  const yrs=[];
  rows.forEach((r,i)=>{ const y=r.stamp.slice(0,4), l=yrs[yrs.length-1];
    if(l && l.y===y) l.e=i; else yrs.push({y,s:i,e:i}); });
  const gy=svgEl('g',{class:'orbYears'});
  yrs.forEach((g,k)=>{
    const x0=L+g.s*step, w=(g.e-g.s+1)*step;
    if(k%2===0) gy.appendChild(svgEl('rect',{x:x0,y:T-10,width:w,height:H-B-T+10,class:'orbBand'}));
    const t=svgEl('text',{x:x0+w/2,y:H-B+21,'text-anchor':'middle',class:'orbYear'});
    t.textContent=w<40 ? "'"+g.y.slice(2) : g.y; gy.appendChild(t);
    if(k) gy.appendChild(svgEl('line',{x1:x0,x2:x0,y1:H-B,y2:H-B+7,class:'orbYearTick'}));
  });
  svg.appendChild(gy);
  svg.appendChild(svgEl('rect',{x:L,y:Y(ymax),width:W-L-R,height:Y(2)-Y(ymax),class:'orbShockZone'}));
  const gg=svgEl('g',{class:'orbGrid'});
  for(let v=0; v<=ymax+1e-9; v+=1){
    gg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),class:v?'':'z'}));
    const t=svgEl('text',{x:L-10,y:Y(v)+4,'text-anchor':'end',class:'orbTick'}); t.textContent=v?v+'×':'0'; gg.appendChild(t);
  }
  svg.appendChild(gg);
  // 기준선: 평소 1× · 큼 1.5× · 격변 2×
  [[1,'평소','1×','orbRef1'],[1.5,'큼','1.5×','orbRef'],[2,'격변','2×','orbRef2']].forEach(([v,k,lab,cls])=>{
    const y=Y(v);
    svg.appendChild(svgEl('line',{x1:L,x2:W-R+6,y1:y,y2:y,class:cls}));
    const t=svgEl('text',{x:W-R+12,y:y+4,class:'orbRefLab '+cls+'L'});
    t.innerHTML='<tspan class="k">'+k+'</tspan> <tspan class="v">'+lab+'</tspan>';
    svg.appendChild(t);
  });
  const guide=svgEl('line',{class:'orbGuide',y1:T-10,y2:H-B}); guide.style.display='none'; svg.appendChild(guide);

  const bars=svgEl('g',{class:'orbBars'}), nodes=new Map();
  rows.forEach((r,i)=>{
    const g=svgEl('g',{class:'orbBar'+(r.tag?' fix':'')+(r.tier?' t-'+r.tier:'')});
    g.style.setProperty('--d',Math.round(i*(650/N))+'ms');
    const cx=X(i);
    let yTop;
    if(r.x===null || r.x===undefined){
      g.appendChild(svgEl('circle',{cx,cy:H-B-5,r:3.6,class:'orbBase'}));
      yTop=H-B-12;
    } else {
      const y=Y(Math.max(r.x,.02)), h=H-B-y, x0=cx-bw/2, rr=Math.min(4,bw/2,h);
      const d='M'+x0+','+(H-B)+'V'+(y+rr)+'Q'+x0+','+y+' '+(x0+rr)+','+y+'H'+(x0+bw-rr)+
              'Q'+(x0+bw)+','+y+' '+(x0+bw)+','+(y+rr)+'V'+(H-B)+'Z';
      const b=svgEl('path',{d,class:'b'});
      b.setAttribute('fill', r.tag?'url(#orbHatch)':(ORB_PC[r.tier]||ORB_PC['평소']));
      if(r.tag){ b.setAttribute('stroke','rgba(154,164,176,.55)'); b.setAttribute('stroke-width','1'); }
      const grow=svgEl('g',{class:'grow'}); grow.appendChild(b); g.appendChild(grow);
      yTop=y;
      if(r.x>ymax){   // 눈금 밖 — 잘린 막대에 값을 적는다
        const t=svgEl('text',{x:cx,y:y-6,'text-anchor':'middle',class:'orbOver'}); t.textContent=orbX(r.x); g.appendChild(t);
        yTop=y-16;
      }
    }
    g.appendChild(svgEl('rect',{x:L+i*step,y:T-12,width:step,height:H-B-T+12+28,class:'hit'}));
    bars.appendChild(g);
    nodes.set(r.rcept,{g,r,i,cx,yTop});
  });
  svg.appendChild(bars);
  const marks=svgEl('g',{class:'orbMarks'}), placed=[];
  keys.forEach((r,k)=>{
    const nd=nodes.get(r.rcept); if(!nd) return;
    let cy=nd.yTop-15;
    // 붙은 막대끼리 번호가 겹치면 위로 쌓는다
    while(placed.some(q=>Math.abs(q.x-nd.cx)<21 && Math.abs(q.y-cy)<21)) cy-=21;
    placed.push({x:nd.cx,y:cy});
    marks.appendChild(svgEl('circle',{cx:nd.cx,cy,r:9.5,class:'spBadge'}));
    const t=svgEl('text',{x:nd.cx,y:cy+3.8,'text-anchor':'middle',class:'spBadgeN'}); t.textContent=k+1; marks.appendChild(t);
    nd.yTop=cy-12;
  });
  if(latest){
    const nd=nodes.get(latest.rcept);
    const t=svgEl('text',{x:nd.cx,y:nd.yTop-5,'text-anchor':'middle',class:'orbNow'}); t.textContent='최신'; marks.appendChild(t);
  }
  svg.appendChild(marks);
  fig.appendChild(svg);

  const tip=el('div','spTip orbTip'); tip.hidden=true; fig.appendChild(tip);
  const focus=r=>{
    const nd=nodes.get(r.rcept); if(!nd) return;
    plate.classList.add('focusing');
    nodes.forEach(o=>o.g.classList.toggle('on',o===nd));
    plate.querySelectorAll('.orbKey').forEach(it=>it.classList.toggle('on',it.dataset.r===r.rcept));
    guide.style.display=''; guide.setAttribute('x1',nd.cx); guide.setAttribute('x2',nd.cx);
    tip.innerHTML=''; tip.appendChild(orbTipBody(r, rank.get(r.rcept))); tip.hidden=false;
    const box=fig.getBoundingClientRect(), sc=box.width/W, tw=tip.offsetWidth, th=tip.offsetHeight;
    let lx=nd.cx*sc+16; if(lx+tw>box.width-4) lx=nd.cx*sc-tw-16;
    const ly=Math.max(4, Math.min(nd.yTop*sc-24, box.height-th-4));
    tip.style.left=Math.max(4,lx)+'px'; tip.style.top=ly+'px';
  };
  const blur=()=>{
    plate.classList.remove('focusing'); guide.style.display='none'; tip.hidden=true;
    nodes.forEach(o=>o.g.classList.remove('on'));
    plate.querySelectorAll('.orbKey').forEach(it=>it.classList.remove('on'));
  };
  nodes.forEach(nd=>{
    nd.g.addEventListener('pointerenter',()=>focus(nd.r));
    nd.g.addEventListener('pointerleave',blur);
    nd.g.addEventListener('click',()=>orbGo(nd.r));
  });

  // ── 점수 읽는 법 — 그림 바로 아래, 범례 겸
  const sc=el('div','orbScale');
  sc.innerHTML='<div class="spIdeasH">점수 읽는 법 <em>HOW TO READ THE BARS</em></div>';
  const pos=v=>Math.min(v,3)/3*100;
  const bar=el('div','orbGBar');
  const segs=ORB_TIERS.slice().reverse();
  segs.forEach(t=>{ const s=el('i'); s.style.left=pos(t.lo)+'%'; s.style.width=(pos(t.hi===null?3:t.hi)-pos(t.lo))+'%';
    s.style.background=ORB_PC[t.k]; bar.appendChild(s); });
  [0,1,2,3].forEach(v=>{ const t=el('span','orbGTick',v?v+'×':'0'); t.style.left=pos(v)+'%'; bar.appendChild(t); });
  const pin=(r,lab,cls)=>{ if(!r) return; const q=el('span','orbPin '+cls); q.style.left=pos(r.x)+'%';
    q.appendChild(el('b',null,lab+' '+orbX(r.x)+(r.x>3?' ▸':''))); bar.appendChild(q); };
  pin(peak,'최대','pk');
  if(latest && latest!==peak) pin(latest,'최신','nw');
  const gw=el('div','orbGWrap'); gw.appendChild(bar); sc.appendChild(gw);
  const leg=el('div','orbGLeg');
  segs.forEach(t=>{
    const d=el('div','orbGL');
    d.innerHTML='<div class="h"><i></i><b></b><span></span></div><p></p><small></small>';
    d.querySelector('i').style.background=ORB_PC[t.k];
    d.querySelector('b').textContent=t.k;
    d.querySelector('span').textContent=orbRange(t);
    d.querySelector('p').textContent=t.d;
    const here=ok.filter(r=>r.tier===t.k).length;
    d.querySelector('small').textContent='보통 '+t.odds+' · 여기선 '+here+'건';
    leg.appendChild(d);
  });
  sc.appendChild(leg);
  const norms={};
  ok.forEach(r=>{ if(r.norm) norms[orbKind(r.label)]=r.norm; });
  const fm=el('p','orbFormula');
  fm.innerHTML='<b>1× = 평소.</b> 이 회사 같은 종류 보고서가 보통 새로 쓰는 분량(중앙값)이다. 사업보고서는 원래 분기보다 길어서 따로 잰다'+
    (Object.keys(norms).length?' ('+Object.entries(norms).map(([k,v])=>esc(k)+' '+orbChars(v)).join(' · ')+')':'')+'.<br>'+
    '<b>분량</b> = Σ 섹션 중요도 × (새로 쓴 글자 + 0.6 × 지운 글자). 중요도는 사업의 내용 1.0 · 경영진단 0.95 · 투자자 보호 0.85 · '+
    '주주·재무 0.7 · 임원·직원 0.55 · 회사 개요 0.4 · 재무제표 0.25 · 부속명세서 0.05. 숫자만 바뀐 표·문단은 세지 않는다. A4 1쪽 ≈ 2,000자.';
  plate.appendChild(sc);

  // ── 숫자 넷
  const epi=(()=>{
    const src=big.length?big:ok, cnt={};
    src.forEach(r=>{ if(r.top) cnt[r.top]=(cnt[r.top]||0)+1; });
    const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0];
    return e?{sec:e[0],n:e[1],of:src.length}:null;
  })();
  const kp=el('div','spKpi');
  [[big.length+'건', '평소의 1.5배 이상 · 그중 격변 '+shock.length+'건', 'Major rewrites'],
   [peak?orbX(peak.x):'—', peak?peak.stamp+' '+peak.label:'', 'Peak'],
   [latest?orbX(latest.x):'—', latest?latest.stamp+' '+latest.label+' · '+latest.tier:'', 'Latest filing'],
   [epi?(ORB_SEC[epi.sec]||epi.sec):'—', epi?(big.length?'큰 변화 ':'전체 ')+epi.of+'건 중 '+epi.n+'건의 진원지':'', 'Epicenter'],
  ].forEach(([b,s,sm])=>{ const k=el('div','spK'); k.appendChild(el('b',null,b)); k.appendChild(el('span',null,s));
    k.appendChild(el('small',null,sm)); kp.appendChild(k); });
  plate.appendChild(kp);

  const ks=el('div','orbKeys');
  ks.innerHTML='<div class="spIdeasH">읽어야 할 보고서 <em>MUST-READ FILINGS · 변화 큰 순</em></div>';
  const ol=el('ol','orbKeyList');
  keys.forEach((r,i)=>{
    const li=el('li','orbKey'); li.dataset.r=r.rcept;
    li.appendChild(el('span','spRank',String(i+1)));
    const m=el('div','orbKeyM'), t=el('div','orbKeyT');
    t.appendChild(el('b',null,r.stamp+' '+r.label));
    const xb=el('em',null,orbX(r.x)); xb.style.setProperty('--c',ORB_PC[r.tier]); t.appendChild(xb);
    t.appendChild(el('small',null,r.tier));
    m.appendChild(t);
    m.appendChild(orbLines(r.gist));
    li.appendChild(m);
    li.onmouseenter=()=>focus(r); li.onmouseleave=blur; li.onclick=()=>orbGo(r);
    ol.appendChild(li);
  });
  ks.appendChild(ol);
  plate.appendChild(ks);
  plate.appendChild(fm);

  const ft=el('div','spFoot');
  ft.innerHTML='<span></span><b>ORBIT · 기업궤도추적</b>';
  ft.querySelector('span').textContent='출처: DART 정기보고서 원문 '+rows.length+'건. 같은 종류의 직전 보고서와 문단 단위로 견줬다. '+
    '한 줄 요약은 직전 보고서에 없던 문장에서 골랐고, 표현만 고친 문단은 뺐다. 막대를 누르면 그 보고서의 변화 브리핑.';
  plate.appendChild(ft);
}

// 보고서별 원장 — 앱 테마. 최신부터.
function orbLedger(box, all){
  box.innerHTML='';
  S.orbFilter=S.orbFilter||'all';
  const hd=el('div','orbLedH');
  const ht=el('div');
  ht.appendChild(el('h4',null,'보고서별 변화 원장'));
  ht.appendChild(el('p','sub','최신부터. 막대는 평소 대비 배수(세로 눈금 = 1×), 오른쪽은 직전 보고서에 없던 내용 한 줄. 줄을 누르면 변화 브리핑이 열린다.'));
  hd.appendChild(ht);
  const hit=r=>!r.tag && r.x!==null && r.x!==undefined;
  const cnt={all:all.length, big:all.filter(r=>hit(r)&&r.x>=1.5).length, shock:all.filter(r=>hit(r)&&r.x>=2).length};
  const seg=el('div','seg');
  [['all','전체'],['big','큼 이상'],['shock','격변만']].forEach(([k,l])=>{
    const b=el('button',k===S.orbFilter?'on':'',l+' '+cnt[k]);
    b.onclick=()=>{ S.orbFilter=k; orbLedger(box, all); };
    seg.appendChild(b);
  });
  hd.appendChild(seg);
  box.appendChild(hd);

  // 앞선 보고서에 이미 나온 문장은 '이어짐'으로 흐리게
  const seen=new Set(), again=new Set();
  all.forEach(r=>(r.gist||[]).forEach(g=>{ const k=orbKeyOf(g); if(!k) return;
    if(seen.has(k)) again.add(r.rcept+'|'+k); seen.add(k); }));

  const rows=all.filter(r=>S.orbFilter==='all' || (hit(r) && r.x>=(S.orbFilter==='big'?1.5:2)));
  const list=el('div','orbRows');
  const head=el('div','orbRow orbHeadRow');
  head.innerHTML='<span>시점</span><span>변화 강도 <small>평소 = 1×</small></span><span>무엇이 바뀌었나 <small>직전 보고서에 없던 내용</small></span>';
  list.appendChild(head);
  if(!rows.length) list.appendChild(el('div','empty','이 조건에 맞는 보고서가 없다.'));
  rows.slice().reverse().forEach(r=>{
    const row=el('div','orbRow'+(r.tier&&!r.tag?' t-'+r.tier:'')+(r.tag?' fix':''));
    row.onclick=()=>orbGo(r);
    const w=el('div','orbWhen');
    w.appendChild(el('b',null,r.stamp));
    w.appendChild(el('span',null,r.label+(r.tag||'')));
    if(r.kind) w.appendChild(el('small',null,'vs '+r.kind));
    row.appendChild(w);
    const m=el('div','orbMeterCell');
    if(r.score===null || r.score===undefined) m.appendChild(el('span','orbPending','분석 전'));
    else if(r.x===null || r.x===undefined) m.appendChild(el('span','orbPending','기준 보고서'));
    else {
      const mt=el('div','orbMeter');
      const f=el('i'); f.style.width=Math.min(100,r.x/3*100)+'%';
      f.style.background=r.tag?'var(--tier-2)':ORB_AC[r.tier]; mt.appendChild(f);
      const u=el('u'); u.style.left=(100/3)+'%'; mt.appendChild(u);
      m.appendChild(mt);
      const v=el('div','orbMeterV');
      v.appendChild(el('b',null,orbX(r.x)));
      const tt=el('span','orbTier',r.tag?'정정':r.tier); tt.style.setProperty('--c',r.tag?'var(--tier-2)':ORB_AC[r.tier]);
      v.appendChild(tt);
      v.appendChild(el('small',null,'원점수 '+r.score));
      m.appendChild(v);
    }
    row.appendChild(m);
    const what=el('div','orbWhat');
    if(r.score===null || r.score===undefined) what.appendChild(el('span','orbPending','분석이 끝나면 여기에 한 줄 요약이 뜬다'));
    else what.appendChild(orbLines(r.gist, g=>again.has(r.rcept+'|'+orbKeyOf(g))));
    row.appendChild(what);
    list.appendChild(row);
  });
  box.appendChild(list);
}

// ---------------------------------------------------------- 호재기업
async function viewCatalyst(p, force){
  S.catDays = S.catDays || 3;
  S.catCat = S.catCat || null;
  S.catMode = S.catMode || 'filing';
  p.innerHTML='';
  p.appendChild(el('h4','head','호재기업'));

  const modes=el('div','seg'); modes.style.marginBottom='12px';
  [['filing','공시 호재'],['backlog','수주잔고 증가'],['synergy','시너지 발굴']].forEach(([k,label])=>{
    const b=el('button', k===S.catMode?'on':'', label);
    b.onclick=()=>{ S.catMode=k; viewCatalyst(p); };
    modes.appendChild(b);
  });
  p.appendChild(modes);
  if(S.catMode==='backlog'){ return viewBacklog(p, force); }
  if(S.catMode==='synergy'){ return viewSynergy(p, force); }
  p.appendChild(el('p','sub',
    'DART 전체 공시를 훑어 보고서명으로 호재를 분류한다. 한국 공시는 이름이 규격화돼 있어 본문을 열지 않아도 무슨 일인지 대부분 판별된다. 종목 선택과 무관하게 전 상장사가 대상이다.'));

  const bar=el('div','mtxbar');
  const seg=el('div','seg');
  [[1,'오늘'],[3,'3일'],[7,'1주'],[14,'2주'],[30,'1달']].forEach(([v,label])=>{
    const b=el('button', v===S.catDays?'on':'', label);
    b.onclick=()=>{ S.catDays=v; S.catCat=null; viewCatalyst(p); };
    seg.appendChild(b);
  });
  bar.appendChild(seg);
  // 강도 필터는 업종 점수와 공시 목록 둘 다에 걸린다
  if(S.catMinW===undefined) S.catMinW=2;
  const wseg=el('div','seg');
  [[1,'전체'],[2,'●● 이상'],[3,'●●● 만']].forEach(([v,label])=>{
    const b=el('button', v===S.catMinW?'on':'', label);
    b.title = v===1 ? '내부자 매수·대량보유 보고서까지 포함 (매일 수백 건)' :
              v===2 ? '수주·설비투자·자사주·M&A·임상 등' : '설비투자·대형수주·자사주소각·메자닌소각·거래재개';
    b.onclick=()=>{ S.catMinW=v; viewCatalyst(p); };
    wseg.appendChild(b);
  });
  bar.appendChild(wseg);
  const sp=el('div'); sp.style.flex='1'; bar.appendChild(sp);
  const rf=el('button','ghost','새로 받기');
  rf.onclick=()=>viewCatalyst(p, true);
  bar.appendChild(rf);
  p.appendChild(bar);

  S.catLevel = S.catLevel || 'sector';
  const box=el('div'); p.appendChild(box);
  box.innerHTML='<div class="loading">DART 공시 훑는 중…</div>';
  const d=await (await fetch('/api/catalyst?days='+S.catDays+'&level='+S.catLevel+
    '&minw='+S.catMinW+(force?'&force=1':''))).json();
  box.innerHTML='';
  if(d.error){ box.appendChild(el('div','err',d.error)); return; }

  // ---- 업종별 현황
  box.appendChild(sectorPanel(d, p));
  if(S.catGroup){
    const key = S.catLevel==='theme' ? (r=>r.themes.includes(S.catGroup))
              : S.catLevel==='industry' ? (r=>r.industry===S.catGroup)
              : (r=>r.sector===S.catGroup);
    d.good = d.good.filter(key); d.check = d.check.filter(key); d.bad = d.bad.filter(key);
    const cc={}; d.good.forEach(r=>{ cc[r.category]=(cc[r.category]||0)+1; });
    d.categories = Object.entries(cc).sort((a,b)=>b[1]-a[1]);
    const f=el('div','first');
    f.innerHTML='<b>'+esc(S.catGroup)+'</b> 만 보는 중 · ';
    const x=el('a',null,'해제'); x.href='#';
    x.onclick=(ev)=>{ ev.preventDefault(); S.catGroup=null; viewCatalyst(p); };
    f.appendChild(x);
    box.appendChild(f);
  }

  // 범주 태그 개수도 강도 기준을 따른다. 안 그러면 내부자 매수 수백 건이 태그 맨 앞에 선다.
  { const cc={}; d.good.filter(r=>(r.weight||1)>=S.catMinW)
      .forEach(r=>{ cc[r.category]=(cc[r.category]||0)+1; });
    d.categories=Object.entries(cc).sort((a,b)=>b[1]-a[1]); }

  const when=new Date(d.at*1000);
  const info=el('div','legend');
  info.textContent='공시 '+d.scanned.toLocaleString('ko-KR')+'건 훑음 · 호재 '+
    d.good.length+'건 · 확인필요 '+d.check.length+'건 · 악재 '+d.bad.length+'건 · '+
    when.toLocaleTimeString('ko-KR')+' 기준';
  box.appendChild(info);

  // 범주 필터
  const cats=el('div','tagrow');
  const all=el('span', S.catCat===null?'tag t0':'tag');
  all.style.cursor='pointer';
  all.appendChild(el('b',null,'전체'));
  all.appendChild(document.createTextNode(' '+d.good.length));
  all.onclick=()=>{ S.catCat=null; viewCatalyst(p); };
  cats.appendChild(all);
  (d.categories||[]).forEach(([name,cnt])=>{
    const s=el('span', S.catCat===name?'tag t0':'tag');
    s.style.cursor='pointer';
    s.appendChild(el('b',null,name));
    s.appendChild(document.createTextNode(' '+cnt));
    s.onclick=()=>{ S.catCat=(S.catCat===name?null:name); viewCatalyst(p); };
    cats.appendChild(s);
  });
  box.appendChild(cats);

  let good = S.catCat ? d.good.filter(r=>r.category===S.catCat) : d.good;
  const hidden = good.filter(r=>(r.weight||1) < S.catMinW).length;
  good = good.filter(r=>(r.weight||1) >= S.catMinW);
  box.appendChild(secTitle('호재 ('+good.length+'건)',
    '강도는 주가 영향 크기가 아니라 신호가 얼마나 분명한지다. ●●● 이 가장 분명하다.'+
    (hidden? '  약한 신호 '+hidden+'건은 접어뒀다 — 내부자 매수·대량보유 보고서는 매일 수백 건씩 나온다.':'')));
  box.appendChild(catList(good));

  if(d.check.length){
    box.appendChild(secTitle('확인 필요 ('+d.check.length+'건)',
      '보고서명만으로는 방향을 알 수 없는 공시다. 호재로 단정하면 안 된다.'));
    box.appendChild(catList(d.check, true));
  }
  if(d.bad.length){
    box.appendChild(secTitle('악재 ('+d.bad.length+'건)',
      '호재 목록에 섞이지 않게 따로 뺀 것들이다.'));
    box.appendChild(catList(d.bad, true));
  }
}

// 수주잔고 증가 — 정기보고서 본문의 수주상황 표에서 뽑은 잔고 시계열
async function viewBacklog(p, force){
  S.blAll = !!S.blAll;
  S.blMode = S.blMode || (S.blAll?'all':'steady');
  p.appendChild(el('p','sub',
    '수주잔고는 DART 재무제표에 없다. 정기보고서 「사업의 내용 → 수주상황」 표와 본문 문장에서 꺼낸다. '+
    '표의 산술 관계(수주총액 − 기납품 = 잔고, 기초 + 신규 − 납품 = 기말)로 검산해서, 맞으면 제대로 읽은 것으로 본다.'));
  const bar=el('div','mtxbar');
  const seg=el('div','seg');
  [['steady','꾸준히 증가만'],['all','수주 공시 전체'],['dip','억울한 낙폭']].forEach(([v,label])=>{
    const b=el('button', v===S.blMode?'on':'', label);
    if(v==='dip') b.title='수주잔고는 쌓이는데 주가는 매크로·심리로만 빠진 회사 — 돈을 벌고, 주주 몫을 해친 일이 없는 곳만';
    b.onclick=()=>{ S.blMode=v; S.blAll=(v==='all'); viewCatalyst(p); };
    seg.appendChild(b);
  });
  bar.appendChild(seg);
  const sp=el('div'); sp.style.flex='1'; bar.appendChild(sp);
  const rf=el('button','ghost','다시 읽기'); rf.onclick=()=>{ if(S.blMode==='dip') viewDip(box,true); else viewBacklog2(true); };
  bar.appendChild(rf);
  p.appendChild(bar);
  const box=el('div'); p.appendChild(box);

  async function viewBacklog2(f){
    const d=await (await fetch('/api/backlog?'+(S.blAll?'all=1':'')+(f?'&force=1':''))).json();
    box.innerHTML='';
    if(d.error){ box.appendChild(el('div','err',d.error)); return; }
    if(d.running){
      const pr=el('div','prog');
      pr.appendChild(el('span',null,'보고서 본문 읽는 중 '+d.done+'/'+d.total+' (수주 표 없는 회사 '+d.skipped+'곳 건너뜀)'));
      const b=el('div','bar'); const i=el('i'); i.style.width=Math.round(d.done/Math.max(d.total,1)*100)+'%';
      b.appendChild(i); pr.appendChild(b);
      pr.appendChild(el('span',null,'처음 한 번만 오래 걸린다. 보고서별로 저장된다.'));
      box.appendChild(pr);
      setTimeout(()=>{ if(S.tab==='cat'&&S.catMode==='backlog') viewBacklog2(false); }, 4000);
    }
    box.appendChild(el('div','legend',
      '수주잔고를 읽은 회사 '+(d.total_found||0)+'곳 · 그중 꾸준히 증가 '+(d.steady||0)+'곳'));
    const rows=d.rows||[];
    if(!rows.length){ box.appendChild(el('div','empty', d.running?'읽는 중…':'해당 없음')); return; }
    box.appendChild(backlogTable(rows));
    box.appendChild(el('div','finnote',
      '꾸준히 증가 판정: 최근 최대 8개 보고서에서 직전 대비 늘어난 횟수가 70% 이상, 중간에 15% 넘게 준 적 없음, '+
      '1년 전보다 5% 넘게 증가, 한 번에 5배 넘게 튄 값 없음(추출 오류 의심). '+
      '매출 배수 = 수주잔고 ÷ 작년 매출. 3배면 3년치 매출을 이미 확보했다는 뜻이다.'));
  }
  if(S.blMode==='dip'){ viewDip(box, force); return; }
  box.innerHTML='<div class="loading">수주잔고 모으는 중…</div>';
  viewBacklog2(force);
}

async function viewDip(box, force){
  if(!box._shell){
    box.innerHTML='';
    const hd=el('div','dipHead');
    hd.appendChild(el('b',null,'억울한 낙폭'));
    hd.appendChild(el('span',null,'수주잔고는 쌓이는데, 주가는 매크로·심리만으로 빠진 회사 — 돈을 벌고 있고 주주 몫을 해친 일도 없는 곳만'));
    box.appendChild(hd);
    const cond=el('details','dipCond'); cond.open=!S.dipCondClosed;
    cond.addEventListener('toggle',()=>{ S.dipCondClosed=!cond.open; });
    cond.appendChild(el('summary',null,'조건식 — 여섯 관문 (앞 관문을 넘어야 다음으로)'));
    const g=el('div','dipGates');
    DIP_GATES.forEach(([k,t,items,why])=>{ const c=el('div','dipGate'); c.appendChild(el('em',null,k)); c.appendChild(el('b',null,t));
      const ul=el('ul'); items.forEach(x=>ul.appendChild(el('li',x.startsWith('(')?'soft':null,x))); c.appendChild(ul); c.appendChild(el('p',null,why)); g.appendChild(c); });
    cond.appendChild(g); box.appendChild(cond);
    box._body=el('div'); box.appendChild(box._body); box._shell=true;
  }
  const body=box._body;
  let d;
  try{ d=await (await fetch('/api/dip'+(force?'?force=1':''))).json(); }catch(e){ d={error:'불러오지 못했습니다'}; }
  if(!box.isConnected) return;
  body.innerHTML='';
  if(d.error){ body.appendChild(el('div','err',d.error)); return; }
  if(d.running){
    const pr=el('div','prog'); pr.appendChild(el('span',null,(d.phase||'계산 중')+(d.total?' '+d.done+'/'+d.total:'')));
    const b=el('div','bar'); const i=el('i'); i.style.width=(d.total?Math.round(d.done/d.total*100):5)+'%'; b.appendChild(i); pr.appendChild(b);
    pr.appendChild(el('span',null,'처음 한 번은 몇 분 걸린다(회사별 공시 3년 치·세부 판정). 6시간마다 새로 맞춘다.'));
    body.appendChild(pr);
    setTimeout(()=>{ if(box.isConnected && S.tab==='cat' && S.catMode==='backlog' && S.blMode==='dip') viewDip(box,false); }, 4000);
    if(!(d.rows||[]).length) return;
  }
  // 깔때기
  const f=d.funnel||{};
  if(f.all!==undefined){
    const fn=el('div','dipFunnel');
    const nA=(d.rows||[]).filter(r=>r.tier==='억울').length;
    [['수주잔고 읽은 회사',f.all],['① 잔고 증가',f[1]],['② 돈을 번다',f[2]],['③ 주주가치 지킴',f[3]],['④ 주가 −20%↓',f[4]],['⑤ 이익은 버팀',f[5]],['⑥ 억울 등급',d.running?undefined:nA]]
      .forEach(([k,v],i)=>{ if(i) fn.appendChild(el('i',null,'→')); const x=el('div'); x.appendChild(el('b',null,v===undefined?'—':String(v))); x.appendChild(el('span',null,k)); fn.appendChild(x); });
    body.appendChild(fn);
  }
  if(d.bt) body.appendChild(dipEvidence(d.bt));
  const rows=d.rows||[];
  const A=rows.filter(r=>r.tier==='억울'), B=rows.filter(r=>r.tier!=='억울');
  body.appendChild(dipTable(A,'억울한 낙폭','이익은 버텼고, 시장·업종과 함께 빠졌고, 자기 역사로 봐도 비싸지 않다'));
  if(B.length) body.appendChild(dipTable(B,'관찰','관문은 넘었지만 하나가 걸린다 — 회사만 더 빠졌거나, 시장은 멀쩡했거나, 빠진 뒤에도 자기 역사로 비싸다'));
  if(!rows.length && !d.running) body.appendChild(el('div','empty','지금은 여섯 관문을 모두 넘은 회사가 없다.'));
  const drop=d.drop||[];
  if(drop.length){
    const det=el('details','dipDrop'); det.appendChild(el('summary',null,'잔고는 느는데 막힌 회사와 막힌 이유 '+drop.length+'곳'));
    const t=el('table','tbl dipTbl'); t.innerHTML='<tr><th>종목</th><th>막힌 관문</th><th>이유</th><th class="r">잔고 1년</th><th class="r">고점 대비</th></tr>';
    drop.forEach(r=>{ const tr=el('tr'); const td=el('td'); const a=el('a',null,r.name); a.href='#'; a.onclick=e=>{ e.preventDefault(); pick(r.code); }; td.appendChild(a); td.appendChild(el('small',null,' '+(r.industry||''))); tr.appendChild(td);
      tr.appendChild(el('td',null,r.fail?DIP_GATES[r.fail.gate-1][0]+' · '+r.fail.name:'—'));
      tr.appendChild(el('td','why',r.fail?r.fail.why+(r.n_fail>1?' (그 밖에 '+(r.n_fail-1)+'가지 더)':''):''));
      tr.appendChild(el('td','num',dipP(r.backlog_yoy))); tr.appendChild(el('td','num',dipP(r.dd))); t.appendChild(tr); });
    det.appendChild(t); body.appendChild(det);
  }
  body.appendChild(el('div','finnote','수주잔고 = 정기보고서 「사업의 내용」 수주상황 표(검산). 이익 = 분기 보고서 순이익 4분기 합(적자면 영업이익). '+
    '시장·업종 = 수집한 전 종목 수정주가로 잰 같은 기간(이 회사 고점일 → 오늘) 수익률의 중앙값. 공시 판정 = DART 공시 목록 3년 치 + 주요사항보고서 세부. '+
    '조건을 모두 넘어도 "싸다"는 뜻이지 "오른다"는 뜻은 아니다 — 왜 빠졌는지 마지막 확인은 사람이 한다.'));
}

function dipEvidence(bt){
  const det=el('details','dipEvd'); det.open=!!S.dipEvdOpen; det.addEventListener('toggle',()=>{ S.dipEvdOpen=det.open; });
  const f=v=>{ if(v==null) return '—'; const n=Math.round(v); return (n>0?'+':'')+n+'%'; };   // −0% 대신 0%
  const T=bt.tiers||{}, a=T['억울']||{}, o=T['관찰']||{}, sn=(bt.score||{}).new||{}, so=(bt.score||{}).old||{};
  det.appendChild(el('summary',null,'과거 12년 검증 — 점수 상위⅓ 12개월 초과수익 '+f(sn.top)+' vs 하위⅓ '+f(sn.bot)+' · 등급 억울 '+f(a.median)+' vs 관찰 '+f(o.median)));
  const d0=(bt.dates||['',''])[0], d1=(bt.dates||['',''])[1];
  det.appendChild(el('p',null,d0.slice(0,4)+'.'+d0.slice(4,6)+'~'+d1.slice(0,4)+'.'+d1.slice(4,6)+' 매달 말, 그때 이미 공시된 보고서만으로 관문을 다시 세우고 그 뒤 12개월 수익률을 같은 기간 전 종목 중앙값과 비교했다. '+
    '주주가치 관문(공시 판정)은 빠졌고, 지금 상장된 회사만 있어 수익률 수준은 부풀어 있다 — 묶음끼리 비교만 믿는다.'));
  const g=bt.groups||{}; const t1=el('table','tbl dipTbl');
  t1.innerHTML='<tr><th>묶음</th><th class="r">표본</th><th class="r">회사</th><th class="r">12개월 초과 중앙</th><th class="r">평균</th><th class="r">이긴 비율</th></tr>';
  [['잔고 관문 통과','잔고만 늘어도'],['+ 돈 관문','잔고 + 돈'],['그중 주가 안 빠짐(고점 −10% 이내)','  그중 주가가 안 빠진 때'],['억울한 낙폭 후보(잔고·돈·하락·이익)','  그중 −20%↓ · 이익 버팀 = 후보'],
   ['그중 −20%↓인데 이익도 −5%↓ 줄어듦','  그중 −20%↓ · 이익도 줄어듦'],['억울 등급','    후보 중 억울'],['관찰 등급','    후보 중 관찰']].forEach(([k,lab])=>{
    const x=(g[k]||{})['12m']; if(!x) return; const tr=el('tr'); tr.appendChild(el('td',null,lab));
    tr.appendChild(el('td','num',String(x.n))); tr.appendChild(el('td','num',String(x.firms))); tr.appendChild(el('td','num strong',f(x.median)));
    tr.appendChild(el('td','num',f(x.mean))); tr.appendChild(el('td','num',Math.round(x.hit)+'%')); t1.appendChild(tr); });
  det.appendChild(t1);
  const t2=el('table','tbl dipTbl');
  t2.innerHTML='<tr><th>점수</th><th class="r">상위⅓</th><th class="r">하위⅓</th><th class="r">차이</th><th class="r">90% 구간(회사 단위 재표본)</th><th class="r">~2019</th><th class="r">2020~</th></tr>';
  const sc=bt.score||{};
  [['예전 점수(가중치를 감으로 정함)',sc.old],['지금 점수(백테스트로 고른 5항목)',sc.new],['지금 점수 — 앞 기간 분포로 뒤 기간을 잼',sc.oos]].forEach(([lab,x])=>{
    if(!x) return; const tr=el('tr'); tr.appendChild(el('td',null,lab));
    [f(x.top),f(x.bot),f(x.spread),(x.ci&&x.ci[0]!=null)?f(x.ci[0])+' ~ '+f(x.ci[1]):'—',f(x.early),f(x.late)].forEach((v,i)=>tr.appendChild(el('td','num'+(i==2?' strong':''),v)));
    t2.appendChild(tr); });
  det.appendChild(t2);
  const ul=el('ul','dipEvdL');
  ['점수 항목: 북투빌(높을수록), 같은 기간 업종 수익률(덜 빠졌을수록), 고점 대비 낙폭(깊을수록), 잔고÷연매출(클수록), 순차입÷자본(낮을수록). 앞뒤 기간에서 방향이 같았던 것만 남겼다.',

   '업종 전체가 빠진 하락은 회복이 오히려 약했다(업종 모멘텀). 업종은 버티는데 이 회사만 과하게 빠진 쪽이 더 잘 돌아왔다.',
   '억울·관찰 등급은 수익률로 구분되지 않았다. 등급은 "왜 빠졌나"를 설명하는 이름표로 읽고, 순서는 점수로 본다.',

  det.appendChild(ul);
  det.appendChild(el('div','finnote','다시 재기: python 도구/억울_백테스트.py (약 10분). 결과 파일 .cache/dip/bt_report.json 을 이 화면과 점수가 바로 읽는다.'));
  return det;
}

function dipTable(rows,title,sub){

  const h=el('div','dipBH'); h.appendChild(el('b',null,title+' '+rows.length+'곳')); h.appendChild(el('span',null,sub)); w.appendChild(h);
  if(!rows.length){ w.appendChild(el('div','empty','해당 없음')); return w; }
  const t=el('table','tbl dipTbl');
  t.innerHTML='<tr><th>종목</th><th class="r">잔고 1년</th><th class="r">북투빌</th><th class="r">고점 대비</th><th class="r">그 사이 이익</th>'+
    '<th class="r">값 매김</th><th class="r">시장 · 업종</th><th class="r">PER 자기 역사</th><th class="r">점수</th><th></th></tr>';
  rows.forEach(r=>{

function synPass(r, f, ctx){
  if(!f.unreliable && !r.reliable) return false;
  if(f.watchOnly && !S.synWatch.has(r.code)) return false;
  if(f.q && !(r.name+' '+r.code+' '+(r.industry||'')+' '+(r.themes||[]).join(' ')).includes(f.q)) return false;
  if(f.market!=='전체' && r.market!==f.market) return false;
  if(f.sector!=='전체' && r.sector!==f.sector) return false;
  if(f.industry!=='전체' && r.industry!==f.industry) return false;
  if(f.theme && !(r.themes||[]).includes(f.theme)) return false;
  if(f.stages.length && !f.stages.includes(r.stage)) return false;
  if(f.noFlags && (r.flags||[]).length) return false;
  if(f.noLoss && r.loss4) return false;
  if(f.onlyLoss && !r.loss4) return false;
  const ge=(v,m)=> num(m)===null || (v!==null&&v!==undefined&&v>=num(m));
  const le=(v,m)=> num(m)===null || (v!==null&&v!==undefined&&v<=num(m));
  const cap = r.cap ? r.cap/1e8 : null;                     // 억 단위로 비교
  if(!ge(cap,f.capMin) || !le(cap,f.capMax)) return false;
  if(!ge(r.backlog_yoy,f.yoyMin) || !ge(r.btb,f.btbMin) || !ge(r.cover,f.coverMin)) return false;
  if(!ge(r.rev_yoy,f.revYoyMin) || !ge(r.rev_accel,f.accMin) || !ge(r.margin_delta,f.mgnMin)) return false;
  if(!ge((r.new_contracts||[]).length,f.ncMin) || !ge(r.new_pct||0,f.ncPctMin)) return false;
  if(!ge(r.price_1y,f.p1yMin) || !le(r.price_1y,f.p1yMax) || !le(r.dd52,f.ddMax)) return false;
  if(!ge(r.gap,f.gapMin)) return false;
  if(!ge(r.cover_chg,f.coverChgMin) || !ge(r.margin4,f.m4Min) || !le(r.margin4,f.m4Max)) return false;
  if(num(f.perMax)!==null && !(r.per>0 && r.per<=num(f.perMax))) return false;
  return true;
}

async function viewSynergy(p, force){
  S.synF = S.synF || synFresh(lsGet('synF', {}));
  S.synWatch = S.synWatch || new Set(lsGet('synWatch', []));
  S.synCols = S.synCols || '개요';
  S.synSort = S.synSort || {key:'score', dir:-1};
  if(S.synMap===undefined) S.synMap = true;
  p.appendChild(el('p','sub',
    '수주가 실적과 주가로 넘어가는 길목을 찾는 스크리너. 네 신호를 한 줄에 세운다 — '+
    '① 선행: 북투빌·잔고/연매출 배수의 1년 변화(잔고가 매출보다 빨리 불어나나) ② 전환: 4분기 합 영업이익률이 아직 낮은가(늘어날 여지, 적자는 0%로 봄) ③ 확인: 보고서 뒤 새 수주 계약 공시 ④ 가격: 주가 반영 갭. '+
    '점수는 흑자·적자를 따지지 않는다 — 4분기 합 적자인 곳은 "4분기 적자" 표시로 따로 알리고, 오른쪽 거름에서 뺄 수 있다. '+
    '부분 안의 항목은 과거 12년 검증으로 골랐다(아래 "과거 검증" 상자). '+
    '카드는 가설 하나씩이다. 행을 펼치면 근거와 함께 "다음에 무엇을 확인할지" 질문, 발주처·동종 대안으로 가는 연결이 나온다.'));
  const box=el('div'); p.appendChild(box);

  async function load(f){
    box.innerHTML='<div class="loading">수주·실적·주가·계약 공시 맞추는 중…</div>';
    const d=await (await fetch('/api/synergy'+(f?'?force=1':''))).json();
    S.synData=d; render();
  }
  function render(){
    S.synRerender=render;
    const d=S.synData; box.innerHTML='';
    if(d.error){ box.appendChild(el('div','err',d.error)); return; }
    if(d.running){
      const pr=el('div','prog');
      pr.appendChild(el('span',null,(d.phase||'계산 중')+(d.total?' '+d.done+'/'+d.total:'')));
      const b=el('div','bar'); const i=el('i'); i.style.width=(d.total?Math.round(d.done/d.total*100):5)+'%';
      b.appendChild(i); pr.appendChild(b);
      pr.appendChild(el('span',null,'처음 한 번은 몇 분 걸린다. 3시간마다 새로 맞춘다.'));
      box.appendChild(pr);
      setTimeout(()=>{ if(S.tab==='cat'&&S.catMode==='synergy') load(false); }, 4000);
      if(!(d.rows||[]).length) return;
    }
    if(d.bt) box.appendChild(synEvidence(d.bt));
    const all=d.rows||[];
    // 업종 동반 수주 — 업종마다 잔고 +15% 이상인 믿을 만한 회사 수
    const wave={};
    all.filter(r=>r.reliable&&(r.backlog_yoy||0)>=15).forEach(r=>{ wave[r.industry]=(wave[r.industry]||0)+1; });
    // RS — 수주 유니버스 안에서 주가 1년 수익률 백분위
    const px=all.map(r=>r.price_1y).filter(v=>v!==null&&v!==undefined).sort((a,b)=>a-b);
    all.forEach(r=>{ r.rs = r.price_1y===null||r.price_1y===undefined ? null :
      Math.round(px.filter(v=>v<r.price_1y).length/Math.max(px.length-1,1)*99); });
    const ctx={wave};
    const preset=SYN_PRESETS.find(x=>x.id===S.synPreset);
    const f=S.synF;
    const rows=all.filter(r=>synPass(r,f,ctx) && (!preset||!preset.pred||preset.pred(r,ctx)));

    // 전략 카드
    const cards=el('div','syncards');
    SYN_PRESETS.forEach(ps=>{
      const ff=synFresh(ps.f);
      const n=all.filter(r=>synPass(r,ff,ctx) && (!ps.pred||ps.pred(r,ctx))).length;
      const c=el('button','syncard'+(S.synPreset===ps.id?' on':''));
      const h=el('div','synch'); h.appendChild(el('b',null,ps.name)); h.appendChild(el('span',null,n+'종목'));
      c.appendChild(h); c.appendChild(el('small',null,ps.desc));
      c.onclick=()=>{
        S.synRec=null;
        if(S.synPreset===ps.id){ S.synPreset=null; S.synF=synFresh(); }
        else { S.synPreset=ps.id; S.synF=synFresh(ps.f); }
        render();
      };
      cards.appendChild(c);
    });
    box.appendChild(cards);

    // 도구줄
    const bar=el('div','mtxbar synbar');
    const cnt=el('div','syncount'); cnt.innerHTML='<b>'+rows.length+'</b>종목 통과 <small>/ 믿을 수 있는 '+(d.reliable||0)+' · 전체 '+all.length+'</small>';
    bar.appendChild(cnt);
    const qi=el('input'); qi.placeholder='종목·업종·테마 검색'; qi.value=f.q; qi.className='synq';
    qi.oninput=()=>{ f.q=qi.value.trim(); clearTimeout(S.synT); S.synT=setTimeout(render,250); };
    bar.appendChild(qi);
    const wb=el('button','ghost'+(f.watchOnly?' on':''), (f.watchOnly?'★':'☆')+' 관심종목 '+S.synWatch.size);
    wb.onclick=()=>{ f.watchOnly=!f.watchOnly; render(); }; bar.appendChild(wb);
    const seg=el('div','seg');
    ['개요','수주','실적','가격·밸류','계약·연결','질문'].forEach(k=>{
      const b=el('button', k===S.synCols?'on':'', k); b.onclick=()=>{ S.synCols=k; render(); }; seg.appendChild(b);
    });
    bar.appendChild(seg);
    const mb=el('button','ghost', S.synMap?'지도 접기':'지도 보기'); mb.onclick=()=>{ S.synMap=!S.synMap; render(); };
    bar.appendChild(mb);
    const rf=el('button','ghost','다시 계산'); rf.onclick=()=>load(true); bar.appendChild(rf);
    box.appendChild(bar);

    const grid=el('div','syngrid');
    const main=el('div','synmain');
    if(S.synMap) main.appendChild(synScatter(rows));
    main.appendChild(synTable(rows, all));
    main.appendChild(synCycle(all, ctx));
    main.appendChild(el('div','finnote',
      '점수 = 선행 35 · 전환 25 · 확인 15 · 가격 25 의 가중 백분위(믿을 수 있는 회사끼리). 최근 악재 공시 하나당 10점 감점. '+
      '북투빌 = 1 + 잔고 1년 증가분 ÷ 최근 4분기 매출. 시가총액은 네이버 시총 스냅샷에 그 뒤 주가 변화를 곱한 추정. '+
      'RS 는 이 목록 안에서의 1년 주가 수익률 백분위(0~99). 판단을 돕는 순위일 뿐 매수 신호가 아니다.'));
    grid.appendChild(main);
    grid.appendChild(synFilterPanel(all, render));
    box.appendChild(grid);
  }
  if(S.synData && !force) render(); else load(force);
}

// 추천필터 — 한 번 누르면 직접 설정 필터가 채워지고 표·지도가 바뀐다. 정의는 시너지.py SYN_REC 한 곳,
// 과거 성과는 도구/시너지_백테스트.py 가 같은 정의로 잰 값(12개월 초과수익 중앙값 · 이긴 비율 · −30%↓ 비율).
function synRecBlock(rerender){
  const d=S.synData||{}, recs=d.rec||[], ev=((d.bt||{}).rec)||{}, base=(d.bt||{}).median;
  const w=el('div','synrec');
  const hd=el('div','synrechd'); hd.appendChild(el('b',null,'추천필터'));
  hd.appendChild(el('span',null,'무엇을 넣을지 모르겠으면 하나를 누른다. 아래 칸이 채워진다.')); w.appendChild(hd);
  if(!recs.length){ w.appendChild(el('small',null,'추천필터를 불러오지 못했다.')); return w; }
  const all=(d.rows||[]);
  const fx=v=>{ const k=Math.round(v); return (k>0?'+':'')+k+'%'; };
  recs.forEach(rc=>{
    const ff=synFresh(rc.f);
    const n=all.filter(r=>synPass(r,ff,{wave:{}})).length;
    const b=el('button','synrecb'+(S.synRec===rc.id?' on':''));
    const top=el('div','synrect'); top.appendChild(el('b',null,rc.name)); top.appendChild(el('span',null,n+'곳')); b.appendChild(top);
    b.appendChild(el('small',null,rc.desc));
    const x=ev[rc.id];
    if(x){
      const e=el('div','synrece');
      e.textContent='과거 1년 뒤 '+fx(x.median)+(base!=null?' (전체 '+fx(base)+')':'')+' · 이긴 '+Math.round(x.hit)+'% · −30%↓ '+Math.round(x.worst)+'%';
      e.title='2013~2025 매달, 그때 이 거름을 통과한 회사들의 12개월 초과수익(같은 기간 전 종목 중앙값 대비) 중앙값. '+
        '표본 '+x.n+'건 · '+x.firms+'곳, 한 달 평균 '+x.per_date.toFixed(1)+'곳. 90% 구간 '+fx(x.ci[0])+' ~ '+fx(x.ci[1])+
        ', 2019년 전 '+(x.early!=null?fx(x.early):'—')+' · 2020년 뒤 '+(x.late!=null?fx(x.late):'—')+'. 악재 공시 거름은 과거 자료가 없어 빠졌다.';
      b.appendChild(e);
    }
    b.onclick=()=>{
      if(S.synRec===rc.id){ S.synRec=null; S.synF=synFresh(); }
      else { S.synRec=rc.id; S.synPreset=null; S.synF=synFresh(rc.f); }
      rerender();
    };
    w.appendChild(b);
  });
  w.appendChild(el('small','synrecn','과거 수치는 지금 상장된 회사만으로 잰 값이라 부풀어 있다. 순서를 고르는 참고일 뿐 매수 신호가 아니다.'));
  return w;
}

// 오른쪽 — 직접 설정 필터
function synFilterPanel(all, rerender){
  const f=S.synF;
  const side=el('aside','synside');
  const hd=el('div','synsidehd'); hd.appendChild(el('b',null,'직접 설정 필터')); side.appendChild(hd);
  const body=el('div','synsidebody'); side.appendChild(body);
  const change=()=>{ S.synPreset=null; S.synRec=null; clearTimeout(S.synT); S.synT=setTimeout(rerender,200); };
  // 값이 기본과 다르면 그 묶음을 펼친다 — 추천필터가 무엇을 채웠는지 바로 보이게
  const set=k=>{ const v=f[k], d=SYN_DEF[k]; return Array.isArray(v)?v.length>0:(v!==d && v!=='' && v!==false && v!==null && v!==undefined); };
  function group(title, open, keys){
    const g=el('details','syngroup'); if(open || (keys||[]).some(set)) g.open=true;
    g.appendChild(el('summary',null,title)); body.appendChild(g); return g;
  }
  body.appendChild(synRecBlock(rerender));
  function sel(g, label, key, opts){
    const w=el('label','synfld'); w.appendChild(el('span',null,label));
    const s=el('select'); opts.forEach(o=>{ const op=el('option',null,o); op.value=o; if(f[key]===o) op.selected=true; s.appendChild(op); });
    s.onchange=()=>{ f[key]=s.value; change(); }; w.appendChild(s); g.appendChild(w);
  }
  function range(g, label, kMin, kMax, unit){
    const w=el('label','synfld'); w.appendChild(el('span',null,label+(unit?' ('+unit+')':'')));
    const r=el('div','synrange');
    [kMin,kMax].forEach((k,i)=>{
      if(!k){ return; }
      const inp=el('input'); inp.type='number'; inp.placeholder=i?'최대':'최소'; inp.value=f[k];
      inp.oninput=()=>{ f[k]=inp.value; change(); }; r.appendChild(inp);
      if(i===0&&kMax) r.appendChild(el('span',null,'~'));
    });
    w.appendChild(r); g.appendChild(w);
  }
  function chk(g, label, key){
    const w=el('label','synchk'); const c=el('input'); c.type='checkbox'; c.checked=!!f[key];
    c.onchange=()=>{ f[key]=c.checked; change(); }; w.appendChild(c); w.appendChild(document.createTextNode(' '+label)); g.appendChild(w);
  }
  const uniq=k=>['전체'].concat([...new Set(all.map(r=>r[k]).filter(x=>x&&x!=='분류없음'))].sort());
  const g1=group('종목 범위', true);
  sel(g1,'시장','market',['전체','KOSPI','KOSDAQ']);
  sel(g1,'대분류','sector',uniq('sector'));
  sel(g1,'업종','industry',uniq('industry'));
  if(f.theme){
    const tw=el('div','synfld'); tw.appendChild(el('span',null,'테마'));
    const tb=el('button','tag t3',f.theme+'  ✕'); tb.style.cssText='border:0;cursor:pointer;font:inherit;font-size:11.5px';
    tb.onclick=(ev)=>{ ev.preventDefault(); f.theme=''; change(); };
    tw.appendChild(tb); g1.appendChild(tw);
  }
  range(g1,'시가총액','capMin','capMax','억');
  const sw=el('div','synfld'); sw.appendChild(el('span',null,'단계'));
  const sb=el('div','synstages');
  const STG=['잠복','점화','반영','둔화','관찰'];
  // 전체 — 단계로 거르지 않는다(다른 필터에 걸린 모든 회사). 다섯 단계를 다 고르면 전체와 같으니 전체로 돌린다
  const ball=el('button','synstg btn'+(f.stages.length===0?' on':''));
  ball.appendChild(document.createTextNode('전체')); ball.title='단계로 거르지 않는다 — 다른 필터에 걸린 모든 회사를 보인다';
  ball.onclick=(ev)=>{ ev.preventDefault(); f.stages.splice(0); change(); };
  sb.appendChild(ball);
  STG.forEach(k=>{
    const b=el('button','synstg btn'+(f.stages.includes(k)?' on':''));
    const d=el('i'); d.style.background=synColor(k); b.appendChild(d); b.appendChild(document.createTextNode(k));
    b.title=(STAGE[k]||{}).desc||'';
    b.onclick=(ev)=>{ ev.preventDefault(); const i=f.stages.indexOf(k); if(i>=0) f.stages.splice(i,1); else f.stages.push(k);
      if(STG.every(x=>f.stages.includes(x))) f.stages.splice(0);
      change(); };
    sb.appendChild(b);
  });
  sw.appendChild(sb); g1.appendChild(sw);
  chk(g1,'잔고 값을 못 믿는 회사도 포함','unreliable');
  const g2=group('수주 · 선행', true);
  range(g2,'수주잔고 1년 증가율 ≥','yoyMin',null,'%');
  range(g2,'북투빌 ≥','btbMin',null,'배');
  range(g2,'연매출 배수 ≥','coverMin',null,'년');
  range(g2,'연매출 배수 1년 변화 ≥','coverChgMin',null,'년');
  const g3=group('실적 · 전환', false, ['revYoyMin','accMin','mgnMin','m4Min','m4Max']);
  range(g3,'4분기 합 영업이익률','m4Min','m4Max','%');
  range(g3,'매출 증가율 ≥','revYoyMin',null,'%');
  range(g3,'매출 가속 ≥','accMin',null,'%p');
  range(g3,'이익률 변화 ≥','mgnMin',null,'%p');
  const g4=group('계약 · 확인', false, ['ncMin','ncPctMin']);
  range(g4,'새 수주 공시 ≥','ncMin',null,'건');
  range(g4,'새 수주 금액 ≥ 연매출의','ncPctMin',null,'%');
  const g5=group('가격 · 밸류', false, ['p1yMin','p1yMax','ddMax','gapMin','perMax']);
  range(g5,'주가 1년 수익률','p1yMin','p1yMax','%');
  range(g5,'52주 고점 대비 ≤','ddMax',null,'%');
  range(g5,'반영 갭 ≥','gapMin',null,'%p');
  range(g5,'PER ≤ (흑자만)','perMax',null,'배');
  const g6=group('위험', false, ['noFlags','noLoss','onlyLoss']);
  chk(g6,'최근 악재 공시(사채 발행·소송 등) 있는 곳 제외','noFlags');
  chk(g6,'4분기 합 적자인 곳 제외(턴어라운드 베팅 빼기)','noLoss');
  chk(g6,'4분기 합 적자인 곳만(턴어라운드 베팅만)','onlyLoss');

  const ft=el('div','synsideft');
  const rs=el('button','ghost','초기화'); rs.onclick=()=>{ S.synPreset=null; S.synRec=null; S.synF=synFresh(); rerender(); };
  const sv=el('button','ghost','저장');
  sv.title='지금 필터를 이 브라우저에 저장한다. 다음에 열면 그대로 뜬다.';
  sv.onclick=()=>{ lsSet('synF', S.synF); sv.textContent='저장됨'; setTimeout(()=>sv.textContent='저장',1200); };
  ft.appendChild(rs); ft.appendChild(sv); side.appendChild(ft);
  return side;
}

// ---- 시너지 전시판 (Exhibit) ---------------------------------------------
// 글로벌 투자자 앞에 띄우는 한 장. 결론을 먼저 말하는 헤드라인, 대칭 로그 축의 산점도,
// 반영 갭 등고 띠(+50·+100%p), 번호 붙은 주목 종목과 목록 연동, 발표 모드(전체 화면).
// 판은 테마와 상관없이 짙은 잉크색 — 프로젝터에서 점 색이 살아나게. 색 3개는
// 이 판 색(#0e1319) 위에서 전 쌍 검증(validate_palette --pairs all)을 통과했다.
const SYN_VIS = [
  {k:'잠복', v:'var(--syn-1)', p:'#3987e5', en:'Latent',   d:'수주는 쌓이는데 매출·주가는 아직'},
  {k:'점화', v:'var(--syn-2)', p:'#d95926', en:'Ignition', d:'수주가 매출·이익으로 넘어오는 중'},
  {k:'반영', v:'var(--syn-3)', p:'#199e70', en:'Priced',   d:'주가·PER이 수주보다 앞서 감'},
  {k:'기타', v:'var(--syn-other)', p:'#5b6472', en:'Other', d:'둔화·관찰'},
];
const synGroup=st=> (st==='잠복'||st==='점화'||st==='반영') ? st : '기타';
const synColor=st=> (SYN_VIS.find(x=>x.k===synGroup(st))||SYN_VIS[3]).v;
const plateColor=st=> (SYN_VIS.find(x=>x.k===synGroup(st))||SYN_VIS[3]).p;

function synScatter(rows, host){
  S.synHide = S.synHide || {};
  // host 가 있으면 그 판을 비우고 다시 그린다 — 발표 모드(전체 화면) 중에 범례를 눌러도 화면이 안 풀린다
  const plate=host || el('section','synplate');
  if(host){ host.innerHTML=''; }
  plate.classList.toggle('full', document.fullscreenElement===plate);
  const all=rows.filter(r=>r.backlog_yoy!==null&&r.backlog_yoy!==undefined&&r.price_1y!==null&&r.price_1y!==undefined);
  const pts=all.filter(r=>!S.synHide[synGroup(r.stage)]);
  const med=a=>{ const v=a.slice().sort((x,y)=>x-y); if(!v.length) return null; const m=v.length>>1; return v.length%2?v[m]:(v[m-1]+v[m])/2; };
  const below=pts.filter(r=>r.gap!==null&&r.gap>0);
  const n=pts.length, b=below.length;
  const medGap=med(below.map(r=>r.gap));
  const widest=below.slice().sort((x,y)=>y.gap-x.gap)[0];
  const cnt=k=>pts.filter(r=>synGroup(r.stage)===k).length;
  const stamp=(()=>{ const t=S.synData&&S.synData.at; const d=t?new Date(t*1000):new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); })();

  // ── 머리: 전시 번호 · 범례 · 발표 모드
  const top=el('div','spTop');
  const eb=el('div','spEyebrow'); eb.innerHTML='<b>EXHIBIT 01</b><span>수주 → 주가 반영 지도</span><em>Backlog vs. share-price reaction</em>';
  top.appendChild(eb);
  const tools=el('div','spTools');
  SYN_VIS.forEach(g=>{
    const c=all.filter(r=>synGroup(r.stage)===g.k).length;
    const bt=el('button','spChip'+(S.synHide[g.k]?' off':''));
    bt.innerHTML='<i style="background:'+g.p+'"></i><span>'+g.k+'</span><small>'+g.en+'</small><em>'+c+'</em>';
    bt.title=g.d+(S.synHide[g.k]?' — 눌러서 보이기':' — 눌러서 숨기기');
    bt.onclick=()=>{ S.synHide[g.k]=!S.synHide[g.k]; synScatter(rows, plate); };
    tools.appendChild(bt);
  });
  const fs=el('button','spFull', document.fullscreenElement===plate?'발표 모드 끝내기':'⛶ 발표 모드');
  fs.title='전시판만 전체 화면으로 띄운다 (Esc 로 나가기)';
  fs.onclick=()=>{
    if(document.fullscreenElement){ document.exitFullscreen(); return; }
    if(plate.requestFullscreen) plate.requestFullscreen().catch(()=>{});
  };
  plate.onfullscreenchange=()=>{
    const on=document.fullscreenElement===plate;
    plate.classList.toggle('full', on);
    fs.textContent=on?'발표 모드 끝내기':'⛶ 발표 모드';
  };
  tools.appendChild(fs);
  top.appendChild(tools);
  plate.appendChild(top);

  // ── 헤드라인 — 이 장이 말하려는 한 문장
  const hl=el('div','spHead');
  if(n){
    const share=b/n;
    hl.appendChild(el('h3',null, share>=0.25
      ? n+'곳 중 '+b+'곳, 수주는 쌓였는데 주가는 아직이다'
      : '주가가 수주를 앞서 간 곳이 더 많다 — '+n+'곳 중 '+(n-b)+'곳'));
    hl.appendChild(el('p',null, share>=0.25
      ? b+' of '+n+' companies sit below the parity line — order backlog has grown faster than the share price.'
      : (n-b)+' of '+n+' companies trade above the parity line — the market has already priced their backlog.'));
  } else hl.appendChild(el('h3',null,'표시할 회사가 없다'));
  plate.appendChild(hl);
  if(!n){ return plate; }

  // ── 본문: 그림 | 주목 종목
  const body=el('div','spBody');
  const fig=el('div','spFig');
  body.appendChild(fig);
  const side=el('div','spIdeas');
  body.appendChild(side);
  plate.appendChild(body);

  // 축 — 대칭 로그. 두 축에 같은 변환이라 대각선은 직선이다.
  const q=(arr,p)=>{ const v=arr.slice().sort((a,b)=>a-b); return v[Math.min(v.length-1,Math.max(0,Math.round(p*(v.length-1))))]; };
  const C=40, TF=v=>Math.sign(v)*Math.log1p(Math.abs(v)/C);
  const TICKS=[-90,-75,-50,-25,0,25,50,100,200,400,800];
  const lo=v=>TICKS.filter(t=>t<=v).pop() ?? TICKS[0];
  const hi=v=>TICKS.find(t=>t>=v) ?? TICKS[TICKS.length-1];
  const xs=all.map(r=>r.backlog_yoy), ys=all.map(r=>r.price_1y);
  const x0=lo(Math.min(-25,q(xs,0.01))), x1=hi(Math.max(100,q(xs,0.99)));
  const y0=lo(Math.min(-25,q(ys,0.01))), y1=hi(Math.max(100,q(ys,0.99)));
  const W=1000, H=600, L=62, R=24, T=40, B=58;
  const X=v=>L+(TF(v)-TF(x0))/(TF(x1)-TF(x0))*(W-L-R);
  const Y=v=>T+(1-(TF(v)-TF(y0))/(TF(y1)-TF(y0)))*(H-T-B);
  const cx=v=>Math.max(x0,Math.min(x1,v)), cy=v=>Math.max(y0,Math.min(y1,v));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'spSvg',role:'img',
    'aria-label':'수주잔고 1년 증가율(가로)과 주가 1년 수익률(세로) 산점도. '+b+'/'+n+' 곳이 대각선 아래.'});
  const defs=svgEl('defs');
  const gr=svgEl('linearGradient',{id:'spOpp',x1:'0',y1:'0',x2:'1',y2:'1'});
  gr.appendChild(svgEl('stop',{offset:'0','stop-color':'#3987e5','stop-opacity':'0.02'}));
  gr.appendChild(svgEl('stop',{offset:'1','stop-color':'#3987e5','stop-opacity':'0.17'}));
  defs.appendChild(gr);
  const cp=svgEl('clipPath',{id:'spClip'}); cp.appendChild(svgEl('rect',{x:L,y:T,width:W-L-R,height:H-T-B})); defs.appendChild(cp);
  svg.appendChild(defs);

  // 반영 갭 등고 띠 — 대각선(갭 0) 아래, +50%p, +100%p. 아래로 갈수록 짙다.
  const bands=svgEl('g',{'clip-path':'url(#spClip)',class:'spBands'});
  [[0,'spBand0'],[50,'spBand1'],[100,'spBand2']].forEach(([k,cls])=>{
    const s0=Math.max(x0, y0+k); if(s0>=x1) return;
    const path=[];
    for(let i=0;i<=80;i++){
      const tv=TF(s0)+(TF(x1)-TF(s0))*i/80;
      const xv=Math.sign(tv)*C*(Math.exp(Math.abs(tv))-1);
      path.push([X(xv), Y(Math.min(y1, Math.max(y0, xv-k)))]);
    }
    const d='M'+path.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L')+' L'+X(x1)+' '+Y(y0)+' L'+X(s0)+' '+Y(y0)+' Z';
    bands.appendChild(svgEl('path',{d, class:cls, fill:k===0?'url(#spOpp)':'#3987e5'}));
    if(k>0){
      // 띠 경계 이름 — 곡선 중간쯤, 곡선 바로 아래에 곡선 기울기대로
      const tm=TF(s0)+(TF(x1)-TF(s0))*(k===50?0.52:0.66);
      const xm=Math.sign(tm)*C*(Math.exp(Math.abs(tm))-1), ym=xm-k;
      if(ym>y0&&ym<y1){
        const e=TF(s0)+(TF(x1)-TF(s0))*((k===50?0.52:0.66)+0.02), xe=Math.sign(e)*C*(Math.exp(Math.abs(e))-1);
        const an=Math.atan2(Y(xe-k)-Y(ym), X(xe)-X(xm))*180/Math.PI;
        const lx=X(xm)+6, ly=Y(ym)+15;
        const t=svgEl('text',{x:lx,y:ly,class:'spBandLab',transform:'rotate('+an.toFixed(1)+' '+lx.toFixed(1)+' '+ly.toFixed(1)+')'});
        t.textContent='반영 갭 +'+k+'%p'; bands.appendChild(t);
      }
    }
  });
  svg.appendChild(bands);

  // 격자·눈금
  const grid=svgEl('g',{class:'spGrid'});
  TICKS.filter(v=>v>=x0&&v<=x1).forEach(v=>{
    grid.appendChild(svgEl('line',{x1:X(v),x2:X(v),y1:T,y2:H-B,class:v===0?'z':''}));
    const t=svgEl('text',{x:X(v),y:H-B+20,'text-anchor':'middle',class:'spTick'}); t.textContent=(v>0?'+':'')+v+'%'; grid.appendChild(t);
  });
  TICKS.filter(v=>v>=y0&&v<=y1).forEach(v=>{
    grid.appendChild(svgEl('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),class:v===0?'z':''}));
    const t=svgEl('text',{x:L-10,y:Y(v)+4,'text-anchor':'end',class:'spTick'}); t.textContent=(v>0?'+':'')+v+'%'; grid.appendChild(t);
  });
  svg.appendChild(grid);

  // 대각선 — 수주 증가 = 주가 상승
  const a=Math.max(x0,y0), b2=Math.min(x1,y1);
  const P1=[X(a),Y(a)], P2=[X(b2),Y(b2)];
  svg.appendChild(svgEl('line',{x1:P1[0],y1:P1[1],x2:P2[0],y2:P2[1],class:'spParity'}));
  const ang=Math.atan2(P2[1]-P1[1],P2[0]-P1[0])*180/Math.PI;
  const lp=[P1[0]+(P2[0]-P1[0])*0.80, P1[1]+(P2[1]-P1[1])*0.80];
  const pl=svgEl('text',{x:lp[0],y:lp[1]-9,'text-anchor':'middle',class:'spParityLab',
    transform:'rotate('+ang.toFixed(2)+' '+lp[0].toFixed(1)+' '+(lp[1]-9).toFixed(1)+')'});
  pl.textContent='PARITY · 수주 증가 = 주가 상승'; svg.appendChild(pl);

  // 영역 이름·축 제목
  const reserve=[];
  const cap=(x,y,anchor,ko,en)=>{
    const t=svgEl('text',{x,y,'text-anchor':anchor,class:'spZone'});
    const s1=svgEl('tspan'); s1.textContent=ko; t.appendChild(s1);
    const s2=svgEl('tspan',{x,dy:15,class:'spZoneEn'}); s2.textContent=en; t.appendChild(s2);
    svg.appendChild(t);
    const w=Math.max(ko.length*13, en.length*6.6);
    reserve.push({x:anchor==='end'?x-w:x, y:y-15, w, h:36});
  };
  cap(L+14, T+22, 'start', '주가가 먼저 간 곳', 'PRICED AHEAD OF BACKLOG');
  cap(W-R-14, H-B-30, 'end', '수주가 앞선 곳', 'BACKLOG AHEAD OF PRICE');
  const axis=(x,y,anchor,ko,en)=>{
    const t=svgEl('text',{x,y,'text-anchor':anchor,class:'spAxis'});
    const a1=svgEl('tspan'); a1.textContent=ko; t.appendChild(a1);
    const a2=svgEl('tspan',{class:'spAxisEn',dx:8}); a2.textContent=en; t.appendChild(a2);
    svg.appendChild(t);
  };
  axis(W-R, H-10, 'end', '수주잔고 1년 증가율', 'ORDER BACKLOG, YoY →');
  axis(L, T-16, 'start', '↑ 주가 1년 수익률', 'SHARE PRICE, 1Y');

  // 원 크기 — 시가총액(로그) 4.5 ~ 13
  const lc=pts.map(r=>r.cap).filter(v=>v>0).map(v=>Math.log10(v));
  const c0=Math.min(...lc), c1=Math.max(...lc);
  const rad=r=> r.cap>0&&c1>c0 ? 4.5+(Math.log10(r.cap)-c0)/(c1-c0)*8.5 : 5.5;

  // 주목 종목 — 점수 순 8곳 (기타 단계는 빼고)
  const ideas=pts.filter(r=>synGroup(r.stage)!=='기타'&&r.score!==null)
    .sort((x,y)=>(y.score||0)-(x.score||0)).slice(0,8);
  const rank=new Map(ideas.map((r,i)=>[r.code,i+1]));

  // 이름표 자리 — 주목 종목만, 겹치면 반대편, 그래도 겹치면 번호만
  const placed=reserve.slice(), labelAt=new Map();
  ideas.forEach(r=>{
    const px=X(cx(r.backlog_yoy)), py=Y(cy(r.price_1y)), rr=rad(r);
    const w=r.name.length*13.5+8, h=18;
    const tries=[{left:false,x:px+rr+16},{left:true,x:px-rr-16-w}];
    if(px+rr+16+w>W-R) tries.reverse();
    for(const tr of tries){
      const bx=tr.x, by=py-h/2;
      if(bx<L+2||bx+w>W-R-2||by<T||by+h>H-B) continue;
      if(placed.some(p=>bx<p.x+p.w&&bx+w>p.x&&by<p.y+p.h&&by+h>p.y)) continue;
      placed.push({x:bx,y:by,w,h}); labelAt.set(r.code,{x:tr.left?bx+w:bx, y:py+5, left:tr.left}); break;
    }
  });

  // 점 — 회색 먼저, 큰 점 먼저. 등장은 왼쪽에서 오른쪽으로 번진다.
  const dots=svgEl('g',{class:'spDots'});
  const byCode=new Map();
  const order=pts.slice().sort((p1,p2)=>{
    const g1=synGroup(p1.stage)==='기타', g2=synGroup(p2.stage)==='기타';
    return g1===g2 ? rad(p2)-rad(p1) : (g1?-1:1);
  });
  const xsort=pts.slice().sort((p1,p2)=>p1.backlog_yoy-p2.backlog_yoy).map(r=>r.code);
  order.forEach(r=>{
    const px=X(cx(r.backlog_yoy)), py=Y(cy(r.price_1y)), rr=rad(r);
    const g=svgEl('g',{class:'spDot'+(synGroup(r.stage)==='기타'?' dim':'')+(rank.has(r.code)?' idea':'')});
    // 바깥 g 는 호버 흐림, 안쪽 g 는 등장 애니메이션 — 둘이 서로의 opacity 를 덮지 않게
    const pop=svgEl('g',{class:'pop'}); pop.style.setProperty('--d', Math.min(900, xsort.indexOf(r.code)*7)+'ms');
    pop.style.transformOrigin=px+'px '+py+'px';
    g.appendChild(pop);
    if(rank.has(r.code)) pop.appendChild(svgEl('circle',{cx:px,cy:py,r:rr+5,class:'halo',stroke:plateColor(r.stage)}));
    pop.appendChild(svgEl('circle',{cx:px,cy:py,r:rr,fill:plateColor(r.stage),class:'core'}));
    const over = r.backlog_yoy>x1||r.backlog_yoy<x0||r.price_1y>y1||r.price_1y<y0;
    if(over){
      const dx=r.backlog_yoy>x1?1:(r.backlog_yoy<x0?-1:0), dy=r.price_1y>y1?-1:(r.price_1y<y0?1:0);
      const nn=Math.hypot(dx,dy)||1, ux=dx/nn, uy=dy/nn, qx=-uy, qy=ux;
      const tx=px+ux*(rr+9), ty=py+uy*(rr+9), bx=px+ux*(rr+4), by=py+uy*(rr+4);
      pop.appendChild(svgEl('path',{d:'M'+tx+' '+ty+' L'+(bx+qx*3.5)+' '+(by+qy*3.5)+' L'+(bx-qx*3.5)+' '+(by-qy*3.5)+' Z',class:'spOver'}));
    }
    if(rank.has(r.code)){
      const bx=px+rr*0.72+3, by=py-rr*0.72-3;
      pop.appendChild(svgEl('circle',{cx:bx,cy:by,r:9,class:'spBadge'}));
      const t=svgEl('text',{x:bx,y:by+3.6,'text-anchor':'middle',class:'spBadgeN'}); t.textContent=String(rank.get(r.code)); pop.appendChild(t);
    }
    g.appendChild(svgEl('circle',{cx:px,cy:py,r:Math.max(13,rr+7),fill:'transparent'}));
    dots.appendChild(g); byCode.set(r.code,{g,px,py,rr});
  });
  svg.appendChild(dots);
  const labs=svgEl('g',{class:'spLabels'});
  ideas.forEach(r=>{
    const l=labelAt.get(r.code); if(!l) return;
    const t=svgEl('text',{x:l.x,y:l.y,'text-anchor':l.left?'end':'start',class:'spName'});
    t.textContent=r.name; labs.appendChild(t);
  });
  svg.appendChild(labs);

  // 호버 — 교차선과 축 위 값 표지
  const cross=svgEl('g',{class:'spCross'}); cross.style.display='none';
  const vl=svgEl('line',{}), hl2=svgEl('line',{});
  const xr=svgEl('rect',{rx:4,height:20}), xt=svgEl('text',{'text-anchor':'middle'});
  const yr=svgEl('rect',{rx:4,height:20}), yt=svgEl('text',{'text-anchor':'end'});
  [vl,hl2,xr,xt,yr,yt].forEach(e=>cross.appendChild(e));
  svg.appendChild(cross);
  fig.appendChild(svg);

  const tip=el('div','spTip'); tip.hidden=true; fig.appendChild(tip);
  const focus=(r, ev)=>{
    const d=byCode.get(r.code); if(!d) return;
    plate.classList.add('focusing');
    byCode.forEach(o=>o.g.classList.toggle('on', o===d));
    side.querySelectorAll('.spIdea').forEach(it=>it.classList.toggle('on', it.dataset.code===r.code));
    // 교차선
    cross.style.display='';
    vl.setAttribute('x1',d.px); vl.setAttribute('x2',d.px); vl.setAttribute('y1',d.py+d.rr); vl.setAttribute('y2',H-B);
    hl2.setAttribute('x1',L); hl2.setAttribute('x2',d.px-d.rr); hl2.setAttribute('y1',d.py); hl2.setAttribute('y2',d.py);
    const xtxt=fx(r.backlog_yoy,0,'%'), ytxt=fx(r.price_1y,0,'%');
    xt.textContent=xtxt; xt.setAttribute('x',d.px); xt.setAttribute('y',H-B+14);
    const xw=xtxt.length*8+14; xr.setAttribute('x',d.px-xw/2); xr.setAttribute('y',H-B); xr.setAttribute('width',xw);
    yt.textContent=ytxt; yt.setAttribute('x',L-8); yt.setAttribute('y',d.py+4.5);
    const yw=ytxt.length*8+14; yr.setAttribute('x',L-yw-2); yr.setAttribute('y',d.py-10); yr.setAttribute('width',yw);
    // 카드
    tip.innerHTML='';
    const h=el('div','spTipH');
    const rk=rank.get(r.code);
    h.innerHTML=(rk?'<span class="spTipRank">'+rk+'</span>':'')+'<b></b><i style="background:'+plateColor(r.stage)+'"></i><small></small>';
    h.querySelector('b').textContent=r.name;
    h.querySelector('small').textContent=r.stage+(r.score!==null?' · 점수 '+r.score.toFixed(0):'');
    tip.appendChild(h);
    const grid2=el('div','spTipG');
    [['수주 1년',fx(r.backlog_yoy,0,'%')],['주가 1년',fx(r.price_1y,0,'%')],['반영 갭',fx(r.gap,0,'%p')],
     ['북투빌',r.btb!==null?r.btb.toFixed(2):'—'],['연매출 배수',r.cover!==null?r.cover.toFixed(1)+'년':'—'],
     ['시가총액',r.cap?money(r.cap):'—']].forEach(([k,v])=>{
      const c=el('div'); c.appendChild(el('span',null,k)); c.appendChild(el('b',null,v)); grid2.appendChild(c); });
    tip.appendChild(grid2);
    tip.appendChild(el('p',null,r.stage_why||''));
    tip.hidden=false;
    const box=fig.getBoundingClientRect(), sc=box.width/W;
    let lx=d.px*sc+18, ly=d.py*sc-20;
    if(lx+280>box.width) lx=d.px*sc-298;
    ly=Math.max(8, Math.min(ly, box.height-190));
    tip.style.left=lx+'px'; tip.style.top=ly+'px';
  };
  const blur=()=>{
    plate.classList.remove('focusing'); cross.style.display='none'; tip.hidden=true;
    byCode.forEach(o=>o.g.classList.remove('on'));
    side.querySelectorAll('.spIdea').forEach(it=>it.classList.remove('on'));
  };
  pts.forEach(r=>{
    const d=byCode.get(r.code);
    d.g.addEventListener('pointerenter',()=>focus(r));
    d.g.addEventListener('pointerleave',blur);
    d.g.addEventListener('click',()=>{ if(document.fullscreenElement) return; synGo(r.code,r.name); });
  });

  // ── 주목 종목 목록
  const ih=el('div','spIdeasH'); ih.innerHTML='주목 종목 <em>TOP IDEAS · 점수 순</em>'; side.appendChild(ih);
  const list=el('ol','spIdeaList');
  ideas.forEach((r,i)=>{
    const it=el('li','spIdea'); it.dataset.code=r.code;
    it.innerHTML='<span class="spRank">'+(i+1)+'</span><div class="spIdeaM"><div class="spIdeaT"><b></b><i style="background:'+plateColor(r.stage)+'"></i><small></small></div>'+
      '<div class="spIdeaV"><span>수주 <b>'+fx(r.backlog_yoy,0,'%')+'</b></span><span>주가 <b>'+fx(r.price_1y,0,'%')+'</b></span><span class="g">갭 <b>'+fx(r.gap,0,'%p')+'</b></span></div></div>';
    it.querySelector('.spIdeaT b').textContent=r.name;
    it.querySelector('.spIdeaT small').textContent=r.stage+' · '+(r.industry!=='분류없음'?r.industry:'');
    it.onpointerenter=()=>focus(r);
    it.onpointerleave=blur;
    it.onclick=()=>{ if(document.fullscreenElement) return; synGo(r.code,r.name); };
    list.appendChild(it);
  });
  side.appendChild(list);

  // ── 핵심 숫자 줄
  const kpi=el('div','spKpi');
  const tile=(v,ko,en)=>{ const t=el('div','spK'); t.innerHTML='<b></b><span></span><small></small>';
    t.querySelector('b').textContent=v; t.querySelector('span').textContent=ko; t.querySelector('small').textContent=en; kpi.appendChild(t); };
  tile(b+' / '+n, '대각선 아래', 'Below parity');
  tile(medGap===null?'—':fx(medGap,0,'%p'), '선 아래 중앙 반영 갭', 'Median gap, below parity');
  tile(cnt('잠복')+' · '+cnt('점화'), '잠복 · 점화', 'Latent · Ignition');
  tile(widest?widest.name:'—', widest?'가장 큰 괴리 '+fx(widest.gap,0,'%p'):'가장 큰 괴리', 'Widest gap');
  plate.appendChild(kpi);

  // ── 출처
  const outN=pts.filter(r=>r.backlog_yoy>x1||r.backlog_yoy<x0||r.price_1y>y1||r.price_1y<y0).length;
  const ft=el('div','spFoot');
  ft.innerHTML='<span>출처 Source · DART 정기보고서 수주상황, 거래소 수주 공시, 네이버 시세 · 기준 '+stamp+
    ' · 잔고를 믿을 수 있는 '+all.length+'곳 · 원 크기 = 시가총액 · 축은 대칭 로그 눈금'+
    (outN?' · ▸ 표시 '+outN+'곳은 축 범위 밖':'')+'</span><b>기업궤도추적</b>';
  plate.appendChild(ft);

  return plate;
}

// 표 — 열 묶음(개요/수주/실적/가격·밸류/계약·연결/질문)을 바꿔 가며 본다
function synGo(code, name){
  $('#q').value=name; pick(code).then(()=>{ $('#tabs').hidden=false; jump('orbit'); });
}
function synLink(code, name){
  const a=el('a',null,name); a.href='#';
  a.onclick=(ev)=>{ ev.preventDefault(); synGo(code, name); };
  return a;
}
const fx=(v,d,suf)=> v===null||v===undefined ? '—' : (v>=0?'+':'')+v.toFixed(d)+(suf||'');
const clsv=v=>'num'+(v>0?' pos':(v<0?' neg':''));

const SYN_COLS = {
  '개요': [
    {k:'score', t:'점수', v:r=>r.score, f:r=>r.score===null?'—':r.score.toFixed(0)},
    {k:'parts', t:'선행·전환·확인·가격', parts:true},
    {k:'cap', t:'시가총액', v:r=>r.cap, f:r=>r.cap?money(r.cap):'—'},
    {k:'backlog_yoy', t:'수주 1년', v:r=>r.backlog_yoy, f:r=>fx(r.backlog_yoy,0,'%'), c:r=>clsv(r.backlog_yoy)},
    {k:'price_1y', t:'주가 1년', v:r=>r.price_1y, f:r=>fx(r.price_1y,0,'%'), c:r=>clsv(r.price_1y)},
    {k:'gap', t:'반영 갭', v:r=>r.gap, f:r=>fx(r.gap,0,'%p'), c:r=>clsv(r.gap)},
    {k:'per', t:'PER', v:r=>r.per>0?r.per:null, f:r=>r.per===null||r.per===undefined?'—':(r.per>0?r.per.toFixed(1)+'배':'적자')},
  ],
  '수주': [
    {k:'backlog', t:'최신 잔고', v:r=>r.backlog, f:r=>money(r.backlog)},
    {k:'backlog_yoy', t:'수주 1년', v:r=>r.backlog_yoy, f:r=>fx(r.backlog_yoy,0,'%'), c:r=>clsv(r.backlog_yoy)},
    {k:'btb', t:'북투빌', v:r=>r.btb, f:r=>r.btb===null?'—':r.btb.toFixed(2), c:r=>'num'+(r.btb>1?' pos':(r.btb!==null&&r.btb<1?' neg':''))},
    {k:'cover', t:'연매출 배수', v:r=>r.cover, f:r=>r.cover===null?'—':r.cover.toFixed(1)+'년'},
    {k:'cover_chg', t:'배수 1년 변화', v:r=>r.cover_chg, f:r=>r.cover_chg==null?'—':(r.cover_chg>=0?'+':'')+r.cover_chg.toFixed(2)+'년', c:r=>clsv(r.cover_chg)},
    {k:'spark', t:'잔고 추이', spark:true},
    {k:'sure', t:'신뢰도', v:r=>(r.verified+r.explicit)/Math.max(r.n_pts,1),
     f:r=>(r.explicit?'검산 '+r.verified+' · 명시 '+r.explicit:'검산 '+r.verified+'/'+r.n_pts)},
  ],
  '실적': [
    {k:'rev_ttm', t:'최근 4분기 매출', v:r=>r.rev_ttm, f:r=>r.rev_ttm?money(r.rev_ttm):'—'},
    {k:'rev_yoy', t:'매출 증가율', v:r=>r.rev_yoy, f:r=>fx(r.rev_yoy,1,'%'), c:r=>clsv(r.rev_yoy)},
    {k:'rev_accel', t:'매출 가속', v:r=>r.rev_accel, f:r=>fx(r.rev_accel,1,'%p'), c:r=>clsv(r.rev_accel)},
    {k:'margin', t:'영업이익률', v:r=>r.margin, f:r=>r.margin===null||r.margin===undefined?'—':r.margin.toFixed(1)+'%'},
    {k:'margin_delta', t:'이익률 변화', v:r=>r.margin_delta, f:r=>fx(r.margin_delta,1,'%p'), c:r=>clsv(r.margin_delta)},
    {k:'quarter', t:'기준 분기', v:r=>r.quarter, f:r=>r.quarter||'—'},
  ],
  '가격·밸류': [
    {k:'price', t:'현재가', v:r=>r.price, f:r=>r.price?Math.round(r.price).toLocaleString('ko-KR'):'—'},
    {k:'price_1m', t:'1개월', v:r=>r.price_1m, f:r=>fx(r.price_1m,1,'%'), c:r=>clsv(r.price_1m)},
    {k:'price_3m', t:'3개월', v:r=>r.price_3m, f:r=>fx(r.price_3m,1,'%'), c:r=>clsv(r.price_3m)},
    {k:'price_1y', t:'1년', v:r=>r.price_1y, f:r=>fx(r.price_1y,0,'%'), c:r=>clsv(r.price_1y)},

    {k:'rs', t:'RS', v:r=>r.rs, f:r=>r.rs===null?'—':String(r.rs)},
    {k:'per', t:'PER', v:r=>r.per>0?r.per:null, f:r=>r.per===null||r.per===undefined?'—':(r.per>0?r.per.toFixed(1)+'배':'적자')},

    {k:'nc', t:'새 수주 공시', v:r=>(r.new_contracts||[]).length, f:r=>(r.new_contracts||[]).length?(r.new_contracts.length+'건'):'—'},
    {k:'new_pct', t:'연매출 대비', v:r=>r.new_pct, f:r=>r.new_pct?r.new_pct.toFixed(1)+'%':'—'},
    {k:'party', t:'주요 발주처', w:true, cell:r=>{
      const td=el('td','synwide');
      (r.parties_listed||[]).slice(0,2).forEach(x=>{ td.appendChild(x.in_list?synLink(x.code,x.name):el('span',null,x.name)); td.appendChild(document.createTextNode(' ')); });
      if(!(r.parties_listed||[]).length){
        const c=(r.new_contracts||[])[0]; td.appendChild(el('span','dim', c&&c.party?c.party.slice(0,24):'—'));
      }
      return td; }},
    {k:'customer', t:'발주처로 등장', w:true, cell:r=>{
      const td=el('td','synwide');
      (r.customer_of||[]).slice(0,2).forEach(x=>{ td.appendChild(synLink(x.supplier_code,x.supplier)); td.appendChild(el('small',null,' '+x.amount_txt+' ')); });

function synTable(rows){
  if(!rows.length) return el('div','empty','조건을 통과한 회사가 없습니다. 필터를 풀어 보세요.');
  const cols=SYN_COLS[S.synCols]||SYN_COLS['개요'];
  const sort=S.synSort;
  const col=cols.find(c=>c.k===sort.key);
  const val=r=> sort.key==='score' ? r.score : (col&&col.v ? col.v(r) : r.score);
  rows=rows.slice().sort((a,b)=>{
    const x=val(a), y=val(b);
    if(x===null||x===undefined) return 1; if(y===null||y===undefined) return -1;
    return (x<y?-1:x>y?1:0)*sort.dir;
  });
  const wrap=el('div','tblwrap');
  const t=el('table','tbl syntbl');
  const hr=el('tr');
  ['','#','종목','단계'].forEach(x=>hr.appendChild(el('th',null,x)));
  cols.forEach(c=>{
    if(c.parts){
      const th=el('th','synpartsth'); th.title=SYN_PART_HELP;
      th.appendChild(el('div','synpartscap','점수 구성'));
      const hh=el('div','synparts synpartsh'); SYN_PART_KEYS.forEach(([k,a])=>hh.appendChild(el('span',null,a))); th.appendChild(hh);
      hr.appendChild(th); return;
    }
    const th=el('th', c.w?null:'r', c.t);
    if(c.v){
      th.style.cursor='pointer';
      if(sort.key===c.k) th.textContent=c.t+(sort.dir<0?' ↓':' ↑');
      th.onclick=()=>{ S.synSort = sort.key===c.k ? {key:c.k, dir:-sort.dir} : {key:c.k, dir:-1};
        S.synRerender(); };
    }
    hr.appendChild(th);
  });
  hr.appendChild(el('th'));
  t.appendChild(hr);
  const nCols=cols.length+5;
  rows.forEach((r,i)=>{
    const tr=el('tr');
    const st=el('td'); const sb=el('button','synstar'+(S.synWatch.has(r.code)?' on':''), S.synWatch.has(r.code)?'★':'☆');
    sb.title='관심종목'; sb.onclick=()=>{ if(S.synWatch.has(r.code)) S.synWatch.delete(r.code); else S.synWatch.add(r.code);
      lsSet('synWatch',[...S.synWatch]); sb.textContent=S.synWatch.has(r.code)?'★':'☆'; sb.classList.toggle('on'); };
    st.appendChild(sb); tr.appendChild(st);
    tr.appendChild(el('td','num',String(i+1)));
    const nm=el('td','synname1');
    nm.appendChild(synLink(r.code,r.name));
    nm.appendChild(el('small',null,' '+(r.industry!=='분류없음'?r.industry:r.code)+(r.market?' · '+r.market:'')));
    if(r.same_as&&r.same_as.length){ const tw=el('span','tag','= '+r.same_as.join(', ')); tw.title='같은 수주잔고를 적은 지주·자회사'; nm.appendChild(tw); }
    if((r.flags||[]).length){ const fl=el('span','tag t1','주의'); fl.title=r.flags.join('\n'); nm.appendChild(fl); }
    if(r.loss4){ const ls=el('span','tag t1','4분기 적자'); const w=v=>v==null?'—':(v/1e8).toFixed(0)+'억';
      ls.title='최근 4분기 합 영업이익 '+w(r.op_ttm)+' · 순이익 '+w(r.ni_ttm)+' — 흑자 전환에 거는 턴어라운드 베팅. 과거엔 수익률 중앙값이 흑자보다 높았지만, 1년 뒤 −30%↓ 비율도 높았고 망해서 사라진 회사는 표본에 없다.';
      nm.appendChild(ls); }
    if(!r.reliable){ const u=el('span','tag','잔고 불확실'); u.title=r.why_not||''; nm.appendChild(u); }
    tr.appendChild(nm);
    const sc=el('td'); const tg=el('span','synstg'); const sd=el('i'); sd.style.background=synColor(r.stage);
    tg.appendChild(sd); tg.appendChild(document.createTextNode(r.stage)); tg.title=r.stage_why; sc.appendChild(tg); tr.appendChild(sc);
    cols.forEach(c=>{
      if(c.cell){ tr.appendChild(c.cell(r)); return; }
      if(c.parts){
        // 네 부분 = 그 날 믿을 수 있는 회사끼리의 백분위(0~100). 배경 막대가 100, 채운 높이가 이 회사 값
        const pc=el('td'); const pb=el('div','synparts');
        const P=r.parts||{};
        pb.title=SYN_PART_KEYS.map(([k])=>k+' '+(P[k]??'—')).join(' · ')+'\n'+SYN_PART_HELP;
        SYN_PART_KEYS.forEach(([k])=>{ const v=P[k]; const cell=el('div','synpc');
          const tk=el('div','synpt'+(v===null||v===undefined?' na':'')); const fi=el('i');
          if(v!==null&&v!==undefined){ fi.style.height=Math.max(0,Math.min(100,v))+'%'; if(v>=70) fi.className='hi'; }
          tk.appendChild(fi); cell.appendChild(tk);
          cell.appendChild(el('span','synpv',v===null||v===undefined?'—':String(Math.round(v))));
          pb.appendChild(cell); });
        pc.appendChild(pb); tr.appendChild(pc); return;
      }
      if(c.spark){ const td=el('td'); td.appendChild(sparkSvg((r.spark||[]).map(v=>v/1e12), r.backlog_yoy)); tr.appendChild(td); return; }
      tr.appendChild(el('td', c.c?c.c(r):'num', c.f(r)));
    });
    const ex=el('td'); const b=el('button','secto','⌄'); ex.appendChild(b); tr.appendChild(ex);
    t.appendChild(tr);

    const det=el('tr'); det.hidden=true;
    const dc=el('td'); dc.colSpan=nCols;
    b.onclick=()=>{
      if(!dc.firstChild) dc.appendChild(synDetail(r));
      det.hidden=!det.hidden; b.textContent=det.hidden?'⌄':'⌃';
    };
    det.appendChild(dc); t.appendChild(det);
  });
  wrap.appendChild(t);
  return wrap;
}

// 펼친 행 — 근거 | 생각해볼 질문 | 연결
function synDetail(r){
  const g=el('div','syndet');
  const c1=el('div');
  c1.appendChild(el('h5',null,r.stage+' — '+r.stage_why));
  const ul=el('ul'); (r.reasons||[]).forEach(s=>ul.appendChild(el('li',null,s))); c1.appendChild(ul);
  if(r.spark&&r.spark.length){
    const sp=el('div','synspark'); sp.appendChild(el('small',null,'잔고 추이 · 마지막 '+(r.last_report||'')));
    sp.appendChild(sparkSvg(r.spark.map(v=>v/1e12), r.backlog_yoy)); c1.appendChild(sp);
  }
  g.appendChild(c1);
  const c2=el('div');
  c2.appendChild(el('h5',null,'생각해볼 질문'));
  const ol=el('ol'); (r.questions||[]).forEach(s=>ol.appendChild(el('li',null,s)));
  if(!(r.questions||[]).length) ol.appendChild(el('li',null,'특이한 괴리가 없다. 다음 분기 잔고가 같은 속도로 느는지 본다.'));
  c2.appendChild(ol);
  if((r.themes||[]).length){
    const th=el('div','synthemes'); th.appendChild(el('small',null,'테마 '));
    r.themes.forEach(x=>{ const b=el('button','tag',x); b.title='이 테마로 거르기';
      b.onclick=()=>{ S.synF.theme=x; S.synPreset=null; show('cat'); };
      th.appendChild(b); });
    c2.appendChild(th);
  }
  g.appendChild(c2);
  const c3=el('div');
  c3.appendChild(el('h5',null,'연결 — 여기서 어디로 넓혀 볼까'));
  const line=(label, items)=>{ const d=el('div','synconn'); d.appendChild(el('b',null,label)); items.forEach(x=>d.appendChild(x)); c3.appendChild(d); };
  if((r.parties_listed||[]).length)
    line('발주처(상장사)', r.parties_listed.map(x=>{ const s=el('span'); s.appendChild(x.in_list?synLink(x.code,x.name):el('span',null,x.name));
      if(!x.in_list) s.appendChild(el('small',null,' (수주잔고 목록 밖)')); return s; }));
  if((r.customer_of||[]).length)
    line('이 회사에 발주한 곳', r.customer_of.map(x=>{ const s=el('span'); s.appendChild(synLink(x.supplier_code,x.supplier));
      s.appendChild(el('small',null,' '+x.amount_txt+(x.title?' · '+x.title.slice(0,30):''))); return s; }));
  if((r.peers||[]).length)
    line('같은 업종 ('+r.industry+')', r.peers.map(x=>{ const s=el('span'); s.appendChild(synLink(x.code,x.name));
      s.appendChild(el('small',null,' '+x.stage+' · 수주 '+fx(x.backlog_yoy,0,'%')+' · 주가 '+fx(x.price_1y,0,'%'))); return s; }));
  if(!c3.querySelector('.synconn')) c3.appendChild(el('div','dim','이어 볼 상장 거래상대나 같은 업종 회사가 목록에 없다.'));
  const nc=r.new_contracts||[];
  if(nc.length){
    c3.appendChild(el('h5',null,'보고서 뒤 수주 공시'));
    nc.forEach(c=>{
      const d=c.date||''; const it=el('div','secitem');
      it.appendChild(el('b',null,d.slice(0,4)+'-'+d.slice(4,6)+'-'+d.slice(6)));
      it.appendChild(el('span',null,' '+(c.title||c.report||'')));
      it.appendChild(el('small',null,(c.party?' · '+c.party:'')+(c.amount?' · '+money(c.amount)+(c.pct?' (매출의 '+c.pct+'%)':''):'')+
        ((c.end&&c.end!=='-')?' · ~'+c.end:'')+(c.subsidiary?' · 자회사 공시':'')));
      if(c.url){ const lk=el('a',null,' 원문'); lk.href=c.url; lk.target='_blank'; lk.rel='noopener'; it.appendChild(lk); }
      c3.appendChild(it);
    });
  }
  g.appendChild(c3);
  return g;
}

// 업종 수주 사이클 — 어느 업종에 수주가 몰리고, 그중 어디가 덜 반영됐나
function synCycle(all){
  const ok=all.filter(r=>r.reliable&&r.industry&&r.industry!=='분류없음');
  const by={};
  ok.forEach(r=>{ (by[r.industry]=by[r.industry]||[]).push(r); });
  const med=a=>{ const v=a.filter(x=>x!==null&&x!==undefined).sort((x,y)=>x-y); if(!v.length) return null;
    const m=Math.floor(v.length/2); return v.length%2?v[m]:(v[m-1]+v[m])/2; };
  const groups=Object.entries(by).filter(([k,v])=>v.length>=2).map(([k,v])=>({
    name:k, n:v.length, up:v.filter(r=>(r.backlog_yoy||0)>0).length,
    yoy:med(v.map(r=>r.backlog_yoy)), p1y:med(v.map(r=>r.price_1y)), gap:med(v.map(r=>r.gap)),
    early:v.filter(r=>r.stage==='잠복'||r.stage==='점화').length,
    top:v.slice().sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,3)}));
  groups.sort((a,b)=>(b.gap??-999)-(a.gap??-999));
  const wrap=el('div','syncycle');
  const hd=el('div','synsidehd'); hd.appendChild(el('b',null,'업종 수주 사이클'));
  hd.appendChild(el('small',null,' 믿을 수 있는 회사 2곳 이상인 업종 · 업종 반영 갭 큰 순. 업종 이름을 누르면 그 업종만 거른다.'));
  wrap.appendChild(hd);
  if(!groups.length){ wrap.appendChild(el('div','empty','업종 묶음이 없습니다.')); return wrap; }
  const tw=el('div','tblwrap'); const t=el('table','tbl');
  t.innerHTML='<tr><th>업종</th><th class="r">회사</th><th class="r">잔고 증가</th><th class="r">잔고 1년(중앙)</th>'+
    '<th class="r">주가 1년(중앙)</th><th class="r">반영 갭(중앙)</th><th class="r">잠복·점화</th><th>대표</th></tr>';
  groups.forEach(g=>{
    const tr=el('tr');
    const a=el('a',null,g.name); a.href='#';
    a.onclick=(ev)=>{ ev.preventDefault(); S.synPreset=null; S.synRec=null; S.synF=synFresh({industry:g.name});
      show('cat'); };
    const td=el('td'); td.appendChild(a); tr.appendChild(td);
    tr.appendChild(el('td','num',String(g.n)));
    tr.appendChild(el('td','num',g.up+'/'+g.n));
    tr.appendChild(el('td',clsv(g.yoy),fx(g.yoy,0,'%')));
    tr.appendChild(el('td',clsv(g.p1y),fx(g.p1y,0,'%')));
    tr.appendChild(el('td',clsv(g.gap),fx(g.gap,0,'%p')));
    tr.appendChild(el('td','num',g.early?String(g.early):'—'));
    const tp=el('td','synwide'); g.top.forEach(r=>{ tp.appendChild(synLink(r.code,r.name)); tp.appendChild(document.createTextNode(' ')); });
    tr.appendChild(tp);
    t.appendChild(tr);
  });
  tw.appendChild(t); wrap.appendChild(tw);
  return wrap;
}

function backlogTable(rows){
  const wrap=el('div','tblwrap');
  const t=el('table','tbl');
  t.innerHTML='<tr><th>종목</th><th>업종</th><th>추이</th>'+
    '<th style="text-align:right">최신 잔고</th><th style="text-align:right">1년 전 대비</th>'+
    '<th style="text-align:right">연율</th><th style="text-align:right">증가 횟수</th>'+
    '<th style="text-align:right">최대 낙폭</th><th style="text-align:right">매출 배수</th>'+
    '<th>신뢰도</th><th></th></tr>';
  rows.forEach(r=>{
    const tr0=r.trend;
    const tr=el('tr');
    const nm=el('td');
    const a=el('a',null,r.name); a.href='#';
    a.onclick=(ev)=>{ ev.preventDefault(); $('#q').value=r.name;
      pick(r.code).then(()=>{ $('#tabs').hidden=false; jump('orbit'); }); };
    nm.appendChild(a); nm.appendChild(el('small',null,' '+r.code));
    if(r.same_as && r.same_as.length){
      const tw=el('span','tag','= '+r.same_as.join(', '));
      tw.style.marginLeft='6px';

    tr.appendChild(el('td','num', money(tr0.last)));

    y.textContent = tr0.yoy===null||tr0.yoy===undefined ? '—' : (tr0.yoy>=0?'+':'')+tr0.yoy.toFixed(1)+'%';
    if(tr0.jumps>0 && r.verified+(r.explicit||0) < Math.ceil(r.n_pts/2)){
      // 한 번에 5배 넘게 튄 값이 있고 검산도 안 된 시계열 — 증가율이 추출 오류일 공산이 크다
      y.className='num'; y.style.color='var(--faint)';
      y.textContent='추출 의심';
      y.title='한 번에 5배 넘게 튄 값이 있고 검산된 값이 절반이 안 된다. 계산상 '+
        (tr0.yoy>=0?'+':'')+(tr0.yoy||0).toFixed(0)+'% 이지만 표를 잘못 읽었을 가능성이 크다. ⌄ 로 원문 근거를 볼 것.';
    }
    tr.appendChild(y);
    tr.appendChild(el('td','num', tr0.cagr===null||tr0.cagr===undefined ? '—' : (tr0.cagr>=0?'+':'')+tr0.cagr.toFixed(0)+'%'));
    tr.appendChild(el('td','num', tr0.ups+'/'+tr0.comps));
    const w=el('td','num'+(tr0.worst_drop<0?' neg':'')); w.textContent=tr0.worst_drop.toFixed(1)+'%';
    tr.appendChild(w);
    tr.appendChild(el('td','num', r.cover ? r.cover.toFixed(1)+'배' : '—'));
    const cf=el('td');
    const ex2=r.explicit||0;

    if(r.verified && ex2) txt='검산 '+r.verified+' · 명시 '+ex2;
    else if(ex2) txt='명시 '+ex2+'/'+r.n_pts;
    else txt='검산 '+r.verified+'/'+r.n_pts;

    tg.title = '검산: 표의 산술 관계(총액−납품=잔고)가 맞는 보고서 수\n'+
               '명시: 회사가 문장으로 "수주잔고는 약 X억원"이라고 직접 밝힌 보고서 수\n'+
               (good ? '절반 이상이 확인된 값이다.' : '확인 안 된 값이 많다. ⌄ 를 눌러 원문 근거를 직접 볼 것.');
    cf.appendChild(tg); tr.appendChild(cf);
    const ex=el('td'); const b=el('button','secto','⌄'); ex.appendChild(b); tr.appendChild(ex);
    t.appendChild(tr);

    const det=el('tr'); det.hidden=true;
    const dc=el('td'); dc.colSpan=11;
    r.points.slice().reverse().forEach(pt=>{
      const line=el('div','secitem');
      line.appendChild(el('b',null, pt.stamp+' '+pt.label));
      line.appendChild(el('span',null,' '+money(pt.value)));
      line.appendChild(el('small',null,'  '+(pt.method||'')+' · '+(pt.source||'').slice(0,140)+
        (pt.check?'  ('+pt.check+')':'')));

    });
    det.appendChild(dc); t.appendChild(det);
    b.onclick=()=>{ det.hidden=!det.hidden; b.textContent=det.hidden?'⌄':'⌃'; };

  wrap.appendChild(t);
  return wrap;
}

    seg.appendChild(b);

  const limit = S.secAll ? rows.length : 15;

  // 열 머리글 — 숫자만 있으면 무엇인지 알 수 없다

   ['직전 '+unit+' 대비','r'],['호재 · 확인 · 악재',''],['','']].forEach(([t,a])=>{
    const c=el('div',null,t); if(a==='r') c.style.textAlign='right'; hd.appendChild(c);

  list.appendChild(hd);
  rows.slice(0,limit).forEach(g=>{
    const item=el('div','secrow'+(S.catGroup===g.name?' on':''));

    const nm=el('div','secname');
    nm.appendChild(el('b',null,g.name));
    nm.appendChild(el('span',null,' ('+(g.size||g.corps)+')'));
    const sub=el('small',null, '호재 '+g.corps+'곳');
    sub.style.cssText='display:block;font-size:11px;color:var(--faint);margin-top:1px';
    nm.appendChild(sub);
    line.appendChild(nm);

    line.appendChild(sparkSvg(g.spark, g.change));

    const sc=el('div','secscore');
    const s=g.score;
    if(g.single){
      sc.textContent='1곳'; sc.style.color='var(--faint)'; sc.style.fontSize='11px';
      sc.title='한 회사의 공시만으로 뜬 그룹이다. 업종 추세가 아니라 개별 이벤트라 순위에서 뺐다.';
    } else {
      sc.textContent = s===null||s===undefined ? '—' : s;
      sc.style.color = s===null||s===undefined ? 'var(--faint)'
        : (s>=70?'var(--add)':(s>=40?'var(--warn)':'var(--dim)'));
      sc.title = '호재 낸 회사 '+g.corps+'곳의 강도합 '+g.w+' ÷ √'+(g.size||1)+
        ' = 밀도 '+(g.density||0).toFixed(2)+'\n다른 업종들과 비교한 백분위가 '+s+
        '\n(100 = 이 기간 호재가 가장 넓게 퍼진 업종)';
    }
    line.appendChild(sc);

    const ch=el('div','secchg');
    if(g.new){
      ch.textContent='신규'; ch.style.color='var(--add)';
      ch.title='직전 '+unit+'에는 호재 공시가 0건이었다. 0에서 늘어난 거라 %로 표시할 수 없다.';
    }
    else if(g.change===null||g.change===undefined){ ch.textContent='—'; ch.style.color='var(--faint)'; }
    else {

      ch.textContent=(up?'+':'−')+Math.abs(g.change).toFixed(1)+'%';

    line.appendChild(ch);

    const tot=Math.max(1,g.good+g.check+g.bad);
