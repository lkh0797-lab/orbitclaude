      const i=el('i'); i.style.width=(v/tot*100)+'%'; i.style.background=c; bar.appendChild(i);
    });
    bar.title='호재 '+g.good+' · 확인필요 '+g.check+' · 악재 '+g.bad;

    const tg=el('button','secto', S.secOpen===g.name?'⌃':'⌄');

        const a=el('a',null,r.corp); a.href=r.url; a.target='_blank'; a.rel='noopener';

  wrap.appendChild(list);
  if(rows.length>15){
    const more=el('button','morebtn', S.secAll?'접기 ⌃':'전체 '+rows.length+'개 보기 ⌄');
    more.onclick=()=>{ S.secAll=!S.secAll; viewCatalyst(p); };

    '점수는 시세가 아니라 공시다 — 그 업종에서 호재 공시를 낸 회사가 얼마나 넓게 퍼져 있는지. '+
    '회사마다 가장 강한 공시 하나만 세고(같은 회사가 여러 번 내도 한 번), 강도합 ÷ √업종 종목수를 업종끼리 백분위로 매긴다. '+
    '한 회사만으로 뜬 그룹은 추세가 아니라 개별 이벤트라 순위에서 뺐다. '+
    '변화는 같은 길이 직전 기간 대비. 행을 누르면 아래 목록이 그 업종으로 걸러지고, ⌄ 는 대표 공시를 펼친다.'));
  return wrap;
}

function sparkSvg(vals, change){
  const W=110,H=26;
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'secspark'});
  if(!vals||!vals.length) return svg;
  const max=Math.max(1,...vals);
  const step=W/Math.max(vals.length-1,1);
  let d='';
  vals.forEach((v,i)=>{ const x=i*step, y=H-3-(v/max)*(H-6); d+=(i?'L':'M')+x+' '+y+' '; });
  const col = change===null||change===undefined ? 'var(--faint)'
    : (change>=0?'var(--add)':'var(--del)');
  svg.appendChild(svgEl('path',{d:d,fill:'none',stroke:col,'stroke-width':1.5,
    'stroke-linejoin':'round'}));
  // 비교 기준선 — 기간 절반 지점
  const mid=Math.floor(vals.length/2)*step;
  svg.appendChild(svgEl('line',{x1:mid,x2:mid,y1:2,y2:H-2,stroke:'var(--line)',
    'stroke-dasharray':'2 2'}));
  const last=vals.length-1;
  svg.appendChild(svgEl('circle',{cx:last*step,cy:H-3-(vals[last]/max)*(H-6),r:2.2,fill:col}));
  return svg;
}

function earnChart(rows, key){
  const vals=rows.map(r=>((r.actual||{})[key]) ?? ((r.estimate||{})[key]))
    .filter(v=>v!==null&&v!==undefined);
  if(!vals.length) return el('div','empty','값 없음');

  const n=rows.length;
  const W=880, L=10, R=10, T=34, B=52;
  const step=(W-L-R)/n;
  // 막대마다 숫자를 얹으려면 자리가 있어야 한다. 좁으면 접고 툴팁에 맡긴다.
  const dense = step < 40;
  const H = dense ? 210 : 250;
  const bw = Math.min(step*0.62, 46);

  let max=Math.max(...vals,0), min=Math.min(...vals,0);
  const span=(max-min)||1;
  max+=span*0.18; if(min<0) min-=span*0.12;
  const Y=v=>H-B-((v-min)/(max-min))*(H-T-B);
  const y0=Y(0);

  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'chart'});
  const defs=svgEl('defs');
  const pat=svgEl('pattern',{id:'hx_'+key,width:5,height:5,
    patternUnits:'userSpaceOnUse',patternTransform:'rotate(45)'});
  pat.appendChild(svgEl('rect',{width:5,height:5,fill:'var(--panel)'}));
  pat.appendChild(svgEl('line',{x1:0,y1:0,x2:0,y2:5,stroke:'var(--accent)',
    'stroke-width':2,opacity:.45}));
  defs.appendChild(pat); svg.appendChild(defs);

  // 0 기준선만 둔다. 값은 막대 위에 직접 쓰므로 눈금선이 필요없다.
  svg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:y0,y2:y0,
    stroke:'var(--line)','stroke-width':1.2}));

  const fmtV = v => key==='EPS'
    ? (Math.abs(v)>=10000 ? (v/10000).toFixed(1)+'만' : Math.round(v).toLocaleString('ko-KR'))
    : money(v);
  const fullV = v => key==='EPS'
    ? Math.round(v).toLocaleString('ko-KR')+'원' : money(v);

  rows.forEach((r,i)=>{
    const a=(r.actual||{})[key], e=(r.estimate||{})[key];
    const v = (a!==null&&a!==undefined) ? a : e;
    if(v===null||v===undefined) return;
    const est = !(a!==null&&a!==undefined);
    const back = (r.actual||{}).backfill;
    const x=L+i*step+(step-bw)/2, y=Y(v);
    const h=Math.max(2,Math.abs(y-y0));

    const rect=svgEl('rect',{x:x,y:Math.min(y,y0),width:bw,height:h,rx:3,
      fill: est ? ('url(#hx_'+key+')') : 'var(--accent)',
      opacity: est ? 1 : (back ? 0.45 : 0.92),
      stroke: est ? 'var(--accent)' : 'none',
      'stroke-width': est ? 1.2 : 0,
      'stroke-dasharray': est ? '3 2' : 'none'});
    tip(rect, r.label+'\n'+(est?'컨센서스 ':(back?'역산 ':'실적 '))+fullV(v)+
      (r.yoy!==undefined&&r.yoy!==null ? '\n전년 대비 '+(r.yoy>=0?'+':'')+r.yoy.toFixed(1)+'%':''));
    svg.appendChild(rect);

    if(!dense){
      const t=svgEl('text',{x:x+bw/2,y:Math.min(y,y0)-8,'text-anchor':'middle',
        'font-size':11,'font-weight':600,fill:'var(--ink)','font-family':'var(--mono)'});
      t.textContent=fmtV(v); svg.appendChild(t);
    }
  });

  // 연도 + 전년 대비 증감률. 수준과 변화를 한 줄에 같이 읽게 한다.
  const everyN = dense ? Math.ceil(n/14) : 1;
  rows.forEach((r,i)=>{
    if(i%everyN) return;
    const cx=L+i*step+step/2;
    const t=svgEl('text',{x:cx,y:H-B+17,'text-anchor':'middle','font-size':10.5,
      fill:'var(--dim)','font-family':'var(--mono)'});
    t.textContent=r.label.replace(/^20/,"'");
    svg.appendChild(t);
    const gv=(r.yoy||{})[key];
    if(gv!==null&&gv!==undefined && !dense){
      const g=svgEl('text',{x:cx,y:H-B+31,'text-anchor':'middle','font-size':10,
        fill: gv>=0?'var(--add)':'var(--del)','font-family':'var(--mono)'});
      g.textContent=(gv>=0?'+':'')+gv.toFixed(0)+'%';
      svg.appendChild(g);
    }
  });

  const wrap=el('div','chartwrap'); wrap.appendChild(svg);
  const lg=legend([['var(--accent)','발표된 실적'],['var(--accent)','컨센서스 (빗금·점선)']]);
  if(rows.some(r=>(r.actual||{}).backfill))
    lg.appendChild((()=>{ const s=el('span'); const i2=el('i');
      i2.style.cssText='background:var(--accent);opacity:.45';
      s.appendChild(i2); s.appendChild(el('span',null,'역산 (보고서 비교수치)')); return s; })());
  wrap.appendChild(lg);
  return wrap;
}

  });
  thead.appendChild(hr); t.appendChild(thead);

  const tb=el('tbody');

$('#screenbtn').onclick = ()=>{ S.screen=true; renderScreen(); };

async function renderScreen(){
  const p=$('#panes');
  $('#welcome') && $('#welcome').remove();
  $('#tabs').hidden=true;
  p.innerHTML='';
  p.appendChild(el('h4','head','전 종목 가속도 스크리닝'));
  p.appendChild(el('p','sub',
    '수집된 모든 종목의 최신 분기를 한 화면에 세운다. 개별 조회가 아니라 전환점을 통과한 회사를 찾는 용도다. 순위는 매출 가속(50%) · 마진 변화(30%) · 재고일수 감소(20%) 를 교차 백분위로 환산해 매긴다. PER 은 보여주되 순위에 넣지 않는다.'));
  const back=el('button','morebtn','← 기업 화면으로');
  back.onclick=()=>{ S.screen=false; if(S.co){ $('#tabs').hidden=false; show(S.tab);} else location.reload(); };
  p.appendChild(back);
  const progBox=el('div'); p.appendChild(progBox);
  const body=el('div'); p.appendChild(body);
  body.innerHTML='<div class="loading">분기 실적 모으는 중…</div>';

  async function tick(){
    const d=await (await fetch('/api/screen')).json();
    progBox.innerHTML='';
    if(d.running){
      const pr=el('div','prog');
      pr.appendChild(el('span',null,'분석 중 '+d.done+'/'+d.total+' 종목'));
      const bar=el('div','bar'); const i=el('i');
      i.style.width=Math.round((d.done/Math.max(d.total,1))*100)+'%';
      bar.appendChild(i); pr.appendChild(bar);
      pr.appendChild(el('span',null,'처음 한 번만 걸립니다. DART 재무 원장을 받아옵니다.'));
      progBox.appendChild(pr);
    }
    let rows=(d.rows||[]).filter(r=>r['매출가속']!==null&&r['매출가속']!==undefined);
    body.innerHTML='';

    // 매출 하한 — 분기 매출이 작으면 증감률·이익률이 통계적으로 의미가 없다
    const FLOORS=[[0,'전체'],[1e10,'100억+'],[5e10,'500억+'],[1e11,'1,000억+']];
    if(S.screenFloor===undefined) S.screenFloor=1e10;
    const fl=el('div','row');
    fl.appendChild(el('span',null,'분기 매출 하한'));
    const seg=el('div','seg');
    FLOORS.forEach(([v,label])=>{
      const b=el('button', v===S.screenFloor?'on':'', label);
      b.onclick=()=>{ S.screenFloor=v; tick(); };
      seg.appendChild(b);
    });
    fl.appendChild(seg);
    const cut=rows.length;
    rows=rows.filter(r=>(r['매출액']||0)>=S.screenFloor);
    if(cut>rows.length)
      fl.appendChild(el('span','legend','매출 미달 '+(cut-rows.length)+'종목 제외'));
    body.appendChild(fl);

    if(!rows.length){
      body.appendChild(el('div','loading', d.running?'계산 중…':'해당 조건에 맞는 종목이 없습니다.'));
    } else {
      rows.sort((a,b)=>(b.score??-1)-(a.score??-1));
      const grow=rows.filter(r=>r['전환']&&r['전환종류']==='성장');
      const less=rows.filter(r=>r['전환']&&r['전환종류']==='역성장완화');
      if(grow.length||less.length){
        const f=el('div','first');
        let h='';
        if(grow.length) h+='<b>성장 전환 '+grow.length+'종목</b> — 매출이 늘면서 증감률까지 다시 빨라졌다: '+
          grow.slice(0,8).map(r=>esc(r.name)).join(', ')+(grow.length>8?' 외':'');
        if(less.length) h+=(h?'<br>':'')+'<b>역성장 완화 '+less.length+'종목</b> — 아직 매출은 줄고 있지만 감소폭이 꺾였다: '+
          less.slice(0,8).map(r=>esc(r.name)).join(', ')+(less.length>8?' 외':'');
        f.innerHTML=h;
        body.appendChild(f);
      }
      body.appendChild(secTitle('가속 · 마진 사분면',
        '가로축 매출 가속(%p), 세로축 영업이익률 변화(%p). 오른쪽 위가 성장이 빨라지면서 마진도 벌어지는 구간이고, 왼쪽 아래가 그 반대다. 점 크기는 분기 매출.'));
      body.appendChild(quadChart(rows));
      body.appendChild(secTitle('순위표','행을 누르면 그 종목 가속도 화면으로 간다.'));
      body.appendChild(screenTable(rows));
    }
    if(d.running) setTimeout(tick, 2500);
  }
  tick();
}

function quadChart(rows){
  const W=860,H=430,L=56,R=20,T=18,B=44;
  const xs=rows.map(r=>r['매출가속']).filter(v=>v!==null&&v!==undefined);
  const ys=rows.map(r=>r['마진변화']).filter(v=>v!==null&&v!==undefined);
  if(!xs.length||!ys.length) return el('div','empty','사분면을 그릴 값이 모자랍니다.');
  const cap=(arr)=>{ const s=arr.slice().sort((a,b)=>a-b);
    const q=(f)=>s[Math.min(s.length-1,Math.max(0,Math.round((s.length-1)*f)))];
    return [q(0.03),q(0.97)]; };
  let [x0,x1]=cap(xs), [y0,y1]=cap(ys);
  const xm=Math.max(Math.abs(x0),Math.abs(x1))*1.15||10;
  const ym=Math.max(Math.abs(y0),Math.abs(y1))*1.15||5;
  const X=v=>L+((Math.max(-xm,Math.min(xm,v))+xm)/(2*xm))*(W-L-R);
  const Y=v=>H-B-((Math.max(-ym,Math.min(ym,v))+ym)/(2*ym))*(H-T-B);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'chart'});

  // 사분면 배경 — 오른쪽 위가 좋은 쪽
  svg.appendChild(svgEl('rect',{x:X(0),y:T,width:W-R-X(0),height:Y(0)-T,
    fill:'var(--add)',opacity:.055}));
  svg.appendChild(svgEl('rect',{x:L,y:Y(0),width:X(0)-L,height:H-B-Y(0),
    fill:'var(--del)',opacity:.055}));
  svg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),
    stroke:'var(--dim)','stroke-width':1.3}));
  svg.appendChild(svgEl('line',{x1:X(0),x2:X(0),y1:T,y2:H-B,
    stroke:'var(--dim)','stroke-width':1.3}));

  [[-xm,'left'],[xm,'right']].forEach(([v,an])=>{
    const t=svgEl('text',{x:X(v),y:H-B+16,'text-anchor':an==='left'?'start':'end',
      'font-size':10,fill:'var(--faint)','font-family':'var(--mono)'});
    t.textContent=(v>0?'+':'')+Math.round(v)+'%p'; svg.appendChild(t);
  });
  [[ym,'top'],[-ym,'bottom']].forEach(([v,pos])=>{
    const t=svgEl('text',{x:L-8,y:Y(v)+(pos==='top'?10:-2),'text-anchor':'end',
      'font-size':10,fill:'var(--faint)','font-family':'var(--mono)'});
    t.textContent=(v>0?'+':'')+Math.round(v)+'%p'; svg.appendChild(t);
  });
  const ax=svgEl('text',{x:(L+W-R)/2,y:H-8,'text-anchor':'middle','font-size':11,
    fill:'var(--faint)'}); ax.textContent='매출 가속 (%p) →'; svg.appendChild(ax);
  const ay=svgEl('text',{x:14,y:(T+H-B)/2,'text-anchor':'middle','font-size':11,
    fill:'var(--faint)',transform:'rotate(-90 14 '+((T+H-B)/2)+')'});
  ay.textContent='영업이익률 변화 (%p) →'; svg.appendChild(ay);

  const revs=rows.map(r=>r['매출액']||0);
  const rmax=Math.max(...revs,1);
  rows.forEach(r=>{
    const x=r['매출가속'], y=r['이익률_비정상']?null:r['마진변화'];
    if(x===null||x===undefined||y===null||y===undefined) return;
    const rad=4+Math.sqrt((r['매출액']||0)/rmax)*11;
    const good=(x>=0&&y>=0), bad=(x<0&&y<0);
    const grow = r['전환'] && r['전환종류']==='성장';
    const cc=svgEl('circle',{cx:X(x),cy:Y(y),r:rad,
      fill: good?'var(--add)':(bad?'var(--del)':'var(--faint)'),
      opacity: grow?0.9:(r['전환']?0.7:0.5),
      stroke: grow?'var(--ink)':'none','stroke-width':grow?1.6:0});
    cc.style.cursor='pointer';
    cc.onclick=()=>{ S.screen=false; $('#q').value=r.name;
      pick(r.code).then(()=>{ $('#tabs').hidden=false; jump('druck'); }); };
    tip(cc, r.name+' ('+r.code+')\n'+r.quarter+
      '\n매출 가속 '+(x>=0?'+':'')+x.toFixed(1)+'%p'+
      '\n마진 변화 '+(y>=0?'+':'')+y.toFixed(2)+'%p'+
      (r['재고일수변화']!==null&&r['재고일수변화']!==undefined
        ?'\n재고일수 '+(r['재고일수변화']>=0?'+':'')+r['재고일수변화'].toFixed(0)+'일':'')+
      (r['전환']?('\n★ '+(grow?'성장 전환':'역성장 완화')):''));
    svg.appendChild(cc);
  });
  // 상위 8개만 이름표
  rows.slice().sort((a,b)=>(b.score??-1)-(a.score??-1)).slice(0,8).forEach(r=>{
    const x=r['매출가속'], y=r['마진변화'];
    if(x===null||x===undefined||y===null||y===undefined) return;
    const t=svgEl('text',{x:X(x),y:Y(y)-10,'text-anchor':'middle','font-size':10.5,
      fill:'var(--ink)','font-weight':'600'});
    t.textContent=r.name.slice(0,9); svg.appendChild(t);
  });
  const wrap=el('div','chartwrap'); wrap.appendChild(svg);
  wrap.appendChild(legend([['var(--add)','가속 + 마진 개선'],
    ['var(--del)','감속 + 마진 악화'],['var(--faint)','엇갈림'],
    ['var(--ink)','테두리 = 성장 전환 (역성장 완화는 테두리 없음)']]));
  return wrap;
}

    '<th style="text-align:right">PER(TTM)</th></tr>';
  const f=(v,d,suf)=> (v===null||v===undefined)?'—':
    ((v>=0&&(suf==='%p'||suf==='일')?'+':'')+v.toFixed(d)+(suf||''));

    const tr=el('tr'); tr.style.cursor='pointer';

      b.title = grow

        : '매출은 아직 전년 대비 줄고 있지만 감소폭이 작아졌습니다. 성장 전환이 아닙니다.';

    if(r['이익률_비정상']){
      const w=el('td','num'); w.textContent='산출불가';
      w.title=(r['이익률_사유']||'이익률이 정상 범위를 벗어납니다.')+
        ' 순위 계산에서도 마진 항목만 제외했습니다.';
      w.style.color='var(--faint)'; tr.appendChild(w);
      const w2=el('td','num'); w2.textContent='—'; w2.style.color='var(--faint)';
      tr.appendChild(w2);
    } else {
      tr.appendChild(el('td','num',f(r['영업이익률'],2,'%')));
      const m=el('td','num'+(r['마진변화']>0?' pos':(r['마진변화']<0?' neg':'')));
      m.textContent=f(r['마진변화'],2,'%p'); tr.appendChild(m);
    }
    const iv=el('td','num'+(r['재고일수변화']<0?' pos':(r['재고일수변화']>0?' neg':'')));
    iv.textContent=f(r['재고일수변화'],0,'일'); tr.appendChild(iv);
    tr.appendChild(el('td','num',f(r['PER_TTM'],1,'배')));
    t.appendChild(tr);
  });
  wrap.appendChild(t);
  return wrap;
}

// ---------------------------------------------------------- 가속도 (드러켄밀러)

const DRK_REG=[

];
const DRK_RC=Object.fromEntries(DRK_REG.map(r=>[r.k,r]));
const DRK_READ={
  '가속 성장':'성장과 가속이 같이 간다. 드러켄밀러가 비중을 싣는 국면이다 — 재고·채권이 받쳐주는지만 확인하라.',
  '바닥 통과':'역성장이지만 2차 미분이 먼저 돌았다. 드러켄밀러가 먼저 들어가는 자리다 — 다음 분기에도 가속이 이어지는지가 확인 포인트.',
  '감속 성장':'성장률은 아직 높아도 속도가 꺾였다. 주가는 성장률의 정점에서 먼저 꺾인다 — 가속이 다시 붙는지 확인하라.',
  '역성장 심화':'줄고, 줄어드는 속도도 빨라진다. 2차 미분이 돌 때까지 기다릴 구간이다.',
};
// 가속이 분기당 0.5%p 안쪽이면 방향이 없다 — 국면 이름 대신 이 풀이를 쓴다
const drkFlat=r=>dNum(r.a)&&Math.abs(r.a)<0.5;
const DRK_FLAT_READ={
  up:'성장률이 고원에 올라섰다. 드러켄밀러가 가장 경계하는 자리다 — 가속이 다시 붙는지, 꺾이는지를 다음 분기에 확인하라.',
  down:'역성장 폭이 제자리다. 바닥을 다지는 중일 수 있다 — 2차 미분이 플러스로 도는 분기를 기다려라.',
};
const drkRead=r=>drkFlat(r) ? DRK_FLAT_READ[r.g>0?'up':'down'] : DRK_READ[r.reg];
const dNum=v=>v!==null&&v!==undefined&&isFinite(v);
const dPct=(v,d=1)=>dNum(v)?(v>=0?'+':'')+v.toFixed(d)+'%':'—';
const dPp=(v,d=1)=>dNum(v)?(v>=0?'+':'')+v.toFixed(d)+'%p':'—';

function drkCalc(pts){
  const R=pts.map(p=>Object.assign({},p));
  const ratio=(a,b)=>(dNum(a)&&dNum(b)&&b>0&&a>0)?(a/b-1)*100:null;
  R.forEach((r,i)=>{
    const b=R[i-4];
    r.g = b&&dNum(r['매출_TTM'])&&dNum(b['매출_TTM'])&&b['매출_TTM']>0 ? (r['매출_TTM']/b['매출_TTM']-1)*100 : null;
    r.m = dNum(r['영업이익_TTM'])&&dNum(r['매출_TTM'])&&r['매출_TTM']>0 ? r['영업이익_TTM']/r['매출_TTM']*100 : null;
    r.og = b ? ratio(r['영업이익_TTM'], b['영업이익_TTM']) : null;
    r.mD4 = b&&dNum(r.m)&&dNum(b.m) ? r.m-b.m : null;
    r.invD4 = b ? ratio(r['재고일수'], b['재고일수']) : null;
    r.arD4 = b ? ratio(r['매출채권일수'], b['매출채권일수']) : null;
    r.px4 = b ? ratio(r['주가'], b['주가']) : null;
    r.eps4 = b ? ratio(r['EPS_TTM'], b['EPS_TTM']) : null;
  });
  // 가속 = TTM 증가율의 최근 2분기 평균 변화(분기당 %p). 한 분기 차이는 납품 시점에 따라 부호가 자주 뒤집힌다.
  R.forEach((r,i)=>{ const p=R[i-1], q=R[i-2];
    r.a1 = p&&dNum(r.g)&&dNum(p.g) ? r.g-p.g : null;
    r.a = q&&dNum(r.g)&&dNum(q.g) ? (r.g-q.g)/2 : null; });
  R.forEach(r=>{ r.reg = !dNum(r.g)||!dNum(r.a) ? null
      : r.g>0 ? (r.a>0?'가속 성장':'감속 성장') : (r.a>0?'바닥 통과':'역성장 심화'); });
  // 변곡 = 가속의 부호가 바뀐 분기(분기당 1.5%p 이상). 그 분기 보고서가 나온 날 알 수 있다 — 앞을 내다본 값이 아니다.
  R.forEach((r,i)=>{ const p=R[i-1]; r.turn=null;
    if(p&&dNum(r.a)&&dNum(p.a)){ if(r.a>=1.5&&p.a<0) r.turn='up'; else if(r.a<=-1.5&&p.a>0) r.turn='down'; } });
  R.forEach((r,i)=>{ const px=r['주가'];
    const f=k=>{ const q=R[i+k]; return dNum(px)&&px>0&&q&&dNum(q['주가']) ? (q['주가']/px-1)*100 : null; };
    r.f2=f(2); r.f4=f(4); });
  // 같은 방향 연속 분기
  R.forEach((r,i)=>{ const p=R[i-1];
    r.streak = !dNum(r.a) ? 0 : (p&&dNum(p.a)&&(p.a>0)===(r.a>0) ? p.streak+1 : 1); });
  return R;
}

async function viewDruck(p){
  const c=S.co, code=c.code;
  p.innerHTML='';
  const plate=el('section','synplate orbplate drkplate'); p.appendChild(plate);
  plate.appendChild(el('div','orbWait','분기 단독 실적 쌓는 중… 처음 한 번은 수십 초 걸립니다.'));
  const ledger=el('div','orbledger drkledger'); p.appendChild(ledger);
  let d;
  try{ d=await (await fetch('/api/druck?code='+code)).json(); }
  catch(e){ plate.innerHTML=''; plate.appendChild(el('div','orbWait','불러오지 못했습니다.')); return; }
  if(S.tab!=='druck' || !S.co || S.co.code!==code) return;
  plate.innerHTML='';
  if(d.error){ plate.appendChild(el('div','orbWait',d.error)); return; }
  const pts=(d.points||[]).filter(x=>x['매출액']);
  if(pts.length<6){ plate.appendChild(el('div','orbWait','분기 데이터가 모자랍니다 (6분기 이상 필요).')); return; }
  const R=drkCalc(pts);
  drkPlate(plate, R, c);
  drkLedger(ledger, R, d.text||[]);
}

function drkPlate(plate, R, c){
  plate.innerHTML='';
  plate.classList.add('anim');
  const V=R.filter(r=>r.reg);

  // ── 머리
  const top=el('div','spTop');
  const eb=el('div','spEyebrow');
  eb.innerHTML='<b>EXHIBIT 04</b><span></span><em>Second-derivative dashboard · '+R[0].label+'–'+R[R.length-1].label+'</em>';
  eb.querySelector('span').textContent='가속도 · '+c.name;
  top.appendChild(eb);
  const tools=el('div','spTools');
  const fs=el('button','spFull','⛶ 발표 모드');
  fs.title='전시판만 전체 화면으로 띄운다 (Esc 로 나가기)';
  fs.onclick=()=>{ if(document.fullscreenElement){ document.exitFullscreen(); return; }

  plate.onfullscreenchange=()=>{ const on=document.fullscreenElement===plate;
    plate.classList.toggle('full',on); fs.textContent=on?'발표 모드 끝내기':'⛶ 발표 모드'; };
  tools.appendChild(fs); top.appendChild(tools); plate.appendChild(top);

  // ── 헤드라인

  let h3='분기 자료가 모자라 국면을 못 정했다', en='';
  if(reg){
    const g=now.g.toFixed(0), a=Math.abs(now.a).toFixed(1);
    const flat=Math.abs(now.a)<0.5;   // 분기당 0.5%p 미만은 방향이 없다고 본다
    h3 = flat ? (now.g>0 ? c.name+', '+dPct(now.g,0)+' 성장을 같은 속도로 이어가고 있다' : c.name+', 역성장 폭이 제자리다')
       : now.reg==='가속 성장' ? c.name+', 성장에 다시 속도가 붙고 있다'
       : now.reg==='감속 성장' ? c.name+', 아직 성장하지만 속도가 줄고 있다'
       : now.reg==='바닥 통과' ? c.name+', 역성장 속에서 감소 폭이 줄고 있다'
       : c.name+', 역성장이 깊어지고 있다';
    hl.appendChild(el('h3',null,h3));
    hl.appendChild(el('p',null,now.label+' 기준 최근 4분기 매출이 1년 전보다 '+dPct(now.g,1)+', 그 증가율이 최근 2분기 동안 분기당 '+
      (now.a>=0?a+'%p씩 올랐다':a+'%p씩 내렸다')+' — '+(flat?'가속은 사실상 0. ':now.streak+'분기 연속 '+(now.a>0?'가속':'감속')+'. ')+
      drkRead(now)));
    en='TTM revenue '+(now.g>=0?'+':'')+g+'% YoY, '+(now.a>=0?'accelerating':'decelerating')+' '+a+'pp per quarter (2Q avg) — '+reg.en.toLowerCase()+' for '+now.streak+' quarter'+(now.streak>1?'s':'')+'.';
    hl.appendChild(el('p','spEn',en));
  } else hl.appendChild(el('h3',null,h3));
  plate.appendChild(hl);

  // ── 위 두 단: 국면 나침반 | 체크리스트
  const duo=el('div','drkDuo');
  duo.appendChild(drkCompass(R, plate));
  duo.appendChild(drkChecks(R, now));
  plate.appendChild(duo);

  // ── 숫자 다섯
  const pers=R.map(r=>r['PER_TTM']).filter(v=>dNum(v)&&v>0);
  const per=now['PER_TTM'];
  const pct=dNum(per)&&per>0&&pers.length>=4 ? Math.round(pers.filter(v=>v<=per).length/pers.length*100) : null;
  const kp=el('div','spKpi drkKpi');
  [[dPct(now.g,1), '최근 4분기 매출 · 1년 전 대비', 'Growth · 1st derivative'],
   [dPp(now.a,1), '분기당 · 최근 2분기 평균 · '+now.streak+'분기 연속 '+(now.a>0?'가속':'감속'), 'Acceleration · 2nd'],
   [dNum(now.m)?now.m.toFixed(1)+'%':'—', 'TTM 영업이익률 · 1년 새 '+dPp(now.mD4,1), 'Margin'],
   [dNum(now['재고일수'])?Math.round(now['재고일수'])+'일':'—', '재고일수 · 1년 새 '+dPct(now.invD4,0), 'Inventory days'],
   [dNum(per)&&per>0?per.toFixed(1)+'배':'—', pct===null?'PER(TTM)':
      pct>=50?'PER(TTM) · 자기 역사 상위 '+Math.max(1,100-pct)+'%':'PER(TTM) · 자기 역사 하위 '+pct+'%', 'Valuation'],
  ].forEach(([b,s,sm])=>{ const k=el('div','spK'); k.appendChild(el('b',null,b)); k.appendChild(el('span',null,s));
    k.appendChild(el('small',null,sm)); kp.appendChild(k); });
  plate.appendChild(kp);

  // ── 시계열 네 판
  plate.appendChild(drkStack(R, plate));
  // ── 변곡 성적표
  plate.appendChild(drkTurns(R));

  const ft=el('div','spFoot');
  ft.innerHTML='<span></span><b>ORBIT · 기업궤도추적</b>';
  ft.querySelector('span').textContent='출처: DART 분기·반기·사업보고서의 분기 단독 실적(누적에서 역산). TTM = 최근 4분기 합. '+
    '가속 = TTM 증가율의 최근 2분기 평균 변화(분기당 %p). 주가는 그 분기 보고서 접수일 종가 — 변곡 뒤 수익률은 그날 알 수 있던 정보로만 셌다.';
  plate.appendChild(ft);
}

// 국면 나침반 — 가로 성장률(1차), 세로 가속(2차). 최근 12분기의 궤적.
function drkCompass(R, plate){
  const box=el('div','drkCompass');
  box.appendChild(el('div','spIdeasH','국면 나침반')).appendChild(el('em',null,'GROWTH × ACCELERATION · 최근 12분기'));
  const trail=R.filter(r=>r.reg).slice(-12);
  if(trail.length<2){ box.appendChild(el('div','orbWait','궤적을 그릴 분기가 모자랍니다.')); return box; }
  const W=560,H=420,L=74,Rr=20,T=20,B=46;
  const gs=trail.map(r=>r.g), as=trail.map(r=>r.a);
  let xmin=Math.min(0,...gs), xmax=Math.max(0,...gs);
  const xs=Math.max(10,xmax-xmin); xmin-=xs*.18; xmax+=xs*.18;
  if(xmin>-xs*.28) xmin=-xs*.28; if(xmax<xs*.28) xmax=xs*.28;      // 네 칸이 다 보이게
  const am=Math.max(4,...as.map(Math.abs))*1.2;
  const X=v=>L+(v-xmin)/(xmax-xmin)*(W-L-Rr), Y=v=>T+(am-v)/(2*am)*(H-T-B);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'orbSvg drkCSvg',role:'img','aria-label':'성장률과 가속으로 본 국면 궤적'});
  const x0=X(0), y0=Y(0);
  // 네 칸
  [['바닥 통과',L,T,x0-L,y0-T,'tl'],['가속 성장',x0,T,W-Rr-x0,y0-T,'tr'],
   ['감속 성장',x0,y0,W-Rr-x0,H-B-y0,'br'],['역성장 심화',L,y0,x0-L,H-B-y0,'bl']].forEach(([k,x,y,w,h,pos])=>{
    const q=svgEl('rect',{x,y,width:Math.max(0,w),height:Math.max(0,h),class:'drkQ'}); q.setAttribute('fill',DRK_RC[k].c); svg.appendChild(q);
    const tx = pos[1]==='l' ? x+12 : x+w-12, ty = pos[0]==='t' ? y+22 : y+h-26, anc = pos[1]==='l'?'start':'end';
    const t=svgEl('text',{x:tx,y:ty,'text-anchor':anc,class:'drkQL'}); t.textContent=k; svg.appendChild(t);
    const e=svgEl('text',{x:tx,y:ty+14,'text-anchor':anc,class:'drkQE'}); e.textContent=DRK_RC[k].en; svg.appendChild(e);
  });
  // 축
  svg.appendChild(svgEl('line',{x1:L,x2:W-Rr,y1:y0,y2:y0,class:'drkAxis'}));
  svg.appendChild(svgEl('line',{x1:x0,x2:x0,y1:T,y2:H-B,class:'drkAxis'}));
  // 전형적 순환 방향(시계 방향) — 흐린 호
  const rr=Math.min(W-L-Rr,H-T-B)*.16, cx=x0, cy=y0;
  const arc=svgEl('path',{d:'M'+(cx-rr)+','+(cy-4)+'A'+rr+','+rr+' 0 1 1 '+(cx-rr*.7)+','+(cy+rr*.72),class:'drkCycle'});
  svg.appendChild(arc);
  const ah=svgEl('path',{d:'M'+(cx-rr*.7-6)+','+(cy+rr*.72-3)+'l6,3 -1,-7',class:'drkCycleH'}); svg.appendChild(ah);
  const cl=svgEl('text',{x:cx+rr+8,y:cy-rr+2,class:'drkCycleL'}); cl.textContent='전형적 순환 ↻'; svg.appendChild(cl);
  // 눈금
  const nice=(lo,hi,n)=>{ const s=(hi-lo)/n, p=Math.pow(10,Math.floor(Math.log10(s))), m=[1,2,2.5,5,10].find(k=>k*p>=s)*p;
    const o=[]; for(let v=Math.ceil(lo/m)*m; v<=hi+1e-9; v+=m) o.push(+v.toFixed(6)); return o; };
  nice(xmin,xmax,5).forEach(v=>{ const t=svgEl('text',{x:X(v),y:H-B+18,'text-anchor':'middle',class:'orbTick'}); t.textContent=(v>0?'+':'')+v+'%'; svg.appendChild(t); });
  nice(-am,am,4).forEach(v=>{ const t=svgEl('text',{x:L-8,y:Y(v)+4,'text-anchor':'end',class:'orbTick'}); t.textContent=(v>0?'+':'')+v+'%p'; svg.appendChild(t); });
  const xl=svgEl('text',{x:W-Rr,y:H-8,'text-anchor':'end',class:'drkAxL'}); xl.textContent='성장률 → (TTM 매출, 1년 전 대비)'; svg.appendChild(xl);
  const yl=svgEl('text',{x:14,y:T+4,class:'drkAxL',transform:'rotate(90 14 '+(T+4)+')'}); yl.textContent='가속 → (직전 분기 대비 %p)'; svg.appendChild(yl);
  // 궤적
  const P=trail.map(r=>[X(r.g),Y(r.a)]);
  for(let i=1;i<P.length;i++){
    const s=svgEl('line',{x1:P[i-1][0],y1:P[i-1][1],x2:P[i][0],y2:P[i][1],class:'drkTrail'});
    s.style.opacity=(.18+.72*i/(P.length-1)).toFixed(2); s.style.setProperty('--d',(i*70)+'ms'); svg.appendChild(s);
  }
  const tip=el('div','spTip drkTip'); tip.hidden=true;
  trail.forEach((r,i)=>{
    const last=i===trail.length-1;
    const g=svgEl('g',{class:'drkPt'+(last?' now':'')}); g.style.setProperty('--d',(i*70)+'ms');
    if(last){ const ring=svgEl('circle',{cx:P[i][0],cy:P[i][1],r:14,class:'drkRing'}); ring.setAttribute('stroke',DRK_RC[r.reg].c); g.appendChild(ring); }
    const dot=svgEl('circle',{cx:P[i][0],cy:P[i][1],r:last?8:4.2,class:'drkDot'}); dot.setAttribute('fill',DRK_RC[r.reg].c); g.appendChild(dot);
    g.appendChild(svgEl('circle',{cx:P[i][0],cy:P[i][1],r:14,class:'hit'}));
    if(last || i===0){ const t=svgEl('text',{x:P[i][0]+(last?14:8),y:P[i][1]-(last?12:8),class:last?'drkNowL':'drkFirstL'});
      t.textContent=last?r.label+' 지금':r.label; g.appendChild(t); }
    g.addEventListener('pointerenter',()=>{
      tip.innerHTML=''; tip.appendChild(drkTipBody(r)); tip.hidden=false;
      const bx=box.getBoundingClientRect(), sv=svg.getBoundingClientRect(), sc=sv.width/W;
      let lx=(sv.left-bx.left)+P[i][0]*sc+16; if(lx+tip.offsetWidth>bx.width-4) lx=(sv.left-bx.left)+P[i][0]*sc-tip.offsetWidth-16;
      tip.style.left=Math.max(4,lx)+'px'; tip.style.top=Math.max(4,(sv.top-bx.top)+P[i][1]*sc-30)+'px';
    });
    g.addEventListener('pointerleave',()=>{ tip.hidden=true; });
    svg.appendChild(g);
  });
  box.appendChild(svg);
  box.appendChild(tip);
  return box;
}

function drkTipBody(r){
  const f=document.createDocumentFragment();
  const h=el('div','spTipH'); h.innerHTML='<b></b><i></i><small></small>';
  h.querySelector('b').textContent=r.label;
  h.querySelector('i').style.background=r.reg?DRK_RC[r.reg].c:'transparent';
  h.querySelector('small').textContent=r.reg||'국면 판단 전';
  f.appendChild(h);
  const g=el('div','spTipG');
  [['TTM 매출 성장',dPct(r.g,1)],['가속 (2분기 평균)',dPp(r.a,1)],['분기 매출 YoY',dPct(r['매출YoY'],1)],['TTM 영업이익률',dNum(r.m)?r.m.toFixed(1)+'%':'—'],
   ['재고일수',dNum(r['재고일수'])?Math.round(r['재고일수'])+'일':'—'],['채권일수',dNum(r['매출채권일수'])?Math.round(r['매출채권일수'])+'일':'—'],
   ['주가',dNum(r['주가'])?Math.round(r['주가']).toLocaleString('ko-KR')+'원':'—'],['PER(TTM)',dNum(r['PER_TTM'])&&r['PER_TTM']>0?r['PER_TTM'].toFixed(1)+'배':'—']]
    .forEach(([k,v])=>{ const c=el('div'); c.appendChild(el('span',null,k)); c.appendChild(el('b',null,v)); g.appendChild(c); });
  f.appendChild(g);
  if(r.turn) f.appendChild(el('p',null,(r.turn==='up'?'▲ 가속 전환':'▼ 감속 전환')+' · 이후 2분기 주가 '+dPct(r.f2,0)+', 4분기 '+dPct(r.f4,0)));
  return f;
}

// 드러켄밀러 체크리스트 — 지금 분기 기준
function drkChecks(R, now){
  const box=el('div','drkChecks');
  box.appendChild(el('div','spIdeasH','드러켄밀러 체크리스트')).appendChild(el('em',null,'THE CHECKLIST · '+now.label));
  const prev=R[R.indexOf(now)-1]||{};
  const items=[];
  const add=(st,t,v,h)=>items.push({st,t,v,h});
  if(dNum(now.a)) add(Math.abs(now.a)<0.5?'warn':(now.a>0?'ok':'bad'),'성장에 속도가 붙는다', dPp(now.a,1)+' / 분기',
    Math.abs(now.a)<0.5?'분기당 0.5%p 미만 — 속도 유지. 방향이 아직 없다':'TTM 매출 증가율이 최근 2분기 동안 올랐나');
  if(dNum(now.a)) add(now.a>0&&now.streak>=2?'ok':(now.a>0?'warn':'bad'),'가속이 이어진다', now.streak+'분기 연속 '+(now.a>0?'가속':'감속'),'한 분기 반등은 잡음일 수 있다. 두 분기부터 추세');
  if(dNum(now.og)&&dNum(now.g)) add(now.og>now.g?'ok':'bad','영업 레버리지', '이익 '+dPct(now.og,0)+' vs 매출 '+dPct(now.g,0),'이익이 매출보다 빨리 늘어야 추정치가 올라간다');
  else add('warn','영업 레버리지','판단 보류','이익이 적자이거나 막 흑자로 돌아 증가율이 뜻이 없다');
  if(dNum(now.mD4)) add(now.mD4>0?'ok':'bad','마진이 넓어진다', (dNum(now.m)?now.m.toFixed(1)+'% · ':'')+dPp(now.mD4,1)+' (1년)','TTM 영업이익률, 1년 전 대비');
  if(dNum(now.invD4)){
    const up=now.invD4>=10;
    add(!up?'ok':(dNum(now.a)&&now.a<=0?'bad':'warn'),'재고가 쌓이지 않는다', '재고일수 '+dPct(now.invD4,0)+' (1년)',
      !up?'재고 회전이 유지되거나 빨라졌다':(now.a<=0?'재고가 쌓이는데 성장은 둔화 — 다음 분기 실적 경고':'재고가 늘었다. 늘어나는 수요가 받쳐주는지 확인'));
  }
  if(dNum(now.arD4)) add(now.arD4>=10?'bad':'ok','돈이 제때 들어온다','채권일수 '+dPct(now.arD4,0)+' (1년)', now.arD4>=10?'회수가 느려졌다 — 밀어내기 매출 의심':'매출채권 회수 속도 유지');
  if(dNum(now.px4)&&dNum(now.eps4)){
    const gap=now.px4-now.eps4;
    add(gap>30?'warn':'ok','주가가 이익을 앞서가지 않았다','주가 '+dPct(now.px4,0)+' vs 이익 '+dPct(now.eps4,0)+' (1년)',
      gap>30?'주가가 이익보다 '+Math.round(gap)+'%p 더 올랐다 — 가속이 이미 값에 들어갔을 수 있다':(gap<-20?'이익이 주가를 앞섰다 — 덜 반영됐다':'주가와 이익이 보조를 맞춘다'));
  }
  const ul=el('ul','drkList');
  items.forEach(x=>{
    const li=el('li',x.st);
    li.appendChild(el('i',null,x.st==='ok'?'✓':x.st==='bad'?'✕':'!'));
    const m=el('div'); const t=el('div','t'); t.appendChild(el('b',null,x.t)); t.appendChild(el('span',null,x.v)); m.appendChild(t);
    m.appendChild(el('small',null,x.h)); li.appendChild(m); ul.appendChild(li);
  });
  box.appendChild(ul);
  const ok=items.filter(x=>x.st==='ok').length;
  const vd=el('div','drkVerdict');
  if(now.reg){ vd.style.setProperty('--c',DRK_RC[now.reg].c);
    vd.innerHTML='<div class="h"><span class="chip"></span><b></b></div><p></p>';
    vd.querySelector('.chip').textContent=now.reg+(drkFlat(now)?' · 속도 유지':'');
    vd.querySelector('b').textContent=ok+' / '+items.length+' 통과';
    vd.querySelector('p').textContent=drkRead(now);
  }
  box.appendChild(vd);
  return box;
}

// 네 판을 한 가로축에: 국면 띠 · 성장률 · 마진 · 선행지표 · 주가 vs 이익
function drkStack(R, plate){
  const wrap=el('div','drkStackWrap');
  wrap.appendChild(el('div','spIdeasH','분기 궤적')).appendChild(el('em',null,'REGIME · GROWTH · MARGIN · LEAD INDICATORS · PRICE vs EARNINGS'));
  // 매출 막대 — 분기 하나의 전년 대비 / 최근 4분기 합의 전년 대비. 앞의 것은 연말 쏠림·기준 효과에 크게 흔들린다
  const revMode=S.drkRev==='ttm'?'ttm':'q';
  const tg=el('div','drkRevTg');
  tg.appendChild(el('span',null,'매출 성장률 막대'));
  [['q','분기 전년 대비'],['ttm','4분기 합 전년 대비']].forEach(([k,lab])=>{
    const b=el('button','spChip'+(k===revMode?'':' off'),lab);
    b.title=k==='q'?'그 분기 하나를 1년 전 같은 분기와 견준다 — 연말 쏠림·기준 효과가 그대로 보인다':'최근 4분기 합(TTM)을 1년 전 4분기 합과 견준다 — 쏠림이 지워져 추세가 보인다';
    b.onclick=()=>{ if(S.drkRev===k) return; S.drkRev=k; wrap.replaceWith(drkStack(R, plate)); };
    tg.appendChild(b); });
  wrap.appendChild(tg);
  const fig=el('div','orbFig'); wrap.appendChild(fig);
  const N=R.length, W=1000, L=56, Rr=112, T=18;
  const RIB=12, HA=150, HB=96, HC=110, HD=120, GAP=34;
  const ribY=T, aT=ribY+RIB+GAP, bT=aT+HA+GAP, cT=bT+HB+GAP, dT=cT+HC+GAP, bot=dT+HD, H=bot+40;
  const step=(W-L-Rr)/N, X=i=>L+i*step+step/2, bw=Math.max(3,Math.min(18,step*.55));
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'orbSvg drkSSvg',role:'img','aria-label':'분기별 성장률·마진·선행지표·주가'});
  // 연도 띠
  const yrs=[]; R.forEach((r,i)=>{ const y=String(r.year), l=yrs[yrs.length-1]; if(l&&l.y===y) l.e=i; else yrs.push({y,s:i,e:i}); });
  yrs.forEach((g,k)=>{ const x0=L+g.s*step, w=(g.e-g.s+1)*step;
    if(k%2===0) svg.appendChild(svgEl('rect',{x:x0,y:aT-8,width:w,height:bot-aT+8,class:'orbBand'}));
    const t=svgEl('text',{x:x0+w/2,y:bot+22,'text-anchor':'middle',class:'orbYear'}); t.textContent=w<40?"'"+g.y.slice(2):g.y; svg.appendChild(t);
    if(k) svg.appendChild(svgEl('line',{x1:x0,x2:x0,y1:bot,y2:bot+7,class:'orbYearTick'})); });
  const cap=(y,a,b)=>{ const t=svgEl('text',{x:L,y,class:'trjCap'}); t.innerHTML='<tspan class="k"></tspan><tspan class="e" dx="8"></tspan>';
    t.querySelector('.k').textContent=a; t.querySelector('.e').textContent=b; svg.appendChild(t); };
  const grid=(top,h,lo,hi,fmtv,n)=>{ const Y=v=>top+h-(v-lo)/((hi-lo)||1)*h;
    const s=(hi-lo)/(n||3), p=Math.pow(10,Math.floor(Math.log10(s||1))), m=[1,2,2.5,5,10].find(k=>k*p>=s)*p;
    for(let v=Math.ceil(lo/m)*m; v<=hi+1e-9; v+=m){ const vv=+v.toFixed(6);
      svg.appendChild(svgEl('line',{x1:L,x2:W-Rr,y1:Y(vv),y2:Y(vv),class:'drkGrid'+(Math.abs(vv)<1e-9?' z':'')}));
      const t=svgEl('text',{x:L-8,y:Y(vv)+4,'text-anchor':'end',class:'orbTick'}); t.textContent=fmtv(vv); svg.appendChild(t); }
    return Y; };
  const pathOf=(vals,Y)=>{ let d='', pen=false; vals.forEach((v,i)=>{ if(!dNum(v)){ pen=false; return; }
    d+=(pen?'L':'M')+X(i).toFixed(1)+','+Y(v).toFixed(1); pen=true; }); return d; };

  // 국면 띠
  cap(ribY-6,'국면','REGIME');
  R.forEach((r,i)=>{ const q=svgEl('rect',{x:X(i)-step/2+1,y:ribY,width:Math.max(1,step-2),height:RIB,rx:2,class:'drkRib'+(r.reg?'':' none')});
    if(r.reg) q.setAttribute('fill',DRK_RC[r.reg].c); svg.appendChild(q); });

  // A. 성장률 — 막대(분기 YoY 또는 4분기 합) + TTM 굵은 선
  cap(aT-12,'매출 성장률',revMode==='ttm'?'막대 = 최근 4분기 합 전년 대비(TTM) · 분기 쏠림을 지운 추세 · ▲▼ 변곡':'막대 = 분기 YoY · 선 = TTM · ▲▼ 변곡');
  const gv=R.map(r=>r.g).filter(dNum), qv=R.map(r=>r['매출YoY']).filter(dNum);
  let lo=Math.min(0,...gv), hi=Math.max(0,...gv); const sp=Math.max(10,hi-lo);
  if(revMode==='q'){ lo=Math.min(lo, Math.max(Math.min(...qv,0), lo-sp*.6)); hi=Math.max(hi, Math.min(Math.max(...qv,0), hi+sp*.6)); }
  lo-=sp*.08; hi+=sp*.08;
  const YA=grid(aT,HA,lo,hi,v=>(v>0?'+':'')+v+'%',4);
  R.forEach((r,i)=>{ const v=revMode==='ttm'?r.g:r['매출YoY']; if(!dNum(v)) return;
    const vc=Math.max(lo,Math.min(hi,v)), y=YA(vc), y0=YA(0);
    svg.appendChild(svgEl('rect',{x:X(i)-bw/2,y:Math.min(y,y0),width:bw,height:Math.max(1,Math.abs(y-y0)),rx:2,class:'drkQBar'+(revMode==='ttm'?' ttm'+(v<0?' neg':''):'')+(v!==vc?' clip':'')})); });
  svg.appendChild(svgEl('path',{d:pathOf(R.map(r=>r.g),YA),class:'drkGLine'+(revMode==='ttm'?' thin':'')}));
  R.forEach((r,i)=>{ if(!r.turn||!dNum(r.g)) return;
    const y=YA(r.g), up=r.turn==='up';
    const m=svgEl('path',{d:up?'M'+X(i)+','+(y+7)+'l-6,10h12z':'M'+X(i)+','+(y-7)+'l-6,-10h12z',class:'drkTurn '+(up?'up':'down')});
    svg.appendChild(m); });
  // 선 끝 라벨
  const lastG=[...R].reverse().find(r=>dNum(r.g));
  if(lastG){ const t=svgEl('text',{x:W-Rr+10,y:YA(lastG.g)+4,class:'drkEndL gold'}); t.textContent='TTM '+dPct(lastG.g,0); svg.appendChild(t); }

  // B. 마진
  cap(bT-12,'영업이익률','선 = TTM · 점 = 분기');
  const mv=R.map(r=>r.m).filter(dNum), qm=R.map(r=>r['영업이익률']).filter(dNum);
  let mlo=Math.min(...mv,...qm.filter(v=>v>-60)), mhi=Math.max(...mv,...qm.filter(v=>v<80));
  if(!isFinite(mlo)){ mlo=0; mhi=10; } const msp=Math.max(4,mhi-mlo); mlo=Math.min(mlo-msp*.1,mlo<0?mlo:0); mhi+=msp*.12;
  const YB=grid(bT,HB,mlo,mhi,v=>v+'%',3);
  R.forEach((r,i)=>{ const v=r['영업이익률']; if(!dNum(v)||v<mlo||v>mhi) return;
    svg.appendChild(svgEl('circle',{cx:X(i),cy:YB(v),r:2.2,class:'drkQDot'})); });
  svg.appendChild(svgEl('path',{d:pathOf(R.map(r=>r.m),YB),class:'drkMLine'}));
  const lastM=[...R].reverse().find(r=>dNum(r.m));
  if(lastM){ const t=svgEl('text',{x:W-Rr+10,y:YB(lastM.m)+4,class:'drkEndL'}); t.textContent='TTM '+lastM.m.toFixed(1)+'%'; svg.appendChild(t); }

  // C. 선행지표 — 재고일수 · 채권일수. 재고↑(1년 10%+)·성장 둔화 분기는 경고로 칠한다
  cap(cT-12,'선행지표','재고일수 · 매출채권일수 · 주황 = 재고 쌓이며 감속');
  R.forEach((r,i)=>{ if(dNum(r.invD4)&&r.invD4>=10&&dNum(r.a)&&r.a<=0)
    svg.appendChild(svgEl('rect',{x:X(i)-step/2,y:cT,width:step,height:HC,class:'drkWarn'})); });
  const dv=[].concat(R.map(r=>r['재고일수']),R.map(r=>r['매출채권일수'])).filter(v=>dNum(v)&&v>=0&&v<1500);
  const dhi=dv.length?Math.max(...dv)*1.12:100;
  const YC=grid(cT,HC,0,dhi,v=>Math.round(v)+'일',3);
  const clampD=v=>dNum(v)&&v>=0&&v<1500?v:null;
  svg.appendChild(svgEl('path',{d:pathOf(R.map(r=>clampD(r['재고일수'])),YC),class:'drkInv'}));
  svg.appendChild(svgEl('path',{d:pathOf(R.map(r=>clampD(r['매출채권일수'])),YC),class:'drkAr'}));
  const lastI=[...R].reverse().find(r=>clampD(r['재고일수'])!==null), lastA=[...R].reverse().find(r=>clampD(r['매출채권일수'])!==null);
  let yi=lastI?YC(lastI['재고일수'])+4:null, ya=lastA?YC(lastA['매출채권일수'])+4:null;
  if(yi!==null&&ya!==null&&Math.abs(yi-ya)<14){ if(yi<ya){ yi-=7; ya+=7; } else { yi+=7; ya-=7; } }
  if(lastI){ const t=svgEl('text',{x:W-Rr+10,y:yi,class:'drkEndL'}); t.textContent='재고 '+Math.round(lastI['재고일수'])+'일'; svg.appendChild(t); }
  if(lastA){ const t=svgEl('text',{x:W-Rr+10,y:ya,class:'drkEndL dim'}); t.textContent='채권 '+Math.round(lastA['매출채권일수'])+'일'; svg.appendChild(t); }

  // D. 주가 vs 이익 — 3년 전(=100)에 맞춘 로그 눈금. 이익이 0 근처인 해를 기준으로 잡으면 지수가 수천으로 부푼다.
  const okPE=r=>dNum(r['주가'])&&r['주가']>0&&dNum(r['EPS_TTM'])&&r['EPS_TTM']>0;
  let bi=R.findIndex((r,i)=>i>=R.length-13&&okPE(r));
  if(bi<0) bi=R.findIndex(okPE);
  cap(dT-12,'주가 vs 이익','주가 · EPS(TTM) · '+(bi>=0?R[bi].label:'')+' = 100 · 로그 눈금');
  if(bi>=0){
    const p0=R[bi]['주가'], e0=R[bi]['EPS_TTM'];
    const pi=R.map((r,i)=>i>=bi&&dNum(r['주가'])&&r['주가']>0?r['주가']/p0*100:null);
    const ei=R.map((r,i)=>i>=bi&&dNum(r['EPS_TTM'])&&r['EPS_TTM']>0?r['EPS_TTM']/e0*100:null);
    const allv=pi.concat(ei).filter(dNum);
    const llo=Math.log10(Math.min(...allv)*.85), lhi=Math.log10(Math.max(...allv)*1.15);
    const YD=v=>dT+HD-(Math.log10(v)-llo)/((lhi-llo)||1)*HD;
    [25,50,100,200,400,800,1600,3200].filter(v=>Math.log10(v)>=llo&&Math.log10(v)<=lhi).forEach(v=>{
      svg.appendChild(svgEl('line',{x1:L,x2:W-Rr,y1:YD(v),y2:YD(v),class:'drkGrid'+(v===100?' z':'')}));
      const t=svgEl('text',{x:L-8,y:YD(v)+4,'text-anchor':'end',class:'orbTick'}); t.textContent=v; svg.appendChild(t); });
    svg.appendChild(svgEl('path',{d:pathOf(ei,YD),class:'drkEps'}));
    svg.appendChild(svgEl('path',{d:pathOf(pi,YD),class:'drkPx'}));
    const lp=[...pi].reverse().find(dNum), le=[...ei].reverse().find(dNum);
    let yp=lp?YD(lp)+4:null, ye=le?YD(le)+4:null;
    if(yp!==null&&ye!==null&&Math.abs(yp-ye)<14){ if(yp<ye){ yp-=7; ye+=7; } else { yp+=7; ye-=7; } }
    if(lp){ const t=svgEl('text',{x:W-Rr+10,y:yp,class:'drkEndL'}); t.textContent='주가 '+Math.round(lp); svg.appendChild(t); }
    if(le){ const t=svgEl('text',{x:W-Rr+10,y:ye,class:'drkEndL gold'}); t.textContent='이익 '+Math.round(le); svg.appendChild(t); }
  } else {
    const t=svgEl('text',{x:L,y:dT+HD/2,class:'drkNA'}); t.textContent='흑자 분기의 주가·EPS 가 모자라 그리지 않았다'; svg.appendChild(t);
  }

  // 십자선
  const guide=svgEl('line',{class:'orbGuide',y1:ribY,y2:bot}); guide.style.display='none'; svg.appendChild(guide);
  const tip=el('div','spTip drkTip'); tip.hidden=true;
  R.forEach((r,i)=>{
    const h=svgEl('rect',{x:L+i*step,y:ribY,width:step,height:bot-ribY,class:'hit drkHit'});
    h.addEventListener('pointerenter',()=>{
      guide.style.display=''; guide.setAttribute('x1',X(i)); guide.setAttribute('x2',X(i));
      tip.innerHTML=''; tip.appendChild(drkTipBody(r)); tip.hidden=false;
      const box=fig.getBoundingClientRect(), sc=box.width/W;
      let lx=X(i)*sc+16; if(lx+tip.offsetWidth>box.width-4) lx=X(i)*sc-tip.offsetWidth-16;
      tip.style.left=Math.max(4,lx)+'px'; tip.style.top=Math.max(4,(aT)*sc)+'px';
    });
    h.addEventListener('pointerleave',()=>{ guide.style.display='none'; tip.hidden=true; });
    svg.appendChild(h);
  });
  fig.appendChild(svg); fig.appendChild(tip);
  return wrap;
}

// 변곡 성적표 — 이 종목에서 가속 전환 신호가 먹혔나
function drkTurns(R){
  const box=el('div','drkTurns');
  const T=R.filter(r=>r.turn);
  const med=a=>{ const v=a.filter(dNum).sort((x,y)=>x-y); if(!v.length) return null; const m=v.length>>1; return v.length%2?v[m]:(v[m-1]+v[m])/2; };
  const up=T.filter(r=>r.turn==='up'), dn=T.filter(r=>r.turn==='down');
  const mu=med(up.map(r=>r.f2)), md=med(dn.map(r=>r.f2)), mall=med(R.map(r=>r.f2));
  const hd=el('div','spIdeasH','변곡 성적표'); hd.appendChild(el('em',null,'DID THE SIGNAL WORK HERE? · 주가는 보고서 접수일'));
  box.appendChild(hd);
  if(!T.length){ box.appendChild(el('div','orbWait','가속의 방향이 1%p 넘게 바뀐 분기가 없다.')); return box; }
  const sum=el('div','drkSum');
  const card=(k,cls,list,m)=>{ const c=el('div','drkSumC '+cls);
    c.innerHTML='<span></span><b></b><small></small>';
    c.querySelector('span').textContent=k+' 뒤 2분기 주가';
    c.querySelector('b').textContent=m===null?'—':dPct(m,0);
    c.querySelector('small').textContent='중앙값 · '+list.filter(r=>dNum(r.f2)).length+'번 · 4분기 '+dPct(med(list.map(r=>r.f4)),0);
    return c; };
  sum.appendChild(card('▲ 가속 전환','up',up,mu));
  sum.appendChild(card('▼ 감속 전환','down',dn,md));
  const edge=el('div','drkSumC note');
  edge.innerHTML='<span>읽는 법 · 아무 분기에나 샀을 때 2분기 뒤 중앙값 '+esc(dPct(mall,0))+'</span><p></p>';
  const ex=(mu!==null&&mall!==null)?mu-mall:null, gap=(mu!==null&&md!==null)?mu-md:null;
  const nu=up.filter(r=>dNum(r.f2)).length, nd=dn.filter(r=>dNum(r.f2)).length;
  const few=Math.min(nu,nd)<3 ? '표본이 적다(▲'+nu+'·▼'+nd+'번) — 참고만. ' : '';
  edge.querySelector('p').textContent = gap===null ? '표본이 모자라 판단하지 않는다.' : few + (
      gap>=10 ? '이 종목에선 가속 전환 뒤 주가가 감속 전환 뒤보다 '+Math.round(gap)+'%p 더 올랐다'+
                (ex!==null?'(평소 대비 '+(ex>=0?'+':'')+Math.round(ex)+'%p)':'')+'. 2차 미분이 주가를 끌었다.'
    : gap<=-10 ? '이 종목에선 감속 전환 뒤가 오히려 '+Math.round(-gap)+'%p 더 올랐다. 가속이 발표 전에 이미 값에 들어가 있던 종목 — 신호를 한 분기 앞서 읽어야 한다.'

const NSV='http://www.w3.org/2000/svg';
function svgEl(n,attrs){
  const e=document.createElementNS(NSV,n);
  for(const k in attrs) e.setAttribute(k,attrs[k]);
  return e;
}
function tip(e,txt){ const t=svgEl('title'); t.textContent=txt; e.appendChild(t); return e; }

function axisFrame(svg,W,H,L,R,T,B,min,max,fmt){
  const Y=v=>H-B-((v-min)/((max-min)||1))*(H-T-B);
  [0,.25,.5,.75,1].forEach(f=>{
    const v=min+(max-min)*f, y=Y(v);
    svg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:y,y2:y,
      stroke:(Math.abs(v)<1e-9?'var(--dim)':'var(--line)'),
      'stroke-width':(Math.abs(v)<1e-9?1.4:1)}));
    const t=svgEl('text',{x:L-6,y:y+3.5,'text-anchor':'end','font-size':10,
      fill:'var(--faint)','font-family':'var(--mono)'});
    t.textContent=fmt(v); svg.appendChild(t);
  });
  return Y;
}
function xLabels(svg,pts,W,H,L,R,B,step){
  pts.forEach((p,i)=>{
    if(pts.length>16 && i%Math.ceil(pts.length/12)) return;
    const t=svgEl('text',{x:L+i*step+step/2,y:H-B+16,'text-anchor':'middle',
      'font-size':9.5,fill:'var(--faint)','font-family':'var(--mono)'});
    t.textContent=p.label.replace(/^20/,''); svg.appendChild(t);
  });
}

const STMTS=[['IS','손익계산서'],['BS','재무상태표'],['CF','현금흐름표']];
function mtxVal(v, pershare){
  if(v===null||v===undefined) return '—';
  // 주당이익은 원 단위 그대로. 억으로 나누면 전부 '0억'이 된다.
  if(pershare) return Math.round(v).toLocaleString('ko-KR')+'원';
  const neg=v<0, a=Math.abs(v);
  let s;
  if(a>=1e12) s=(a/1e12).toFixed(2)+'조';
  else if(a>=1e8) s=(a/1e8).toFixed(a/1e8>=100?0:1)+'억';
  else if(a>=1e4) s=(a/1e4).toFixed(0)+'만';
  else s=Math.round(a).toLocaleString('ko-KR');
  return (neg?'-':'')+s;
}
function mtxGrowth(y){
  // 기저가 작으면 증감률이 수천 %로 튄다. 정확한 자릿수는 의미가 없으니 자른다.
  if(y===null||y===undefined) return null;
  if(y > 999) return '>+999%';
  if(y < -999) return '<-999%';
  return (y>=0?'+':'')+y.toFixed(1)+'%';
}

const UNIT=[[1e12,'조'],[1e8,'억'],[1e4,'만']];
function money(v){
  if(v===null||v===undefined) return '—';
  const neg=v<0; let a=Math.abs(v);
  for(const [u,s] of UNIT){
    if(a>=u){ const x=a/u;
      return (neg?'-':'')+ (x>=100? Math.round(x).toLocaleString('ko-KR')
        : x.toFixed(x>=10?1:2)) + s; }
  }
  return (neg?'-':'')+Math.round(a).toLocaleString('ko-KR');
}
const won = v => Math.round(v).toLocaleString('ko-KR');
function fmtVal(r){
  if(r.value===null||r.value===undefined) return '—';
  // 주당 금액은 억·조로 뭉개면 읽을 수 없다. 원 단위 그대로.
  if(r.unit==='원/주') return won(r.value)+'원';
  if(r.unit==='원') return money(r.value);
  return r.value.toFixed(r.digits)+r.unit;
}
function fmtDelta(r){
  if(r.delta===null||r.delta===undefined) return null;
  const sign = r.delta>=0 ? '+' : '';
  if(r.unit==='원/주') return sign+won(r.delta)+'원';
  if(r.unit==='원') return sign+money(r.delta);
  return sign+r.delta.toFixed(r.digits)+(r.unit==='%'?'%p':r.unit);
}

  if(!f.now.annual)
    wrap.appendChild(el('div','finnote',
      '분기·반기 EPS 는 누적치라 PER 은 사업보고서에서만 냅니다. 매출·이익도 해당 기간 누적입니다.'));
  box.appendChild(wrap);

// ---- 원탁 토론 시뮬레이션 --------------------------------------------------------------
// 규칙 기반 가상 토론. 구루마다 논거 종류별로 설득되는 정도(민감도)가 다르다.
//  1) 모든 논거를 각자의 민감도로 가중해 첫 확신(−1 … +1)을 정한다.
//  2) 모두 발언 → 반론(가장 비관적인 구루가 가장 무거운 위험을 가장 낙관적인 구루에게 던진다) → 반박 → 값 논쟁 → 두 번째 반론.
//     논거가 나올 때마다 듣는 구루의 확신이 (민감도 × 논거의 무게)만큼 움직인다.
//  3) 최종 입장 — 서로의 평균 쪽으로 20% 수렴한 뒤 투표. 가중 평균 확신과 멍거의 거부권(치명 위험)으로 집행 여부를 정한다.
// tape = 주가 흐름(시장이 먼저 한 말). 드러켄밀러는 가격을 존중하고, 버핏·멍거는 미스터 마켓의 기분에 덜 흔들린다.
const INV_SENS={

  '버핏':     {momentum:.2, story:.4, quality:1,  valuation:1,  risk:.8, tape:.25},
  '린치':     {momentum:.6, story:1,  quality:.5, valuation:.7, risk:.6, tape:.6},
  '멍거':     {momentum:.1, story:.2, quality:.7, valuation:.8, risk:1, tape:.35},
  '미스터 마켓':{momentum:0, story:0, quality:0, valuation:.6, risk:.15, tape:1},
};
const INV_BIAS={'드러켄밀러':0,'버핏':-.08,'린치':.05,'멍거':-.25,'미스터 마켓':0};   // 멍거는 기본이 의심
const INV_UPSIDE={'드러켄밀러':1,'버핏':.8,'린치':1,'멍거':.35,'미스터 마켓':1};      // 좋은 소식에 설득되는 정도(멍거는 나쁜 소식에만 온전히 반응)
const INV_WT={'드러켄밀러':1.1,'버핏':1.2,'린치':1,'멍거':1,'미스터 마켓':1};
const INV_FATAL=/계속기업|감사의견\s*(거절|한정|부적정)|의견\s*거절|횡령|배임|상장\s*폐지|자본\s*잠식|파산|회생\s*절차|거래\s*정지/;
const invClamp=v=>Math.max(-1,Math.min(1,v));
const invSgn=v=>(v>=0?'+':'')+v.toFixed(2);
const invCut=(t,n)=>t.length>n?t.slice(0,n)+'…':t;

// 신호 → 논거(종류 · 부호 · 무게). 재무 규칙 몇 개는 여기서 논거로 더한다.
function invArgs(d, v){
  v=v||INV_ENGINE;
  const sigs=d.signals||[], fin={}; (d.fin||[]).forEach(r=>fin[r.key]=r);
  const ttm=d.ttm||{}, A=[];
  sigs.forEach(s=>{
    if(Math.abs(s.dir)<.1 || s.key==='PBR') return;     // 값은 아래에서 PBR·PER '수준'으로 따로 세운다
    let type;
    if(s.src==='fin'&&s.key==='PEG') type='valuation';
    else if(s.dir<-.15) type='risk';
    else if(s.src==='fin') type=(['매출액','영업이익','레버리지'].includes(s.key)||/전환/.test(s.label))?'momentum':'quality';
    else type='story';
    A.push({id:s.id, type, sign:Math.sign(s.dir), w:Math.min(1,Math.abs(s.dir)*s.mag*1.1), label:s.label,
            text:s.src==='fin'?s.text:invCut(s.text,58), hz:s.hz, fatal:INV_FATAL.test(s.text), fin:s.src==='fin'});
  });
  const fp=k=>fin[k]&&fin[k].pct!=null?fin[k].pct:null, fv=k=>fin[k]?fin[k].value:null;
  if(ttm.a!=null && Math.abs(ttm.a)>=.5)
    A.push({id:null,syn:'ttm',type:'momentum',sign:Math.sign(ttm.a),w:Math.min(.9,Math.abs(ttm.a)/3*.8+.2),label:'TTM 가속 '+(ttm.a>=0?'+':'')+ttm.a.toFixed(1)+'%p',
            text:'최근 4분기 매출 '+iPct(ttm.g,0)+', 그 증가율이 분기당 '+(ttm.a>=0?'+':'')+ttm.a.toFixed(1)+'%p', hz:.1});
  const rev=fp('매출액');
  if(rev!=null&&ttm.g!=null&&Math.abs(rev-ttm.g)>15)
    A.push({id:null,syn:'ttm',type:'momentum',sign:rev>ttm.g?1:-1,w:.55,label:'분기 vs TTM',
            text:'이번 분기 매출 '+iPct(rev,0)+' vs 최근 4분기 '+iPct(ttm.g,0)+(rev>ttm.g?' — 2차 미분이 곧 돈다':' — 감속이 숫자로 들어온다'),hz:.1});
  const pb=fp('PBR'), bp=fp('BPS'), ep=fp('EPS');
  const px=pb!=null&&bp!=null?((1+pb/100)*(1+bp/100)-1)*100:null;
  // 값 — 변화율이 아니라 수준. PBR 29배는 +94% 재평가보다 그 자체가 더 큰 말이다.
  const pbv=fv('PBR'), per=ttm.per;
  const pbSig=sigs.find(s=>s.key==='PBR');
  if(pbv!=null&&pbv>0){
    if(pbv>=4) A.push({id:pbSig?pbSig.id:null,abs:1,type:'valuation',sign:-1,w:Math.min(.95,Math.log(pbv/2)/2.6+(pb>50?.2:0)),label:'PBR '+pbv.toFixed(1)+'배',
      text:'PBR '+pbv.toFixed(1)+'배'+(pb!=null?'(1년 새 '+iPct(pb,0)+')':'')+' — 장부가치의 '+Math.round(pbv)+'배를 치르고 있다',hz:.05});
    else if(pbv<1) A.push({id:pbSig?pbSig.id:null,abs:1,type:'valuation',sign:1,w:Math.min(.7,(1-pbv)+.25),label:'PBR '+pbv.toFixed(2)+'배',
      text:'PBR '+pbv.toFixed(2)+'배 — 장부가치보다 싸다',hz:.05});
  }
  if(per!=null&&per>0&&!(v>=2&&ttm.per_pct!=null)){   // 엔진 2는 자기 역사 백분위가 있으면 그것을 쓴다
    if(per>=35) A.push({id:null,abs:1,type:'valuation',sign:-1,w:Math.min(.9,(per-25)/70+.15),label:'PER '+per.toFixed(0)+'배',
      text:'PER(TTM) '+per.toFixed(0)+'배 — 이익의 '+per.toFixed(0)+'년 치를 미리 치른다',hz:.05});
    else if(per<=12) A.push({id:null,abs:1,type:'valuation',sign:1,w:Math.min(.7,(15-per)/20+.2),label:'PER '+per.toFixed(1)+'배',
      text:'PER(TTM) '+per.toFixed(1)+'배 — 이익 대비 싸다',hz:.05});
  }
  if(px!=null&&ep!=null&&Math.abs(px-ep)>=25)
    A.push({id:null,syn:'pxeps',type:'valuation',sign:ep>px?1:-1,w:Math.min(.8,Math.abs(px-ep)/100+.2),label:'주가 vs 이익',
            text:'1년 새 주가 '+iPct(px,0)+', 이익 '+iPct(ep,0)+(ep>px?' — 이익이 주가를 앞섰다':' — 주가가 이익을 앞서갔다'),hz:.05});
  const roe=fv('ROE');
  if(roe!=null&&(roe>=15||roe<8))
    A.push({id:null,type:'quality',sign:roe>=15?1:-1,w:roe>=15?.5:.4,label:'ROE '+roe.toFixed(1)+'%',
            text:'ROE '+roe.toFixed(1)+'%'+(roe>=15?' — 자본을 15% 넘게 굴린다':' — 자본비용을 못 넘는다'),hz:.75});
  if(v>=2){
    // ① 공시 지연 할인 — 분기가 끝나고 한두 달 뒤에 나오는 숫자는 잠정실적·업황 뉴스로 이미 알려져 있다
    const st=(d.report&&d.report.stamp)||'', mo=st.slice(5,7);
    if(d.filed&&mo){ const qe=Date.UTC(+st.slice(0,4),+mo-1,(mo==='03'||mo==='12')?31:30)/864e5, fd=invDay(d.filed);
      const lagF=Math.max(.45,Math.min(1,1-(fd-qe-30)/150));
      A.forEach(a=>{ if(a.fin&&(a.type==='momentum'||a.type==='quality')) a.w*=lagF; }); }
    const K=INV_KNOB;
    A.forEach(a=>{
      if(a.fin&&a.type==='momentum') a.w*=K.mom;
      if(a.syn==='ttm') a.w*=K.ttm;
      if(a.type==='story') a.w=Math.min(1,a.w*K.story*(INV_FWD.test(a.text)?K.fwd:1));
      if(a.abs) a.w*=K.absVal;
      if(a.syn==='pxeps') a.w*=K.pxeps;
      if(a.type==='risk') a.w*=K.risk;
    });
    // ② 주가 흐름 — 직전 보고서 공시부터 이번 공시까지. 시장이 먼저 한 말이다
    const S=d.series, arc=d.arc||[];
    if(S&&d.filed){ const pv=arc.filter(a=>a.date<d.filed).sort((a,b)=>a.date.localeCompare(b.date)).pop();
      const k=invPriceAt(S,+d.filed), kp=pv?invPriceAt(S,+pv.date):-1;
      if(k>0&&kp>=0&&kp<k){ const r=(S.p[k]/S.p[kp]-1)*100;
        if(Math.abs(r)>=8) A.push({id:null,type:'tape',sign:Math.sign(r),w:Math.min(.95,(Math.abs(r)/60+.15)*INV_KNOB.tape),label:'주가 흐름 '+iPct(r,0),
          text:'직전 보고서 공시 뒤 이번 공시까지 주가 '+iPct(r,0)+' — 시장이 먼저 움직였다',hz:.05}); } }
    // ③ 값은 자기 역사 대비 — 이 종목이 늘 받던 PER 에서 어디쯤인가
    if(ttm.per_pct!=null&&ttm.per>0){ const q=ttm.per_pct;
      if(q>=80) A.push({id:null,type:'valuation',sign:-1,w:Math.min(.8,.35+(q-80)/40),label:'PER 역사 상위 '+Math.max(1,Math.round(100-q))+'%',
        text:'PER(TTM) '+ttm.per.toFixed(0)+'배 — 이 종목이 받아 온 PER 가운데 상위 '+Math.max(1,Math.round(100-q))+'%',hz:.05});
      else if(q<=25) A.push({id:null,type:'valuation',sign:1,w:Math.min(.8,.35+(25-q)/40),label:'PER 역사 하위 '+Math.round(q)+'%',
        text:'PER(TTM) '+ttm.per.toFixed(1)+'배 — 이 종목이 받아 온 PER 가운데 하위 '+Math.round(q)+'%',hz:.05}); }
  }
  A.forEach((a,i)=>a.key=i);
  return A;
}

// ---- 선행 점수 — 보고서가 나올 때 이미 값에 든 것과 아직 안 든 것을 가른다 --------------------------
// 백테스트(14종목, 2015–2026 보고서 513건, 2026-09-27): 원탁 확신과 공시 뒤 3개월 수익률의 종목 안 순위상관은 +0.03.
// 재무 모멘텀(성장·마진·TTM 가속)은 0 또는 음수 — 공시 때 이미 값에 있다. 새 문장(앞날 이야기)과 직전 주가 흐름만 꾸준했다.
// 선행 점수 = 새 문장/1.5 + tanh(직전 보고서 뒤 주가 흐름 / 40%) − 0.3 × 재무 모멘텀.
// 종목을 반으로 나눈 검증에서도 5분위 꼬리가 갈렸다(검증 절반 3개월 중앙값 Q5 +8.8%·상승 76%, Q1 −0.4%).
const INV_LEAD={
  cuts:[0.307,0.858,1.401,2.12],
  // 분위별 공시 뒤 [중앙값 %, 상승 비율 %, 건수] — 1·3·6개월
  stat:{1:{f1:[-0.4,48,103],f3:[-1.0,47,99],f6:[1.2,52,99]},
        2:{f1:[1.1,53,103],f3:[4.1,56,101],f6:[7.3,59,100]},
        3:{f1:[3.4,62,102],f3:[1.4,52,99],f6:[1.6,54,96]},
        4:{f1:[2.7,56,103],f3:[3.3,58,99],f6:[6.1,63,94]},
        5:{f1:[3.1,59,102],f3:[11.6,71,101],f6:[16.5,67,96]}},
  base:'14개 종목 · 2015–2026 보고서 513건',
};
function invLead(d){
  // 보정할 때와 같은 자로 잰다 — 크기를 달고 같은 사건을 묶기 전의 신호(lead_sigs), 엔진 1의 논거 무게
  const A=invArgs(Object.assign({}, d, {signals:d.lead_sigs||d.signals}),1);
  const sum=t=>A.filter(a=>a.type===t).reduce((s,a)=>s+a.sign*a.w,0);
  const story=sum('story'), mom=sum('momentum');
  let prevc=null;
  const S=d.series, arc=d.arc||[];
  if(S&&d.filed){ const pv=arc.filter(a=>a.date<d.filed).sort((a,b)=>a.date.localeCompare(b.date)).pop();
    const k=invPriceAt(S,+d.filed), kp=pv?invPriceAt(S,+pv.date):-1;
    if(k>0&&kp>=0&&kp<k) prevc=(S.p[k]/S.p[kp]-1)*100; }
  const parts={story:story/1.5, tape:Math.tanh((prevc||0)/40), mom:-0.3*mom};
  const score=parts.story+parts.tape+parts.mom;
  const q=INV_LEAD.cuts.filter(c=>score>c).length+1;
  return {score, q, parts, prevc, story, mom};
}
// 결론 — 선행 점수 분위가 뼈대, 원탁은 위험 필터(크게 반대하면 한 단계 낮추고, 치명 위험이면 멍거 거부권)
function invDecide(lead, M, fatal){
  if(fatal) return {verdict:'보류 — 멍거 거부권', cls:'dn', size:'집행하지 않는다', en:'Vetoed'};
  const order=[
    {verdict:'집행하지 않음', cls:'dn', size:'들어가지 않는다', en:'Pass'},
    {verdict:'보류 · 관찰', cls:'hold', size:'다음 보고서까지 대기', en:'Hold & watch'},
    {verdict:'부분 집행 · 시험 포지션', cls:'part', size:'목표 비중의 4분의 1', en:'Starter position'},
    {verdict:'집행 · 분할 진입', cls:'go', size:'목표 비중의 절반으로 시작, 다음 보고서에서 나머지', en:'Execute in tranches'},
  ];
  let k = lead.q===5?3 : lead.q===4?2 : lead.q>=2?1 : 0;
  const down = M<=-0.35 && k>0;
  if(down) k--;
  return Object.assign({}, order[k], {down});
}

    bar.appendChild(seg);
  }
  const bw=el('div','invLeadBarW'); bw.appendChild(el('div','cap','과거 같은 분위 보고서의 공시 뒤 3개월 (중앙값 · 상승 비율)')); bw.appendChild(bar);
  row.appendChild(bw);
  box.appendChild(row);
  const parts=el('div','invLeadParts');
  const part=(k,sub,v,cls)=>{ const x=el('div','pt '+(cls||'')); const h=el('div','h'); h.appendChild(el('span',null,k)); h.appendChild(el('b',null,(v>=0?'+':'')+v.toFixed(2))); x.appendChild(h); x.appendChild(el('small',null,sub)); parts.appendChild(x); };
  part('새 문장','아직 값에 안 든 이야기 — 공시 뒤 수익률과 가장 꾸준히 같은 방향이던 조각',lead.parts.story,lead.parts.story>=0?'up':'dn');
  part('주가 흐름','직전 보고서 뒤 이번 공시까지 '+(lead.prevc==null?'—':iPct(lead.prevc,0))+' — 시장이 먼저 한 말, 추세는 이어지는 편',lead.parts.tape,lead.parts.tape>=0?'up':'dn');
  part('재무 모멘텀 할인','성장·마진은 공시 때 이미 값에 있다 — 좋을수록 조금 뺀다',lead.parts.mom,'nu');
  box.appendChild(parts);
  box.appendChild(el('p','invLeadNote','보정: '+INV_LEAD.base+'. 성장·마진 같은 발표 숫자는 공시 때 이미 값에 들어가 있어, 공시 뒤 수익률과 꾸준히 같은 방향이던 것은 새 문장과 직전 주가 흐름뿐이었다. '+
    '다만 보정에 쓴 14종목은 삼성전자·HD현대일렉트릭·한미반도체처럼 이미 크게 오른 이름들이라 결과가 부풀었을 수 있다 — 전 종목 검증 전까지는 매매 판단이 아니라 참고로만 읽는다. '+
    '가운데 분위는 잡음이 크다.'));
  return box;
}

function invDebate(d, v){
  v=v||INV_ENGINE;
  const A=invArgs(d, v), used=new Set();
  const G=(v>=2?INV_GURUS.concat([INV_MARKET]):INV_GURUS).map(g=>Object.assign({},g));
  const imp=(g,a)=>a.sign*a.w*(INV_SENS[g.k][a.type]||0)*(a.sign>0?INV_UPSIDE[g.k]:1);
  // 논거가 많을수록 합이 커져 모두 ±1로 쏠린다 — 논거 수의 제곱근으로 나눈다
  const nrm=Math.sqrt(Math.max(4,A.length));
  G.forEach(g=>{ g.c0=invClamp(Math.tanh(A.reduce((s,a)=>s+imp(g,a),0)/nrm*1.6+INV_BIAS[g.k])); g.c=g.c0; });
  const fatal=A.find(a=>a.fatal);
  const steps=[{t:'시작', v:Object.fromEntries(G.map(g=>[g.k,g.c]))}];
  const rounds=[];
  const snap=t=>steps.push({t, v:Object.fromEntries(G.map(g=>[g.k,g.c]))});
  const best=(pred,g)=>A.filter(a=>pred(a)&&!used.has(a.key)).sort((x,y)=>Math.abs(imp(g,y))-Math.abs(imp(g,x)))[0];
  // 논거 하나가 나오면 말한 사람을 뺀 모두가 움직인다
  const hear=(speaker,a,k)=>{ const ds=[]; G.forEach(g=>{ if(g.k===speaker) return;
      const dv=imp(g,a)*k; g.c=invClamp(g.c+dv); if(Math.abs(dv)>=.01) ds.push([g.k,dv]); }); used.add(a.key); return ds; };
  // 근거 문장을 이어 붙이면 마침표가 겹친다(“+37%.. ”, “…. ”) — 한 번에 정리
  const tidy=t=>t.replace(/…\s*\./g,'…').replace(/\.(\s*\.)+/g,'.').replace(/\.\s*—/g,' —').replace(/\s{2,}/g,' ');
  const line=(who,text,refs,ds)=>({who,text:tidy(text),refs:(refs||[]).filter(Boolean).map(a=>a.id).filter(x=>x!=null),ds:ds||[]});
  // 논거를 말로 — 근거 문장이 이름으로 시작하면 이름을 두 번 쓰지 않는다
  const lt=a=>!a?'':(a.text&&a.text!==a.label?(a.text.startsWith(a.label)?a.text:a.label+' — '+a.text):a.label);

  // 1라운드 — 모두 발언
  const r1=[];
  G.forEach(g=>{
    const pro=A.filter(a=>imp(g,a)>0).sort((x,y)=>imp(g,y)-imp(g,x)), con=A.filter(a=>imp(g,a)<0).sort((x,y)=>imp(g,x)-imp(g,y));
    const p1=pro[0], p2=pro[1], n1=con[0], n2=con[1];
    let t;
    if(g.k==='드러켄밀러'){
      const mo=A.filter(a=>a.type==='momentum').sort((x,y)=>y.w-x.w).slice(0,2);
      const ms=mo.length?mo.map(a=>a.text).join('. '):'숫자의 방향이 뚜렷하지 않다';
      t = g.c>=.2 ? '나는 수준보다 변화율의 변화를 본다. '+ms+'. 이 조합이면 18개월 뒤 이익은 지금 추정보다 클 공산이 크다 — 들어갈 쪽이다.'
        : g.c<=-.2 ? '추세가 꺾이는 걸 보면서 버틸 이유가 없다. '+ms+'. 2차 미분이 다시 플러스로 돌 때까지 기다리겠다.'
        : ms+'. 방향이 아직 안 정해졌다. 다음 분기 가속을 보고 판단하겠다.';
      g.open=[mo[0],mo[1]];
    } else if(g.k==='버핏'){
      const q=A.filter(a=>a.type==='quality'&&a.sign>0).sort((x,y)=>y.w-x.w)[0], qn=A.filter(a=>a.type==='quality'&&a.sign<0)[0];
      const v=A.filter(a=>a.type==='valuation').sort((x,y)=>y.w-x.w)[0];
      const qs=q?q.text:(qn?qn.text:'사업의 질을 가늠할 숫자가 이번 보고서엔 적다');
      const vs=v?(v.sign<0?'다만 '+v.text+' — 좋은 사업도 비싸게 사면 평범한 투자가 된다.':v.text+' — 값도 무리하지 않다.'):'값은 따로 따져 봐야 한다.';
      t = g.c>=.2 ? '사업의 질부터 보자. '+qs+'. '+vs
        : g.c<=-.2 ? qs+'. '+vs+' 나는 기다리는 데 익숙하다.'
        : qs+'. 해자라 부르기엔 증거가 더 필요하다. '+vs;
      g.open=[q||qn,v];
    } else if(g.k==='린치'){
      const st=A.filter(a=>a.type==='story'&&a.sign>0).sort((x,y)=>y.w-x.w).slice(0,2);
      const peg=A.find(a=>/PEG/.test(a.label));
      t = st.length ? '이 회사를 두 문장으로 말하면 — '+st.map(a=>a.text).join(' / ')+'. '+(peg?peg.text+'. ':'')+
          (g.c>=.2?'이야기와 숫자가 같은 방향이다. 나는 산다.':g.c<=-.2?'그런데 숫자가 이야기를 받쳐주지 않는다.':'이야기가 숫자로 이어지는지 한 분기 더 보겠다.')
        : '이번 보고서에서 새로 할 이야기가 안 보인다. '+(p1?p1.label+' 정도다. ':'')+'이야기 없는 주식은 오래 못 든다.';
      g.open=[st[0],st[1]||peg];
    } else if(g.market){
      const tp=A.find(a=>a.type==='tape'), vv=A.find(a=>a.type==='valuation'&&/역사/.test(a.label));
      t='나는 보고서를 읽지 않는다. '+(tp?tp.text:'직전 보고서 뒤로 주가는 거의 제자리였다')+'. '+(vv?vv.text+'. ':'')+
        (g.c>=.2?'좋은 소식은 가격이 먼저 말하고 있다 — 추세는 아직 살아 있다.':g.c<=-.2?'가격이 먼저 등을 돌렸다. 보고서가 좋아도 나는 믿지 않는다.':'가격은 아직 방향을 정하지 않았다.');
      g.open=[tp,vv];
    } else {
      const rk=A.filter(a=>a.type==='risk').sort((x,y)=>y.w-x.w);
      const vn=A.filter(a=>a.type==='valuation'&&a.sign<0)[0];
      if(fatal){ t='이건 논쟁거리가 아니다 — '+fatal.text+'. 나는 거부권을 쓰겠다.'; g.c=invClamp(g.c-.6); }
      else if(rk.length||vn){
        t='뒤집어 보자. 무엇이 이걸 망가뜨리나? '+[rk[0],rk[1]||vn].filter(Boolean).map(lt).join(' / ')+
          '. '+(g.c<=-.2?'이걸 가격에 넣지 않았다면 반대다.':'이걸 가격에 넣었다면 반대하진 않겠다.');
      } else t='뒤집어 봐도 크게 걸리는 게 없다. 그게 오히려 의심스럽지만, 반대할 근거는 없다.';
      g.open=[rk[0],rk[1]||vn];
    }
    r1.push(line(g.k,t,g.open));
  });
  rounds.push({t:'1라운드 · 모두 발언', lines:r1});
  snap('발언');

  // 2라운드 — 반론과 반박
  const r2=[];
  const byC=()=>G.filter(g=>!g.market).sort((x,y)=>x.c-y.c);
  let bear=byC()[0]; if(bear.c>.1) bear=G.find(g=>g.k==='멍거');
  let bull=byC().slice(-1)[0];
  const risk1=A.filter(a=>(a.type==='risk'||(a.type==='valuation'&&a.sign<0))&&!used.has(a.key)).sort((x,y)=>y.w-x.w)[0];
  if(risk1 && bull.k!==bear.k){
    const ds=hear(bear.k,risk1,.35);
    r2.push(line(bear.k, bull.k+', '+lt(risk1)+'. 이걸 가격에 넣었나?',[risk1],ds));
    snap('반론');
    bull=byC().slice(-1)[0];
    const reb=best(a=>a.sign>0&&a.type!=='valuation',bull);
    if(reb && bull.c>0){
      const say = bull.k==='드러켄밀러' ? '그건 '+(risk1.hz>=.4?'1–2년 뒤의 일':'이미 알려진 일')+'이고, '+reb.text+' — 이건 지금 숫자로 보인다. 나는 추세에 건다.'
        : bull.k==='버핏' ? reb.text+'. 위험은 알지만 사업의 체력이 그걸 감당한다.'
        : bull.k==='린치' ? reb.text+'. 이 문장은 아직 숫자에 안 들어갔다 — 여기서 돈을 번다.'
        : reb.text+'. 그래도 균형은 이쪽이다.';
      const ds2=hear(bull.k,reb,.3);
      r2.push(line(bull.k,say,[reb],ds2));
      snap('반박');
    }
  } else if(!risk1){
    r2.push(line('멍거','반론할 만한 위험이 보고서에 새로 드러나지 않았다. 그래도 “없다”는 게 가장 위험한 말이라는 건 기억해 두자.',[],[]));
  }
  // 미스터 마켓 — 가격이 먼저 한 말을 원탁에 올린다
  const tape=A.find(a=>a.type==='tape'&&!used.has(a.key));
  if(tape&&G.some(g=>g.market)){
    const ds=hear('미스터 마켓',tape,.3);
    r2.push(line('미스터 마켓',tape.text+'. 여러분이 읽는 숫자는 분기가 끝나고 한두 달 뒤에 나온 것이다 — 나는 그사이 이미 움직였다.',[tape],ds));
    snap('시장');
  }
  // 값 논쟁 — 버핏
  const val=A.filter(a=>a.type==='valuation'&&!used.has(a.key)).sort((x,y)=>y.w-x.w)[0];
  if(val){
    const bf=G.find(g=>g.k==='버핏');
    const say = val.sign<0 ? '값을 잊지 말자. '+val.text+'. 좋은 사업도 비싸면 평범한 투자다 — 안전마진이 얇다.'
                           : val.text+'. 시장이 이 이익을 아직 덜 쳐줬다. 안전마진이 있다.';
    const ds=hear('버핏',val,.28);
    r2.push(line('버핏',say,[val],ds));
    snap('값');
  }
  // 두 번째 반론 — 멍거
  const risk2=A.filter(a=>a.type==='risk'&&!used.has(a.key)).sort((x,y)=>y.w-x.w)[0];
  if(risk2){
    const ds=hear('멍거',risk2,.2);
    r2.push(line('멍거','하나 더 — '+lt(risk2)+'.',[risk2],ds));
    snap('반론2');
  }
  // 린치 — 아직 숫자에 안 들어간 이야기
  const story=A.filter(a=>a.type==='story'&&a.sign>0&&!used.has(a.key)).sort((x,y)=>y.w-x.w)[0];
  if(story){
    const ds=hear('린치',story,.2);
    r2.push(line('린치','하나 더 보태자면 — '+story.text+'. 이런 문장이 매출로 바뀌는 데 한두 해가 걸린다.',[story],ds));
    snap('이야기');
  }
  rounds.push({t:'2라운드 · 반론과 반박', lines:r2});

  // 3라운드 — 최종 입장(20% 수렴 뒤 투표)
  const wm=()=>G.reduce((s,g)=>s+g.c*INV_WT[g.k],0)/G.reduce((s,g)=>s+INV_WT[g.k],0);
  const m0=wm(); G.forEach(g=>{ g.c=invClamp(.8*g.c+.2*m0); });
  snap('최종');
  const r3=[];
  G.forEach(g=>{
    g.vote = g.c>=.2?'찬성':g.c<=-.2?'반대':'기권';
    const sup=A.filter(a=>Math.sign(imp(g,a))===Math.sign(g.c||1)).sort((x,y)=>Math.abs(imp(g,y))-Math.abs(imp(g,x)))[0];
    const why = sup ? sup.label : '결정적 논거 없음';
    const t = g.vote==='찬성' ? '찬성. '+why+'이(가) 결정적이다.'
      : g.vote==='반대' ? '반대. '+why+' — 이걸 넘을 근거를 아직 못 봤다.'
      : '기권. '+why+' — 방향을 정하기엔 한 분기가 더 필요하다.';
    r3.push(line(g.k,t+' (확신 '+invSgn(g.c)+')',[sup],[]));
  });
  rounds.push({t:'3라운드 · 최종 입장', lines:r3});

  // 결론 — 엔진 1은 원탁 확신만으로, 엔진 2는 선행 점수 분위가 뼈대이고 원탁은 위험 필터
  const M=wm(), votes={찬성:0,기권:0,반대:0}; G.forEach(g=>votes[g.vote]++);
  let verdict, cls, size, en, lead=null, down=false;
  if(v>=2){
    lead=invLead(d);
    const dc=invDecide(lead, M, fatal);
    verdict=dc.verdict; cls=dc.cls; size=dc.size; en=dc.en; down=!!dc.down;
    const st=INV_LEAD.stat[lead.q].f3;
    rounds.push({t:'결론 · 의장', lines:[line('의장',
      '선행 점수 '+lead.score.toFixed(2)+' — 5분위 중 '+lead.q+'분위. 과거 같은 분위의 보고서는 공시 뒤 3개월 중앙값 '+iPct(st[0],1)+', '+st[1]+'%가 올랐다. '+
      (fatal?'그러나 치명 위험이 있어 멍거의 거부권을 받아들인다.':down?'원탁의 반대가 강해(확신 '+invSgn(M)+') 한 단계 낮춘다.':'원탁의 반대가 결론을 뒤집을 만큼 강하지 않다(확신 '+invSgn(M)+').')+
      ' 결론: '+verdict+'.',[],[])]});
  }
  else if(fatal){ verdict='보류 — 멍거 거부권'; cls='dn'; size='집행하지 않는다'; en='Vetoed'; }
  else if(M>=.45&&votes.반대===0){ verdict='집행'; cls='go'; size='목표 비중까지 두 번에 나눠 진입'; en='Execute'; }
  else if(M>=.28){ verdict='집행 · 분할 진입'; cls='go'; size='목표 비중의 절반으로 시작'; en='Execute in tranches'; }
  else if(M>=.12){ verdict='부분 집행 · 시험 포지션'; cls='part'; size='목표 비중의 4분의 1'; en='Starter position'; }
  else if(M>-.12){ verdict='보류 · 관찰'; cls='hold'; size='다음 보고서까지 대기'; en='Hold & watch'; }
  else { verdict='집행하지 않음'; cls='dn'; size='들어가지 않는다'; en='Pass'; }
  const topPro=A.filter(a=>a.sign>0).sort((x,y)=>y.w-x.w)[0], topCon=A.filter(a=>a.sign<0).sort((x,y)=>y.w-x.w)[0];
  const adds=[], kills=[];
  const ttm=d.ttm||{};
  if(ttm.a!=null) adds.push(ttm.a>0?'다음 분기에도 TTM 가속이 이어지면':'TTM 가속이 플러스로 돌면');
  A.filter(a=>a.type==='story'&&a.sign>0).slice(0,2).forEach(a=>{ const k=a.label.split(' · ')[0]; if(INV_MON[k]) adds.push(INV_MON[k].split(' — ')[0]+' 확인되면'); });
  [...new Set(A.filter(a=>a.type==='risk').sort((x,y)=>y.w-x.w).map(a=>a.label))].slice(0,2)
    .forEach(l=>kills.push(l+' — 악화되면'));
  const vn=A.find(a=>a.type==='valuation'&&a.sign<0); if(vn) kills.push('다음 실적이 기대에 못 미치면 ('+vn.label+')');
  if(!kills.length) kills.push('매출 가속이 꺾이고 재고가 쌓이기 시작하면');
  const why=[];
  if(lead){ const st=INV_LEAD.stat[lead.q].f3;
    why.push('선행 점수 '+lead.q+'분위 — 과거 3개월 중앙값 '+iPct(st[0],1)+' · 상승 '+st[1]+'%');
    if(down) why.push('원탁 반대가 강해 한 단계 낮춤 (확신 '+invSgn(M)+')'); }
  if(topPro) why.push('찬성 쪽 핵심 — '+topPro.label);
  if(topCon) why.push('반대 쪽 핵심 — '+topCon.label);
  return {agents:G, rounds, steps, M, votes, verdict, cls, size, en, fatal, lead, down, why:why.slice(0,4),
          adds:[...new Set(adds)].slice(0,3), kills:kills.slice(0,3), args:A};
}

// ---- 원탁 성적표 — 이 종목의 지난 보고서마다 원탁을 다시 돌려, 결론과 공시 뒤 주가를 맞대 본다 ----------
const INV_TRACK={};   // 종목별 계산 결과(한 번 돌리면 보고서를 넘겨도 다시 안 돈다)
function invSpear(a,b){
  const p=a.map((x,i)=>[x,b[i]]).filter(([x,y])=>x!=null&&y!=null&&isFinite(x)&&isFinite(y));
  if(p.length<8) return null;
  const rk=v=>{ const s=v.map((x,i)=>[x,i]).sort((u,w)=>u[0]-w[0]); const r=new Array(v.length); s.forEach(([,i],k)=>r[i]=k); return r; };
  const rx=rk(p.map(q=>q[0])), ry=rk(p.map(q=>q[1])), n=p.length, mx=(n-1)/2;
  let num=0,dx=0,dy=0; for(let i=0;i<n;i++){ num+=(rx[i]-mx)*(ry[i]-mx); dx+=(rx[i]-mx)**2; dy+=(ry[i]-mx)**2; }
  return num/Math.sqrt(dx*dy);
}
async function invTrackRun(code, S, A, onStep){
  const co=S_inv._co&&S_inv._co.code===code?S_inv._co:await (await fetch('/api/company?code='+code)).json();
  const reps=co.reports.filter(r=>!r.tag&&r.stamp>='2015-01');
  const out=[];
  for(let i=0;i<reps.length;i++){
    const r=reps[i];
    let d; try{ d=await (await fetch('/api/invest?lite=1&code='+code+'&rcept='+r.rcept)).json(); }catch(e){ continue; }
    onStep&&onStep(i+1,reps.length);
    if(!d||d.first) continue;
    d.series=S; d.arc=A;
    const k=invPriceAt(S,+d.filed); if(k<0) continue;
    const ld=invLead(d);
    out.push({rcept:r.rcept, stamp:r.stamp, label:r.label, filed:d.filed, L:ld.score, q:ld.q,
              f1:invFwd(S,k,21), f3:invFwd(S,k,63), f6:invFwd(S,k,126)});
  }
  return out;
}
function invTrackView(d, rep){

  const body=el('div','invTrackBody'); box.appendChild(body);

    body.innerHTML='';
    const H=S_inv.trackH||'f3';
    const seg=el('div','invRange');

    const R=rows.filter(r=>r[H]!=null);

    const grid=el('div','invTrackGrid');
    // 산점도 — 가로 원탁 가중 확신, 세로 공시 뒤 수익률
    const W=520,Hh=300,L=46,Rr=16,T=16,B=36;
    const ys=R.map(r=>r[H]); const ylo=Math.min(-10,...ys), yhi=Math.max(10,...ys);
    const X=v=>L+(v-xlo)/(xhi-xlo)*(W-L-Rr), Y=v=>T+(yhi-v)/(yhi-ylo)*(Hh-T-B);

    svg.appendChild(svgEl('line',{x1:X(0),x2:X(0),y1:T,y2:Hh-B,class:'drkGrid z'}));
    (XK==='L'?[-1,0,1,2,3]:[-1,-.5,0,.5,1]).filter(v=>v>=xlo&&v<=xhi).forEach(v=>{ const t=svgEl('text',{x:X(v),y:Hh-B+16,'text-anchor':'middle',class:'orbTick'}); t.textContent=(v>0?'+':'')+v; svg.appendChild(t); });
    if(XK==='L') INV_LEAD.cuts.forEach(c=>{ if(c>xlo&&c<xhi) svg.appendChild(svgEl('line',{x1:X(c),x2:X(c),y1:T,y2:Hh-B,class:'invQcut'})); });
    const nice=(()=>{ const s=(yhi-ylo)/4, p=Math.pow(10,Math.floor(Math.log10(s))), m=[1,2,2.5,5,10].find(k=>k*p>=s)*p; const o=[]; for(let v=Math.ceil(ylo/m)*m; v<=yhi; v+=m) o.push(v); return o; })();

    [5,4,3,2,1].forEach(q=>{ const g=R.filter(r=>r.q===q).map(r=>r[H]); if(!g.length) return; const t=q+'분위';
      const tr=el('tr'); tr.appendChild(el('td',null,t)); tr.appendChild(el('td','n',String(g.length)));
      const m=invMed(g); const td=el('td','n '+(m>0?'up':'dn'),iPct(m,1)); tr.appendChild(td);
      tr.appendChild(el('td','n',Math.round(g.filter(x=>x>0).length/g.length*100)+'%')); tb.appendChild(tr); });
    const all=R.map(r=>r[H]); const tr=el('tr','all'); tr.appendChild(el('td',null,'모든 보고서')); tr.appendChild(el('td','n',String(all.length)));
    tr.appendChild(el('td','n',iPct(invMed(all),1))); tr.appendChild(el('td','n',Math.round(all.filter(x=>x>0).length/Math.max(1,all.length)*100)+'%')); tb.appendChild(tr);
    right.appendChild(tb);
    right.appendChild(el('p','note','2015년 이후 보고서 '+R.length+'건. 각 보고서의 점수는 그 보고서에 담긴 정보와 그 전 주가만으로 다시 매겼다(앞날 자료 없음). 수익률은 최초 공시일 종가 기준.'));
    grid.appendChild(right);
    body.appendChild(grid);
  };
  if(INV_TRACK[code]){ setTimeout(()=>draw(INV_TRACK[code]),0); }
  else {
    const btn=el('button','spFull','▶ 지난 보고서로 성적 매기기');
    const prog=el('span','invTrackProg');
    body.appendChild(btn); body.appendChild(prog);

  }
  return box;
}

    '엔진 2: 재무 숫자는 공시 지연만큼 할인하고, 직전 주가 흐름과 자기 역사 대비 PER 을 논거에 넣었다. 결론은 선행 점수 분위가 정하고 원탁은 크게 반대할 때(확신 −0.35 이하) 한 단계 낮추는 위험 필터다. '+
