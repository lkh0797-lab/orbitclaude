function invConvChart(deb){
  const wrap=el('div','invConv');
  wrap.appendChild(el('div','spIdeasH','확신의 이동')).appendChild(el('em',null,'CONVICTION · 발언이 오갈 때마다'));
  const S=deb.steps, W=440,H=320,L=40,R=96,T=16,B=36;
  const X=i=>L+i*(W-L-R)/Math.max(1,S.length-1), Y=v=>T+(1-v)/2*(H-T-B);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'orbSvg invConvSvg',role:'img','aria-label':'토론 중 구루별 확신 변화'});
  svg.appendChild(svgEl('rect',{x:L,y:Y(1),width:W-L-R,height:Y(.2)-Y(1),class:'cvYes'}));
  svg.appendChild(svgEl('rect',{x:L,y:Y(-.2),width:W-L-R,height:Y(-1)-Y(-.2),class:'cvNo'}));
  [[1,'+1'],[.2,'+0.2'],[0,'0'],[-.2,'−0.2'],[-1,'−1']].forEach(([v,t])=>{
    svg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:Y(v),y2:Y(v),class:'drkGrid'+(v===0?' z':'')}));
    const x=svgEl('text',{x:L-6,y:Y(v)+4,'text-anchor':'end',class:'orbTick'}); x.textContent=t; svg.appendChild(x); });
  const zy=svgEl('text',{x:L+6,y:Y(1)+13,class:'cvZone'}); zy.textContent='찬성 구역'; svg.appendChild(zy);
  const zn=svgEl('text',{x:L+6,y:Y(-1)-6,class:'cvZone'}); zn.textContent='반대 구역'; svg.appendChild(zn);
  S.forEach((s,i)=>{ const t=svgEl('text',{x:X(i),y:H-12,'text-anchor':'middle',class:'orbTick'}); t.textContent=s.t; svg.appendChild(t); });
  const ends=[];
  deb.agents.forEach(g0=>{
    const g=INV_GC[g0.k];   // 토론 속 g0.c 는 확신 값이다 — 색은 참석자 표에서
    const pts=S.map((s,i)=>[X(i),Y(s.v[g.k])]);
    const p=svgEl('path',{d:pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+','+q[1].toFixed(1)).join(''),class:'cvLine'}); p.setAttribute('stroke',g.c); svg.appendChild(p);
    pts.forEach((q,i)=>{ const c=svgEl('circle',{cx:q[0],cy:q[1],r:i===pts.length-1?4.5:2.6,class:'cvDot'}); c.setAttribute('fill',g.c); svg.appendChild(c); });
    ends.push({g, y:pts[pts.length-1][1], v:S[S.length-1].v[g.k]});
  });
  ends.sort((a,b)=>a.y-b.y); for(let i=1;i<ends.length;i++) if(ends[i].y-ends[i-1].y<14) ends[i].y=ends[i-1].y+14;
  ends.forEach(e=>{ const t=svgEl('text',{x:W-R+8,y:e.y+4,class:'cvEnd'}); t.textContent=e.g.k+' '+invSgn(e.v); t.setAttribute('fill',e.g.c); svg.appendChild(t); });
  // 가중 평균
  const my=Y(deb.M); svg.appendChild(svgEl('line',{x1:X(S.length-1)-10,x2:X(S.length-1)+10,y1:my,y2:my,class:'cvMean'}));
  wrap.appendChild(svg);
  return wrap;
}

function invPlate(plate, d, c, L, rep){
  plate.innerHTML='';
  plate.classList.add('anim');
  // ── 머리: 전시 번호 · 보고서 고르기 · 발표 모드
  const top=el('div','spTop');
  const eb=el('div','spEyebrow');
  eb.innerHTML='<b>EXHIBIT 05</b><span></span><em></em>';
  eb.querySelector('span').textContent='변화 브리핑 · '+c.name;
  eb.querySelector('em').textContent=rep.stamp+' '+rep.label+rep.tag+(d.filed?' · '+invDate(d.filed)+' 공시':'');
  top.appendChild(eb);
  const tools=el('div','spTools');
  const idx=L.indexOf(rep);
  const pv=el('button','spChip','←'); pv.disabled=idx<=0; pv.title='이전 보고서';
  pv.onclick=()=>{ S.briefRcept=L[idx-1].rcept; show('brief'); };
  const sel=el('select','trjSel');
  L.slice().reverse().forEach(r=>{ const o=el('option',null,r.stamp+' '+r.label+r.tag+' · '+invDate(r.rcept.slice(0,8))+' 공시'); o.value=r.rcept; if(r.rcept===rep.rcept) o.selected=true; sel.appendChild(o); });
  sel.onchange=()=>{ S.briefRcept=sel.value; show('brief'); };
  const nx=el('button','spChip','→'); nx.disabled=idx>=L.length-1; nx.title='다음 보고서';
  nx.onclick=()=>{ S.briefRcept=L[idx+1].rcept; show('brief'); };
  tools.appendChild(pv); tools.appendChild(sel); tools.appendChild(nx);
  const fs=el('button','spFull','⛶ 발표 모드');
  fs.onclick=()=>{ if(document.fullscreenElement){ document.exitFullscreen(); return; } if(plate.requestFullscreen) plate.requestFullscreen().catch(()=>{}); };
  plate.onfullscreenchange=()=>{ const on=document.fullscreenElement===plate; plate.classList.toggle('full',on); fs.textContent=on?'발표 모드 끝내기':'⛶ 발표 모드'; };
  tools.appendChild(fs); top.appendChild(tools); plate.appendChild(top);
  if(d.first){ plate.appendChild(el('div','orbWait','가장 오래된 보고서라 견줄 짝이 없다. 다음 보고서로 넘어가 보라.')); return; }

  const sigs=d.signals||[];
  const fin={}; (d.fin||[]).forEach(r=>fin[r.key]=r);
  const lead=invLead(d);
  const pos=sigs.filter(s=>s.dir>.15&&!s.routine), neg=sigs.filter(s=>s.dir<-.15);
  const P=pos.reduce((a,s)=>a+s.dir*s.mag,0), N=-neg.reduce((a,s)=>a+s.dir*s.mag,0);
  const topNew=sigs.filter(s=>s.src==='new'&&s.dir>.15&&!s.routine).sort((a,b)=>b.mag*b.dir-a.mag*a.dir)[0];
  const evNeg=neg.filter(s=>s.src!=='fin');
  const bigNeg=evNeg.filter(s=>s.size!=='작음');
  const topRisk=(bigNeg.length?bigNeg:evNeg).slice().sort((a,b)=>a.dir*a.mag-b.dir*b.mag)[0];

  // ── 헤드라인 — 숫자 한 마디 + 새 문장 한 마디
  const lev=sigs.find(s=>s.key==='레버리지'), turn=sigs.find(s=>s.label==='흑자 전환'||s.label==='적자 전환');
  const rv=fin['매출액']&&fin['매출액'].pct, op=fin['영업이익']&&fin['영업이익'].pct;
  const finPhrase = turn ? turn.label==='흑자 전환'?'영업이익이 흑자로 돌아섰다':'영업이익이 적자로 돌아섰다'
    : lev ? '이익이 매출보다 '+lev.value.toFixed(1)+'배 빨리 늘었다'
    : (rv!=null&&op!=null) ? (rv>=0?'매출 '+iPct(rv,0):'매출이 '+iPct(rv,0)+' 줄었고')+(op>=0?', 영업이익 '+iPct(op,0):', 영업이익 '+iPct(op,0))
    : '숫자보다 문장이 더 많이 바뀌었다';
  const hl=el('div','spHead');
  hl.appendChild(el('h3',null,c.name+', '+finPhrase));
  if(topNew) hl.appendChild(el('p',null,'새로 들어온 가장 무거운 문장('+invSizeTxt(topNew)+') — “'+topNew.text+'”'));
  if(topRisk) hl.appendChild(el('p','invRiskLine',bigNeg.length?'가장 큰 위험('+invSizeTxt(topRisk)+') — “'+topRisk.text+'”'
    :'크기가 큰 새 위험은 없다 — 가장 큰 것도 '+invSizeTxt(topRisk).replace(/^작음 · /,'')+' (“'+(topRisk.text.length>60?topRisk.text.slice(0,60)+'…':topRisk.text)+'”)'));
  plate.appendChild(hl);
  plate.appendChild(invOnePager(d, sigs, fin, lead, pos, neg));

  // ── 맥락 띠
  const ctx=el('div','invCtx');
  const chip=(k,v,cls)=>{ const x=el('div','invCtxC'+(cls?' '+cls:'')); x.appendChild(el('span',null,k)); x.appendChild(el('b',null,v)); ctx.appendChild(x); };
  chip('비교', 'vs '+(d.base?d.base.stamp+' '+d.base.label:'—'));
  if(d.x!=null) chip('새로 쓴 분량', '평소의 '+d.x.toFixed(2)+'배 · '+(d.tier||''));
  if(d.ttm&&d.ttm.reg) chip('TTM 국면', d.ttm.reg+' · '+iPct(d.ttm.g,0));
  // 최초 공시일과 그날 주가 — 정정본이면 원본이 처음 나온 날
  const kF=d.series&&d.filed?invPriceAt(d.series,+d.filed):-1;
  if(d.filed) chip('최초 공시 · 그날 주가', invDate(d.filed)+(kF>=0?' · '+Math.round(d.series.r[kF]).toLocaleString('ko-KR')+'원':'')+(d.filed_doc&&d.filed_doc!==d.filed?' (정정 '+invDate(d.filed_doc)+')':''));
  if(kF>=0&&kF<d.series.d.length-1) chip('공시 후 지금까지', iPct((d.series.p[d.series.p.length-1]/d.series.p[kF]-1)*100,0), (d.series.p[d.series.p.length-1]>=d.series.p[kF])?'up':'dn');
  if(fin['PBR']&&fin['PBR'].value) chip('PBR', fin['PBR'].value.toFixed(1)+'배');
  if(d.ttm&&d.ttm.per_pct!=null) chip('PER 자기 역사', (d.ttm.per?d.ttm.per.toFixed(0)+'배 · ':'')+(d.ttm.per_pct>=50?'상위 '+Math.max(1,Math.round(100-d.ttm.per_pct)):'하위 '+Math.round(d.ttm.per_pct))+'%', d.ttm.per_pct>=80?'dn':d.ttm.per_pct<=25?'up':'');
  chip('신호', '기회 '+pos.length+' · 위험 '+neg.length+(sigs.some(s=>s.n_rel)?' (같은 사건 묶음)':''), P>=N*1.3?'up':N>=P*1.3?'dn':'');
  plate.appendChild(ctx);
  const arc=invArc(d, rep);
  if(arc) plate.appendChild(arc);

  // ── 기회 지형도 | 신호 목록
  const duo=el('div','invDuo');
  const terr=invTerrain(sigs, plate);
  duo.appendChild(terr);
  const lst=el('div','invSigList');
  lst.appendChild(el('div','spIdeasH','신호')).appendChild(el('em',null,'SIGNALS · 무게 순'));
  const ol=el('ol');
  sigs.slice(0,12).forEach(s=>{
    const li=el('li',invTone(s.dir)+(s.routine?' routine':'')); li.dataset.id=s.id;
    const n=el('span','n',String(s.id)); n.style.setProperty('--c',invCol(s.dir)); li.appendChild(n);
    const m=el('div','m');
    const t=el('div','t'); t.appendChild(el('b',null,s.label));
    if(s.size) t.appendChild(el('span','invSz '+({'중요':'big','보통':'mid','작음':'small'}[s.size]||'na'),invSizeTxt(s)));
    if(s.n_rel) t.appendChild(el('span','invSz na','같은 사건 '+(s.n_rel+1)+'개 문장'));
    if(s.routine) t.appendChild(el('span','invSz na','정기 배당'));
    t.appendChild(el('small',null,INV_SRC[s.src]+' · '+s.sec)); m.appendChild(t);
    if(s.src!=='fin') m.appendChild(el('p',null,s.text));
    (s.related||[]).slice(0,2).forEach(x=>m.appendChild(el('p','rel','＋ '+x)));
    li.appendChild(m);
    li.onmouseenter=()=>terr.focusId&&terr.focusId(s.id); li.onmouseleave=()=>terr.blur&&terr.blur();
    ol.appendChild(li);
  });
  lst.appendChild(ol);
  duo.appendChild(lst);
  plate.appendChild(duo);

  // ── 관점 체크리스트 — 같은 근거를 다섯 관점으로 나눠 본다. 결론을 내지 않는다
  plate.appendChild(invLens(d));

  // 선행 점수·성적표는 뺐다 — 보정 14종목 밖 60곳(보고서 2,562건) 표본 외 검증에서 공시 뒤 수익률을 가르지 못했다(2026-10-01).
  // invLeadView · invTrackView 코드는 다시 잴 때 쓰도록 남긴다(도구/선행점수_검증.mjs).

  const ft=el('div','spFoot');
  ft.innerHTML='<span></span><b>기업궤도추적</b>';
  ft.querySelector('span').textContent='신호는 규칙으로 뽑았다 — 새 문장·사라진 문장은 직전 같은 종류 보고서와 견줘 표현만 고친 문단·회계 상용구·정관 조문을 뺐고, '+
    '방향은 범주와 낱말(증가·수주·소송·지연…)로, 크기는 직전 사업보고서의 연 매출·영업이익과 공시일 시가총액 대비로 매겼다. 매매 권유가 아니다.';
  plate.appendChild(ft);
}

// 크기 한 마디 — '연 영업이익의 0.7%' 처럼 회사 대비로
function invSizeTxt(s){
  if(!s) return '';
  if(s.src==='fin') return s.key==='PBR'?'값':'발표 숫자';
  if(s.size==='실적 문장') return '실적 문장';
  if(!s.amt) return '금액 미상';
  const w=s.amt>=1e12?(s.amt/1e12).toFixed(1)+'조':Math.round(s.amt/1e8).toLocaleString('ko-KR')+'억';
  const p=s.p_op!=null&&s.p_op>0?'연 영업이익의 '+(s.p_op<1?s.p_op.toFixed(1):Math.round(s.p_op))+'%'
        : s.p_rev!=null?'연 매출의 '+(s.p_rev<1?s.p_rev.toFixed(2):s.p_rev.toFixed(1))+'%'
        : s.p_cap!=null?'시총의 '+s.p_cap.toFixed(2)+'%':'';
  return (s.size&&s.size!=='금액 미상'?s.size+' · ':'')+w+(p?' = '+p:'');
}

// 결론 먼저 한 장 — 무엇이 바뀌었나 · 이미 가격에 들었나 · 크기로 본 위험 · 생각을 바꿀 조건
function invOnePager(d, sigs, fin, lead, pos, neg){
  const box=el('div','invMemo invOne');
  const grid=el('div','invMemoG invOneG'); box.appendChild(grid);
  const card=(k,sub)=>{ const c=el('div','invM'); const h=el('div','h'); h.appendChild(el('b',null,k)); if(sub) h.appendChild(el('small',null,sub)); c.appendChild(h); const ul=el('ul'); c.appendChild(ul); grid.appendChild(c); return ul; };
  const li=(ul,txt,s,cls)=>{ const x=el('li',(s?invTone(s.dir):'')+(cls?' '+cls:'')); if(s) x.appendChild(el('span','n','#'+s.id)); x.appendChild(document.createTextNode(txt)); ul.appendChild(x); };
  const fp=k=>fin[k]&&fin[k].pct!=null?fin[k].pct:null;
  const cut=(t,n)=>t.length>n?t.slice(0,n)+'…':t;

  // ① 무엇이 바뀌었나
  const u1=card('무엇이 바뀌었나','크기 순');
  const rv=fp('매출액'), op=fp('영업이익');
  if(rv!=null||op!=null) li(u1,'숫자 — 매출 '+iPct(rv,0)+' · 영업이익 '+iPct(op,0)+' (직전 같은 종류 보고서 대비)'+(d.ttm&&d.ttm.reg?' · 최근 4분기 '+d.ttm.reg+' '+iPct(d.ttm.g,0):''));
  const rank=s=>({'중요':3,'보통':2,'금액 미상':1.5,'작음':.5}[s.size]||1)*s.mag*(.4+Math.abs(s.dir));
  const story=sigs.filter(s=>s.src!=='fin'&&!s.routine&&Math.abs(s.dir)>.1).sort((a,b)=>rank(b)-rank(a)).slice(0,3);
  story.forEach(s=>li(u1,(s.src==='gone'?'빠진 문장 · ':'')+s.label+' ('+invSizeTxt(s)+(s.n_rel?' · 관련 문장 '+(s.n_rel+1)+'개':'')+') — '+cut(s.text,70),s));
  if(!story.length) li(u1,'새로 들어온 문장 중 크기를 매길 만한 사건이 없다 — 숫자만 갱신된 보고서에 가깝다.');

  // ② 이미 가격에 들었나
  const u2=card('이미 가격에 들었나','주가 · 값');
  if(lead.prevc!=null) li(u2,'공시 전: 직전 보고서 공시 뒤 이번 공시까지 주가 '+iPct(lead.prevc,0)+(Math.abs(lead.prevc)>=15?(lead.prevc>0?' — 좋은 소식은 상당 부분 먼저 반영됐다':' — 시장이 먼저 등을 돌렸다'):' — 크게 움직이지 않았다'));
  const S=d.series, kF=S&&d.filed?invPriceAt(S,+d.filed):-1;
  if(kF>=0&&kF<S.d.length-1) li(u2,'공시 뒤: 지금까지 '+iPct((S.p[S.p.length-1]/S.p[kF]-1)*100,0));
  const pb=fp('PBR'), bp=fp('BPS'), ep=fp('EPS');
  const px=pb!=null&&bp!=null?((1+pb/100)*(1+bp/100)-1)*100:null;
  if(px!=null&&ep!=null) li(u2,'1년 새 주가 '+iPct(px,0)+' vs 주당이익 '+iPct(ep,0)+(ep-px>=25?' — 이익이 앞섰다':px-ep>=25?' — 주가가 앞섰다':' — 보조를 맞췄다'));
  const pctTxt=q=>(q>=50?'상위 '+Math.max(1,Math.round(100-q)):'하위 '+Math.round(q))+'%';
  if(d.ttm&&d.ttm.per_pct!=null&&d.ttm.per>0) li(u2,'값: PER(4분기) '+d.ttm.per.toFixed(0)+'배 — 이 회사가 받아 온 PER 중 '+pctTxt(d.ttm.per_pct));
  else if(d.val&&d.val.pct!=null) li(u2,'값: PER '+(d.val.per?d.val.per.toFixed(0)+'배':'')+' — 이 회사 15년 PER 중 '+pctTxt(d.val.pct)+' (풍경 탭 계산, 지금 기준)');
  else if(fin['PBR']&&fin['PBR'].value) li(u2,'값: PBR '+fin['PBR'].value.toFixed(1)+'배 (PER 자기 역사 자료가 아직 없다)');
  // 시장 기대 — 올해 컨센서스 대비 진도와 선행 PER
  const E=d.expect;
  if(E&&!E.none){
    const jo=v=>v==null?'—':v>=1e12?(v/1e12).toFixed(2)+'조':Math.round(v/1e8).toLocaleString('ko-KR')+'억';
    li(u2,'시장 기대: '+E.year+'년 컨센서스 매출 '+jo(E.rev_e)+(E.g_rev!=null?'('+iPct(E.g_rev,0)+')':'')+' · 영업이익 '+jo(E.op_e)+(E.g_op!=null?'('+iPct(E.g_op,0)+')':''));
    if(E.share_op!=null){
      const par=E.par_hist!=null?E.par_hist:E.par;
      li(u2,'진도: '+E.q+'분기까지 영업이익 '+jo(E.ytd_op)+' = 컨센서스의 '+Math.round(E.share_op)+'% — '+(E.par_hist!=null?'지난 '+E.par_n+'년 같은 시점 평균 '+Math.round(E.par_hist)+'%':'고르게 벌면 '+Math.round(E.par)+'%')+
        (E.need_rest!=null&&E.ytd_avg>0?' · 남은 분기가 지금까지 분기 평균보다 '+iPct((E.need_rest/E.ytd_avg-1)*100,0)+' 벌어야 컨센서스':''),
        null, E.share_op<par-8?'dn':E.share_op>par+8?'up':'');
    }
    if(E.fwd_per) li(u2,'선행 PER: '+E.fwd_per.toFixed(0)+'배 (올해 예상 EPS '+Math.round(E.eps_e).toLocaleString('ko-KR')+'원, '+invDate(E.price_date)+' 종가)');
  } else if(E&&E.none) li(u2,'시장 기대: '+E.why,null,'small');
  if(!u2.children.length) li(u2,'주가 자료가 모자란다.');

  // ③ 크기로 본 위험
  const u3=card('크기로 본 위험','작은 것은 묶어서');
  const nonSmall=neg.filter(s=>(s.src==='fin'&&s.key!=='PBR')||(s.src!=='fin'&&s.size!=='작음')), small=neg.filter(s=>s.src!=='fin'&&s.size==='작음');
  nonSmall.slice(0,3).forEach(s=>li(u3,(s.src==='gone'?'빠진 문장 · ':'')+s.label+' ('+invSizeTxt(s)+(s.n_rel?' · 관련 문장 '+(s.n_rel+1)+'개':'')+')'+(s.src!=='fin'?' — '+cut(s.text,60):' — '+s.text),s));
  if(small.length){ const mx=small.slice().sort((a,b)=>(b.amt||0)-(a.amt||0))[0];
    li(u3,'작은 위험 '+small.reduce((a,s)=>a+1+(s.n_rel||0),0)+'건 — 가장 큰 것도 '+invSizeTxt(mx).replace(/^작음 · /,'')+' ('+mx.label+')','','small'); }
  if(d.ttm&&d.ttm.per_pct!=null&&d.ttm.per_pct>=80) li(u3,'값이 자기 역사 상위 '+Math.max(1,Math.round(100-d.ttm.per_pct))+'% — 한 분기 실적 미스에도 크게 흔들릴 수 있다');
  const debt=fin['부채비율']&&fin['부채비율'].value; if(debt!=null&&debt>200) li(u3,'부채비율 '+Math.round(debt)+'% — 금리·경기에 약하다');
  if(!u3.children.length) li(u3,'이 보고서에서 새로 드러난 위험은 없다.');

  // ④ 생각을 바꿀 조건
  const u4=card('생각을 바꿀 조건','다음 보고서에서');
  const seenM=new Set();
  const GOODK=['수주','증설','신사업','R&D','고객','M&A'];
  pos.forEach(s=>{ const k=s.label.split(' · ')[0]; if(GOODK.includes(k)&&INV_MON[k]&&!seenM.has(k)&&seenM.size<2){ seenM.add(k); li(u4,'더 믿게 될 때 — '+INV_MON[k],s); } });
  if(d.ttm&&d.ttm.a!=null) li(u4,d.ttm.a>0?'더 믿게 될 때 — 최근 4분기 매출 가속이 다음 분기에도 이어진다(지금 '+(d.ttm.a>=0?'+':'')+d.ttm.a.toFixed(1)+'%p/분기)':'더 믿게 될 때 — 매출 감속이 멈추고 가속으로 돈다');
  // 접게 될 조건은 뜻이 분명한 것만 — 소송·제재, 자금조달·희석, 특수관계 거래(방향 낱말만으로 음수가 된 문장은 뺀다)
  const DIL=/유상증자|전환사채|신주인수권|교환사채|감자|물적\s*분할/;
  nonSmall.filter(s=>s.src==='new'&&(s.gov||/^(리스크|자금조달)/.test(s.label)||DIL.test(s.text))).slice(0,2).forEach(s=>li(u4,'접게 될 때 — '+(s.gov?'특수관계 거래가 늘거나 거래 가격·조건이 회사에 불리하게 드러난다 ('+s.label.split(' · ').pop()+')'
    : DIL.test(s.text)?s.label+' — 주식 수가 늘거나(희석) 조건이 기존 주주에게 불리해진다':s.label+' — 충당부채·판결·제재 범위가 커진다'),s));
  if(sigs.some(s=>s.key==='레버리지'||s.key==='영업이익률')) li(u4,'접게 될 때 — 매출이 늘어도 영업이익률이 뒷걸음친다');
  if(!u4.children.length) li(u4,'다음 보고서의 매출·영업이익률 방향.');
  return box;
}

// 관점 체크리스트 — 같은 근거를 다섯 관점으로 모아 본다(사람 이름·가상 대사 없음, 결론 없음)
const INV_LENS=[
  ['momentum','변화율','이익·매출이 빨라지는가'],
  ['story','이야기','숫자에 아직 안 들어간 새 문장이 있는가'],
  ['quality','사업의 질','번 돈을 잘 굴리는가(ROE·이익률·부채)'],
  ['valuation','값','지금 값이 이 회사가 늘 받던 값보다 비싼가'],
  ['risk','뒤집어 보기','무엇이 이 이야기를 망가뜨리나(크기 반영)'],
  ['tape','주가 흐름','시장은 이미 어느 쪽으로 움직였나'],
];
function invLens(d){
  const box=el('div','invLensBox');
  const hd=el('div','invCouncilH'); hd.appendChild(el('div','spIdeasH','관점 체크리스트')).appendChild(el('em',null,'같은 근거를 관점별로 모았다 — 결론을 내지 않는다'));
  box.appendChild(hd);
  const A=invArgs(d,2);
  const t=el('table','invLensT');
  t.innerHTML='<tr><th>관점</th><th>묻는 것</th><th>읽힘</th><th>가장 무거운 근거</th></tr>';
  INV_LENS.forEach(([k,nm,q])=>{
    const as=A.filter(a=>a.type===k).sort((a,b)=>b.w-a.w);
    const sum=as.reduce((x,a)=>x+a.sign*a.w,0);
    const sigOf=a=>a.id!=null?(d.signals||[]).find(s=>s.id===a.id):null;
    // 위험이 모두 회사 크기에 비해 작은 사건이면 '비우호'가 아니라 '작은 것뿐'
    const allSmall=k==='risk'&&as.length&&as.every(a=>{ const s=sigOf(a); return s&&s.size==='작음'; });
    const rd=!as.length?['자료 없음','na']:allSmall?['작은 것뿐','nu']:sum>.15?['우호','up']:sum<-.15?['비우호','dn']:['중립','nu'];
    const tr=el('tr');
    tr.appendChild(el('td','k',nm)); tr.appendChild(el('td','q',q));
    const r=el('td'); r.appendChild(el('span','invRd '+rd[1],rd[0])); tr.appendChild(r);
    const s0=as.length?sigOf(as[0]):null;
    tr.appendChild(el('td','e',as.length?as[0].text+(s0&&s0.size&&s0.src!=='fin'?' ('+invSizeTxt(s0)+')':'')+(as.length>1?' 외 '+(as.length-1)+'개':''):'—'));
    t.appendChild(tr);
  });
  box.appendChild(t);
  box.appendChild(el('p','invLeadNote','관점별로 근거를 모았을 뿐 투표·결론을 내지 않는다. 옛 화면의 가상 토론(유명 투자자 이름으로 쓴 규칙 시뮬레이션)은 그 합계가 공시 뒤 3개월 수익률과 거의 무관했고(순위상관 +0.03), '+
    '실존 인물의 말처럼 읽혀 없앴다. 이 근거로 만든 "선행 점수"(새 문장 + 공시 전 주가 흐름 − 재무 모멘텀)도 보정에 쓴 14종목 밖 60곳·보고서 2,562건에서 '+
    '공시 뒤 수익률을 가르지 못했다(점수 최상위 5분위 − 최하위 1분위, 시장 대비 3개월 −1.9%p · 12개월 +0.1%p, 순위상관 −0.03) — 그래서 점수·분위·성적표를 보여 주지 않는다.'));
  return box;
}

// 보고서 캔들 — 주가를 보고서 단위로 쪼갠다. 캔들 하나 = 그 보고서 공시일부터 다음 보고서 공시 전날까지.
// 폭 = 기간, 몸통 = 시작가 → 끝가, 꼬리 = 기간 중 최고·최저, 그 구간 일봉은 캔들 색으로 물들여 겹친다.
// 상승 빨강 · 하락 파랑(한국식, validate_palette 짙은 판 통과). 아래 칸: 새로 쓴 분량(원 크기) · TTM 국면(띠).
const invDay=v=>{ const s=String(v); return Date.UTC(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8))/864e5; };
const invDate=v=>{ const s=String(v); return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8); };
function invPriceAt(S, day){          // 그날(휴장이면 직전 영업일) 인덱스
  let lo=0, hi=S.d.length-1, k=-1;
  while(lo<=hi){ const m=(lo+hi)>>1; if(S.d[m]<=day){ k=m; lo=m+1; } else hi=m-1; }
  return k;
}
function invFwd(S, k, n){ const j=k+n; return k>=0&&j<S.d.length? (S.p[j]/S.p[k]-1)*100 : null; }
const S_inv={};   // 주가 차트 기간 — 보고서를 넘겨도 유지
const INV_UP='#e5534b', INV_DN='#3987e5';
const invMed=a=>{ const v=a.filter(x=>x!=null&&isFinite(x)).sort((x,y)=>x-y); if(!v.length) return null; const m=v.length>>1; return v.length%2?v[m]:(v[m-1]+v[m])/2; };

// 보고서마다 '다음 보고서까지' 구간
function invPeriods(S, A){
  const P=[];
  A.forEach((a,i)=>{
    const ks=invPriceAt(S,+a.date); if(ks<0) return;
    const last=i===A.length-1;
    const ke=last?S.d.length-1:invPriceAt(S,+A[i+1].date-1);
    if(ke<ks) return;
    let hi=-Infinity, lo=Infinity, khi=ks, klo=ks;
    for(let k=ks;k<=ke;k++){ if(S.p[k]>hi){ hi=S.p[k]; khi=k; } if(S.p[k]<lo){ lo=S.p[k]; klo=k; } }
    P.push({a, ks, ke, o:S.p[ks], c:S.p[ke], hi, lo, khi, klo, ret:(S.p[ke]/S.p[ks]-1)*100, open:last,
            t0:invDay(a.date), t1:last?invDay(S.d[S.d.length-1]):invDay(A[i+1].date)});
  });
  return P;
}

function invArc(d, rep){
  const S=d.series;
  if(!S||!S.d||S.d.length<30) return null;
  const A=(d.arc||[]).slice().sort((a,b)=>a.date.localeCompare(b.date));
  const regBy={}; (d.regimes||[]).forEach(r=>{ if(r.label) regBy[r.label]=r; });
  const qOf=st=>{ const [y,m]=st.split('-'); const q={'03':1,'06':2,'09':3,'12':4}[m]; return q?y+'Q'+q:null; };
  const regOf=a=>{ const r=regBy[qOf(a.stamp)]; return r&&r.reg?r.reg:null; };

  const hot=done.filter(p=>p.a.x!=null&&p.a.x>=1.5), cold=done.filter(p=>p.a.x!=null&&p.a.x<1.5);

  stat('크게 다시 쓴 보고서 뒤',hM==null?'—':iPct(hM,0),'1.5×↑ '+hot.length+'번 · 평소 보고서 뒤 '+(cM==null?'—':iPct(cM,0)), hM!=null&&cM!=null?(hM>cM?'up':'dn'):'');
  const rgs=el('div','s rg'); rgs.appendChild(el('span',null,'TTM 국면별 (중앙값 · 횟수)'));

  lg.appendChild(rg);
  box.appendChild(lg);

  // ── 창
  const tEnd=invDay(S.d[S.d.length-1]), filedDay=invDay(d.filed);

  if(filedDay<t0+30) t0=filedDay-120;
  t0=Math.max(t0, P[0].t0-20, invDay(S.d[0]));
  const V=P.filter(p=>p.t1>t0);

  else { const s=(hi0-lo0)/4, p=Math.pow(10,Math.floor(Math.log10(s||1))), m=[1,2,2.5,5,10].find(k=>k*p>=s)*p;

  const lastI=S.d.length-1, lyLast=Y(S.p[lastI]);

  svg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:BB,y2:BB,class:'invBase'}));
  const cap=(y,t,e)=>{ const x=svgEl('text',{x:L+2,y,class:'invCap'}); x.innerHTML='<tspan class="k"></tspan><tspan class="e" dx="7"></tspan>';
    x.querySelector('.k').textContent=t; x.querySelector('.e').textContent=e||''; svg.appendChild(x); };
  cap(BT-4,'새로 쓴 분량','원이 클수록 평소보다 많이'); cap(GT-4,'TTM 국면','');

  // 캔들
  const cols=[];
  const maxLabel=V.length>14;   // 캔들이 촘촘하면 큰 움직임에만 수익률을 적는다
  V.forEach((p,i)=>{
    const cur=p.a.date===d.filed&&p.a.stamp===rep.stamp;
    const x0=X(p.t0)+1, x1=Math.max(x0+2,X(p.t1)-1), xm=(x0+x1)/2, up=p.ret>=0, col=up?INV_UP:INV_DN;

    // 그 구간 일봉 — 캔들 색으로

    for(let k=p.ks;k<=p.ke;k+=stp){ const t=invDay(S.d[k]); if(t<t0) continue; dd+=(dd?'L':'M')+X(t).toFixed(1)+','+Y(S.p[k]).toFixed(1); }
    if(p.ke>p.ks){ const t=invDay(S.d[p.ke]); dd+='L'+X(t).toFixed(1)+','+Y(S.p[p.ke]).toFixed(1); }
    if(dd){ const ln=svgEl('path',{d:dd,class:'invSeg'}); ln.setAttribute('stroke',col); g.appendChild(ln); }
    // 시작·끝 눈금
    g.appendChild(svgEl('line',{x1:x0,x2:x0+Math.min(8,(x1-x0)/2),y1:Y(p.o),y2:Y(p.o),class:'invOC'}));
    g.appendChild(svgEl('line',{x1:x1-Math.min(8,(x1-x0)/2),x2:x1,y1:Y(p.c),y2:Y(p.c),class:'invOC'}));
    // 지금 보는 보고서 — 금색 틀
    if(cur) g.appendChild(svgEl('rect',{x:x0-3,y:Y(p.hi)-6,width:x1-x0+6,height:Y(p.lo)-Y(p.hi)+12,rx:7,class:'invCurFrame'}));

      g.appendChild(svgEl('circle',{cx:x0+Math.min(r+1,(x1-x0)/2),cy:(BT+BB)/2+2,r,class:'invBub'+(cur?' cur':p.a.x>=1.5?' hot':'')})); }

    const rb=svgEl('rect',{x:x0,y:GT,width:x1-x0,height:GH,rx:2,class:'invRib'+(rgk?'':' none')}); if(rgk) rb.setAttribute('fill',DRK_RC[rgk].c); g.appendChild(rb);

      let lx=(r.left-bx.left)+cl.x1*sc+12; if(lx+tip.offsetWidth>bx.width-4) lx=(r.left-bx.left)+cl.x0*sc-tip.offsetWidth-12;

    const y0=T+18+k*(H-T-B-30)/6, a=6+k%3*4, ph=k*.9;
    let dd='M'+L+','+y0; for(let x=L;x<=W-R;x+=24){ dd+='L'+x+','+(y0+Math.sin(x/70+ph)*a+Math.sin(x/23+ph*2)*2).toFixed(1); }
    svg.appendChild(svgEl('path',{d:dd,class:'invContour'}));
  }
  // 구역
  [[0,'지금','NOW · 실적'],[1/3,'1–2년','CATALYSTS'],[2/3,'구조','STRUCTURE · 해자']].forEach(([h,k,e],i)=>{
    const x0=X(h), x1=X(h+1/3);
    if(i) svg.appendChild(svgEl('line',{x1:x0,x2:x0,y1:T,y2:H-B,class:'invZone'}));
    const t=svgEl('text',{x:(x0+x1)/2,y:T-20,'text-anchor':'middle',class:'invZoneK'}); t.textContent=k; svg.appendChild(t);
    const e2=svgEl('text',{x:(x0+x1)/2,y:T-7,'text-anchor':'middle',class:'invZoneE'}); e2.textContent=e; svg.appendChild(e2);
  });
  svg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:Y(0),y2:Y(0),class:'invMid'}));
  const hi=svgEl('text',{x:L+12,y:T+18,class:'invLand up'}); hi.textContent='기회의 고지'; svg.appendChild(hi);
  const lo=svgEl('text',{x:L+12,y:H-B-10,class:'invLand dn'}); lo.textContent='위험의 골짜기'; svg.appendChild(lo);
  // 점 — 겹치면 살짝 밀어낸다
  const nodes=sigs.map(s=>({s, x:X(s.hz), y:Y(s.dir*.78), r:6+s.mag*10}));
  for(let it=0;it<120;it++){ let moved=false;
    for(let i=0;i<nodes.length;i++) for(let j=i+1;j<nodes.length;j++){
      const a=nodes[i], b=nodes[j], need=a.r+b.r+3;
      let dx=b.x-a.x, dy=b.y-a.y;
      if(Math.abs(dx)+Math.abs(dy)<.5){ dx=(j%2?1:-1)*.8; dy=.3; }   // 완전히 겹친 점은 옆으로 비껴 놓는다
      const dist=Math.hypot(dx,dy);
      if(dist<need){ const push=(need-dist)/2, ux=dx/dist, uy=dy/dist; a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push; moved=true; } }
    nodes.forEach(n=>{ n.x=Math.max(L+n.r+2,Math.min(W-R-n.r-2,n.x)); n.y=Math.max(T+n.r+2,Math.min(H-B-n.r-2,n.y)); });
    if(!moved) break; }
  const g=svgEl('g',{class:'invNodes'}), byId=new Map(), boxes=[];
  nodes.forEach((n,k)=>{
    const s=n.s, col=invCol(s.dir);
    const gg=svgEl('g',{class:'invNode '+s.src}); gg.style.setProperty('--d',(k*45)+'ms');
    let shape;
    if(s.src==='fin') shape=svgEl('rect',{x:n.x-n.r,y:n.y-n.r,width:n.r*2,height:n.r*2,rx:4});
    else if(s.src==='num') shape=svgEl('path',{d:'M'+n.x+','+(n.y-n.r*1.15)+'L'+(n.x+n.r*1.15)+','+n.y+'L'+n.x+','+(n.y+n.r*1.15)+'L'+(n.x-n.r*1.15)+','+n.y+'Z'});
    else shape=svgEl('circle',{cx:n.x,cy:n.y,r:n.r});
    shape.setAttribute('class','sh');
    if(s.src==='gone'){ shape.setAttribute('fill','none'); shape.setAttribute('stroke',col); shape.setAttribute('stroke-dasharray','3 2'); }
    else shape.setAttribute('fill',col);
    gg.appendChild(shape);
    const num=svgEl('text',{x:n.x,y:n.y+3.6,'text-anchor':'middle',class:'invNum'+(s.src==='gone'?' hollow':'')}); num.textContent=s.id; gg.appendChild(num);
    boxes.push([n.x-n.r,n.y-n.r,n.x+n.r,n.y+n.r]);
    g.appendChild(gg); byId.set(s.id,{gg,n});
  });
  svg.appendChild(g);
  // 이름 — 점 자리를 다 잡은 뒤, 위 12개만 맨 위 층에. 오른쪽·왼쪽·위·아래·비스듬히 중 빈자리. 없으면 번호만.
  const labs=svgEl('g',{class:'invLabs'});
  nodes.filter(n=>n.s.id<=12).forEach(n=>{
    const s=n.s, w=s.label.length*7.2+6, hh=14, o=n.r+5;
    const cand=[[n.x+o,n.y+4,'start'],[n.x-o,n.y+4,'end'],[n.x,n.y-n.r-6,'middle'],[n.x,n.y+n.r+14,'middle'],
                [n.x+o,n.y-n.r-2,'start'],[n.x+o,n.y+n.r+10,'start'],[n.x-o,n.y-n.r-2,'end'],[n.x-o,n.y+n.r+10,'end']];
    const bx=([x,y,a])=>{ const x0=a==='start'?x:a==='end'?x-w:x-w/2; return [x0,y-11,x0+w,y-11+hh]; };
    const hit=b=>boxes.some(q=>!(b[2]<q[0]||b[0]>q[2]||b[3]<q[1]||b[1]>q[3]))||b[0]<L||b[2]>W-R||b[1]<T+2||b[3]>H-B;
    const pick=cand.find(p=>!hit(bx(p)));
    if(!pick) return;
    boxes.push(bx(pick));
    const t=svgEl('text',{x:pick[0],y:pick[1],'text-anchor':pick[2],class:'invLab'}); t.textContent=s.label;
    t.dataset.id=s.id; labs.appendChild(t);
  });
  svg.appendChild(labs);
  box.appendChild(svg);
  // 범례
  const lg=el('div','invLegend');
  [['sq','재무'],['ci','새 문장'],['di','숫자 변화'],['ho','사라진 문장']].forEach(([c2,t])=>{ const s=el('span'); s.appendChild(el('i',c2)); s.appendChild(document.createTextNode(t)); lg.appendChild(s); });
  const cs=el('span','cols'); cs.innerHTML='<i style="background:#f1d9a0"></i>기회 <i style="background:#8a95a3"></i>중립 <i style="background:#d95926"></i>위험 · 크기 = 무게';
  lg.appendChild(cs);
  box.appendChild(lg);
  const tip=el('div','spTip invTip'); tip.hidden=true; box.appendChild(tip);
  const show1=(s)=>{
    const o=byId.get(s.id); if(!o) return;
    box.classList.add('focusing'); byId.forEach(v=>v.gg.classList.toggle('on',v===o));
    svg.querySelectorAll('.invLab').forEach(t=>t.classList.toggle('on',+t.dataset.id===s.id));
    plate.querySelectorAll('.invSigList li').forEach(li=>li.classList.toggle('on',+li.dataset.id===s.id));
    tip.innerHTML='';
    const h=el('div','spTipH'); h.innerHTML='<span class="spTipRank"></span><b></b><i></i><small></small>';
    h.querySelector('.spTipRank').textContent=s.id; h.querySelector('b').textContent=s.label;
    h.querySelector('i').style.background=invCol(s.dir); h.querySelector('small').textContent=INV_SRC[s.src]+' · '+s.sec;
    tip.appendChild(h);
    tip.appendChild(el('p','invTipT',s.text));
    tip.appendChild(el('p',null,'방향 '+(s.dir>0?'+':'')+s.dir.toFixed(2)+' · 지평 '+(s.hz<1/3?'지금':s.hz<2/3?'1–2년':'구조')+(s.size?' · 크기 '+invSizeTxt(s):'')));
    tip.hidden=false;
    const sv=svg.getBoundingClientRect(), bx=box.getBoundingClientRect(), sc=sv.width/W;
    let lx=(sv.left-bx.left)+o.n.x*sc+16; if(lx+tip.offsetWidth>bx.width-4) lx=(sv.left-bx.left)+o.n.x*sc-tip.offsetWidth-16;
    tip.style.left=Math.max(4,lx)+'px'; tip.style.top=Math.max(4,(sv.top-bx.top)+o.n.y*sc-24)+'px';
  };
  const hide=()=>{ box.classList.remove('focusing'); byId.forEach(v=>v.gg.classList.remove('on')); tip.hidden=true;
    plate.querySelectorAll('.invSigList li').forEach(li=>li.classList.remove('on')); };
  sigs.forEach(s=>{ const o=byId.get(s.id); o.gg.addEventListener('pointerenter',()=>show1(s)); o.gg.addEventListener('pointerleave',hide); });
  box.focusId=id=>{ const s=sigs.find(x=>x.id===id); if(s) show1(s); };
  box.blur=hide;
  return box;
}

// 투자 메모 — 논지 · 시장이 놓친 것 · 촉매 · 킬 조건 · 다음에 확인할 것
function invMemo(d, sigs, fin, council){
  const box=el('div','invMemo');
  const hd=el('div','spIdeasH','투자 메모'); hd.appendChild(el('em',null,'THE MEMO · 한 장으로')); box.appendChild(hd);
  const grid=el('div','invMemoG'); box.appendChild(grid);
  const card=(cls,k,en)=>{ const c=el('div','invM '+cls); const h=el('div','h'); h.appendChild(el('b',null,k)); h.appendChild(el('small',null,en)); c.appendChild(h); grid.appendChild(c); return c; };
  const li=(ul,s,txt)=>{ const x=el('li',s?invTone(s.dir):null); if(s) x.appendChild(el('span','n','#'+s.id)); x.appendChild(document.createTextNode(txt)); ul.appendChild(x); };
  const fp=k=>fin[k]&&fin[k].pct!=null?fin[k].pct:null;
  const pos=sigs.filter(s=>s.dir>.15).sort((a,b)=>b.dir*b.mag-a.dir*a.mag), neg=sigs.filter(s=>s.dir<-.15).sort((a,b)=>a.dir*a.mag-b.dir*b.mag);
  const up=council.filter(g=>g.vote==='찬성').map(g=>g.k), dn=council.filter(g=>g.vote==='반대').map(g=>g.k);

  // 논지
  const th=card('thesis','논지','THESIS');
  const tp=el('p');
  const struct=pos.filter(s=>s.hz>=2/3), near=pos.filter(s=>s.hz<1/3), mid=pos.filter(s=>s.hz>=1/3&&s.hz<2/3);
  const parts=[];
  if(near.length) parts.push('지금 숫자('+near.slice(0,2).map(s=>s.label).join(', ')+')');
  if(mid.length) parts.push('1–2년 촉매('+mid.slice(0,2).map(s=>s.label).join(', ')+')');
  if(struct.length) parts.push('구조 변화('+struct.slice(0,2).map(s=>s.label).join(', ')+')');
  tp.textContent = parts.length
    ? '기회 신호가 '+parts.join(' · ')+'에 걸쳐 있다. '+(parts.length>=3?'세 시간대가 같은 방향을 가리킬 때가 드러켄밀러가 말하는 “큰 판”이다.':parts.length===2?'두 시간대가 겹친다 — 한 시간대만 있을 때보다 무겁다.':'아직 한 시간대의 이야기다.')
      +(up.length?' 원탁에서 '+up.join('·')+'이(가) 찬성했다.':'')+(dn.length?' '+dn.join('·')+'은(는) 반대했다.':'')
    : '이 보고서에서는 뚜렷한 기회 신호가 잡히지 않았다. 숫자만 갱신된 보고서일 수 있다.';
  th.appendChild(tp);

  // 시장이 놓친 것 — 이익과 주가의 틈, 숫자에 아직 안 잡힌 이야기
  const vp=card('variant','시장이 놓친 것','VARIANT PERCEPTION');
  const vpu=el('ul'); vp.appendChild(vpu);
  const pb=fp('PBR'), bp=fp('BPS'), ep=fp('EPS');
  const px = pb!=null&&bp!=null ? ((1+pb/100)*(1+bp/100)-1)*100 : null;
  if(px!=null&&ep!=null){
    li(vpu,null, ep-px>=25 ? '이익('+iPct(ep,0)+')이 주가('+iPct(px,0)+')보다 빨리 늘었다 — 시장이 아직 덜 쳐줬다.'
      : px-ep>=25 ? '주가('+iPct(px,0)+')가 이익('+iPct(ep,0)+')을 앞서갔다 — 좋은 소식은 이미 값에 있다. 초과수익은 숫자에 아직 안 잡힌 이야기에서 나온다.'
      : '주가('+iPct(px,0)+')와 이익('+iPct(ep,0)+')이 보조를 맞춘다 — 시장과 같은 생각이다.');
  }
  const story=pos.filter(s=>s.src==='new'&&s.hz>=1/3).slice(0,3);
  story.forEach(s=>li(vpu,s,'숫자에 아직 안 잡힌 이야기: '+s.label+' — '+s.text.slice(0,70)+(s.text.length>70?'…':'')));
  if(!vpu.children.length) li(vpu,null,'주가·이익 비교 자료가 모자란다.');

  // 촉매
  const ca=card('cat','촉매','CATALYSTS · 1–2년');
  const cau=el('ul'); ca.appendChild(cau);
  const cats=pos.filter(s=>s.hz<2/3&&s.src!=='fin').slice(0,4);
  (cats.length?cats:pos.slice(0,3)).forEach(s=>li(cau,s,s.label+(s.src!=='fin'?' — '+s.text.slice(0,64)+(s.text.length>64?'…':''):'')));
  if(!cau.children.length) li(cau,null,'잡힌 촉매가 없다.');

  // 킬 조건 — 멍거
  const ki=card('kill','킬 조건','WHAT WOULD KILL IT · 멍거');
  const kiu=el('ul'); ki.appendChild(kiu);
  neg.slice(0,3).forEach(s=>li(kiu,s,s.label+(s.src!=='fin'?' — '+s.text.slice(0,64)+(s.text.length>64?'…':''):' — '+s.text)));
  if(pb!=null&&pb>15&&fin['PBR']&&fin['PBR'].value>3) li(kiu,null,'PBR '+fin['PBR'].value.toFixed(1)+'배 — 기대가 높다. 실적 한 분기 미스에도 크게 흔들린다.');
  const debt=fin['부채비율']&&fin['부채비율'].value; if(debt!=null&&debt>200) li(kiu,null,'부채비율 '+Math.round(debt)+'% — 금리·경기에 약하다.');
  if(!kiu.children.length) li(kiu,null,'이 보고서에서 새로 드러난 위험은 없다. 그래도 멍거는 “없다”를 가장 의심한다.');

  // 다음 보고서에서 확인할 것
  const mo=card('mon','다음 보고서에서 확인할 것','MONITOR');
  const mou=el('ul'); mo.appendChild(mou);
  const seenM=new Set();
  sigs.forEach(s=>{ const k=(s.label.split(' · ')[0]); if(INV_MON[k]&&!seenM.has(k)&&seenM.size<5){ seenM.add(k); li(mou,s,INV_MON[k]); } });
  if(sigs.some(s=>s.key==='레버리지'||s.key==='영업이익률')&&seenM.size<5) li(mou,null,'마진이 원가·환율 변화에도 유지되는지');
  if(d.ttm&&d.ttm.a!=null&&seenM.size<6) li(mou,null, d.ttm.a>0?'TTM 가속이 다음 분기에도 이어지는지 (지금 '+(d.ttm.a>=0?'+':'')+d.ttm.a.toFixed(1)+'%p/분기)':'TTM 감속이 멈추는지 — 2차 미분이 플러스로 도는 분기');
  if(!mou.children.length) li(mou,null,'다음 보고서의 매출·마진 방향.');
  return box;
}

// 기존 변화 브리핑 — 백업으로 남긴다
// 실적 탭 — 보고서 한 건의 재무 매트릭스 · 재무지표 15종(직전 같은 종류 대비) · 섹션별 새 문장·숫자·빠진 말
async function viewBriefClassic(p){
  const c=S.co;
  const L=reps();                       // 고른 종류의 보고서만
  p.innerHTML='';
  p.appendChild(el('h4','head','실적 — '+c.name+(S.kind?' · '+S.kind:'')));
  if(!L.length){ p.appendChild(el('div','empty','이 종류의 보고서가 없습니다.')); return; }
  const rep = L.find(r=>r.rcept===S.briefRcept) || L[L.length-1];
  S.briefRcept=rep.rcept;
  const row=el('div','row');
  const sel=el('select');
  L.slice().reverse().forEach(r=>{
    const o=el('option',null,r.stamp+' '+r.label+r.tag); o.value=r.rcept;
    if(r.rcept===rep.rcept)o.selected=true; sel.appendChild(o);
  });
  sel.onchange=()=>{ S.briefRcept=sel.value; show('earn'); };
  row.appendChild(sel);
  // 이전/다음은 같은 종류 안에서만 움직인다.
  const idx=L.indexOf(rep);
  const prev=el('button','morebtn','← 이전 보고서');
  prev.disabled = idx<=0;
  prev.onclick=()=>{ S.briefRcept=L[idx-1].rcept; show('earn'); };
  const next=el('button','morebtn','다음 보고서 →');
  next.disabled = idx>=L.length-1;
  next.onclick=()=>{ S.briefRcept=L[idx+1].rcept; show('earn'); };
  row.appendChild(prev); row.appendChild(next);
  p.appendChild(row);

  const box=el('div'); p.appendChild(box);
  box.innerHTML='<div class="loading">직전 보고서와 대조 중… 처음 한 번은 몇 초 걸립니다.</div>';
  const b=await (await fetch('/api/brief?code='+c.code+'&rcept='+rep.rcept)).json();
  box.innerHTML='';
  if(b.error){ box.appendChild(el('div','err',b.error)); return; }
  if(b.first || !b.base){
    box.appendChild(el('div','empty','가장 오래된 보고서라 비교 대상이 없습니다.'));
    return;
  }

  const hd=el('div','first');
  hd.innerHTML='<b>'+esc(b.report.stamp+' '+b.report.label+b.report.tag)+'</b> 를 <b>'+
    esc(b.base.stamp+' '+b.base.label+b.base.tag)+'</b> 와 대조 ('+esc(b.kind)+')<br>'+
    '변화점수 <b>'+b.score+'</b> · 달라진 섹션 '+b.sections.length+'개';
  box.appendChild(hd);
  const mtxBox=el('div'); box.appendChild(mtxBox);
  renderMatrix(mtxBox);

  const finBox=el('div'); box.appendChild(finBox);
  finBox.innerHTML='<div class="loading">재무지표 불러오는 중…</div>';
  fetch('/api/financials?code='+c.code+'&rcept='+rep.rcept)
    .then(r=>r.json()).then(f=>renderFin(finBox, f))
    .catch(()=>{ finBox.innerHTML=''; });

  if(Object.keys(b.tags).length) tagRow(b.tags, box);

  if(!b.sections.length){
    box.appendChild(el('div','empty','읽을 만한 변화가 없습니다. 숫자만 갱신된 보고서입니다.'));
    return;
  }
  const max=b.sections[0].score||1;
  b.sections.forEach((s,i)=>{
    const card=el('div','bcard'+(i===0?' open':''));
    const head=el('div','bhead');
    const nm=el('div','nm'); nm.appendChild(document.createTextNode(s.section));
    nm.appendChild(el('small',null,'새 문단 '+s.added+' · 숫자만 바뀜 '+(s.numeric||0)+
      ' · 삭제 '+s.removed+' · 유사도 '+s.similarity+'%'));
    head.appendChild(nm);

    head.appendChild(el('div','sc','점수 '+s.score));
    head.onclick=()=>card.classList.toggle('open');
    card.appendChild(head);

    const body=el('div','bbody');
    if(s.highlights.length){
      const blk=el('div','blk'); blk.appendChild(el('h5',null,'새로 들어간 말'));
      s.highlights.forEach(h=>{
        const d=el('div','pitem a');
        if(h.tags.length){ const tg=el('div','tg');
          h.tags.forEach(t=>tg.appendChild(el('span',tagClass(t),t))); d.appendChild(tg); }
        d.appendChild(document.createTextNode(h.text));
        blk.appendChild(d);
      });
      body.appendChild(blk);
    }
    if((s.numbers||[]).length){
      const blk=el('div','blk'); blk.appendChild(el('h5',null,'같은 문장, 달라진 숫자'));
      s.numbers.forEach(nn=>{
        const d=el('div','pitem n');
        const chips=el('div');
        (nn.diff||[]).forEach(x=>{
          const ch=el('span','numchip');
          ch.appendChild(el('span',null,x.from+' → '+x.to));
          if(x.pct!==null&&x.pct!==undefined)
            ch.appendChild(el('span', x.pct>=0?'up':'dn',
              (x.pct>=0?'+':'')+x.pct+'%'));
          chips.appendChild(ch);
        });
        d.appendChild(chips);
        d.appendChild(document.createTextNode(nn.after));
        blk.appendChild(d);
      });
      body.appendChild(blk);
    }
    if(s.dropped.length){
      const blk=el('div','blk'); blk.appendChild(el('h5',null,'빠진 말'));
      s.dropped.forEach(h=>{
        const d=el('div','pitem d');
        d.appendChild(document.createTextNode(h.text));
        blk.appendChild(d);
      });
      body.appendChild(blk);
    }
    const act=el('div','blk');
    const full=el('button','morebtn','이 섹션 전체 diff 보기');
    full.onclick=()=>{ S.section=s.section; S.diffA=b.base.rcept; S.diffB=b.report.rcept;
      renderSide(); jump('diff'); };
    act.appendChild(full);
    body.appendChild(act);
    card.appendChild(body);
    box.appendChild(card);
  });
}

async function viewRead(p){
  const c=S.co;
  const L=reps();
  p.innerHTML='';
  if(!L.length){ p.appendChild(el('div','empty','이 종류의 보고서가 없습니다.')); return; }
  const target = S.lastRead || (()=>{ const r=L[L.length-1];
    return {rcept:r.rcept, file:(r.sections.find(s=>s.norm===S.section)||r.sections[0]).file};})();
  const rep = L.find(r=>r.rcept===target.rcept) || L[L.length-1];
  const sec = rep.sections.find(s=>s.file===target.file)
           || rep.sections.find(s=>s.norm===S.section) || rep.sections[0];
  // 전문검색 족보에서 넘어오면 그 문장에 형광펜 — 한 번만
  const hi = target.hi && rep.rcept===target.rcept && sec.file===target.file ? target.hi : null;
  S.lastRead = {rcept:rep.rcept, file:sec.file};

  p.appendChild(el('h4','head', sec.title));
  const row=el('div','row');
  const selR=el('select');
  L.slice().reverse().forEach(r=>{
    const o=el('option',null, r.stamp+' '+r.label+r.tag); o.value=r.rcept;
    if(r.rcept===rep.rcept) o.selected=true; selR.appendChild(o);
  });
  selR.onchange=()=>{ const r=L.find(x=>x.rcept===selR.value);
    const s=r.sections.find(x=>x.norm===sec.norm)||r.sections[0];
    S.lastRead={rcept:r.rcept,file:s.file}; show('read'); };
  const selS=el('select');
  rep.sections.forEach(s=>{ const o=el('option',null,s.title); o.value=s.file;
    if(s.file===sec.file)o.selected=true; selS.appendChild(o); });
  selS.onchange=()=>{ S.lastRead={rcept:rep.rcept,file:selS.value}; show('read'); };
  row.appendChild(selR); row.appendChild(selS);
  p.appendChild(row);

  const d=await (await fetch('/api/text?code='+c.code+'&rcept='+rep.rcept+
    '&file='+encodeURIComponent(sec.file))).json();
  const box=el('div','doc');
  box.appendChild(el('div','src', c.name+' ('+c.code+') · '+rep.stamp+' '+rep.label+rep.tag+
    ' · 접수 '+rep.rcept+' · '+fmt(d.text.length)+'자'));
  const pre=el('pre');
  const at = hi ? d.text.indexOf(hi) : -1;
  if(at>=0){
    pre.appendChild(document.createTextNode(d.text.slice(0,at)));
    const mk=el('mark','readHi',hi); pre.appendChild(mk);
    pre.appendChild(document.createTextNode(d.text.slice(at+hi.length)));
    requestAnimationFrame(()=>mk.scrollIntoView({block:'center'}));
  } else pre.textContent=d.text;
  box.appendChild(pre);
  p.appendChild(box);
}

// ---------------------------------------------------------- 섹션 궤적
// 같은 섹션을 같은 종류 직전 보고서와 견준다(서버 traj_view). 위 = 분량(A4 쪽), 아래 = 다시 쓴 비율.
const TRJ_TIERS=[
  {k:'절반 이상',  c:'격변', d:'섹션 절반 넘게 새로 썼다. 사업을 다시 정의한 신호'},
  {k:'크게 고침',  c:'큼',   d:'평소보다 10%p 넘게 더 고쳐 썼다. 읽을 곳'},
  {k:'평소',       c:'평소', d:'해마다 하는 문구 손질과 숫자 갱신'},
  {k:'거의 그대로', c:'조용', d:'5% 미만. 복사해 붙인 수준'},
];
const TRJ_C=Object.fromEntries(TRJ_TIERS.map(t=>[t.k,t.c]));   // 등급 → 궤도 탭 색 이름
const trjPages=n=>n===null||n===undefined?null:n/2000;
const trjPg=n=>{ const v=trjPages(n); return v===null?'—':(v>=10?Math.round(v):v.toFixed(1))+'쪽'; };
function trjMed(a){ const v=a.slice().sort((x,y)=>x-y); if(!v.length) return null; const m=v.length>>1;
  return v.length%2?v[m]:(v[m-1]+v[m])/2; }
function trjGo(r){
  if(!r.base_rcept) return;
  const go=()=>{ S.diffA=r.base_rcept; S.diffB=r.rcept; S.diffMode='text'; jump('diff'); };
  if(document.fullscreenElement) document.exitFullscreen().then(go).catch(go); else go();
}

async function viewTraj(p){
  const c=S.co, sec=S.section, code=c.code;
  p.innerHTML='';
  const progBox=el('div'); p.appendChild(progBox);
  const plate=el('section','synplate orbplate trjplate'); p.appendChild(plate);
  plate.appendChild(el('div','orbWait','섹션 궤적을 불러오는 중…'));
  const ledger=el('div','orbledger trjledger'); p.appendChild(ledger);
  if(!sec){ plate.innerHTML=''; plate.appendChild(el('div','orbWait','왼쪽에서 섹션을 고르세요.')); return; }
  let first=true, lastSig='';
  async function tick(){
    if(S.tab!=='traj' || !S.co || S.co.code!==code || S.section!==sec || !p.contains(plate)) return;
    let d;
    try{ d=await (await fetch('/api/traj?code='+code+'&section='+encodeURIComponent(sec)+labelsParam())).json(); }
    catch(e){ setTimeout(tick,2500); return; }
    if(!d || d.error){ plate.innerHTML=''; plate.appendChild(el('div','orbWait',(d&&d.error)||'불러오지 못했습니다.')); return; }
    progBox.innerHTML='';
    if(d.pending){
      const pr=el('div','prog'), tot=d.rows.length*2-1;
      pr.appendChild(el('span',null,'섹션 비교 중 · 남은 '+d.pending+'건'));
      const bar=el('div','bar'), i=el('i'); i.style.width=Math.round(Math.max(0,1-d.pending/Math.max(1,tot))*100)+'%';
      bar.appendChild(i); pr.appendChild(bar);
      pr.appendChild(el('span',null,'처음 한 번만 걸립니다. 결과는 저장됩니다.'));
      progBox.appendChild(pr);
    }
    const sig=JSON.stringify(d.rows.map(r=>[r.rcept,r.sim,r.chars,r.line_ready]));
    if(sig!==lastSig){ lastSig=sig; trjPlate(plate,d,c,first); trjLedger(ledger,d); first=false; }
    if(d.pending) setTimeout(tick,1500);
  }
  tick();
}

// 등급 매기기 — 평소 = 이 회사 이 섹션의 다시 쓴 비율 중앙값
function trjPrep(d){
  const rows=d.rows.slice().sort((a,b)=>a.stamp.localeCompare(b.stamp)||a.rcept.localeCompare(b.rcept));
  const pr=rows.filter(r=>r.rewrite!==null&&r.rewrite!==undefined);
  const med=trjMed(pr.map(r=>r.rewrite));
  const thr=med===null?null:med+10;
  rows.forEach(r=>{
    r.tier = r.rewrite===null||r.rewrite===undefined ? null
      : r.rewrite>=50 ? '절반 이상' : (thr!==null&&r.rewrite>=thr) ? '크게 고침' : r.rewrite<5 ? '거의 그대로' : '평소';
  });
  return {rows,pr,med,thr};
}

// 한 줄 요약(섹션 하나)
function trjLine(r){
  const ul=el('ul','orbLines');
  if(!r.base_rcept){ ul.appendChild(el('li','none','이 종류의 첫 보고서. 견줄 짝이 없다')); return ul; }
  if(!r.line_ready){ ul.appendChild(el('li','wait','요약 뽑는 중…')); return ul; }
  const ln=r.line;
  if(!ln || (!ln.text && !(ln.came||[]).length)){ ul.appendChild(el('li','none','새 문장은 안 잡혔다. 표현·숫자 손질')); return ul; }
  const li=el('li');
  if(ln.text) li.appendChild(el('span','t',ln.text));
  if(ln.came && ln.came.length) li.appendChild(el('span','came','새 말 '+ln.came.slice(0,3).join(' · ')));
  if(ln.gone && ln.gone.length) li.appendChild(el('span','came gone','빠진 말 '+ln.gone.slice(0,2).join(' · ')));
  ul.appendChild(li);
  return ul;
}

   ['분량 변화', dp===null?'—':(dp>=0?'+':'')+dp.toFixed(0)+'%'],
   ['유사도', r.sim!=null?r.sim+'%':'—'],

  if(r.base_rcept) f.appendChild(el('p','orbTipGo','누르면 두 보고서 문단 비교 →'));

function trjPlate(plate, d, c, animate){
  plate.innerHTML='';
  plate.classList.toggle('full', document.fullscreenElement===plate);
  plate.classList.toggle('anim', !!animate);
  const sec=d.section, secS=ORB_SEC[sec]||sec;
  const {rows,pr,med,thr}=trjPrep(d);
  if(!rows.length){ plate.appendChild(el('div','orbWait','이 섹션이 있는 보고서가 없습니다.')); return; }
  const big=pr.filter(r=>r.tier==='절반 이상'||r.tier==='크게 고침'), half=pr.filter(r=>r.tier==='절반 이상');
  const byR=pr.slice().sort((a,b)=>b.rewrite-a.rewrite);
  const peak=byR[0], latest=pr[pr.length-1];
  const keys=byR.slice(0, Math.min(5, Math.max(3, big.length)));
  const rank=new Map(keys.map((r,i)=>[r.rcept,i+1]));
  // 분량 줄은 한 종류로만 잇는다 — 분기보고서의 사업의 내용은 사업보고서보다 짧게 쓰는 회사가 많다
  const kinds={}; rows.forEach(r=>{ if(r.chars!=null) kinds[r.label]=(kinds[r.label]||0)+1; });
  const lenKind=S.kind || (kinds['사업보고서']>=2?'사업보고서':Object.entries(kinds).sort((a,b)=>b[1]-a[1]).map(x=>x[0])[0]);
  const lenRows=rows.filter(r=>r.label===lenKind && r.chars!=null);
  const l0=lenRows[0], l1=lenRows[lenRows.length-1];
  const y0=rows[0].stamp.slice(0,4), y1=rows[rows.length-1].stamp.slice(0,4);

  // ── 머리: 전시 번호 · 섹션 바꾸기 · 발표 모드
  const top=el('div','spTop');
  const eb=el('div','spEyebrow');
  eb.innerHTML='<b>EXHIBIT 03</b><span></span><em>Section rewrite trajectory · '+y0+'–'+y1+'</em>';
  eb.querySelector('span').textContent='섹션 궤적 · '+c.name;
  top.appendChild(eb);
  const tools=el('div','spTools');
  const sel=el('select','trjSel');
  sectionsOf().forEach(s=>{ const o=el('option',null,s.norm); o.value=s.norm; if(s.norm===sec) o.selected=true; sel.appendChild(o); });
  sel.title='다른 섹션의 궤적 보기';
  sel.onchange=()=>{ S.section=sel.value; renderSide(); show('traj'); };
  tools.appendChild(sel);
  const fs=el('button','spFull', document.fullscreenElement===plate?'발표 모드 끝내기':'⛶ 발표 모드');
  fs.title='전시판만 전체 화면으로 띄운다 (Esc 로 나가기)';
  fs.onclick=()=>{ if(document.fullscreenElement){ document.exitFullscreen(); return; }
    if(plate.requestFullscreen) plate.requestFullscreen().catch(()=>{}); };
  plate.onfullscreenchange=()=>{ const on=document.fullscreenElement===plate;
    plate.classList.toggle('full',on); fs.textContent=on?'발표 모드 끝내기':'⛶ 발표 모드'; };
  tools.appendChild(fs); top.appendChild(tools); plate.appendChild(top);

  // ── 헤드라인
  const n=pr.length;
  let h3, en;
  if(half.length){ h3='「'+secS+'」, '+n+'번 중 '+half.length+'번은 절반 넘게 새로 썼다';
    en=half.length+' of '+n+' revisions rewrote more than half of this section.'; }
  else if(big.length){ h3='「'+secS+'」, 평소보다 크게 고쳐 쓴 때가 '+big.length+'번 있었다';
    en=big.length+' of '+n+' revisions rewrote well above the usual '+(med!==null?Math.round(med):'—')+'% rate.'; }
  else if(n){ h3='「'+secS+'」은 '+n+'번 내내 평소 수준으로만 고쳐 썼다';
    en='No revision in '+n+' rewrote this section much beyond its usual rate.'; }
  else { h3='「'+secS+'」 비교 중'; en=''; }
  const hl=el('div','spHead');
  hl.appendChild(el('h3',null,h3));
  const sub=[];
  if(peak) sub.push('가장 크게 바뀐 때는 '+peak.stamp+' '+peak.label+', '+Math.round(peak.rewrite)+'%를 새로 썼다'+
    (peak.line&&peak.line.text?' — '+peak.line.text:'.'));
  if(l0 && l1 && l0!==l1) sub.push('분량은 '+l0.stamp.slice(0,4)+'년 A4 '+trjPg(l0.chars)+'에서 '+l1.stamp.slice(0,4)+'년 '+trjPg(l1.chars)+
    ' ('+(l1.chars>=l0.chars?'×'+(l1.chars/l0.chars).toFixed(1):(((l1.chars-l0.chars)/l0.chars)*100).toFixed(0)+'%')+').');
  sub.forEach(t=>hl.appendChild(el('p',null,t)));
  if(en) hl.appendChild(el('p','spEn',en+(peak?' Peak '+Math.round(peak.rewrite)+'% in '+peak.stamp+'.':'')));
  plate.appendChild(hl);

  // ── 그림: 위 분량, 아래 다시 쓴 비율. 같은 가로축
  const fig=el('div','orbFig'); plate.appendChild(fig);
  const W=1000, L=46, R=100, T=30, HA=104, GAP=40, HB=176, B=46;
  const aTop=T, aBot=T+HA, bTop=aBot+GAP, bBot=bTop+HB, H=bBot+B;
  const N=rows.length, step=(W-L-R)/N, bw=Math.max(3,Math.min(24,step*.62));
  const X=i=>L+i*step+step/2;
  const idx=new Map(rows.map((r,i)=>[r.rcept,i]));
  const maxPg=Math.max(1,...lenRows.map(r=>trjPages(r.chars)));
  const niceA=(v=>{ const s=v<=4?1:v<=10?2:v<=25?5:v<=60?10:20; return Math.ceil(v/s)*s; })(maxPg*1.08);
  const YA=v=>aBot-v/niceA*(HA);
  const maxR=Math.max(0,...pr.map(r=>r.rewrite));
  const ymaxB=Math.min(100, Math.max(40, Math.ceil((maxR+8)/10)*10));
  const stepB=ymaxB<=50?10:ymaxB<=80?20:25;
  const YB=v=>bBot-Math.min(v,ymaxB)/ymaxB*HB;
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'orbSvg trjSvg',role:'img','aria-label':h3});
  const defs=svgEl('defs',{});
  defs.innerHTML='<linearGradient id="trjArea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(214,180,106,.26)"/>'+
    '<stop offset="1" stop-color="rgba(214,180,106,0)"/></linearGradient>';
  svg.appendChild(defs);
  // 연도 띠 — 두 판을 가로질러

    const t=svgEl('text',{x:L-10,y:YA(v)+4,'text-anchor':'end',class:'orbTick'}); t.textContent=v?(+v.toFixed(1))+'':'0'; ga.appendChild(t); });

    '금액·날짜 같은 숫자만 바뀐 문단은 그대로 남은 것으로 센다. 0% = 복사해 붙임, 100% = 전부 새로 씀. '+
    '평소 = 이 회사 이 섹션의 중앙값'+(med!==null?' '+Math.round(med)+'%':'')+'.'));

  const leg=el('div','orbGLeg');

    leg.appendChild(dd);

  plate.appendChild(sc);

  // ── 숫자 넷
  const kp=el('div','spKpi');
  [[big.length+'번', '평소보다 크게 고침 · 그중 절반 이상 '+half.length+'번', 'Major rewrites'],
   [peak?Math.round(peak.rewrite)+'%':'—', peak?peak.stamp+' '+peak.label:'', 'Peak rewrite'],
   [l0&&l1&&l0!==l1?'×'+(l1.chars/l0.chars).toFixed(1):'—', l0&&l1?'A4 '+trjPg(l0.chars)+' → '+trjPg(l1.chars)+' · '+(lenKind||''):'', 'Length'],
   [latest?Math.round(latest.rewrite)+'%':'—', latest?latest.stamp+' '+latest.label+' · '+latest.tier:'', 'Latest'],
  ].forEach(([b,s,sm])=>{ const k=el('div','spK'); k.appendChild(el('b',null,b)); k.appendChild(el('span',null,s));
    k.appendChild(el('small',null,sm)); kp.appendChild(k); });
  plate.appendChild(kp);

  // ── 읽어야 할 구간
  const ks=el('div','orbKeys');
  ks.innerHTML='<div class="spIdeasH">읽어야 할 구간 <em>MUST-READ REVISIONS · 다시 쓴 비율 순</em></div>';
  const ol=el('ol','orbKeyList');
  keys.forEach((r,i)=>{
    const li=el('li','orbKey'); li.dataset.r=r.rcept;
    li.appendChild(el('span','spRank',String(i+1)));
    const m=el('div','orbKeyM'), t=el('div','orbKeyT');
    t.appendChild(el('b',null,r.stamp+' '+r.label));
    const xb=el('em',null,Math.round(r.rewrite)+'%'); xb.style.setProperty('--c',ORB_PC[TRJ_C[r.tier]]); t.appendChild(xb);
    t.appendChild(el('small',null,r.tier+' · vs '+r.base_stamp));
    m.appendChild(t); m.appendChild(trjLine(r));
    li.appendChild(m);
    li.onmouseenter=()=>focus(r); li.onmouseleave=blur; li.onclick=()=>trjGo(r);
    ol.appendChild(li);
  });
  ks.appendChild(ol);
  plate.appendChild(ks);

  const ft=el('div','spFoot');
  ft.innerHTML='<span></span><b>ORBIT · 기업궤도추적</b>';
  ft.querySelector('span').textContent='출처: DART 정기보고서 원문 '+rows.length+'건의 「'+sec+'」. 사업·반기·분기보고서는 서식이 달라 '+
    '같은 종류끼리만 견줬고, 정정 공시는 뺐다. 한 줄 요약은 직전 보고서에 없던 문장에서 골랐다. 막대를 누르면 두 보고서 문단 비교.';
  plate.appendChild(ft);
}

function trjLedger(box, d){
  box.innerHTML='';
  const {rows,pr,med}=trjPrep(d);
  S.trjFilter=S.trjFilter||'all';
  const hd=el('div','orbLedH');
  const ht=el('div');
  ht.appendChild(el('h4',null,'구간별 원장 — '+d.section));
  ht.appendChild(el('p','sub','최신부터. 막대는 다시 쓴 비율(세로 눈금 = 이 섹션의 평소), 오른쪽은 직전 보고서에 없던 문장 한 줄. 줄을 누르면 두 보고서 문단 비교.'));
  hd.appendChild(ht);
  const cnt={all:rows.length, big:pr.filter(r=>r.tier==='절반 이상'||r.tier==='크게 고침').length, half:pr.filter(r=>r.tier==='절반 이상').length};
  const seg=el('div','seg');
  [['all','전체'],['big','크게 고침 이상'],['half','절반 이상']].forEach(([k,l])=>{
    const b=el('button',k===S.trjFilter?'on':'',l+' '+cnt[k]); b.onclick=()=>{ S.trjFilter=k; trjLedger(box,d); }; seg.appendChild(b); });
  hd.appendChild(seg);
  box.appendChild(hd);
  const pick=rows.filter(r=>S.trjFilter==='all' || (S.trjFilter==='big' ? (r.tier==='절반 이상'||r.tier==='크게 고침') : r.tier==='절반 이상'));
  const list=el('div','orbRows');
  const head=el('div','orbRow orbHeadRow');
  head.innerHTML='<span>시점</span><span>다시 쓴 비율 <small>눈금 = 평소</small></span><span>분량</span><span>무엇이 바뀌었나 <small>직전 보고서에 없던 문장</small></span>';
  list.appendChild(head);
  if(!pick.length) list.appendChild(el('div','empty','이 조건에 맞는 구간이 없다.'));
  pick.slice().reverse().forEach(r=>{
    const row=el('div','orbRow'+(r.tier?' t-'+TRJ_C[r.tier]:''));
    if(r.base_rcept) row.onclick=()=>trjGo(r); else row.style.cursor='default';
    const w=el('div','orbWhen');
    w.appendChild(el('b',null,r.stamp)); w.appendChild(el('span',null,r.label));
    if(r.base_stamp) w.appendChild(el('small',null,'vs '+r.base_stamp+' '+r.base_label));
    row.appendChild(w);
    const m=el('div','orbMeterCell');
    if(r.rewrite===null||r.rewrite===undefined) m.appendChild(el('span','orbPending', r.base_rcept?'비교 중…':'첫 보고서'));
    else {
      const mt=el('div','orbMeter');
      const f=el('i'); f.style.width=Math.min(100,r.rewrite)+'%'; f.style.background=ORB_AC[TRJ_C[r.tier]]; mt.appendChild(f);
      if(med!==null){ const u=el('u'); u.style.left=Math.min(100,med)+'%'; mt.appendChild(u); }
      m.appendChild(mt);
      const v=el('div','orbMeterV');
      v.appendChild(el('b',null,Math.round(r.rewrite)+'%'));
      const tt=el('span','orbTier',r.tier); tt.style.setProperty('--c',ORB_AC[TRJ_C[r.tier]]); v.appendChild(tt);
      v.appendChild(el('small',null,'유사도 '+r.sim+'%'));
      m.appendChild(v);
    }
    row.appendChild(m);
    const len=el('div','trjLen');
    len.appendChild(el('b',null,r.chars!=null?'A4 '+trjPg(r.chars):'—'));
    if(r.chars!=null && r.base_chars){
      const dp=(r.chars-r.base_chars)/r.base_chars*100;
      const s=el('span',Math.abs(dp)>=15?(dp>0?'up':'down'):'', (dp>=0?'+':'')+dp.toFixed(0)+'%'); len.appendChild(s);
    }
    row.appendChild(len);
    const what=el('div','orbWhat'); what.appendChild(trjLine(r)); row.appendChild(what);
    list.appendChild(row);
  });
  box.appendChild(list);
}

// ---------------------------------------------------------- 변경점
async function viewDiff(p){
  const c=S.co, sec=S.section;
  // 종류 칸을 고른 뒤에는 말없이 전체로 되돌리지 않는다 — 되돌리면 종류가 다시 섞인다.
  const withSec = reps().filter(r=>r.sections.some(s=>s.norm===sec));
  p.innerHTML='';
  // 첫 화면은 변곡점 — 문단 비교는 그 근거를 원문으로 확인하는 곳
  S.diffMode = S.diffMode || 'inflect';
  const modes=el('div','seg'); modes.style.marginBottom='14px';
  [['inflect','변곡점 · 구루 렌즈'],['text','문단 비교']].forEach(([k,label])=>{
    const b=el('button', k===S.diffMode?'on':'', label);
    b.onclick=()=>{ S.diffMode=k; show('diff'); };
    modes.appendChild(b);
  });
  p.appendChild(modes);
  if(S.diffMode==='inflect'){ const host=el('div'); p.appendChild(host); return viewInflect(p, host); }
  if(withSec.length<2){
    p.appendChild(el('div','empty', S.kind
      ? S.kind+' 중 「'+sec+'」 섹션이 있는 보고서가 2건 미만입니다. 왼쪽에서 다른 종류나 섹션을 골라 보세요.'
      : '이 섹션이 있는 보고서가 2건 미만입니다.'));
    return;
  }
  return viewGalley(p, c, sec, withSec);
}

// ---------------------------------------------------------- 문단 비교 — 교정지
// 두 보고서의 같은 섹션을 편집자의 교정지처럼 보여준다. 여백에 교정 표시(새로 씀·고쳐 씀·지움…),
// 고쳐 쓴 문단은 낱말 단위로 — 뺀 말은 빨간 줄, 넣은 말은 형광펜. 표 숫자 칸은 표 하나로 묶는다(서버 diff_changes).
const GAL_K={
  add:  {t:'새로 씀',  en:'INSERTED', d:'직전 보고서에 없던 문단'},
  mod:  {t:'고쳐 씀',  en:'REVISED',  d:'같은 문단을 고쳐 쓴 곳 — 바뀐 말만 표시'},
  del:  {t:'지움',    en:'DELETED',  d:'이번 보고서에서 빠진 문단'},
  num:  {t:'숫자만',  en:'FIGURES',  d:'문장은 그대로, 숫자만 갱신'},
  table:{t:'표',     en:'TABLES',   d:'표 칸 — 숫자·머리글이 바뀐 곳'},
  move: {t:'자리 이동', en:'MOVED',   d:'같은 문단이 다른 자리로 옮겨 감'},
};
const GAL_ORDER=['add','mod','del','num','table','move'];
const galNum=s=>{ if(s==null) return null; const m=String(s).replace(/,/g,'').match(/^[△▲(-]?\s*(\d+(?:\.\d+)?)/); if(!m) return null;
  const v=parseFloat(m[1]); return /^[△(-]/.test(String(s).trim())?-v:v; };

function viewGalley(p, c, sec, withSec){
  S.galHide=S.galHide||{move:true};
  const b=S.diffB && withSec.find(r=>r.rcept===S.diffB) ? S.diffB : withSec[withSec.length-1].rcept;
  // 기본 짝은 같은 종류의 직전 보고서 — 분기와 반기를 맞대면 서식 차이가 변화로 잡힌다
  const bi=withSec.findIndex(r=>r.rcept===b);
  const same=withSec.slice(0,bi).reverse().find(r=>r.label===withSec[bi].label&&!r.tag);
  const a=S.diffA && withSec.find(r=>r.rcept===S.diffA) ? S.diffA : (same||withSec[Math.max(0,bi-1)]).rcept;
  const ra=withSec.find(r=>r.rcept===a), rb=withSec.find(r=>r.rcept===b);
  const box=el('div','gal'); p.appendChild(box);

  // ── 고르는 줄
  const bar=el('div','galPick');
  const mk=cur=>{ const s=el('select'); withSec.forEach(r=>{ const o=el('option',null,r.stamp+' '+r.label+r.tag); o.value=r.rcept; if(r.rcept===cur) o.selected=true; s.appendChild(o); }); return s; };
  const sa=mk(a), sb=mk(b);
  const lab=(t,s)=>{ const w=el('label','galSel'); w.appendChild(el('span',null,t)); w.appendChild(s); return w; };
  bar.appendChild(lab('이전',sa));
  const sw=el('button','galSwap','⇄'); sw.title='앞뒤 바꾸기';
  sw.onclick=()=>{ S.diffA=sb.value; S.diffB=sa.value; show('diff'); };
  bar.appendChild(sw);
  bar.appendChild(lab('지금',sb));
  sa.onchange=sb.onchange=()=>{ S.diffA=sa.value; S.diffB=sb.value; show('diff'); };
  // 한 칸씩 — 같은 종류의 앞뒤 보고서로 함께 이동
  const idx=withSec.findIndex(r=>r.rcept===b);
  // 같은 종류끼리 한 칸씩 — 이전 쪽 보고서의 종류를 따른다
  const kin=withSec.filter(r=>r.label===ra.label&&!r.tag);
  const ki=kin.findIndex(r=>r.rcept===rb.rcept);
  const step=d=>{ if(ki<0){ const nb=withSec[idx+d], na=withSec[idx+d-1]; if(!nb||!na) return; S.diffA=na.rcept; S.diffB=nb.rcept; show('diff'); return; }
    const nb=kin[ki+d], na=kin[ki+d-1]; if(!nb||!na) return; S.diffA=na.rcept; S.diffB=nb.rcept; show('diff'); };
  const pv=el('button','galStep','← 앞 구간'); pv.disabled=ki>=0?ki<2:idx<2; pv.onclick=()=>step(-1);
  const nx=el('button','galStep','다음 구간 →'); nx.disabled=ki>=0?ki>=kin.length-1:idx>=withSec.length-1; nx.onclick=()=>step(1);
  bar.appendChild(pv); bar.appendChild(nx);
  box.appendChild(bar);
  kindNote(box);

  const holder=el('div'); box.appendChild(holder);
  holder.appendChild(el('div','galWait','교정지를 짜는 중… 긴 섹션은 몇 초 걸립니다.'));
  fetch('/api/diff?v=2&code='+c.code+'&section='+encodeURIComponent(sec)+'&a='+a+'&b='+b)
    .then(r=>r.json()).then(d=>{
      if(!box.isConnected) return;
      holder.innerHTML='';
      if(d.error){ holder.appendChild(el('div','err',d.error)); return; }
      galRender(holder, d, sec, ra, rb);
    }).catch(()=>{ holder.innerHTML=''; holder.appendChild(el('div','err','비교하지 못했습니다.')); });
}

// 낱말 단위 교정 — 뺀 말(빨간 줄) → 넣은 말(형광펜). 긴 공통부는 앞뒤만 남기고 접는다.
function galSegs(segs, into){
  const n=segs.length;
  segs.forEach(([t,x],k)=>{
    if(t==='eq'){
      const first=k===0, last=k===n-1, L=x.length;
      if(L>150){
        if(!first) into.appendChild(document.createTextNode(x.slice(0,56)));
        const e=el('span','galEl','⋯'); e.title=L+'자 그대로'; into.appendChild(e);
        if(!last) into.appendChild(document.createTextNode(x.slice(-56)));
      } else into.appendChild(document.createTextNode(x));
      return;
    }
    // 띄어쓰기만 다른 del·ins 짝은 고친 게 아니다
    if(t==='del' && segs[k+1] && segs[k+1][0]==='ins' && x.replace(/\s/g,'')===segs[k+1][1].replace(/\s/g,'')) return;
    if(t==='ins' && segs[k-1] && segs[k-1][0]==='del' && x.replace(/\s/g,'')===segs[k-1][1].replace(/\s/g,'')){ into.appendChild(document.createTextNode(x)); return; }
    if(t==='del'){ into.appendChild(el('del','galDel',x)); if(segs[k+1]&&segs[k+1][0]==='ins') into.appendChild(el('span','galArr','→')); }
    else into.appendChild(el('ins','galIns',x));
  });
}

function galRender(holder, d, sec, ra, rb){
  const st=d.stats, cards=d.cards;

  const hd=el('div','galHead');

  if(st.del) parts.push('지운 문단 '+st.del);
  const tail=[];
  if(st.num) tail.push('숫자만 바뀐 문장 '+st.num);
  if(st.cells) tail.push('표 칸 '+st.cells+'곳');

    ' 두 섹션의 문단 '+d.similarity+'%가 같다'+(st.ws?' (띄어쓰기만 고친 '+st.ws+'곳은 뺐다)':'')+'.'));
  holder.appendChild(hd);

  // ── 교정 막대 — 종류별 분량. 누르면 그 종류만 켜고 끈다

  GAL_ORDER.forEach(k=>{
    const n=cnt(k)||0; if(!n) return;
    const w=(k==='table'?Math.min(st.cells,40):n)/total*100;
    const s=el('i','k-'+k); s.style.width=w+'%'; s.title=GAL_K[k].t+' '+n; strip.appendChild(s);
    const ch=el('button','galChip k-'+k+(S.galHide[k]?' off':''));
    ch.innerHTML='<i></i><b></b><em></em>';
    ch.querySelector('b').textContent=GAL_K[k].t; ch.querySelector('em').textContent=n+(k==='table'?'칸':'');
    ch.title=GAL_K[k].d+(S.galHide[k]?' — 눌러서 보이기':' — 눌러서 숨기기');
    ch.onclick=()=>{ S.galHide[k]=!S.galHide[k]; ch.classList.toggle('off',!!S.galHide[k]); apply(); };
    chips.appendChild(ch);
  });
  bars.appendChild(strip); bars.appendChild(chips);
  holder.appendChild(bars);

  // ── 핵심 변화 셋
  if(d.top.length){
    const key=el('div','galKey');
    key.appendChild(el('div','galKeyH','가장 무거운 변화'));
    const ol=el('ol');
    d.top.forEach(id=>{
      const cd=cards[id]; const li=el('li','k-'+cd.k);
      const m=el('div','m');
      const tg=el('div','tg'); tg.appendChild(el('span','kd',GAL_K[cd.k].t)); (cd.tags||[]).slice(0,3).forEach(t=>tg.appendChild(el('span',tagClass(t),t))); m.appendChild(tg);
      let ex='';
      if(cd.k==='add') ex=cd.text;
      else { const ins=cd.segs.filter(s=>s[0]==='ins').map(s=>s[1].trim()).filter(Boolean);
        const big=ins.filter(x=>x.length>=14); ex=(big.length?big:ins).join(' … '); }
      m.appendChild(el('p',null,ex.length>170?ex.slice(0,170)+'…':ex));
      if(cd.head) m.appendChild(el('small',null,'§ '+cd.head));
      li.appendChild(m);
      li.onclick=()=>jumpTo(id);
      ol.appendChild(li);
    });
    key.appendChild(ol);
    holder.appendChild(key);
  }

  // ── 교정지 본문 | 미니맵
  const body=el('div','galBody');
  const sheet=el('div','galSheet');
  const map=el('div','galMap');
  const mapIn=el('div','galMapIn'); map.appendChild(mapIn);
  map.appendChild(el('span','galMapT','처음'));
  map.appendChild(el('span','galMapB','끝'));
  const nodes=[];
  let lastHead=null;
  cards.forEach(cd=>{
    if(cd.head!==lastHead){ lastHead=cd.head; if(cd.head){ const h=el('div','galSec'); h.dataset.k=''; h.appendChild(el('span','sig','§')); h.appendChild(document.createTextNode(cd.head)); sheet.appendChild(h); nodes.push({h, cd:null}); } }
    const card=el('div','galCard k-'+cd.k+(d.top.includes(cd.id)?' key':'')); card.id='gal_'+cd.id;
    const mg=el('div','galMargin');
    mg.appendChild(el('b',null,GAL_K[cd.k].t));
    if(cd.k==='mod') mg.appendChild(el('small',null,'그대로 '+cd.keep+'%'));
    if(cd.k==='table') mg.appendChild(el('small',null,cd.n+'칸'));
    if(d.top.includes(cd.id)) mg.appendChild(el('span','star','¶'+(d.top.indexOf(cd.id)+1)));
    card.appendChild(mg);
    const tx=el('div','galTxt');
    if(cd.tags&&cd.tags.length){ const tg=el('div','tg'); cd.tags.slice(0,3).forEach(t=>tg.appendChild(el('span',tagClass(t),t))); tx.appendChild(tg); }
    if(cd.k==='mod'||cd.k==='num'){
      const pp=el('p'); galSegs(cd.segs, pp); tx.appendChild(pp);
      const nChg=cd.segs.filter(s=>s[0]!=='eq').length;
      if(cd.k==='mod' && nChg>=4){ const t=el('button','galMini','새 문장만'); t.onclick=()=>{ card.classList.toggle('newonly'); t.textContent=card.classList.contains('newonly')?'고친 자국 보기':'새 문장만'; }; tx.appendChild(t); }
    } else if(cd.k==='table'){
      const tb=el('table','galTbl');
      tb.innerHTML='<tr><th>항목</th><th>이전</th><th>지금</th><th>변화</th></tr>';
      const rows=cd.items;
      rows.forEach((it,i)=>{
        const tr=el('tr', i>=8?'more':null);
        tr.appendChild(el('td','l',it.lab||'—'));
        tr.appendChild(el('td','n a',it.a==null?'—':it.a));
        tr.appendChild(el('td','n b',it.b==null?'—':it.b));
        const va=galNum(it.a), vb=galNum(it.b);
        const pc=(va!=null&&vb!=null&&va!==0&&!/%$/.test(String(it.b).trim()))?(vb/va-1)*100:null;
        const td=el('td','n c'+(pc==null?'':pc>0?' up':pc<0?' dn':''), pc==null?(it.a==null?'새 칸':it.b==null?'빠짐':''):(pc>0?'+':'')+pc.toFixed(pc>=100||pc<=-100?0:1)+'%');
        tr.appendChild(td); tb.appendChild(tr);
      });
      tx.appendChild(tb);
      if(rows.length>8||cd.n>rows.length){ const t=el('button','galMini','나머지 '+(cd.n-8)+'칸 펼치기'); t.onclick=()=>{ card.classList.toggle('open'); t.textContent=card.classList.contains('open')?'접기':'나머지 '+(cd.n-8)+'칸 펼치기'; }; tx.appendChild(t); }
    } else {
      const long=cd.text.length>520;
      const pp=el('p',long?'clamp':null,cd.text); tx.appendChild(pp);
      if(long){ const t=el('button','galMini','전부 읽기'); t.onclick=()=>{ pp.classList.toggle('clamp'); t.textContent=pp.classList.contains('clamp')?'전부 읽기':'접기'; }; tx.appendChild(t); }
    }
    card.appendChild(tx);
    sheet.appendChild(card);
    // 미니맵 눈금
    const tick=el('i','k-'+cd.k+(d.top.includes(cd.id)?' key':'')); tick.style.top=(cd.pos*100)+'%';
    tick.title=GAL_K[cd.k].t+(cd.head?' · '+cd.head:''); tick.onclick=()=>jumpTo(cd.id);
    mapIn.appendChild(tick);
    nodes.push({card, cd, tick});
  });
  if(!cards.length) sheet.appendChild(el('div','galWait','두 보고서의 이 섹션이 같다.'));
  body.appendChild(sheet); body.appendChild(map);
  holder.appendChild(body);
  holder.appendChild(el('p','galFoot','읽는 법 — 여백의 표시가 교정 종류다. 빨간 줄은 뺀 말, 형광펜은 넣은 말, ⋯ 는 그대로인 긴 문장을 접은 자리. '+
    '오른쪽 띠는 섹션 전체에서 변화가 있는 자리(누르면 이동, 키보드 j·k 로 다음·이전). 표는 칸마다 한 줄로 들어와 소제목별로 묶었다 — 기간이 한 칸씩 밀려 모든 숫자가 바뀐 것처럼 보이는 표도 있다.'));

  function jumpTo(id){ const e=document.getElementById('gal_'+id); if(!e) return;
    if(e.classList.contains('hide')){ const k=cards[id].k; S.galHide[k]=false; holder.querySelectorAll('.galChip.k-'+k).forEach(x=>x.classList.remove('off')); apply(); }
    e.scrollIntoView({behavior:'smooth',block:'center'}); e.classList.remove('flash'); void e.offsetWidth; e.classList.add('flash'); }
  function apply(){
    nodes.forEach(n=>{ if(n.cd){ const h=!!S.galHide[n.cd.k]; n.card.classList.toggle('hide',h); n.tick.classList.toggle('hide',h); } });
    // 보이는 카드가 없는 소제목은 숨긴다
    nodes.forEach((n,i)=>{ if(n.cd) return; let any=false; for(let j=i+1;j<nodes.length&&nodes[j].cd;j++) if(!S.galHide[nodes[j].cd.k]){ any=true; break; } n.h.classList.toggle('hide',!any); });
  }
  apply();
  // 키보드 — j 다음, k 이전 (보이는 카드만)
  const vis=()=>nodes.filter(n=>n.cd&&!S.galHide[n.cd.k]).map(n=>n.card);
  let cur=-1;
  const key=ev=>{
    if(!holder.isConnected){ document.removeEventListener('keydown',key); return; }
    if(/INPUT|SELECT|TEXTAREA/.test((ev.target&&ev.target.tagName)||'')) return;
    if(ev.key!=='j'&&ev.key!=='k') return;
    const v=vis(); if(!v.length) return;
    cur=ev.key==='j'?Math.min(v.length-1,cur+1):Math.max(0,cur-1);
    const t=v[cur]; t.scrollIntoView({behavior:'smooth',block:'center'}); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash');
  };
  document.addEventListener('keydown',key);
}

function infSpark(vals, w, h){
  w=w||120; h=h||30;
  const svg=svgEl('svg',{viewBox:'0 0 '+w+' '+h,class:'infspark'});
  const v=(vals||[]).map(x=>x===null||x===undefined?null:+x);
  const ok=v.filter(x=>x!==null);
  if(ok.length<2) return svg;
  let lo=Math.min(0,...ok), hi=Math.max(0,...ok); if(hi===lo) hi=lo+1;
  const X=i=>2+i*(w-4)/Math.max(v.length-1,1), Y=x=>h-3-(x-lo)/(hi-lo)*(h-6);
  if(lo<0&&hi>0) svg.appendChild(svgEl('line',{x1:0,x2:w,y1:Y(0),y2:Y(0),stroke:'var(--line)','stroke-width':1}));
  let d='', pen=false;
  v.forEach((x,i)=>{ if(x===null){ pen=false; return; } d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(x).toFixed(1)+' '; pen=true; });
  svg.appendChild(svgEl('path',{d,fill:'none',stroke:'var(--accent)','stroke-width':1.6,'stroke-linejoin':'round','stroke-linecap':'round'}));
  const li=v.length-1-[...v].reverse().findIndex(x=>x!==null);
  svg.appendChild(svgEl('circle',{cx:X(li),cy:Y(v[li]),r:2.4,fill:'var(--accent)'}));
  return svg;
}

// 타임라인 — 해마다 5갈래. 점을 누르면 아래 카드로 간다.
function infTimeline(d){
  const box=el('div','infcard inftl');
  box.appendChild(el('div','infsec','변곡점 타임라인 <small>점 하나 = 사건 하나 · 색 = 좋아짐 / 나빠짐 / 경고 / 전환</small>'));
  box.firstChild.innerHTML='변곡점 타임라인 <small>점 하나 = 사건 하나 · 색은 좋아짐 · 나빠짐 · 경고 · 전환</small>';
  const ev=d.events||[];
  const y0=d.years?d.years[0]:2011, y1=(d.years?d.years[1]:2025)+1;
  const W=1000, H=36+INF_LANES.length*34+26, L=96, R=16, T=18;
  const X=v=>L+(v-y0)/(y1-y0+0.0001)*(W-L-R);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'inftlsvg'});
  for(let y=y0;y<=y1;y++){
    svg.appendChild(svgEl('line',{x1:X(y),x2:X(y),y1:T,y2:H-26,stroke:'var(--line2)'}));
    if((y-y0)%2===0||y===y1){ const tx=svgEl('text',{x:X(y),y:H-8,'text-anchor':'middle',class:'inftlax'}); tx.textContent=String(y); svg.appendChild(tx); }
  }
  INF_LANES.forEach((Ln,i)=>{
    const cy=T+14+i*34;
    svg.appendChild(svgEl('line',{x1:L,x2:W-R,y1:cy,y2:cy,stroke:'var(--line)','stroke-dasharray':'2 4'}));
    const lb=svgEl('text',{x:L-10,y:cy+4,'text-anchor':'end',class:'inftllane'}); lb.textContent=Ln.k; svg.appendChild(lb);
    // 같은 해·같은 갈래에 여러 개면 살짝 옆으로
    const mine=ev.filter(e=>e.lane===Ln.k);
    const slot={};
    mine.forEach(e=>{
      const m=+(e.stamp||'').slice(5,7)||12;
      const fy=(e.year||y0)+(m-1)/12;

      pr.appendChild(el('span',null,'처음 한 번만 걸립니다. 결과는 저장됩니다.'));
      progBox.appendChild(pr);
      if(!drawn){ askPlate(plate,d,c,true,W); drawn=true; }
      if(S.findAsk||S.findQ) start(null);
      setTimeout(tick,1200); return;
    }
    if(d.error){ plate.innerHTML=''; plate.appendChild(el('div','orbWait','질문 지도를 만들지 못했습니다 — '+d.error)); start(null); return; }
    ASK_LAST=d;
    askPlate(plate,d,c,first,W); first=false;
    W.sync();
    start(d);
  }
  tick();
}

function askStText(q){
  if(!q) return '…';
  switch(q.status){
    case 'new': return '새 답 '+q.n_recent+(q.usual?' / 평소 '+q.usual:'');
    case 'first': return '처음 등장 '+q.first.stamp.slice(2);
    case 'usual': return '평소만큼 '+q.n_recent;
    case 'dropped': return '빠진 말 '+q.n_drop;
    case 'gone': return '언급 끊김';
    case 'none': return '말한 적 없음';
  }
  return q.last_sig ? "'"+q.last_sig.stamp.slice(2,4)+' 이후 조용' : '조용';
}

function askStrip(q,d){
  const n=q.counts.length, W=156, H=22, cw=W/Math.max(1,n);
  const mx=Math.max(1,...q.counts), rf=d.recent_from;
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'askStrip'});
  svg.appendChild(svgEl('rect',{x:rf*cw,y:0,width:Math.max(0,W-rf*cw),height:H,class:'rc'}));
  svg.appendChild(svgEl('line',{x1:0,x2:W,y1:H-.5,y2:H-.5,class:'base'}));
  q.counts.forEach((v,i)=>{ if(!v) return; const h=Math.max(1.5,Math.sqrt(v/mx)*(H-8));
    svg.appendChild(svgEl('rect',{x:i*cw+cw*.15,y:H-h,width:Math.max(1,cw*.7),height:h,class:'c'+(i>=rf?' r':'')})); });
  q.marks.forEach((v,i)=>{ if(v) svg.appendChild(svgEl('circle',{cx:i*cw+cw/2,cy:2.6,r:Math.min(2.8,1.7+v*.35),class:'m'})); });
  return svg;
}

}

    d.came.forEach(x=>{

      b.title=x.first+'부터 · 최근 '+x.n+'건의 「사업의 내용」·「경영진단」에 나옴 — 누르면 족보';

    '「평소」 = 지난 해들의 새 답 개수 중앙값. 원탁 백테스트(정기보고서 513건)에서 공시 뒤에도 값에 덜 든 채 남은 건 새 문장뿐이었다 — 그래서 새 말을 질문별로 가른다.</span><b>QUESTIONS · '+total+'</b>';
  plate.appendChild(ft);

function askWork(work, c){
  work.innerHTML='';
  const bar=el('div','askBar');
  const inp=el('input'); inp.type='text';
  inp.placeholder='직접 찾기 — 예: HBM, 가동률, 소송  (쉼표 = 또는 · 띄어쓰기 무시)';
  inp.value=S.findAsk?'':(S.findQ||'');
  const selS=el('select');
  selS.appendChild(Object.assign(el('option',null,'전체 섹션'),{value:''}));
  c.sections.forEach(s=>{ const o=el('option',null,s.norm); o.value=s.norm; if(s.norm===S.findSec) o.selected=true; selS.appendChild(o); });
  const go=el('button','go','찾기');
  bar.appendChild(inp); bar.appendChild(selS); bar.appendChild(go); work.appendChild(bar);
  work.appendChild(el('p','askHint','질문을 누르거나 낱말을 넣으면 걸린 문장을 족보로 묶어 여기 펼칩니다 — 언제 처음 썼고, 어떻게 고쳐 썼고, 언제 뺐는지.'+
    (S.kind?' 지금은 '+S.kind+'만 봅니다.':'')));
  const out=el('div'); work.appendChild(out);
  out.appendChild(el('div','linEmpty','질문 지도를 다 펼치면 가장 무거운 질문이 여기 먼저 열립니다.'));
  let seq=0;
  const mark=()=>document.querySelectorAll('.askRow,.askSpotI').forEach(r=>r.classList.toggle('on', !!S.findAsk && r.dataset.q===S.findAsk));
  async function load(url){
    const my=++seq;
    out.innerHTML=''; out.appendChild(el('div','loading','15년치 본문에서 같은 문장을 이어 족보를 만드는 중…'));
    let d;
    try{ d=await (await fetch(url)).json(); }catch(e){ d={error:'불러오지 못했습니다'}; }
    if(my!==seq) return;
    out.innerHTML='';
    if(d.error){ out.appendChild(el('div','err',d.error)); return; }
    linRender(out, d, c);
  }
  const W={
    ask(id, scroll){
      S.findAsk=id; S.findQ=''; inp.value=''; mark();
      load('/api/lineage?code='+c.code+'&ask='+encodeURIComponent(id)+labelsParam());
      if(scroll) work.scrollIntoView({behavior:'smooth',block:'start'});
    },
    text(q, sec, scroll){
      q=(q||'').trim(); if(!q) return;
      S.findAsk=null; S.findQ=q; S.findSec=sec||''; inp.value=q; selS.value=S.findSec; mark();
      load('/api/lineage?code='+c.code+'&q='+encodeURIComponent(q)+(S.findSec?'&section='+encodeURIComponent(S.findSec):'')+labelsParam());
      if(scroll) work.scrollIntoView({behavior:'smooth',block:'start'});
    },
    sync(){ mark(); }
  };
  go.onclick=()=>W.text(inp.value, selS.value);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') W.text(inp.value, selS.value); });
  return W;
}

function linPrevSame(R,i){ for(let j=i-1;j>=0;j--) if(R[j].label===R[i].label) return j; return null; }

function linMark(node,text,rx){
  if(!rx){ node.textContent=text; return; }
  rx.lastIndex=0; let last=0, m, k=0;
  while((m=rx.exec(text)) && k<60){
    if(!m[0]){ rx.lastIndex++; continue; }
    node.appendChild(document.createTextNode(text.slice(last,m.index)));
    node.appendChild(el('mark',null,m[0]));
    last=m.index+m[0].length; k++;
  }
  node.appendChild(document.createTextNode(text.slice(last)));
}

function linLife(f,n){
  const W=160, H=10, cw=W/Math.max(1,n);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'linLife'});
  const occ=new Set(f.occ);
  for(let i=0;i<n;i++) svg.appendChild(svgEl('rect',{x:i*cw,y:0,width:Math.max(.8,cw-.8),height:H,rx:1,
    class:occ.has(i)?(i===f.born?'o b':'o'):'x'}));
  return svg;
}

function linTimeline(d){
  const R=d.reports, n=R.length, W=1000, H=132, L=36, RR=10, T=24, B=26;
  const tl=d.timeline, mx=Math.max(1,...tl), rf=d.recent_from;
  const step=(W-L-RR)/n, bw=Math.max(2,Math.min(16,step*.62));
  const X=i=>L+i*step+step/2, Y=v=>H-B-(v/mx)*(H-T-B);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,role:'img','aria-label':'보고서별로 걸린 횟수와 새 문장'});
  svg.appendChild(svgEl('rect',{x:L+rf*step,y:T-14,width:Math.max(0,W-RR-(L+rf*step)),height:H-B-T+14,class:'rc'}));
  const rc=svgEl('text',{x:W-RR-4,y:T-3,'text-anchor':'end',class:'cap'}); rc.textContent='최근 1년'; svg.appendChild(rc);
  svg.appendChild(svgEl('line',{x1:L,x2:W-RR,y1:H-B+.5,y2:H-B+.5,class:'base'}));
  const ym=svgEl('text',{x:L-6,y:T+4,'text-anchor':'end',class:'ax'}); ym.textContent=fmt(mx); svg.appendChild(ym);
  if(d.first!==null && d.first!==undefined){
    const x=X(d.first);
    svg.appendChild(svgEl('line',{x1:x,x2:x,y1:T-8,y2:H-B,class:'base','stroke-dasharray':'2 3'}));
    const t=svgEl('text',{x:x+4,y:T-3,class:'cap'}); t.textContent='첫 등장 '+R[d.first].stamp; svg.appendChild(t);
  }
  tl.forEach((v,i)=>{ if(!v) return; const y=Y(v);
    const r=svgEl('rect',{x:X(i)-bw/2,y,width:bw,height:Math.max(1,H-B-y),rx:1.5,class:'lb'+(i>=rf?' r':'')});
    const t=svgEl('title',{}); t.textContent=R[i].stamp+' '+R[i].label+' · '+v+'회'+(d.births[i]?' · 새 문장 '+d.births[i]+'개':''); r.appendChild(t);
    svg.appendChild(r); });
  d.births.forEach((v,i)=>{ if(!v || i<d.base_end) return;
    const c=svgEl('circle',{cx:X(i),cy:Y(tl[i])-7,r:Math.min(5.5,2.4+Math.sqrt(v)),class:'dot'});
    const t=svgEl('title',{}); t.textContent=R[i].stamp+' 새 문장 '+v+'개'; c.appendChild(t); svg.appendChild(c); });
  let lastY='', lastX=-99;
  R.forEach((r,i)=>{ const y=r.stamp.slice(0,4); if(y===lastY) return; lastY=y; const x=X(i); if(x-lastX<30) return; lastX=x;
    const t=svgEl('text',{x,y:H-8,'text-anchor':'middle',class:'ax'}); t.textContent="'"+y.slice(2); svg.appendChild(t); });
  const w=el('div','linTL'); w.appendChild(svg); return w;
}

function linCard(f,R,rx,c,g){
  const card=el('div','linCard g-'+g+(f.table?' tab':''));
  const w=el('div','linWhen'), b=R[f.born], l=R[f.last];
  if(g==='gone' && f.dead!==null){ w.appendChild(el('b',null,b.stamp+' → '+l.stamp));
    w.appendChild(el('span',null,R[f.dead].stamp+' '+R[f.dead].label+'에서 빠짐')); }
  else if(g==='new'){ w.appendChild(el('b',null,b.stamp+' 처음'));
    w.appendChild(el('span',null,b.label+(f.n>1?' · 이후 '+(f.n-1)+'건 더':''))); }
  else { w.appendChild(el('b',null,b.stamp+' → '+l.stamp)); w.appendChild(el('span',null,'보고서 '+f.n+'건')); }
  w.appendChild(el('span',null,f.sec_s));
  w.appendChild(linLife(f,R.length));
  card.appendChild(w);
  const body=el('div');
  const tx=el('div','linTxt'); linMark(tx,f.text,rx); body.appendChild(tx);
  if(f.edits && f.edits.length){
    const ed=el('div','linEd');
    f.edits.forEach(e=>{ const r=el('div'); r.appendChild(el('span','s',R[e.ri].stamp));
      e.add.forEach(t=>r.appendChild(el('span','a','+'+t))); (e.rm||[]).forEach(t=>r.appendChild(el('span','r',t))); ed.appendChild(r); });
    body.appendChild(ed);
  }
  if(f.nums && f.nums.length>1){
    const nb=el('div','linNums');
    f.nums.forEach(([ri,v],k)=>{ if(k) nb.appendChild(el('i',null,'→'));
      const s=el('span'); s.appendChild(el('small',null,R[ri].stamp.slice(2))); s.appendChild(document.createTextNode(v.join(' · '))); nb.appendChild(s); });
    body.appendChild(nb);
  }
  const act=el('div','linAct');
  const b1=el('button',null,'본문에서 보기');
  b1.onclick=()=>{ S.lastRead={rcept:R[f.last].rcept, file:f.file, hi:f.table?null:f.text}; jump('read'); };
  act.appendChild(b1);
  const tgt = g==='gone' && f.dead!==null ? f.dead : g==='new' ? f.born : f.last;
  const prev = linPrevSame(R,tgt);
  if(prev!==null){
    const b2=el('button',null,(g==='gone'?'빠진 때':g==='new'?'처음 나온 때':'최신')+' 문단 비교 ('+R[prev].stamp+' ↔ '+R[tgt].stamp+')');
    b2.onclick=()=>{ S.section=f.sec; S.diffA=R[prev].rcept; S.diffB=R[tgt].rcept; S.diffMode='text'; renderSide(); jump('diff'); };
    act.appendChild(b2);
  }
  body.appendChild(act);
  card.appendChild(body);
  return card;
}

  if(!L.length) return;
