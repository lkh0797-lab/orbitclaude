  if(L.length>lim){
    const det=el('details','linMore');
    det.appendChild(el('summary',null, lim ? '나머지 '+(L.length-lim)+'개 더 보기' : L.length+'개 펼치기'));
    det.addEventListener('toggle',()=>{ if(det.open && det.children.length===1)
      L.slice(lim, lim+80).forEach(f=>det.appendChild(linCard(f,R,rx,c,key==='table'?'moved':key))); });
    grp.appendChild(det);
  }
  out.appendChild(grp);
}

function linRender(out, d, c){
  const R=d.reports||[], n=R.length;
  const m=d.ask ? (ASK_META_JS||[]).find(x=>x.id===d.ask) : null;
  let rx=null; try{ rx=new RegExp(d.rx,'gi'); }catch(e){ rx=null; }
  const hc=el('div','linHead');
  const k=el('div','k');
  if(m){
    const th=(ASK_THEMES_JS||[]).find(t=>t[0]===m.th);
    k.appendChild(el('span',null,(th?th[1]+' · '+th[2]+' · ':'')+m.who+'의 질문'));
    k.appendChild(el('span','linClk '+m.clock, ASK_ST_CLK[m.clock][0]+' — '+ASK_ST_CLK[m.clock][1]));
  } else k.appendChild(el('span',null,'직접 찾기 · 문장 족보'));
  hc.appendChild(k);
  hc.appendChild(el('h4',null, m ? m.q : '「'+(d.terms||[]).join('」 또는 「')+'」'));
  if(m){
    hc.appendChild(el('p',null,m.why+' 찾는 곳: '+m.secs.join(' · ')+'.'));
    const gb=el('div','linGB');
    [['g','좋은 답',m.good],['b','나쁜 답',m.bad]].forEach(([kk,t,v])=>{ const x=el('div',kk); x.appendChild(el('span',null,t)); x.appendChild(document.createTextNode(v)); gb.appendChild(x); });
    hc.appendChild(gb);
  } else {
    hc.appendChild(el('p',null,'띄어쓰기를 무시하고 찾았다'+((d.extra||[]).length?' — 같은 뜻으로 갈라 쓰는 말('+d.extra.join(', ')+')도 함께':'')+
      '. 숫자·기간 낱말만 다른 문장은 한 족보로 묶었다.'));
  }
  out.appendChild(hc);
  if(d.first===null || d.first===undefined){
    out.appendChild(el('div','linEmpty', m
      ? '이 회사 보고서는 '+(n?R[0].stamp.slice(0,4)+'년 이후 ':'')+'이 질문에 답한 적이 없다. '+(m.clock==='risk'?'꼬리 위험 질문이라면 좋은 소식이다.':'공시하지 않는 것 자체가 정보일 수 있다 — 같은 업종의 다른 회사와 견줘 보라.')
      : '이 말은 보고서에 한 번도 나오지 않았다.'));
    return;
  }
  out.appendChild(linTimeline(d));
  const G={new:[],moved:[],gone:[],steady:[]}; (d.families||[]).forEach(f=>G[f.g].push(f));
  const sum=el('div','linSum');
  const add=(v,t)=>{ const s=el('span'); s.appendChild(el('b',null,String(v))); s.appendChild(document.createTextNode(t)); sum.appendChild(s); };
  add(R[d.first].stamp,' 첫 등장');
  add(d.timeline.filter(v=>v).length+'/'+n,' 보고서에 나옴');
  add(fmt(d.timeline.reduce((a,b)=>a+b,0)),'회 걸림');
  add(d.n_families,'종 문장');
  add(G.new.length,' 새로 생김'); add(G.moved.length,' 움직임'); add(G.gone.length,' 사라짐');
  out.appendChild(sum);
  if((d.came||[]).length){
    const cw=el('div','linCame'); cw.appendChild(el('span',null,'최근 1년 이 말 곁에 처음 붙은 말 →'));
    d.came.forEach(x=>{ const b=el('button',null,x.t); b.title='최근 1년 '+x.n+'문장에서'; b.onclick=()=>ASK_W && ASK_W.text(x.t,'',true); cw.appendChild(b); });
    out.appendChild(cw);
  }
  if(!(d.families||[]).length) out.appendChild(el('div','linEmpty','문장으로 쓰인 곳은 없고 표 칸에만 나온다.'));
  linGroup(out,'new',G.new,R,rx,c,10);
  linGroup(out,'moved',G.moved,R,rx,c,8);
  linGroup(out,'gone',G.gone,R,rx,c,6);
  linGroup(out,'table',(d.tables||[]).filter(f=>f.nums),R,rx,c,4);
  linGroup(out,'steady',G.steady,R,rx,c,0);
}

// ---------------------------------------------------------- 풍경 (Exhibit 07)
// 버핏과 린치는 한 회사의 보고서를 수십 년치 처음부터 읽는다. 그렇게 읽은 사람에게 보이는 것을 한 장에:
// 풍경(어떤 유형으로 살아왔나 · 주가는 이익을 따라갔나) · 안목(이 회사의 15년이 가르치는 규칙) · 결단(그들의 조건과 지금).
// 서버 landscape_build — 주당 값은 액면분할·무상증자를 연말 주식 수로 역산해 오늘 기준으로 맞춘다.
const LS_TC={고성장:'#199e70', 대형우량:'#3987e5', 경기순환:'#d95926', 저성장:'#8b95a3', 회생:'#d6b46a', 적자:'#e5534b'};
const LS_VER={결단:'go', 기다림:'wait', 관찰:'wait', '정점 경계':'wait', 비쌈:'wait', '너무 어려움':'stop', 지나침:'stop'};
const lsPct=(v,d=0)=>v===null||v===undefined?'—':(v>=0?'+':'')+v.toFixed(d)+'%';
const lsD=s=>s? s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8):'—';
const lsT=s=>Date.UTC(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8));

async function viewLand(p){
  const c=S.co, code=c.code;
  p.innerHTML='';
  const progBox=el('div'); p.appendChild(progBox);
  const plate=el('section','synplate orbplate lsplate'); p.appendChild(plate);
  plate.appendChild(el('div','orbWait','15년치 원장과 주가를 한 장에 펴는 중…'));
  const led=el('div','lsLed'); p.appendChild(led);
  async function tick(){
    if(S.tab!=='land' || !S.co || S.co.code!==code || !p.contains(plate)) return;
    let d;
    try{ d=await (await fetch('/api/landscape?code='+code)).json(); }
    catch(e){ setTimeout(tick,2500); return; }
    progBox.innerHTML='';
    if(d.pending){
      const pr=el('div','prog'); pr.appendChild(el('span',null,'풍경을 그리는 중 · '+(d.step||'')));
      pr.appendChild(el('span',null,'처음 한 번만 걸립니다. 하루 한 번 주가만 새로 붙입니다.'));
      progBox.appendChild(pr); setTimeout(tick,1000); return;
    }
    if(d.error){ plate.innerHTML=''; plate.appendChild(el('div','orbWait',d.error)); return; }
    lsPlate(plate,d,c,true);
    lsLedger(led,d);
  }
  tick();
}

  const gmax=Math.max(...(d.gaps||[]).map(g=>g.gap)), gmin=Math.min(...(d.gaps||[]).map(g=>g.gap));
  if(gapNow!==null && fol && (gapNow>=gmax || gapNow<=gmin) && Math.abs(gapNow)>=40) p1+='그런데 지금은 15년 들어 이익선에서 가장 멀리 '+(gapNow>0?'위로':'아래로')+' 떨어져 있다. ';
  if(gapNow!==null) p1+='지금 '+won(dc.px)+'원은 최근 4분기 이익으로 그은 이익선 '+won(lineNow)+'원보다 '+Math.abs(gapNow).toFixed(0)+'% '+(gapNow>=0?'위':'아래')+
    (dc.pct!==null&&dc.pct!==undefined?' — PER '+dc.per.toFixed(1)+'배, 자기 역사 하위 '+dc.pct.toFixed(0)+'% 자리.':'.');
  hl.appendChild(el('p',null,p1));

  hl.appendChild(el('p','spEn','Fifteen years of filings in one frame: the kind of company it has been, whether price followed earnings, and when Buffett’s and Lynch’s conditions lined up.'));

    '<span><i style="border-color:rgba(214,180,106,.5);border-top-width:8px"></i>값 띠 '+(d.band.lo?d.band.lo.toFixed(1)+'–'+d.band.hi.toFixed(1)+'배':'')+' (자기 역사 PER 25–75%)</span>'+
    '<span><b style="background:#d6b46a">B</b>버핏 조건이 맞은 때</span><span><b style="background:#4fc3a1">L</b>린치 조건이 맞은 때</span>'+

    'B·L 은 그 분기 보고서 접수일에 그때까지 알 수 있던 숫자로만 조건을 따졌다. 한 회사 15년의 기록이라 표본이 작다 — 규칙이 맞았는지보다 이 회사가 어떻게 움직이는 회사인지를 보라. '+
    '반영 시계 검증에서 자기 역사 대비 값의 위치는 6–12개월 수익률과 약한 음(−)의 상관이었다.</span><b>LONG VIEW</b>';
  plate.appendChild(ft);

function lsChart(fig, d, plate){
  const W=1000, L=58, RR=118, T=42, H1=300, GAP=40, H2=66, B=28;
  const pTop=T, pBot=T+H1, rTop=pBot+GAP, rBot=rTop+H2, H=rBot+B;
  const R=d.rows, M=d.monthly||[], LN=d.line||[];
  const t0=Date.UTC(R[0].year,0,1), t1=Math.max(M.length?lsT(M[M.length-1].d):0, Date.UTC(R[R.length-1].year,11,31));
  const X=t=>L+(t-t0)/(t1-t0)*(W-L-RR);
  const vals=[...M.map(m=>m.p), ...LN.filter(x=>x.lo).flatMap(x=>[x.lo,x.hi])].filter(v=>v>0);
  let lo=Math.min(...vals), hi=Math.max(...vals);
  const pad=(Math.log(hi)-Math.log(lo))*.06||.1;
  const l0=Math.log(lo)-pad, l1=Math.log(hi)+pad;
  const Y=v=>pBot-(Math.log(v)-l0)/(l1-l0)*H1;
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'lsSvg',role:'img','aria-label':'주가와 이익선, 유형의 장(章), 결단 시점'});

  // 장(章) 띠
  const gch=svgEl('g',{});
  (d.chapters||[]).forEach((ch,i)=>{
    const last=i===(d.chapters||[]).length-1;
    const a=Math.max(X(Date.UTC(ch.y0,0,1)),L), b=last ? W-RR : Math.min(X(Date.UTC(ch.y1,11,31)),W-RR);
    if(b<=a) return;
    const col=LS_TC[ch.type]||'#8b95a3';
    const r=svgEl('rect',{x:a,y:pTop-26,width:b-a,height:rBot-pTop+26,class:'lsBand'}); r.setAttribute('fill',col); gch.appendChild(r);
    if(i) gch.appendChild(svgEl('line',{x1:a,x2:a,y1:pTop-26,y2:rBot,class:'lsDiv'}));
    if(b-a>46){
      const t=svgEl('text',{x:(a+b)/2,y:pTop-12,'text-anchor':'middle',class:'lsChap'}); t.textContent=ch.type; t.setAttribute('fill',col); gch.appendChild(t);
      const s=svgEl('text',{x:(a+b)/2,y:pTop-1,'text-anchor':'middle',class:'lsChapY'}); s.textContent=ch.y0===ch.y1?String(ch.y0):"'"+String(ch.y0).slice(2)+"–'"+String(ch.y1).slice(2); gch.appendChild(s);
    }
  });
  svg.appendChild(gch);

  // 격자(로그)
  const gg=svgEl('g',{class:'lsGrid'});
  const ticks=[];
  for(let e=Math.floor(Math.log10(Math.exp(l0))); e<=Math.ceil(Math.log10(Math.exp(l1))); e++)
    [1,2,5].forEach(m=>{ const v=m*Math.pow(10,e); if(Math.log(v)>=l0 && Math.log(v)<=l1) ticks.push(v); });
  const tk=ticks.length>7 ? ticks.filter((v,i)=>String(v)[0]!=='2' || ticks.length<=10) : ticks;
  tk.forEach(v=>{ const y=Y(v); gg.appendChild(svgEl('line',{x1:L,x2:W-RR,y1:y,y2:y}));
    const t=svgEl('text',{x:L-8,y:y+4,'text-anchor':'end',class:'lsTick'}); t.textContent=v>=1e4?(v/1e4)+'만':fmt(v); gg.appendChild(t); });
  svg.appendChild(gg);

  // 값 띠 · 이익선 — 흑자 구간마다 끊어서
  const segs=[]; let cur=[];
  LN.forEach(x=>{ if(x.mid){ cur.push(x); } else { if(cur.length>=3) segs.push(cur); cur=[]; } });
  if(cur.length>=3) segs.push(cur);     // 흑자 한두 분기짜리 토막은 이익선으로 긋지 않는다
  const P=(x,k)=>X(lsT(x.d)).toFixed(1)+','+Y(x[k]).toFixed(1);
  segs.forEach(sg=>{
    if(sg.length>1) svg.appendChild(svgEl('path',{d:'M'+sg.map(x=>P(x,'hi')).join('L')+'L'+sg.slice().reverse().map(x=>P(x,'lo')).join('L')+'Z',class:'lsVal'}));
    ['lo','hi'].forEach(k=>{ if(sg.length>1) svg.appendChild(svgEl('path',{d:'M'+sg.map(x=>P(x,k)).join('L'),class:'lsLoHi'})); });
    if(sg.length>1) svg.appendChild(svgEl('path',{d:'M'+sg.map(x=>P(x,'mid')).join('L'),class:'lsMid'}));
  });
  // 적자 분기
  LN.forEach((x,i)=>{ if(!x.loss) return; const a=X(lsT(x.d))-((W-L-RR)/(LN.length||1))*.9, b=X(lsT(x.d));
    svg.appendChild(svgEl('rect',{x:Math.max(L,a),y:pBot-5,width:Math.max(2,b-Math.max(L,a)),height:5,class:'lsLoss'})); });
  // 오른쪽 이름표 — 마지막 흑자 이익선
  const lastL=[...LN].reverse().find(x=>x.mid);
  if(lastL){
    const xe=X(lsT(lastL.d));
    const lab=(k,txt,cls,dy)=>{ const t=svgEl('text',{x:W-RR+10,y:Y(lastL[k])+4+dy,class:'lsLab '+cls}); t.textContent=txt; svg.appendChild(t);
      svg.appendChild(svgEl('line',{x1:xe,x2:W-RR+6,y1:Y(lastL[k]),y2:Y(lastL[k])+dy,stroke:'rgba(214,180,106,.35)','stroke-width':1})); };
    const yh=Y(lastL.hi), ym=Y(lastL.mid), yl=Y(lastL.lo);
    lab('mid','이익선 '+d.band.mid.toFixed(1)+'배','gold',0);
    lab('hi','비쌈 '+d.band.hi.toFixed(1)+'배','',Math.min(0,(ym-13)-yh));
    lab('lo','쌈 '+d.band.lo.toFixed(1)+'배','',Math.max(0,(ym+13)-yl));
  }
  // 주가
  if(M.length>1) svg.appendChild(svgEl('path',{d:'M'+M.map(m=>X(lsT(m.d)).toFixed(1)+','+Y(m.p).toFixed(1)).join('L'),class:'lsPx'}));
  // 지금
  if(M.length){
    const m=M[M.length-1], x=X(lsT(m.d)), y=Y(m.p);
    svg.appendChild(svgEl('circle',{cx:x,cy:y,r:4.5,class:'lsNowDot'}));
    const g=svgEl('g',{class:'lsNow'}); const txt='지금 '+won(m.p);
    const w=txt.length*6.6+14, bx=x>W-RR-70 ? x-w-10 : Math.min(x+8,W-w-2), by=y-28<pTop ? y+10 : y-28;
    g.appendChild(svgEl('rect',{x:bx,y:by,width:w,height:18,rx:5}));
    const t=svgEl('text',{x:bx+7,y:by+13}); t.textContent=txt; g.appendChild(t); svg.appendChild(g);
  }
  // 결단 표지 — B 버핏, L 린치. 겹치면 위로 쌓는다
  const tip=el('div','spTip lsTip'); tip.hidden=true;
  const placed=[];
  (d.moments||[]).forEach((mo,i)=>{
    const x=X(lsT(mo.d)); let y=Y(mo.px)-16;
    while(placed.some(q=>Math.abs(q.x-x)<18 && Math.abs(q.y-y)<18)) y-=19;
    placed.push({x,y});
    const g=svgEl('g',{class:'lsMk'}); g.style.setProperty('--d',(900+i*60)+'ms');
    g.appendChild(svgEl('line',{x1:x,x2:x,y1:y+8,y2:Y(mo.px)-2,stroke:'rgba(255,255,255,.35)','stroke-width':1}));
    g.appendChild(svgEl('circle',{cx:x,cy:y,r:8.5,class:mo.who==='버핏'?'b':'l'}));
    const t=svgEl('text',{x:x,y:y+3.6,'text-anchor':'middle'}); t.textContent=mo.who==='버핏'?'B':'L'; g.appendChild(t);
    if(mo.r1!==null && mo.r1!==undefined){ const r=svgEl('text',{x:x,y:y-12,'text-anchor':'middle',class:'r '+(mo.r1>=0?'up':'dn')}); r.textContent=lsPct(mo.r1); g.appendChild(r); }
    g.addEventListener('pointerenter',()=>{
      tip.innerHTML='';
      const h=el('div','spTipH'); h.appendChild(el('b',null,mo.who+' — '+mo.what)); tip.appendChild(h);
      const gr=el('div','spTipG');
      [['접수일',lsD(mo.d)],['그날 주가',won(mo.px)+'원'],['1년 뒤',lsPct(mo.r1)],['3년 뒤',lsPct(mo.r3)]].forEach(([k,v])=>{ const c2=el('div'); c2.appendChild(el('span',null,k)); c2.appendChild(el('b',null,v)); gr.appendChild(c2); });

  cap.querySelector('.k').textContent='사업의 체력'; svg.appendChild(cap);
  const roes=R.map(r=>r.roe).filter(v=>v!==null&&v!==undefined);
  const rmax=Math.min(60,Math.max(20,...roes.map(v=>Math.abs(v))))*1.25;
  const rmin=Math.max(-rmax,Math.min(0,...roes));
  const YR=v=>rBot-(Math.max(rmin,Math.min(rmax,v))-rmin)/(rmax-rmin)*H2;
  svg.appendChild(svgEl('line',{x1:L,x2:W-RR,y1:YR(0),y2:YR(0),stroke:'rgba(255,255,255,.17)'}));

  const l15=svgEl('text',{x:W-RR+10,y:YR(15)+4,class:'lsLab gold'}); l15.textContent='ROE 15%'; svg.appendChild(l15);

    const t=svgEl('text',{x,y:r.roe>=0?Math.min(y,y0)-3:Math.max(y,y0)+10,'text-anchor':'middle',class:'lsRoe'}); t.textContent=r.roe.toFixed(0); svg.appendChild(t);
  });
  // 연도 축
  R.forEach((r,i)=>{ const x=X(Date.UTC(r.year,6,1)); if(R.length>12 && i%2 && i!==R.length-1) return;
    const t=svgEl('text',{x,y:H-8,'text-anchor':'middle',class:'lsTick'}); t.textContent="'"+String(r.year).slice(2); svg.appendChild(t); });

  // 따라가는 선 — 날짜·주가·이익선·벌어짐
  const guide=svgEl('line',{class:'lsGuide',y1:pTop,y2:rBot}); guide.style.display='none'; svg.appendChild(guide);
  const hit=svgEl('rect',{x:L,y:pTop,width:W-L-RR,height:H1,fill:'transparent'}); svg.appendChild(hit);
  const tip2=el('div','spTip lsTip'); tip2.hidden=true;
  hit.addEventListener('pointermove',ev=>{
    const box=svg.getBoundingClientRect(), sc=box.width/W, xs=(ev.clientX-box.left)/sc;
    const tt=t0+(xs-L)/(W-L-RR)*(t1-t0);

    if(!best) return;

    [['주가',won(m.p)+'원'],['이익선',ln&&ln.mid?won(ln.mid)+'원':(ln&&ln.loss?'적자':'—')],['벌어짐',lsPct(gap)],['값 띠',ln&&ln.lo?won(ln.lo)+'–'+won(ln.hi):'—']]

  const tools=el('div','spTools');
  const fs=el('button','spFull', document.fullscreenElement===plate?'발표 모드 끝내기':'⛶ 발표 모드');
  fs.onclick=()=>{ if(document.fullscreenElement){ document.exitFullscreen(); return; } if(plate.requestFullscreen) plate.requestFullscreen().catch(()=>{}); };
  plate.onfullscreenchange=()=>{ const on=document.fullscreenElement===plate; plate.classList.toggle('full',on); fs.textContent=on?'발표 모드 끝내기':'⛶ 발표 모드'; };
  tools.appendChild(fs); top.appendChild(tools); plate.appendChild(top);

  // ── 헤드라인 — 말이 어디서 어디로 옮겨 가나
  const core=d.core.slice(0,2), ris=d.rising.slice(0,3), fad=d.fading.slice(0,3);
  const h3=c.name+'의 말은 '+(core.length?'「'+core.join('·')+'」에서 ':'')+(ris.length?'「'+ris.join('·')+'」로 옮겨 가고 있다':'크게 옮겨 가지 않았다');
  const hl=el('div','spHead'); hl.appendChild(el('h3',null,h3));
  const ps=[];
  if(fad.length) ps.push('접은 말 — '+fad.map(t=>t+'('+R[T[t].pk].stamp.slice(0,4)+' 정점)').join(' · ')+'.');
  (d.families||[]).slice(0,2).forEach(f=>{ const ms=f.members.filter(m=>T[m]&&T[m].first!==null).sort((a,b)=>T[a].first-T[b].first);
    if(ms.length>=2) ps.push('세대 교체 — '+ms.join(' → ')+'.'); });
  if(ps.length) hl.appendChild(el('p',null,ps.join(' ')));
  hl.appendChild(el('p','spEn','What a company spends its words on moves before its numbers do: rising terms, core identity, retired businesses and product generations, read off '+n+' filings.'));
  if(!d.df) hl.appendChild(el('p','spEn','전 종목 낱말 빈도를 만드는 중 — 다 되면 어느 회사나 쓰는 말이 더 잘 걸러집니다.'));
  plate.appendChild(hl);

  // ── 말의 지층 — 줄마다 한 말, 면적 = 그 말의 지면(4건 평균, 줄마다 자기 최대로 맞춤)
  const W=1000, L=176, RR=128, TOP=26, rowH=25, gH=30;
  const X=vcX(n,W,L,RR);
  const rows=[];
  ['rising','core','fading'].forEach(g=>{ if(d[g].length){ rows.push({h:g}); d[g].forEach(t=>rows.push({t,g})); } });
  let y=TOP; rows.forEach(r=>{ r.y=y; y+=r.h?gH:rowH; });
  const H=y+30;
  const fig=el('div','vcFig'); plate.appendChild(fig);
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'vcSvg',role:'img','aria-label':'말의 궤적'});
  // 연도 격자
  let lastY='', lx=-99;
  R.forEach((r,i)=>{ const yy=r.stamp.slice(0,4); if(yy===lastY) return; lastY=yy; const x=X(i)-(W-L-RR)/n/2;
    svg.appendChild(svgEl('line',{x1:x,x2:x,y1:TOP-8,y2:H-26,class:'vcYearL'}));
    if(x-lx>=34){ const t=svgEl('text',{x:x+2,y:H-10,class:'vcYear'}); t.textContent="'"+yy.slice(2); svg.appendChild(t); lx=x; } });
  const tip=el('div','spTip vcTip'); tip.hidden=true;
  rows.forEach((r,k)=>{
    if(r.h){
      const t=svgEl('text',{x:8,y:r.y+19,class:'vcGrp'}); t.textContent=VC_GN[r.h][0]; t.setAttribute('fill',VC_GC[r.h]); svg.appendChild(t);
      const e=svgEl('text',{x:8+VC_GN[r.h][0].length*14+10,y:r.y+19,class:'vcGrpE'}); e.textContent=VC_GN[r.h][1]; svg.appendChild(e);
      return;
    }
    const tr=T[r.t]; if(!tr) return;
    const g=svgEl('g',{class:'vcRow'}); g.dataset.t=r.t;
    g.appendChild(svgEl('rect',{x:2,y:r.y+1,width:W-4,height:rowH-2,rx:5,class:'bg'}));
    const base=r.y+rowH-4, hmax=rowH-8;
    const mx=Math.max(...tr.roll,0.01);
    const col=VC_GC[r.g];
    let dp='M'+X(0).toFixed(1)+','+base;
    tr.roll.forEach((v,i)=>{ dp+='L'+X(i).toFixed(1)+','+(base-v/mx*hmax).toFixed(1); });
    dp+='L'+X(n-1).toFixed(1)+','+base+'Z';
    const a=svgEl('path',{d:dp,class:'vcArea',fill:col,'fill-opacity':.55}); a.style.setProperty('--d',(k*35)+'ms'); g.appendChild(a);
    g.appendChild(svgEl('line',{x1:L,x2:W-RR,y1:base+.5,y2:base+.5,class:'vcBase'}));
    // 단계 사다리 · 본격화
    Object.entries(tr.ladder||{}).forEach(([nm,i])=>{ const li=VC_LAD.findIndex(x=>x[0]===nm); if(li<0) return;
      g.appendChild(svgEl('circle',{cx:X(i),cy:r.y+5,r:3.2,fill:VC_LAD[li][1],class:'vcLad'})); });
    if(tr.take!==null && tr.take!==undefined){ const x=X(tr.take); g.appendChild(svgEl('path',{d:'M'+x+','+(r.y+11)+'l-4.5,-7h9z',class:'vcTake'})); }
    // 왼쪽 이름 · 지금 단계
    const lt=svgEl('text',{x:14,y:r.y+16,class:'vcT'}); lt.textContent=r.t.length>11?r.t.slice(0,10)+'…':r.t; g.appendChild(lt);
    // 단계는 떠오른 말에만 — 오래된 말은 곁에 늘 '확대'가 붙어 정보가 안 된다. 저문 말은 마지막으로 쓴 해
    const stTxt = r.g==='rising' ? tr.now : r.g==='fading' ? (tr.last!==null&&tr.last!==undefined&&tr.last<n-1?"'"+R[tr.last].stamp.slice(2,4)+'까지':'') : (tr.now==='둔화'?'둔화':'');
    if(stTxt){ const st=svgEl('text',{x:L-8,y:r.y+16,'text-anchor':'end',class:'vcSt'}); st.textContent=stTxt; if(stTxt==='둔화') st.setAttribute('fill','#f0a58c'); g.appendChild(st); }
    // 오른쪽 숫자 — 지금 · 정점
    const nt=svgEl('text',{x:W-RR+10,y:r.y+16,class:'vcNum'});
    const now=tr.roll[n-1];
    nt.innerHTML='<tspan class="b"></tspan><tspan dx="6"></tspan>';
    nt.firstChild.textContent=now.toFixed(1);
    nt.lastChild.textContent=r.g==='fading'?'← '+tr.peak.toFixed(0)+" '"+R[tr.pk].stamp.slice(2,4):'정점 '+tr.peak.toFixed(0);
    g.appendChild(nt);
    g.addEventListener('pointerenter',()=>{
      tip.innerHTML='';
      const h=el('div','spTipH'); h.appendChild(el('b',null,r.t)); h.appendChild(el('small',null,VC_GN[r.g][0]+(tr.now?' · 지금 '+tr.now:''))); tip.appendChild(h);
      const gr=el('div','spTipG');
      [['처음',tr.first!==null?R[tr.first].stamp:'—'],['본격화',tr.take!==null&&tr.take!==undefined?R[tr.take].stamp:'처음부터'],
       ['정점',R[tr.pk].stamp+' · '+tr.peak.toFixed(1)],['지금(1만 낱말당)',now.toFixed(1)]].forEach(([kk,v])=>{ const c2=el('div'); c2.appendChild(el('span',null,kk)); c2.appendChild(el('b',null,v)); gr.appendChild(c2); });
      tip.appendChild(gr);
      if(tr.snip_last) tip.appendChild(el('p',null,tr.snip_last));
      tip.hidden=false;
      const box=fig.getBoundingClientRect(), sc=box.width/W, tw=tip.offsetWidth;
      let lx2=X(n-1)*sc-tw-10; if(lx2<4) lx2=4;
      tip.style.left=lx2+'px'; tip.style.top=Math.max(4,(r.y+rowH)*sc+4)+'px';
    });
    g.addEventListener('pointerleave',()=>{ tip.hidden=true; });
    g.addEventListener('click',()=>{ pickT(r.t); document.querySelector('.vcLed').scrollIntoView({behavior:'smooth',block:'start'}); });
    svg.appendChild(g);
  });
  fig.appendChild(svg); fig.appendChild(tip);

  // ── 세대 교체 — 같은 약어의 세대가 언제 나고 언제 물러났나
  const fams=(d.families||[]).filter(f=>f.members.filter(m=>T[m]&&T[m].first!==null).length>=2);
  if(fams.length){
    const mrows=[]; fams.forEach(f=>{ mrows.push({h:f.root}); f.members.filter(m=>T[m]&&T[m].first!==null).sort((a,b)=>T[a].first-T[b].first).forEach(m=>mrows.push({t:m,f:f.root})); });
    let yy=18; mrows.forEach(r=>{ r.y=yy; yy+=r.h?22:17; });
    const H2=yy+8;
    const sv2=svgEl('svg',{viewBox:'0 0 '+W+' '+H2,class:'vcSvg'});
    const cap=svgEl('text',{x:8,y:12,class:'vcGrp'}); cap.textContent='세대 교체'; cap.setAttribute('fill',VC_GC.family); sv2.appendChild(cap);
    const ce=svgEl('text',{x:84,y:12,class:'vcGrpE'}); ce.textContent='GENERATIONS — 새 세대가 나고 옛 세대가 물러나는 때가 기술 사이클의 자리'; sv2.appendChild(ce);
    const step=(W-L-RR)/n;
    mrows.forEach(r=>{
      if(r.h){ const t=svgEl('text',{x:14,y:r.y+15,class:'vcFam'}); t.textContent=r.h+' 계열'; t.setAttribute('fill','#cdbcf5'); sv2.appendChild(t); return; }
      const tr=T[r.t], mx=Math.max(...tr.roll,0.01);
      const lt=svgEl('text',{x:30,y:r.y+11,class:'vcSt'}); lt.textContent=r.t; lt.setAttribute('fill','#e6ddfb'); sv2.appendChild(lt);
      tr.roll.forEach((v,i)=>{ if(v<=0) return; sv2.appendChild(svgEl('rect',{x:X(i)-step/2+.5,y:r.y+2,width:Math.max(1,step-1),height:11,rx:1.5,fill:VC_GC.family,'fill-opacity':(0.12+0.88*v/mx).toFixed(2)})); });
      const nt=svgEl('text',{x:W-RR+10,y:r.y+11,class:'vcNum'}); nt.textContent=R[tr.first].stamp.slice(0,4)+'–'+(tr.last!==null?R[tr.last].stamp.slice(0,4):''); sv2.appendChild(nt);
    });
    const f2=el('div','vcFig'); f2.appendChild(sv2); plate.appendChild(f2);
  }
  const key=el('div','vcKey');
  key.innerHTML='<span><i style="background:#4fc3a1"></i>떠오른 말</span><span><i style="background:#d6b46a"></i>주력 말</span><span><i style="background:#6f9fe0"></i>저문 말</span>'+
    '<span>면적 = 1만 낱말당 쓰인 횟수(4건 평균) · 줄마다 자기 최대로 맞춤</span><span style="color:#f1d9a0">▼ 본격화(자기 정점의 30%에 처음 닿은 보고서)</span>'+
    VC_LAD.map(([nm,cc])=>'<span><i style="background:'+cc+';width:8px;height:8px;border-radius:50%"></i>'+nm+'</span>').join('')+'<span>단계는 그 말이 든 문장의 낱말로 추정</span>';
  plate.appendChild(key);

  // ── 읽는 법 — 키워드 추이를 투자에 쓰는 다섯 가지
  const how=el('div','vcHow');
  const hs=[
    ['#4fc3a1','RISING','떠오른 말 = 돈을 거는 곳','새 제품·새 시장은 매출이 되기 전에 보고서 지면부터 차지한다(린치). 2년 전보다 지면이 크게 는 말을 먼저 본다.','사다리로 개발 → 샘플·인증 → 양산·출시 → 확대 중 어디까지 왔는지 확인. 양산 전이면 아직 이야기다.'],
    ['#d6b46a','CORE','주력 말 = 정체성','15년 내내 크게 쓰는 말이 이 회사가 무엇인지다. 버핏의 "이해할 수 있는 사업".','주력 말의 지면이 줄기 시작하면 정체성이 바뀌는 중 — 옛 숫자로 지금을 재지 말 것.'],
    ['#6f9fe0','FADING','저문 말 = 접은 사업','한때 크게 쓰다 사라진 말은 정리한 사업이나 끝난 이야기다.','사라진 해에 매출·이익률이 어떻게 됐는지 맞춰 본다 — 다각화 정리(좋음)인지 본업 쇠퇴(나쁨)인지.'],
    ['#b79cf0','GENERATIONS','세대 교체 = 사이클의 자리','같은 약어의 새 세대(DDR5·HBM4)가 처음 나오고 옛 세대가 정점을 찍는 때가 기술 사이클의 전환점이다.','새 세대가 옛 세대의 지면을 넘어서는 보고서가 가격·물량이 바뀌는 때와 겹치는지 본다.'],
    ['#e98f6a','WORDS → NUMBERS','말이 숫자를 앞선다','말을 누르면 아래에 지면과 회사 매출 증가율을 겹쳐 그린다. 본격화 뒤 1년 주가도 적었다.','말이 본격화되고 몇 분기 뒤 매출이 따라왔는지가 이 회사의 "말의 신용도"다.'],
  ];
  hs.forEach(([cc,en,t,p1,p2])=>{ const b=el('div','vcHowI'); b.style.setProperty('--c',cc); b.appendChild(el('em',null,en)); b.appendChild(el('b',null,t)); b.appendChild(el('p',null,p1)); b.appendChild(el('small',null,p2)); how.appendChild(b); });
  plate.appendChild(how);
  const ft=el('div','spFoot');
  ft.innerHTML='<span>「사업의 내용」 '+n+'건, 1만 낱말당 쓰인 횟수. 어느 회사나 쓰는 말(수요·투자·글로벌)은 전 종목 '+(d.df_n||'—')+'개사 최근 사업보고서에서 흔한 정도로 눌렀다. 떠오른 말 = 최근 4건이 그 전 2년보다 2.5배↑, 저문 말 = 4건 평균이 자기 정점의 30% 아래, 주력 말 = 85% 넘는 보고서에 나오고 지면이 안정.</span><b>WORDS · '+(d.rising.length+d.core.length+d.fading.length)+'</b>';
  plate.appendChild(ft);
}

function vcHi(node,text,t){
  if(!text){ node.appendChild(document.createTextNode('—')); return; }
  const i=text.indexOf(t);
  if(i<0){ node.appendChild(document.createTextNode(text)); return; }
  node.appendChild(document.createTextNode(text.slice(0,i))); node.appendChild(el('mark',null,t)); node.appendChild(document.createTextNode(text.slice(i+t.length)));
}

// 말과 주가 — 이 말은 그때 주가를 움직인 이야기였나(/api/narrative). 뉴스 대신 같은 말을 쓴 회사들의 주가로 가린다
const VN_K={'맞물림':['#1f6b3f','var(--add-bg)'],'겹침':['#2f7d6a','var(--add-bg)'],'뒤따름':['#8a5a12','var(--warn-bg)'],'부분':['#8a5a12','var(--warn-bg)'],'비껴감':['#6d6a64','var(--line2)'],'무관':['#a3352c','var(--del-bg)'],'약함':['#6d6a64','var(--line2)']};
const vnP=v=>v===null||v===undefined?'—':(v>=0?'+':'')+Math.round(v)+'%';
const vnD=s=>s?s.slice(0,4)+'.'+s.slice(4,6)+'.'+s.slice(6,8):'';
async function vcNarr(box,c,t){
  if(!box.isConnected && box._started) return;
  box._started=true;
  let o;
  try{ o=await (await fetch('/api/narrative?code='+c.code+'&term='+encodeURIComponent(t))).json(); }catch(e){ o={error:'불러오지 못했습니다'}; }
  if(!box.isConnected) return;
  box.innerHTML='';
  const h=el('div','vnH'); h.appendChild(el('b',null,'주가와의 관계')); h.appendChild(el('span',null,'이 말은 그때 실제로 주가를 끌어올린 이야기였나?'));
  box.appendChild(h);
  if(o.error){ box.appendChild(el('p','vnNote',o.error)); return; }
  // 판정
  if(o.verdict){
    const v=o.verdict, col=VN_K[v.k]||VN_K['약함'];
    const vb=el('div','vnV'); const chip=el('span','vnChip',v.k); chip.style.color=col[0]; chip.style.background=col[1]; chip.style.borderColor=col[0];
    vb.appendChild(chip); vb.appendChild(el('b',null,v.t)); box.appendChild(vb);
    if(v.lines&&v.lines.length){ const ul=el('ul','vnL'); v.lines.forEach(x=>ul.appendChild(el('li',null,x))); box.appendChild(ul); }
  } else if(o.theme_pending){
    const p=o.theme_pending;
    box.appendChild(el('p','vnNote','전 종목 '+(p.total||'—')+'개사 보고서에서 이 말을 찾는 중 '+(p.done||0)+'/'+(p.total||'—')+' — 처음 한 번만 걸린다(약 20초).'));
    setTimeout(()=>{ if(box.isConnected) vcNarr(box,c,t); },2000);
  }
  const grid=el('div','vnG');
  // ① 시점 — 이 회사 주가
  const tm=o.timing||{}, seg=el('div','vnCol');
  seg.appendChild(el('em',null,'① 언제 올랐나 — 이 회사 주가'));
  const bars=el('div','vnT');
  [['첫 언급 전 6개월',tm.pre,'보고서 전에 시장이 먼저 움직였나'],
   [o.same?null:'첫 언급 → 본격화',tm.mid,'말이 커지는 동안'],
   ['본격화 뒤 1년',tm.post,'보고서가 앞섰나']].forEach(([k,w,why])=>{ if(!k||!w) return;
    const r=el('div','vnTr'); r.appendChild(el('span','k',k));
    const v=w.ret, b=el('span','bar'); const f=el('i'); const mag=v===null?0:Math.min(1,Math.abs(v)/150);
    f.style.width=(mag*100)+'%'; f.className=v===null?'':v>=0?'up':'dn'; b.appendChild(f); r.appendChild(b);
    r.appendChild(el('b',v===null?'':v>=0?'up':'dn',vnP(v)+(w.partial?' (진행 중)':'')));
    r.appendChild(el('small',null,vnD(w.d0)+' → '+vnD(w.d1)+' · '+why));
    bars.appendChild(r); });
  seg.appendChild(bars); grid.appendChild(seg);
  // ② 시장 — 같은 말을 쓴 회사들
  const th=o.theme, mk=el('div','vnCol');
  mk.appendChild(el('em',null,'② 시장의 이야기였나 — 같은 말을 쓴 회사들'));
  if(th){
    const rows=[['전 종목 중앙값',th.all_med,th.n_all+'곳'],
      ['이 말을 쓴 회사',th.users_med,th.n_users+'곳'],
      ['이 말을 새로 쓰기 시작한 회사',th.adopt_med,th.n_adopt+'곳 (2년 전엔 안 씀)'],
      [c.name,th.me,th.me_pct!==null&&th.me_pct!==undefined?'전 종목 상위 '+(100-th.me_pct)+'%':'']];
    const vals=rows.map(r=>r[1]).filter(v=>v!==null&&v!==undefined);
    const mx=Math.max(50,...vals.map(Math.abs));
    rows.forEach(([k,v,s],i)=>{ const r=el('div','vnTr'+(i===3?' me':'')); r.appendChild(el('span','k',k));
      const b=el('span','bar'); const f=el('i'); f.style.width=(v===null||v===undefined?0:Math.min(1,Math.abs(v)/mx)*100)+'%'; f.className=v>=0?'up':'dn'; b.appendChild(f); r.appendChild(b);
      r.appendChild(el('b',v>=0?'up':'dn',v===null||v===undefined?'—':vnP(v))); r.appendChild(el('small',null,s)); mk.appendChild(r); });
    mk.appendChild(el('p','vnNote','같은 창('+vnD(th.d0)+' → '+vnD(th.d1)+') 주가 수익률. 「이 말을 쓴 회사」 = '+th.fy+'년 사업보고서 「사업의 내용」에 3번 넘게 쓴 회사.'));
    const peers=(th.adopt_top&&th.adopt_top.length?th.adopt_top:th.users_top)||[];
    if(peers.length){ const pw=el('div','vnPeers'); pw.appendChild(el('span',null,(th.adopt_top&&th.adopt_top.length?'새로 쓰기 시작한 회사':'이 말을 많이 쓴 회사')+' →'));
      peers.filter(p=>p.code!==c.code).slice(0,10).forEach(p=>{ const b=el('button',null,p.name+' '+vnP(p.ret)); b.title=p.name+' 「사업의 내용」에 '+p.c1+'번 · 누르면 그 회사로';
        b.onclick=async()=>{ await pick(p.code); S.trendPick=t; jump('trend'); }; pw.appendChild(b); });
      mk.appendChild(pw); }
  } else if(o.theme_pending) mk.appendChild(el('p','vnNote','계산 중…'));
  else if(o.theme_error) mk.appendChild(el('p','vnNote',o.theme_error));
  grid.appendChild(mk);
  // ③ 값 매김 — 이익이 올린 몫과 값을 더 쳐준 몫
  const rr=o.rerate, vc=el('div','vnCol');
  vc.appendChild(el('em',null,'③ 무엇이 올렸나 — 이익 vs 값 매김'));
  if(rr){
    const eq=el('div','vnEq');
    eq.innerHTML='<span>주가</span><b class="'+(rr.price>=0?'up':'dn')+'">'+vnP(rr.price)+'</b><i>=</i><span>'+rr.base.split('(')[0]+'</span><b>'+vnP(rr.growth)+'</b><i>×</i><span>값 매김</span><b class="'+(rr.rerate>=0?'up':'dn')+'">'+vnP(rr.rerate)+'</b>';
    vc.appendChild(eq);
    vc.appendChild(el('p','vnNote',rr.from+' → '+rr.to+' 보고서 기준. 값 매김 = 같은 '+rr.base.split('(')[0]+'에 시장이 쳐주는 값(PER'+(rr.base.startsWith('매출')?'·PSR':'')+')의 변화. '+
      (rr.rerate>=25?'값 매김이 크게 올랐다 — 시장이 이 회사의 이야기에 미래 값을 미리 쳐줬다.':rr.rerate<=-15?'값 매김은 오히려 내렸다 — 이익이 주가보다 빨리 늘었다.':'값 매김은 크게 변하지 않았다 — 주가는 이익을 따라 움직였다.')));
  } else vc.appendChild(el('p','vnNote','이 기간 이익·매출 자료가 모자라 나눠 보지 못했다.'));
  grid.appendChild(vc);
  box.appendChild(grid);
  box.appendChild(el('p','vnFoot','뉴스를 읽은 게 아니라 보고서와 주가로 가린 것이다. 같은 말을 쓴 회사들이 함께 올랐다면 시장의 이야기, 이 회사만 올랐다면 회사만의 이야기, 값 매김이 크게 올랐다면 그 이야기에 값이 붙은 것으로 본다. 창 = 본격화 보고서 1년 전 → 6개월 뒤.'));
}

const VC_NUM='①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮';
const vcFiled=r=>r.rcept.slice(0,4)+'.'+r.rcept.slice(4,6)+'.'+r.rcept.slice(6,8);
const vcEvD=e=>e.y+'.'+String(e.m).padStart(2,'0')+(e.d?'.'+String(e.d).padStart(2,'0'):'');
const vcWhen=r=>"'"+r.stamp.slice(2,4)+'.'+r.stamp.slice(5,7)+' '+r.label.replace('보고서','');
const vcJosa=(w,a,b)=>{ const c=w.charCodeAt(w.length-1); return (c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28)?a:b; };

// 처음 보는 사람을 위한 해석 — 무슨 말이고, 언제 나왔고, 어떻게 자랐고, 숫자는 어땠나
function vcStory(tr,t,R,d){
  const L=[], f=tr.first, tk=tr.take, n=R.length;
  const eun=vcJosa(t,'은','는'), ga=vcJosa(t,'이','가');
  if(f!==null){
    const head = f>8 ? '「'+t+'」'+eun+' '+vcWhen(R[f])+'보고서('+vcFiled(R[f])+' 접수)에 처음 나온 말이다.'
                     : '「'+t+'」'+eun+' 수집한 첫 보고서('+R[0].stamp.slice(0,4)+')부터 쓰인 말이다.';
    L.push(head+(tr.rank?' 지금은 이 회사가 「사업의 내용」에서 <b>'+tr.rank+'번째로 많이 쓰는 말</b>이다(최근 보고서에 '+tr.n_last+'번).'
                           :' 최근 보고서에는 더 나오지 않는다.'));
  }
  if(tr.renamed_from){ const o=tr.renamed_from.t;
    L.push('<b>새 사업이 생긴 게 아니라 이름을 바꾼 것</b>으로 보인다 — 같은 때 「'+o+'」'+vcJosa(o,'이','가')+' '+vcWhen(R[tr.renamed_from.last])+'보고서를 끝으로 사라졌다. 숫자를 이어 볼 때는 옛 이름까지 함께 보라.'); }
  if(tr.renamed_to){ const o=tr.renamed_to.t;
    L.push('<b>사업을 접은 게 아니라</b> 「'+o+'」'+vcJosa(o,'으로','로')+' 이름이 바뀐 것으로 보인다.'); }
  if(f!==null && tk!==null && tk!==undefined && !tr.renamed_from){
    const q=tk-f;
    L.push(q===0 ? '<b>나오자마자 크게 썼다</b> — 그래서 ① 처음과 ② 본격화가 같은 보고서다. 사업부 이름이나 인수한 회사 이름처럼 한 번에 자리 잡은 말에서 흔하다.'
         : '처음 언급되고 '+q+'개 보고서(약 '+(q*3)+'개월) 뒤인 '+vcWhen(R[tk])+'보고서에서 <b>가장 크게 뛰었다</b>(② 본격화) — 그때 무슨 일이 있었는지 아래 사건과 「본격화 때」 문장을 보라.');
  } else if(f!==null && (tk===null||tk===undefined) && f<=8 && tr.grp!=='fading'){
    L.push('15년 내내 쓰인 말이라 \'본격화\' 시점이 따로 없다. 선이 오르내린 때를 보라.');
  }
  if(tr.grp==='fading' && tr.last!==null && tr.last<n-1 && !tr.renamed_to)
    L.push(vcWhen(R[tr.last])+'보고서를 끝으로 거의 쓰지 않는다 — 접은 사업인지, 매출에서 작아진 것인지 그 무렵 숫자를 확인하라.');
  const lad=Object.entries(tr.ladder||{}).sort((a,b)=>a[1]-b[1]);
  if(lad.length) L.push('이 말이 든 문장에 처음 나온 단계 낱말: '+lad.map(([k,i])=>k+"('"+R[i].stamp.slice(2).replace('-','.')+')').join(' → ')+(tr.now?' · 요즘 문장은 「'+tr.now+'」 쪽':'')+'.');
  // 숫자 — 그 말이 나온 때와 1년 뒤, 회사 매출(4분기 합) 증가율
  const qOf={'03':1,'06':2,'09':3,'12':4}, rv={};
  (d.rev||[]).forEach(x=>{ if(x.ttm!==null&&x.ttm!==undefined) rv[x.y+'-'+x.q]=x.ttm; });
  const at=i=>i===null||i===undefined||i>=n?undefined:rv[R[i].stamp.slice(0,4)+'-'+qOf[R[i].stamp.slice(5,7)]];
  const base=tk!==null&&tk!==undefined?tk:f;
  if(base!==null && base>8){
    const g0=at(base), g1=at(base+4);
    if(g0!==undefined) L.push('그때 회사 매출(최근 4분기 합)은 1년 전보다 '+(g0>=0?'+':'')+g0.toFixed(0)+'%'+(g1!==undefined?', 그 1년 뒤에는 '+(g1>=0?'+':'')+g1.toFixed(0)+'%':'')+
      (g1!==undefined?(g1>g0+3?' — 말이 커진 뒤 매출이 빨라졌다.':g1<g0-3?' — 말이 커졌지만 매출은 오히려 느려졌다.':' — 매출 속도는 비슷했다.'):'.'));
  }
  if(tr.take_r1!==null&&tr.take_r1!==undefined)
    L.push('본격화 보고서가 나온 날부터 1년 동안 주가는 '+(tr.take_r1>=0?'+':'')+tr.take_r1.toFixed(0)+'%였다 — 회사 전체 주가라 이 말 하나 때문이라고 볼 수는 없다.');
  return L;
}

function vcDetail(box,d,t,c){
  box.innerHTML='';
  const R=d.reports, n=R.length, tr=d.tracks[t]||(d.mine||{})[t]; if(!tr) return;
  const card=el('div','vcDet');
  const h=el('div','vcDetH'); h.appendChild(el('b',null,t));
  const gc=VC_GC[tr.grp]||VC_GC.mine;
  const chip=el('span','chip',(VC_GN[tr.grp]||[{family:'세대 교체',mine:'직접 찾은 말'}[tr.grp]||''])[0]); chip.style.background=gc; h.appendChild(chip);
  if(tr.renamed_from){ const rc=el('span','chip','이름 바뀜'); rc.style.background='#8b95a3'; h.appendChild(rc); }
  card.appendChild(h);

  // ── 해석 — 한 문장씩
  const story=vcStory(tr,t,R,d);
  if(story.length){ const sb=el('div','vcStory'); sb.appendChild(el('em',null,'한 줄씩 읽기'));
    const ul=el('ul'); story.forEach(x=>{ const li=el('li'); li.innerHTML=x; ul.appendChild(li); }); sb.appendChild(ul); card.appendChild(sb); }

  // ── 흐름 — 옛 이름 → 처음 → 본격화 → 지금
  const steps=[];
  if(tr.renamed_from) steps.push({k:'옛 이름',v:'「'+tr.renamed_from.t+'」',s:"~'"+R[tr.renamed_from.last].stamp.slice(2).replace('-','.')+' 보고서까지',cls:'old'});
  const r1=tr.take_r1!==null&&tr.take_r1!==undefined?' · 그 뒤 1년 주가 '+(tr.take_r1>=0?'+':'')+tr.take_r1.toFixed(0)+'%':'';
  if(tr.first!==null && tr.take===tr.first)
    steps.push({k:'① 처음 등장 = ② 본격화',v:vcWhen(R[tr.first]),s:vcFiled(R[tr.first])+' 접수 · 나오자마자 크게 씀'+r1,cls:'take'});
  else {
    if(tr.first!==null) steps.push({k:'① 처음 등장',v:vcWhen(R[tr.first]),s:vcFiled(R[tr.first])+' 접수 · 첫 언급'});
    if(tr.take!==null&&tr.take!==undefined) steps.push({k:'② 본격화',v:vcWhen(R[tr.take]),s:vcFiled(R[tr.take])+' 접수 · 지면이 가장 크게 뛴 때'+r1,cls:'take'});
  }
  if(tr.grp==='fading'&&tr.last!==null&&tr.last<n-1) steps.push({k:'③ 마지막',v:vcWhen(R[tr.last]),s:tr.renamed_to?'「'+tr.renamed_to.t+'」로 이름 바뀜':'이후 거의 안 씀',cls:'end'});
  else steps.push({k:'③ 지금',v:vcWhen(R[n-1]),s:tr.rank?tr.rank+'번째로 많이 쓰는 말 · '+tr.n_last+'번'+(tr.now?' · '+tr.now:''):'최근엔 안 씀',cls:'now'});
  const fl=el('div','vcFlow');
  steps.forEach((st,i)=>{ if(i) fl.appendChild(el('i',null,'→')); const x=el('div',st.cls||''); x.appendChild(el('small',null,st.k)); x.appendChild(el('b',null,st.v)); x.appendChild(el('span',null,st.s)); fl.appendChild(x); });
  card.appendChild(fl);
  // ── 주가와의 관계 — 이 말이 그때 주가를 끌어올린 이야기였나
  const nb=el('div','vcNarr'); nb.appendChild(el('div','loading','주가와의 관계를 따지는 중…')); card.appendChild(nb);
  setTimeout(()=>vcNarr(nb,c,t),0);

  // ── 도구 — 구간 · 매출 막대
  const lateStart=tr.first!==null && tr.first>8;
  if(S.trendZoom===undefined) S.trendZoom=true;
  const zoom=lateStart && S.trendZoom;
  const a=zoom?Math.max(0,tr.first-4):0, b=n-1, m=b-a+1;
  const bar=el('div','vcBar');
  if(lateStart){
    const seg=el('div','seg');
    [['zoom','이 말의 구간 ('+R[a].stamp+'~)'],['all','15년 전체']].forEach(([k,lab])=>{
      const bt=el('button',(k==='zoom')===zoom?'on':'',lab);
      bt.onclick=()=>{ S.trendZoom=(k==='zoom'); vcDetail(box,d,t,c); };
      seg.appendChild(bt); });
    bar.appendChild(seg);
  }
  const revMode=S.trendRev==='ttm'?'ttm':'q';
  const seg2=el('div','seg');
  [['q','매출 · 분기 전년 대비'],['ttm','매출 · 4분기 합 전년 대비']].forEach(([k,lab])=>{
    const bt=el('button',k===revMode?'on':'',lab);
    bt.title=k==='q'?'그 분기 하나를 1년 전 같은 분기와 견준다 — 연말 쏠림·기준 효과가 그대로 보인다':'최근 4분기 합을 1년 전 4분기 합과 견준다 — 쏠림이 지워져 추세가 보인다';
    bt.onclick=()=>{ S.trendRev=k; vcDetail(box,d,t,c); };
    seg2.appendChild(bt); });
  bar.appendChild(seg2);
  card.appendChild(bar);

  // ── 그림 — 선 = 이 말을 쓴 정도, 막대 = 회사 매출 증가율, 번호 = 사건
  const ym=(y,mo,dd)=>y*12+(mo-1)+((dd||15)-1)/31;
  const Tm=R.map(r=>ym(+r.stamp.slice(0,4),+r.stamp.slice(5,7),28));
  const evs=(tr.events||[]).filter(e=>ym(e.y,e.m,e.d)>=Tm[a]-3);
  const W=1000, L=70, RR=64, T=evs.length?60:30, H=T+196, B=34, pb=H-B;
  const step=(W-L-RR)/m;
  const X=i=>L+(i-a)*step+step/2;
  const Xt=tt=>{ if(tt<=Tm[a]) return X(a)-Math.min(step/2,(Tm[a]-tt)/3*step);
    for(let i=a;i<b;i++) if(tt<=Tm[i+1]) return X(i)+(tt-Tm[i])/(Tm[i+1]-Tm[i])*step;
    return Math.min(W-RR+30, X(b)+(tt-Tm[b])/3*step); };
  const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'vcDetSvg'});
  const qOf={'03':1,'06':2,'09':3,'12':4};
  const rv={}; (d.rev||[]).forEach(x=>{ const v=revMode==='ttm'?x.ttm:x.yoy; if(v!==null&&v!==undefined) rv[x.y+'-'+x.q]=v; });
  const revs=R.map(r=>rv[r.stamp.slice(0,4)+'-'+qOf[r.stamp.slice(5,7)]]);
  const rin=revs.slice(a,b+1).filter(v=>v!==undefined).map(Math.abs).sort((p,q)=>p-q);
  // 튀는 한두 분기(2012년 +193%)가 나머지를 납작하게 만들지 않게 — 90% 분위의 1.6배에서 자르고 잘린 막대엔 값을 적는다
  const p90=rin.length?rin[Math.floor((rin.length-1)*0.9)]:20;
  const rmax=Math.max(20,Math.min(rin.length?rin[rin.length-1]:20,p90*1.6));
  const mid=T+(pb-T)/2, YR=v=>mid-Math.max(-1,Math.min(1,v/rmax))*(pb-T)/2*0.92;
  svg.appendChild(svgEl('line',{x1:L,x2:W-RR,y1:mid,y2:mid,class:'grid'}));
  for(let i=a;i<=b;i++){ const v=revs[i]; if(v===undefined) continue; const y=YR(v), clip=Math.abs(v)>rmax;
    svg.appendChild(svgEl('rect',{x:X(i)-step*.3,y:Math.min(y,mid),width:step*.6,height:Math.max(1,Math.abs(mid-y)),class:'rev'+(v<0?' n':'')}));
    if(m<=20||clip){ const tv=svgEl('text',{x:X(i),y:v>=0?Math.min(y,mid)-3:Math.max(y,mid)+10,'text-anchor':'middle',class:'ax'}); tv.textContent=(clip?(v>0?'↑':'↓'):'')+(v>=0?'+':'')+Math.round(v)+'%'; tv.style.fontSize='9px'; svg.appendChild(tv); } }
  const al=svgEl('text',{x:W-RR+6,y:mid-4,class:'ax'}); al.textContent='매출'; svg.appendChild(al);
  const al2=svgEl('text',{x:W-RR+6,y:mid+9,class:'ax'}); al2.textContent='0%'; svg.appendChild(al2);
  const rollIn=tr.roll.slice(a,b+1), shIn=tr.share.slice(a,b+1);
  const mx=Math.max(...rollIn,...shIn,0.01), YS=v=>pb-v/mx*(pb-T);
  svg.appendChild(svgEl('path',{d:'M'+rollIn.map((v,k)=>X(a+k).toFixed(1)+','+YS(v).toFixed(1)).join('L'),class:'shavg'}));
  svg.appendChild(svgEl('path',{d:'M'+shIn.map((v,k)=>X(a+k).toFixed(1)+','+YS(v).toFixed(1)).join('L'),class:'sh'}));
  for(let i=a;i<=b;i++){ const v=tr.share[i]; if(v>0) svg.appendChild(svgEl('circle',{cx:X(i),cy:YS(v),r:2.8,class:'dot'})); }
  const yl=svgEl('text',{x:L-8,y:T+4,'text-anchor':'end',class:'ax'}); yl.textContent='많이 씀'; svg.appendChild(yl);
  const yl2=svgEl('text',{x:L-8,y:pb,'text-anchor':'end',class:'ax'}); yl2.textContent='안 씀'; svg.appendChild(yl2);
  // 처음 · 본격화 — 선 아래쪽에 짧은 꼬리표(위쪽은 사건 번호 자리)
  const tagP=[];
  // 꼬리표는 선의 오른쪽에 붙인다. 오른쪽 끝에 닿을 때만 왼쪽으로 — 그래도 시간 순서가 뒤집히지 않게 한 꼬리표로 합친다
  const tagAt=(i,txt)=>{ const x=X(i), w=txt.length*9.5+12, right=x>W-RR-w-4, x0=right?x-w-3:x+3;
    let y=pb-17; while(tagP.some(q=>x0<q.x1+4&&x0+w>q.x0-4&&q.y===y)) y-=19;
    tagP.push({x0,x1:x0+w,y});
    svg.appendChild(svgEl('rect',{x:x0,y,width:w,height:15,rx:4,class:'mkbg'}));
    const tt=svgEl('text',{x:right?x-8:x+8,y:y+11,class:'mk','text-anchor':right?'end':'start'}); tt.textContent=txt; svg.appendChild(tt); };
  const tag=(i,txt)=>{ if(i===null||i===undefined||i<a) return; const x=X(i);
    svg.appendChild(svgEl('line',{x1:x,x2:x,y1:T,y2:pb,class:'mkl'}));
    const w=txt.length*11+10, right=x>W-RR-w-4, x0=right?x-w-3:x+3;
    let y=pb-17; while(tagP.some(q=>x0<q.x1+4&&x0+w>q.x0-4&&q.y===y)) y-=19;   // 붙어 있으면 위로 쌓는다
    tagP.push({x0,x1:x0+w,y});
    svg.appendChild(svgEl('rect',{x:x0,y,width:w,height:15,rx:4,class:'mkbg'}));
    const tt=svgEl('text',{x:right?x-8:x+8,y:y+11,class:'mk','text-anchor':right?'end':'start'}); tt.textContent=txt; svg.appendChild(tt); };
  const fI=tr.first, tI=tr.take;
  if(fI!==null && fI!==undefined && fI>=a){
    if(tI===fI) tag(fI,'① 처음 = ② 본격화');
    else if(tI!==null && tI!==undefined && (tI-fI)*step<150){
      [fI,tI].forEach(i=>svg.appendChild(svgEl('line',{x1:X(i),x2:X(i),y1:T,y2:pb,class:'mkl'})));
      tagAt(fI,'① 처음 → ② 본격화 '+"'"+R[tI].stamp.slice(2).replace('-','.')); }
    else { tag(fI,'① 처음'); if(tI!==null&&tI!==undefined) tag(tI,'② 본격화'); }
  } else if(tI!==null && tI!==undefined) tag(tI,'② 본격화');
  // 사건 번호
  const evP=[];
  evs.forEach((e,k)=>{
    const x=Xt(ym(e.y,e.m,e.d));
    let cy=14; while(evP.some(q=>Math.abs(q.x-x)<17 && q.y===cy)) cy+=17;
    evP.push({x,y:cy});
    const col=e.term?'var(--tier-4)':'var(--faint)';
    svg.appendChild(svgEl('line',{x1:x,x2:x,y1:cy+8,y2:pb,stroke:col,'stroke-width':1,'stroke-dasharray':e.plan?'1 3':'2 3',opacity:.7}));
    svg.appendChild(svgEl('circle',{cx:x,cy,r:8,fill:e.term?'var(--tier-4)':'var(--panel)',stroke:col,'stroke-width':1.5}));

function vcMineBox(box,d,c){
  box.innerHTML='';

  const row=el('div','row');

  const go=el('button','go','그리기');
  row.appendChild(inp); row.appendChild(go); box.appendChild(row);
  const out=el('div'); box.appendChild(out);
  async function run(){
    const terms=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
    if(!terms.length) return;
    S.trendQ=inp.value;
    out.innerHTML='<div class="loading">세는 중…</div>';
    let r; try{ r=await (await fetch('/api/vocab?code='+c.code+'&terms='+encodeURIComponent(terms.join(',')))).json(); }catch(e){ r={error:'불러오지 못했습니다'}; }
    out.innerHTML='';
    if(r.error){ out.appendChild(el('div','err',r.error)); return; }
    const M=r.mine||{}, keys=Object.keys(M);
    if(!keys.length){ out.appendChild(el('div','empty','찾을 말이 없습니다.')); return; }
    const R=r.reports, n=R.length, W=1000, L=48, RR=20, T=14, H=230, B=26, pb=H-B;
    const X=vcX(n,W,L,RR);
    const mx=Math.max(0.01,...keys.flatMap(k=>M[k].roll));
    const Y=v=>pb-v/mx*(pb-T);
    const svg=svgEl('svg',{viewBox:'0 0 '+W+' '+H,class:'vcDetSvg'});
    [0,.5,1].forEach(f=>{ const y=Y(mx*f); svg.appendChild(svgEl('line',{x1:L,x2:W-RR,y1:y,y2:y,class:'grid'}));
      const t=svgEl('text',{x:L-6,y:y+4,'text-anchor':'end',class:'ax'}); t.textContent=(mx*f).toFixed(mx*f<10?1:0); svg.appendChild(t); });
    keys.forEach((k,j)=>{ const col=VC_MINE_C[j%VC_MINE_C.length];
      svg.appendChild(svgEl('path',{d:'M'+M[k].roll.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join('L'),fill:'none',stroke:col,'stroke-width':2.2,'stroke-linejoin':'round'}));
      if(M[k].take!==null&&M[k].take!==undefined){ const x=X(M[k].take); svg.appendChild(svgEl('path',{d:'M'+x+','+(Y(M[k].roll[M[k].take])-6)+'l-4.5,-7h9z',fill:col})); } });
    let lastY='', lx=-99;
    R.forEach((rr,i)=>{ const yy=rr.stamp.slice(0,4); if(yy===lastY) return; lastY=yy; const x=X(i); if(x-lx<34) return; lx=x;
      const t=svgEl('text',{x,y:H-6,'text-anchor':'middle',class:'ax'}); t.textContent="'"+yy.slice(2); svg.appendChild(t); });
    out.appendChild(svg);
    const lg=el('div','vcLeg');
    keys.forEach((k,j)=>{ const m=M[k]; const s=el('span'); const i=el('i'); i.style.background=VC_MINE_C[j%VC_MINE_C.length]; s.appendChild(i);
      s.appendChild(document.createTextNode(k+(m.extra&&m.extra.length?' (+'+m.extra.join(', ')+')':'')));
      s.appendChild(el('small',null,m.first===null?'  한 번도 안 나옴':'  처음 '+R[m.first].stamp+(m.take!==null&&m.take!==undefined?' · 본격화 '+R[m.take].stamp:'')+(m.now?' · 지금 '+m.now:'')));
      s.style.cursor='pointer'; s.onclick=()=>{ const det=document.querySelector('.vcLed>div'); if(det){ d.mine=M; vcDetail(det,Object.assign({},d,{mine:M,tracks:Object.assign({},d.tracks)}),k,c); det.scrollIntoView({behavior:'smooth'}); } };
      lg.appendChild(s); });
    out.appendChild(lg);
  }
  go.onclick=run;
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') run(); });
  if(S.trendQ) run();
}

function sparkline(pts){
  const W=760,H=90,P=26;
  const max=Math.max(...pts.map(p=>p.y),1);
  const sw=(W-P*2)/Math.max(pts.length-1,1);
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','chart');
  let d='';
  pts.forEach((p,i)=>{ const x=P+i*sw, y=H-18-(p.y/max)*(H-40);
    d+=(i?'L':'M')+x+' '+y+' ';
    const cc=document.createElementNS('http://www.w3.org/2000/svg','circle');
    cc.setAttribute('cx',x);cc.setAttribute('cy',y);cc.setAttribute('r',2.5);
    cc.setAttribute('fill','var(--accent)');
    const ti=document.createElementNS('http://www.w3.org/2000/svg','title');
    ti.textContent=p.x+' : '+p.y+'회'; cc.appendChild(ti); svg.appendChild(cc);
  });
  const path=document.createElementNS('http://www.w3.org/2000/svg','path');
  path.setAttribute('d',d); path.setAttribute('fill','none');
  path.setAttribute('stroke','var(--accent)'); path.setAttribute('stroke-width','1.6');
  svg.insertBefore(path, svg.firstChild);
  [[pts[0].x,P,'start'],[pts[pts.length-1].x,W-P,'end']].forEach(([txt,x,an])=>{
    const t=document.createElementNS('http://www.w3.org/2000/svg','text');
    t.setAttribute('x',x);t.setAttribute('y',H-4);t.setAttribute('text-anchor',an);
    t.setAttribute('font-size','10');t.setAttribute('fill','var(--faint)');
    t.setAttribute('font-family','var(--mono)');t.textContent=txt; svg.appendChild(t);
  });
  const wrap=el('div'); wrap.style.margin='6px 0 16px'; wrap.appendChild(svg); return wrap;
}

function multiline(d){
  const COLORS=['#2f5d50','#a3352c','#8a5a12','#3b5f8a','#6b3f7a','#2f7d6a','#8a3f5f','#55603a'];
  const terms=Object.keys(d.series);
  const W=820,H=260,L=44,R=14,T=14,B=34;
  const n=d.points.length;
  const max=Math.max(1,...terms.flatMap(t=>d.series[t].map(v=>v.n)));
  const sw=(W-L-R)/Math.max(n-1,1);
  const X=i=>L+i*sw, Y=v=>H-B-(v/max)*(H-T-B);
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.setAttribute('class','chart');

  [0,.25,.5,.75,1].forEach(f=>{
    const y=Y(max*f);
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',L);l.setAttribute('x2',W-R);l.setAttribute('y1',y);l.setAttribute('y2',y);
    l.setAttribute('stroke','var(--line)');l.setAttribute('stroke-width','1'); svg.appendChild(l);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',L-7);t.setAttribute('y',y+3.5);t.setAttribute('text-anchor','end');
    t.setAttribute('font-size','10');t.setAttribute('fill','var(--faint)');
    t.setAttribute('font-family','var(--mono)');t.textContent=Math.round(max*f); svg.appendChild(t);
  });
  d.points.forEach((p,i)=>{
    if(n>14 && i%Math.ceil(n/12)) return;
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',X(i));t.setAttribute('y',H-12);t.setAttribute('text-anchor','middle');
    t.setAttribute('font-size','10');t.setAttribute('fill','var(--faint)');
    t.setAttribute('font-family','var(--mono)');t.textContent=p.stamp.slice(2); svg.appendChild(t);
  });
  terms.forEach((term,k)=>{
    const col=COLORS[k%COLORS.length];
    let path='';
    d.series[term].forEach((v,i)=>{ path+=(i?'L':'M')+X(i)+' '+Y(v.n)+' '; });
    const pe=document.createElementNS(NS,'path');
    pe.setAttribute('d',path);pe.setAttribute('fill','none');
    pe.setAttribute('stroke',col);pe.setAttribute('stroke-width','2');
    pe.setAttribute('stroke-linejoin','round'); svg.appendChild(pe);
    d.series[term].forEach((v,i)=>{
      const c=document.createElementNS(NS,'circle');
      c.setAttribute('cx',X(i));c.setAttribute('cy',Y(v.n));c.setAttribute('r',2.6);
      c.setAttribute('fill',col);
      const ti=document.createElementNS(NS,'title');
      ti.textContent=d.points[i].stamp+' '+term+' : '+v.n+'회'; c.appendChild(ti);
      svg.appendChild(c);
    });
  });
  const wrap=el('div');
  const leg=el('div'); leg.style.cssText='display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 2px;font-size:12px';
  terms.forEach((t,k)=>{
    const s=el('span'); s.style.cssText='display:flex;gap:6px;align-items:center';
    const sw2=el('span'); sw2.style.cssText='width:12px;height:3px;border-radius:2px;background:'+COLORS[k%COLORS.length];
    s.appendChild(sw2); s.appendChild(el('span',null,t)); leg.appendChild(s);
  });
  wrap.appendChild(svg); wrap.appendChild(leg);
  wrap.style.margin='4px 0 18px';
  return wrap;
}

    b.appendChild(el('em', null, '→ '+r.k));
    b.onclick=r.go;
    g.appendChild(b);
  });
  p.appendChild(g);
}

// ---------------------------------------------------------- 시작
waitIndex().then(()=>{
  const c=S.companies;
  if(c.length===1){ $('#q').value=c[0].name; pick(c[0].code); }
});
